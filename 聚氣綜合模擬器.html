<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龍・山・水 聚氣綜合模擬器 v25.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f1e7;--ink:#22201c;--ink-soft:#5a554c;--seal:#a63a2b;--gold:#b98a2e;--jade:#3f6b52;--water:#3e6f86;--bg-dark:#14120e;--bg-panel:#171a1e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;background:var(--bg-dark);color:#cfc6b4;line-height:1.4;overflow-x:hidden;height:100vh;display:flex;flex-direction:column}
h1,h2,h3,h4{font-family:'Noto Serif TC','PingFang TC',serif}
header{background:#171512;color:var(--paper);text-align:center;padding:8px 16px;border-bottom:2px solid var(--gold);flex:0 0 auto}
header h1{font-size:20px;letter-spacing:.15em;font-weight:900}
header p{color:#a89e88;letter-spacing:.1em;margin-top:2px;font-size:13px}
.main-layout{flex:1;display:flex;padding:8px;gap:8px;min-height:0}
.canvas-panel{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-dark);border-radius:12px;overflow:hidden;border:1px solid rgba(246,241,231,.15);box-shadow:0 10px 30px rgba(0,0,0,.15)}
#sim-canvas{width:100%;height:100%;flex:1;display:block;background:#0c1013;aspect-ratio:auto}
.ui-panel{width:440px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--jade) #0e1114}
.ui-panel::-webkit-scrollbar{width:5px}
.ui-panel::-webkit-scrollbar-track{background:#0e1114;border-radius:3px}
.ui-panel::-webkit-scrollbar-thumb{background:var(--jade);border-radius:3px}
.controls-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ctrl-col{display:flex;flex-direction:column;gap:4px}
.ctrl-row{display:flex;align-items:center;gap:6px;margin-bottom:0}
.ctrl-label{font-family:'Noto Serif TC',serif;letter-spacing:.05em;color:#cfc6b4;min-width:42px;font-size:13px;flex-shrink:0}
.seg{display:flex;gap:3px;flex-wrap:wrap;flex:1}
.seg button{display:flex;align-items:center;gap:3px;background:transparent;border:1px solid rgba(246,241,231,.2);color:#cfc6b4;border-radius:4px;padding:3px 6px;cursor:pointer;font-family:'Noto Serif TC',serif;font-size:12px;letter-spacing:.01em;transition:.2s;white-space:nowrap}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#171512;font-weight:700}
.seg button:hover{background:rgba(246,241,231,.08);border-color:rgba(246,241,231,.5)}
.seg button.on:hover{background:#cda240;border-color:#cda240}
.seg button.danger.on{background:var(--seal);border-color:var(--seal);color:#fff}
.seg button.danger.on:hover{background:#c04a3a;border-color:#c04a3a}
.seg button.preset{border-color:#7fb08f;color:#7fb08f;font-weight:600;flex:1;justify-content:center}
.seg button.preset:hover{background:#7fb08f;color:#14120e}
.seg button:disabled{opacity:.3;pointer-events:none;cursor:not-allowed}
.stats-row{display:flex;gap:8px;align-items:flex-end;margin-top:4px}
.meters{flex:1;display:flex;flex-direction:column;gap:4px}
.meter-group{width:100%}
.meter-title{font-size:12px;letter-spacing:.03em;color:#a89e88;display:flex;justify-content:space-between;margin-bottom:2px}
.meter-title b{color:var(--paper)}
.meter{height:6px;background:rgba(246,241,231,.1);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0%;transition:width .35s}
#m-gather .meter i{background:linear-gradient(90deg,#8a6a20,var(--gold))}
#m-scatter .meter i{background:linear-gradient(90deg,#7a2a20,#c04a3a)}
.radar-box{width:150px;flex:0 0 auto;background:rgba(246,241,231,.03);border:1px solid rgba(246,241,231,.08);border-radius:8px;padding:4px;text-align:center}
.radar-box h4{font-size:13px;color:#cfc6b4;letter-spacing:.1em;margin-bottom:2px}
#radar{width:130px;height:130px}
.status-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.status-bar span{font-size:11px;letter-spacing:.02em;border:1px solid;border-radius:999px;padding:2px 8px}
#verdict-row{background:rgba(0,0,0,.2);padding:6px 8px;border-radius:6px;border-left:3px solid var(--gold);margin-top:4px;display:flex;align-items:center;gap:8px}
#rating{font-family:'Noto Serif TC',serif;font-weight:900;font-size:14px;letter-spacing:.05em;padding:2px 6px;border-radius:4px;color:#171512;white-space:nowrap}
#verdict{font-family:'Noto Serif TC',serif;color:#d8cfba;letter-spacing:.01em;font-size:13px;line-height:1.5}
@media(max-width:960px){body{height:auto;overflow-y:auto}.main-layout{flex-direction:column}.canvas-panel{height:50vh}.ui-panel{width:100%;max-height:none;overflow-y:visible}.controls-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <h1>龍・山・水 聚氣綜合模擬器</h1>
</header>

<div class="main-layout">
  <div class="canvas-panel">
    <canvas id="sim-canvas"></canvas>
  </div>

  <div class="ui-panel">
    <div class="controls-grid">
      <div class="ctrl-col">
        <div class="ctrl-row"><span class="ctrl-label">龍勢</span><div class="seg" data-k="d"><button data-v="sheng">躍龍</button><button data-v="pingyang">平洋</button><button data-v="huilong">迴龍</button><button data-v="ji">急龍</button><button data-v="huan">緩龍</button><button data-v="si">死病</button><button data-v="po">破</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">左砂</span><div class="seg" data-k="ml"><button data-v="you">青龍有情</button><button data-v="ya">逼壓</button><button data-v="po">破碎</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">右砂</span><div class="seg" data-k="mr"><button data-v="you">白虎有情</button><button data-v="tai">抬頭煞</button><button data-v="po">破碎</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">水勢</span><div class="seg" data-k="w"><button data-v="you">玉帶</button><button data-v="jiuqu">九曲</button><button data-v="gejiao">割腳</button><button data-v="lintou">淋頭</button><button data-v="ji">直沖</button><button data-v="fan">反弓</button><button data-v="bazi">八字</button><button data-v="none">無水</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">星體</span><div class="seg" data-k="xing"><button data-v="jin">金</button><button data-v="mu">木</button><button data-v="shui">水</button><button data-v="huo">火</button><button data-v="tu">土</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">穴形</span><div class="seg" data-k="xue"><button data-v="none">無</button><button data-v="wo">窩鉗</button><button data-v="ru">乳突</button></div></div>
      </div>
      <div class="ctrl-col">
        <div class="ctrl-row"><span class="ctrl-label">護從</span><div class="seg">
          <button class="tog on" data-g="adv" data-k="shu">束氣</button>
          <button class="tog danger" data-g="adv" data-k="fenzhi">分流</button>
          <button class="tog" data-g="adv" data-k="guiyao">鬼曜</button>
          <button class="tog" data-g="adv2" data-k="hulong">護龍</button>
          <button class="tog on" data-g="adv2" data-k="fengyao">蜂腰</button>
          <button class="tog" data-g="adv2" data-k="zutai">祖脈</button>
        </div></div>
        <div class="ctrl-row"><span class="ctrl-label">穴場</span><div class="seg">
          <button class="tog on" data-g="elem" data-k="xia">穴星</button>
          <button class="tog on" data-g="elem" data-k="an">案山</button>
          <button class="tog on" data-g="elem" data-k="chao">朝山</button>
          <button class="tog on" data-g="elem" data-k="mt">明堂</button>
          <button class="tog on" data-g="elem" data-k="taiji">太極</button>
          <button class="tog" data-g="adv2" data-k="qian">鉗穴</button>
          <button class="tog" data-g="adv2" data-k="guan">官星</button>
          <button class="tog danger" data-g="adv2" data-k="qing">傾瀉</button>
        </div></div>
        <div class="ctrl-row"><span class="ctrl-label">水法</span><div class="seg">
          <button class="tog water-dep" data-g="elem" data-k="san">三叉水</button>
          <button class="tog" data-g="elem" data-k="yue">半月池</button>
        </div></div>
        <div class="ctrl-row"><span class="ctrl-label">水口</span><div class="seg">
          <button class="tog water-dep" data-g="elem" data-k="luo">羅星</button>
          <button class="tog water-dep" data-g="elem" data-k="hua">華表</button>
          <button class="tog water-dep" data-g="adv2" data-k="shixiang">獅象</button>
          <button class="tog water-dep" data-g="adv2" data-k="qin">禽星</button>
        </div></div>
        <div class="ctrl-row"><span class="ctrl-label">形煞</span><div class="seg">
          <button class="tog danger" data-g="adv2" data-k="tianzhan">天斬</button>
          <button class="tog danger" data-g="adv2" data-k="qingquan">擎拳</button>
          <button class="tog danger" data-g="adv" data-k="ao">凹風</button>
          <button class="tog danger" data-g="adv" data-k="tantou">探頭</button>
          <button class="tog danger" data-g="adv" data-k="shaMode">手動</button>
        </div></div>
        <div class="ctrl-row"><span class="ctrl-label">時間</span><div class="seg" id="time-seg">
          <button data-t="0">暫停</button><button data-t="1" class="on">正常</button><button data-t="2">加速</button>
        </div></div>
        <div class="ctrl-row"><span class="ctrl-label">其他</span><div class="seg" id="face-seg"><button data-f="1" class="on">向水</button><button data-f="0">背水</button></div><div class="seg" style="flex:0 0 auto"><button class="tog on" data-g="view" data-k="heat">熱力</button><button class="tog on" data-g="view" data-k="wind">風場</button><button class="tog" data-g="view" data-k="tilt">2.5D</button></div></div>
      </div>
    </div>

    <div class="ctrl-row">
      <span class="ctrl-label">格局</span>
      <div class="seg" style="width:100%">
        <button class="preset" data-preset="perfect">完美巒頭</button>
        <button class="preset" data-preset="gejiao">割腳退財</button>
        <button class="preset" data-preset="huilong">迴龍顧祖</button>
        <button class="preset" data-preset="tianzhan">天斬傾瀉</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="meters">
        <div class="meter-group" id="m-gather"><div class="meter-title"><span>聚氣指數</span><b id="g-num">0</b></div><div class="meter"><i id="g-fill"></i></div></div>
        <div class="meter-group" id="m-scatter"><div class="meter-title"><span>散氣／煞氣</span><b id="s-num">0</b></div><div class="meter"><i id="s-fill"></i></div></div>
        <div class="meter-group"><div class="meter-title"><span>容量/乘數</span><b id="cap-num">0/×1.0</b></div><div class="meter"><i id="cap-fill" style="background:linear-gradient(90deg,#3f6b52,#7fb08f)"></i></div></div>
      </div>
      <div class="radar-box">
        <h4>五訣</h4>
        <canvas id="radar" width="130" height="130"></canvas>
      </div>
    </div>

    <div class="status-bar" id="status"></div>
    <div id="verdict-row"><span id="rating"></span><p id="verdict"></p></div>
  </div>
</div>

<script>
const ENV={houseY:.52,riverStart:.12,riverEnd:.88,riverBaseY:.78,centerRBase:.15,dragonSegments:9,maxParticles:{sheng:260,si:80,po:100,pingyang:150,huilong:220,ji:300,huan:120},spawnRate:{sheng:2.6,si:.5,po:1.0,pingyang:1.5,huilong:2.2,ji:4.0,huan:1.0}};
const cv=document.getElementById('sim-canvas'),ctx=cv.getContext('2d');
const rCv=document.getElementById('radar'),rCtx=rCv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);
let lastG=-1,lastS=-1,pScale=1;

const noise=(function(){const p=[];for(let i=0;i<256;i++)p[i]=i;for(let i=255;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}for(let i=0;i<256;i++)p[256+i]=p[i];function fade(t){return t*t*t*(t*(t*6-15)+10)}function lerp(a,b,t){return a+t*(b-a)}function grad(h,x,y){const v=h&3;const u=v<2?x:y;const w=v<2?y:x;return((v&1)?-u:u)+((v&2)?-w:w)}return function(x,y){const X=((Math.floor(x)%256)+256)%256;const Y=((Math.floor(y)%256)+256)%256;x-=Math.floor(x);y-=Math.floor(y);const u=fade(x),v=fade(y);const A=p[X]+Y,B=p[X+1]+Y;return lerp(lerp(grad(p[A],x,y),grad(p[B],x-1,y),u),lerp(grad(p[A+1],x,y-1),grad(p[B+1],x-1,y-1),u),v)}})();

const spriteCache={};
function createParticleSprite(key,coreColor,glowRGB,size){let c=spriteCache[key];if(!c){c=document.createElement('canvas');spriteCache[key]=c}c.width=c.height=size*4;const cx=c.getContext('2d');cx.clearRect(0,0,c.width,c.height);const grad=cx.createRadialGradient(c.width/2,c.height/2,0,c.width/2,c.height/2,size*2);grad.addColorStop(0,`rgba(${glowRGB},0.15)`);grad.addColorStop(.5,`rgba(${glowRGB},0.06)`);grad.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=grad;cx.fillRect(0,0,c.width,c.height);cx.fillStyle=coreColor;cx.beginPath();cx.arc(c.width/2,c.height/2,size,0,Math.PI*2);cx.fill()}
function initSprites(){const sz=Math.max(1.5,baseDim*.004);createParticleSprite('normal','rgba(230,195,110,0.9)','185,138,46',sz);createParticleSprite('faint','rgba(230,195,110,0.5)','185,138,46',sz*.7);createParticleSprite('settled','rgba(150,220,235,0.85)','120,200,220',sz*1.1);createParticleSprite('held','rgba(240,208,128,0.9)','240,208,128',sz*1.1);createParticleSprite('sha','rgba(200,80,60,0.9)','200,80,60',sz*1.4);createParticleSprite('leak','rgba(190,220,240,0.8)','150,200,255',sz*1.2);createParticleSprite('pure','rgba(255,240,180,1.0)','255,220,100',sz*1.2)}

const ps=[],obstacles=[],shockwaves=[];
let spawnAcc=0,gIdx=0,shaAcc=0;
let waterOffset=0,windTime=0;
let lastTime=0;
let W=0,H=0,gw=0,gh=0,baseDim=0,margin=0;
let radarW=0,radarH=0;
let heat=null,heatC=null,heatCtx=null,heatImg=null;
let tempHeatCanvas=null;
let bgCanvas=null,bgDirty=true;
let tantouTimer=0,isPaused=false;
let GRID_SIZE=50;
let gridCols=0,gridRows=0,grid=[];

function initGrid(){gridCols=Math.ceil(W/GRID_SIZE);gridRows=Math.ceil(H/GRID_SIZE);grid=new Array(gridCols*gridRows);for(let i=0;i<grid.length;i++)grid[i]=[]}
function clearGrid(){for(let i=0;i<grid.length;i++)grid[i].length=0}
function addToGrid(p){const gx=Math.floor(p.x/GRID_SIZE);const gy=Math.floor(p.y/GRID_SIZE);if(gx>=0&&gx<gridCols&&gy>=0&&gy<gridRows){grid[gy*gridCols+gx].push(p)}}
function getNearby(p){const gx=Math.floor(p.x/GRID_SIZE);const gy=Math.floor(p.y/GRID_SIZE);const res=[];for(let dy=-1;dy<=1;dy++){for(let dx=-1;dx<=1;dx++){const nx=gx+dx,ny=gy+dy;if(nx>=0&&nx<gridCols&&ny>=0&&ny<gridRows){const cell=grid[ny*gridCols+nx];for(let i=0;i<cell.length;i++)res.push(cell[i])}}}return res}

const baseState={d:'sheng',ml:'you',mr:'you',w:'you',xing:'jin',xue:'none',ao:false,shu:true,shaMode:false,fenzhi:false,tantou:false,guiyao:false};
const baseElem={xia:true,an:true,chao:true,luo:false,hua:false,mt:true,taiji:true,san:false,yue:false};
const baseAdv2={hulong:false,fengyao:true,zutai:false,guan:false,qin:false,qian:false,qing:false,shixiang:false,tianzhan:false,qingquan:false};
const state={...baseState};
const elem={...baseElem};
const adv2={...baseAdv2};
const view={heat:true,wind:true,tilt:false};let face=true;

let resizeTimer;
function rs(){
  const oldW=W,oldH=H;
  W=cv.clientWidth;H=cv.clientHeight;
  if(W===0||H===0)return;
  baseDim=Math.min(W,H);
  pScale=baseDim/600;
  margin=baseDim*.05;
  GRID_SIZE=Math.max(50,baseDim*.08);
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  gw=Math.max(30,Math.round((W*DPR)/12));
  gh=Math.max(24,Math.round((H*DPR)/12));
  
  if(oldW>0&&oldH>0&&heatC){
    if(!tempHeatCanvas)tempHeatCanvas=document.createElement('canvas');
    tempHeatCanvas.width=heatC.width;tempHeatCanvas.height=heatC.height;
    tempHeatCanvas.getContext('2d').drawImage(heatC,0,0);
  }
  
  heat=new Float32Array(gw*gh);
  if(!heatC)heatC=document.createElement('canvas');
  heatC.width=gw;heatC.height=gh;
  heatCtx=heatC.getContext('2d',{willReadFrequently:true});
  heatImg=heatCtx.createImageData(gw,gh);
  
  if(tempHeatCanvas&&tempHeatCanvas.width>0){
    heatCtx.drawImage(tempHeatCanvas,0,0,gw,gh);
    const imgData=heatCtx.getImageData(0,0,gw,gh);
    for(let i=0;i<gw*gh;i++){
      const R=imgData.data[i*4];
      heat[i]=Math.max(0,(R-40)/30.1);
    }
  }
  
  radarW=rCv.clientWidth;radarH=rCv.clientHeight;
  rCv.width=radarW*DPR;rCv.height=radarH*DPR;
  rCtx.setTransform(DPR,0,0,DPR,0,0);
  if(!bgCanvas)bgCanvas=document.createElement('canvas');
  bgCanvas.width=cv.width;bgCanvas.height=cv.height;
  bgDirty=true;initSprites();initGrid();
  
  if(oldW>0&&oldH>0){
    const scaleX=W/oldW,scaleY=H/oldH;
    for(let p of ps){p.x*=scaleX;p.y*=scaleY}
    for(let sw of shockwaves){sw.x*=scaleX;sw.y*=scaleY;sw.r*=scaleX;sw.maxR*=scaleX;}
  }
}
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(rs,150)});

document.addEventListener('visibilitychange',()=>{isPaused=document.hidden;if(!isPaused)lastTime=0});
let fontsLoaded=false;
if(document.fonts){document.fonts.ready.then(()=>{if(!fontsLoaded){fontsLoaded=true;bgDirty=true}})}

function getGlobalMultiplier(){
  let m=1.0;
  if(!elem.xia)m*=0.3;
  if(!elem.mt)m*=0.5;
  if(state.w==='lintou')m*=0.1;
  if(state.d==='po')m*=0.2;
  if(state.d==='si')m*=0.4;
  if(state.d==='huan')m*=0.6;
  if(state.d==='ji' && !adv2.qian && !elem.an)m*=0.6;
  if(state.ml==='ya')m*=0.8;
  if(state.mr==='tai')m*=0.6;
  if(state.ml==='ya'&&state.mr==='tai')m*=0.7;
  if(state.ml==='po')m*=0.7;
  if(state.mr==='po')m*=0.7;
  if(state.ml==='po'&&state.mr==='po')m*=0.6;
  if(state.ao)m*=(state.shu ? 0.2 : 0.3);
  if(state.tantou)m*=0.5;
  if(adv2.tianzhan)m*=0.4;
  if(adv2.qingquan)m*=0.6;
  if(state.xing==='huo')m*=(elem.yue || (state.w !== 'none' && state.w !== 'lintou')) ? 0.7 : 0.4;
  if(obstacles.length>0)m*=Math.max(0.2, 1.0 - obstacles.length * 0.15);
  
  let validGuards = (state.ml !== 'none' || state.mr !== 'none' || state.d === 'pingyang');
  let isBadWater = ['gejiao','fan','bazi','ji','lintou'].includes(state.w);
  let waterGuards = (validGuards && !isBadWater) ? ((elem.luo?1:0) + (elem.hua?1:0) + (adv2.shixiang?2:0) + (adv2.qin?1:0)) : 0;
  
  let anshanShield = elem.an ? 0.3 : 0;
  
  if(['gejiao','ji','fan','bazi'].includes(state.w)) {
      let base = (state.w === 'bazi' || state.w === 'gejiao') ? 0.3 : 0.4;
      let cap = (state.w === 'bazi' || state.w === 'gejiao') ? 0.8 : 0.9;
      let effectiveAnShield = (state.w === 'gejiao') ? 0 : anshanShield;
      m *= Math.min(cap, base + waterGuards * 0.1 + effectiveAnShield);
  }
  
  if(adv2.qing) m *= Math.min(0.9, 0.5 + waterGuards * 0.1 + anshanShield); 
  
  if(!face && state.d !== 'pingyang' && state.w !== 'none') m *= 0.5; // 山龍背水（坐空朝滿）大忌
  if(state.d === 'pingyang' && state.w !== 'none') {
      if(!face) m *= 1.2; // 平洋龍訣法：喜坐空朝滿（背水反為大吉）
      else if(state.w !== 'jiuqu' && state.w !== 'you') m *= 0.7; // 平洋向水若非玉帶九曲，遇快水極易退氣
  }
  
  return m;
}
function getCapacityLimit(){
  let cap=0;
  if(state.ml==='you')cap+=20;else if(state.ml==='ya')cap+=10;else if(state.ml==='po')cap+=5;
  if(state.mr==='you')cap+=20;else if(state.mr==='tai')cap+=0;else if(state.mr==='po')cap+=5;
  if(elem.an)cap+=15;if(elem.chao)cap+=10;if(elem.xia)cap+=10;
  if(elem.mt)cap+=20; // 修正：明堂是聚氣的核心容器，必須提供大量基礎容量
  if(adv2.qian)cap+=15;if(adv2.hulong)cap+=10;
  if(adv2.zutai)cap+=10;
  if(adv2.fengyao)cap+=10;
  // 修正：水口神獸交鎖（下關砂），如同水壩蓄水，能大幅提升明堂乘氣的極限容量
  if(elem.luo)cap+=10; if(elem.hua)cap+=10; if(adv2.shixiang)cap+=15; if(adv2.qin)cap+=5;
  if(!elem.mt) cap = Math.min(cap, 25);
  if(state.ml==='none' && state.mr==='none' && state.d !== 'pingyang') cap = Math.min(cap, 30);
  if(state.d === 'pingyang' && state.w === 'none') cap = Math.min(cap, 15);
  if(state.w === 'gejiao' || state.w === 'lintou') cap = Math.min(cap, 20);
  if(adv2.qing) cap = Math.min(cap, 30);
  return Math.min(100,cap);
}

class Particle{
  constructor(isShaArrow=false){
    this.isShaArrow=isShaArrow;
    this.state='moving';
    this.dir=1;this.faint=state.d==='si';this.branched=false;
    this.ph=Math.random()*6.28;this.life=0;this.maxLife=120;
    this.vx=0;this.vy=0;this.x=0;this.y=0;
    this.purified=false;
    this.isUnderground=true;
    this.hasPassedMingTang=false;
    this.hasTouchedWater=false;
    this.markedForDeath=false;
    this.inPool=0;
    
    if(isShaArrow){
      this.state='sha';
      this.x=W/2+(Math.random()-.5)*40;this.y=H*.85;
      const dx=W/2-this.x,dy=H*.52-this.y;const d=Math.hypot(dx,dy);
      this.vx=(dx/d)*3.5*pScale;this.vy=(dy/d)*3.5*pScale;
      this.life=150;this.maxLife=150;return;
    }
    
    const t=Math.random()*.75;const leak=(state.d==='po'||state.d==='huan')&&Math.random()<.35;
    const spread = (35 - 25 * t) * pScale; // 修正：氣脈隨過峽「剝換」逐漸收斂，並正確適應螢幕縮放
    this.x=dragonX(t)+(Math.random()-.5)*spread;this.y=dragonY(t);
    
    let initVy = (.6+Math.random()*.5)*pScale;
    if(state.d==='ji') initVy = 2.5 * pScale; 
    if(state.d==='huan' || state.d==='pingyang') initVy = 0.2 * pScale; 
    
    this.vx=leak?(Math.random()<.5?-1.8:1.8)*pScale:0;
    this.vy=initVy;
    if(leak){this.state='leak';this.life=120}
  }
  
  update(dt){
    const hx=W/2,hy=H*ENV.houseY,cR=baseDim*ENV.centerRBase;
    const cR_sq=cR*cR;
    const cR3_sq=9*cR_sq;
    
    if(adv2.zutai && this.state==='moving'){
        const pool1Y = H * 0.15, pool2Y = H * 0.30;
        const t1 = Math.max(0, (pool1Y - (-20)) / (hy - (-20))), t2 = Math.max(0, (pool2Y - (-20)) / (hy - (-20)));
        const px1 = dragonX(t1), px2 = dragonX(t2); // 追蹤動態龍脈引力點
        const poolR = baseDim * 0.08;
        let inPool = false;
        const rx1 = (this.x - px1) / (W * 0.1), ry1 = (this.y - pool1Y) / (H * 0.03);
        if(rx1*rx1 + ry1*ry1 < 1.0){
            inPool = true; this.inPool = 1;
            this.vx *= Math.pow(0.95, dt); this.vy *= Math.pow(0.95, dt);
            this.vx += (px1 - this.x) * 0.01 * dt; this.vy += (pool1Y - this.y) * 0.01 * dt;
            if(Math.random() < 0.005 * dt) this.vy += 1.5 * pScale; 
        } else if(Math.hypot(this.x - px2, this.y - pool2Y) < poolR){
            inPool = true; this.inPool = 2;
            this.vx *= Math.pow(0.95, dt); this.vy *= Math.pow(0.95, dt);
            this.vx += (px2 - this.x) * 0.01 * dt; this.vy += (pool2Y - this.y) * 0.01 * dt;
            if(Math.random() < 0.01 * dt) this.vy += 1.5 * pScale;
        }
        if(!inPool) this.inPool = 0;
    }

    if(this.state==='leak'){
      this.life-=dt;this.x+=this.vx*dt;this.y+=this.vy*.4*dt;
      if(this.life<=0)return false;
      return!(this.y>H+margin||this.y<-margin*2||this.x<-margin||this.x>W+margin);
    }
    if(this.state==='sha'){
      this.life-=dt;
      
      if(this.isShaArrow) {
          const dx = (W/2) - this.x, dy = (H*ENV.houseY) - this.y;
          const d = Math.max(1, Math.hypot(dx, dy));
          // 探頭暗箭：帶有極強的導引力，精準狙擊明堂穴心內的聚氣
          this.vx += (dx/d) * 0.25 * pScale * dt; 
          this.vy += (dy/d) * 0.25 * pScale * dt;
          if (d < baseDim * 0.05) this.life -= 3 * dt; // 擊中穴心後碎裂，交由全局碰撞邏輯產生連環破壞
      } else {
          this.vy += 0.05 * pScale * dt;
      }
      this.x+=this.vx*dt;this.y+=this.vy*dt;
      return!(this.life<=0);
    }
    if(this.state==='settled'||this.state==='held'){
      this.life-=dt;this.x+=Math.sin(windTime*.05+this.ph)*.3*pScale*dt;
      
      // 流體排斥力：防止真氣無限重疊，讓氣團產生柔軟的體積感與流動性
      const nearby = getNearby(this);
      for(let target of nearby) {
          if(target !== this && (target.state === 'settled' || target.state === 'held')) {
              const dx = this.x - target.x, dy = this.y - target.y;
              const distSq = dx*dx + dy*dy;
              if(distSq > 0 && distSq < (25 * pScale * pScale)) { // 感知半徑
                  const dist = Math.sqrt(distSq);
                  this.x += (dx/dist) * 0.4 * pScale * dt; // 柔和推開
                  this.y += (dy/dist) * 0.4 * pScale * dt;
              }
          }
      }

      if(this.life<=0)return false;
      if(view.heat)heatAdd(this.x,this.y,this.state==='settled'?1.5:1.3);
      
      if(this.state === 'held' && !elem.an && this.y < riverY(this.x) - 10) {
          this.state = 'moving';
          this.vy = 2.0 * pScale; // 案山消失，失去支撐，氣脈直接墜落
      }
      
      let exposed=(state.ml==='none'||state.ml==='po'?0.05:0)+(state.mr==='none'||state.mr==='po'?0.05:0)+(!elem.an?0.05:0);
      if(exposed>0&&Math.random()<exposed*0.02*dt){this.state='moving';this.vx+=(Math.random()-0.5)*4*pScale;}
      
      if(state.w==='gejiao'&& this.y > hy - 5 && Math.hypot(this.x-hx,this.y-hy)<cR*1.8){
        this.state='swept';this.dir=this.x<hx?-1:1; // 修正：必須抵達水位線才會被割腳水沖刷，拒絕隔空吸氣
      }
      if(state.w==='lintou'&&this.y>hy-cR&&this.y<hy+cR*2){
        this.state='swept';this.dir=(Math.random()<.5?-1:1);
      }
      
      // 九曲逆水朝堂：若為向水局，九曲水會將清純水氣逆勢向上（反重力）輸回明堂，大旺財氣
      if(state.w === 'jiuqu' && face && this.y > hy + 10 && this.state === 'settled') {
          if(Math.random() < 0.015 * dt) {
              this.state = 'moving';
              this.vy = -1.5 * pScale; // 逆向托力
              this.purified = true; // 化為純粹的吉氣
              shockwaves.push({x:this.x, y:this.y, r:0, maxR:baseDim*.05, life:20, type:'pure'}); // 逆水昇華波紋
          }
      }

      if(adv2.qing && this.state==='settled'){
          this.vy += 0.05 * pScale * dt;
          this.y += this.vy * dt;
          
          let limitY = elem.an ? (hy + cR*0.8) : (hy + cR*1.2);
          if(this.y > limitY) { 
              if(elem.an) {
                  this.y = limitY; this.vy = 0; // 案山成功關攔傾瀉之氣
              } else if(state.w === 'none' || state.w === 'lintou') {
                  this.state = 'leak';
              } else {
                  this.state = 'swept'; 
                  this.dir = this.x < hx ? -1 : 1; 
              }
          }
      }
      return true;
    }
    if(this.state==='swept'){
      this.vx += (4.2*pScale*this.dir - this.vx) * 0.2 * dt; // 修正：河水推力作用於速度向量(vx)，解決動力學覆寫衝突
      
      const isFastWater = (state.w === 'ji' || state.w === 'gejiao' || state.w === 'fan'); // 判斷是否為無情水
      if(adv2.shixiang && (this.x > W*0.85 || this.x < W*0.15)){
          const dx = W/2 - this.x; 
          this.vx += dx * 0.02 * dt; 
          this.vy -= 0.5 * pScale * dt; 
          if(Math.random() < (isFastWater ? 0.005 : 0.02) * dt) { this.state='held'; this.life=600; } // 凶水沖刷，神獸攔氣機率大幅下降
      }

      if((elem.luo||elem.hua)&&(this.x>W*.85||this.x<W*.15)){
        this.vx -= this.dir * 1.5 * pScale * dt; 
        this.vy -= 0.2 * pScale * dt;
        if(Math.random() < (isFastWater ? 0.003 : 0.015) * dt) { this.state='held'; this.life=500; } 
      }
	  
      this.vx *= Math.pow(0.85, dt);
      this.vy *= Math.pow(0.85, dt);
      this.vx = Math.max(-5 * pScale, Math.min(5 * pScale, this.vx));
      this.vy = Math.max(-5 * pScale, Math.min(5 * pScale, this.vy));
      
      this.x += this.vx * dt; // 統一計算最終位移，讓神獸的引力與水流推力完美疊加
      this.y += this.vy * dt;

	  if(this.x>W*.11&&this.x<W*.89&&state.w!=='lintou'&&state.w!=='none'){
		const targetY=riverY(this.x)+6;this.y+=(targetY-this.y)*.3*dt;
	  }
      if(this.x>W+margin||this.x<-margin){
        const catchP=(elem.luo ? 0.6 : 0)+(elem.hua ? 0.25 : 0);
        if(catchP>0&&Math.random()<catchP){
          this.state='held';this.life=600;
          this.x=this.dir<0?W*0.06:W*0.94; // 修正：取消不合理的河道源頭瞬移，讓真氣精準停留在神獸視覺模型上
          this.y=riverY(this.x)-4;return true;
        }
        return false;
      }
      return true;
    }
    
    this.isUnderground=this.y<(hy-baseDim*.05);
    let windAmp=0,jitter=0;
    if(!this.isUnderground){
      
      let windExposed = 0;
      if(state.ml==='none' || state.ml==='po') windExposed += 0.04;
      if(state.mr==='none' || state.mr==='po') windExposed += 0.04;
      if(!elem.an) windExposed += 0.05; 
      
      windAmp = (state.ml==='you'&&state.mr==='you'&&elem.an) ? 0.01 : windExposed;
      if(state.d==='pingyang') windAmp *= 0.2; // 修正：平洋龍不怕八風交吹
      if(adv2.hulong && Math.abs(this.x - hx) < W*0.2) windAmp *= 0.2;
      
      jitter = (state.ml==='you'&&state.mr==='you'&&elem.an) ? 0.01 : (0.04 + windExposed);
      if(state.d==='si') jitter *= 2.0;
      
      // 修正：真正的「氣乘風則散」。若毫無遮蔽（風劫），真氣將被強風直接吹散化為虛無
      if(windExposed >= 0.13 && state.d !== 'pingyang' && this.state === 'moving') {
          if(Math.random() < windExposed * 0.1 * dt) { this.state = 'leak'; this.life = 60; }
      }
      
      
      if(this.y < hy && this.y > hy - baseDim*0.15) {
          if((state.d==='po'||state.d==='si') && !state.guiyao) {
              this.vy += 1.5 * pScale * dt; 
          }
          if(state.guiyao) {
              if(state.d==='po' || state.d==='si' || state.d==='huan') {
                  this.vx += (Math.random() - 0.5) * 3.0 * pScale * dt; 
                  this.vy -= 1.0 * pScale * dt; // 弱龍生曜：鬼曜化為「盜氣星」，將真氣反向(向上)抽離穴場
                  if(Math.random() < 0.02 * dt) this.state = 'leak'; // 氣遭竊漏不聚
              } else {
                  this.vy += 0.2 * pScale * dt; 
                  this.vx *= Math.pow(0.8, dt); // 強龍生曜：武將帶刀，推氣入穴
              }
          }
      }
    }
    
    if(this.isUnderground && this.state === 'moving') {
        let t_curr = state.d === 'pingyang' ? (this.y - H*.1) / (hy - 14 - H*.1) : (this.y + 20) / (hy - 14 + 20);
        if (t_curr >= 0 && t_curr <= 1) {
            this.vx += (dragonX(t_curr) - this.x) * 0.15 * dt; // 修正：循脈而行，真氣隨視覺彎曲
        }
        
        if(state.shu && this.y > hy - cR*3 && this.y < hy - cR) {
            if(state.d === 'si' || state.d === 'po') {
                this.vx += (Math.random() - 0.5) * 1.5 * pScale * dt; // 死/破龍強行束氣，反遭擠散
            } else {
                this.vx += (hx - this.x) * 0.15 * dt; 
                this.vy *= Math.pow(0.92, dt); 
            }
            // 過峽最忌風吹：若有凹風煞，束氣處的脆弱真氣會被橫風直接吹散（風劫破脈）
            if(state.ao && Math.random() < 0.04 * dt) {
                this.state = 'leak'; this.life = 60;
                this.vx += 3.0 * pScale; // 氣遭側風無情吹出脈外
            }
        }
    }

    if(state.fenzhi&&this.y<H*.45&&!this.branched&&Math.random()<.06*dt){
          this.vx=(this.x<hx?-1:1)*3.5*pScale;this.branched=true;
          this.state='leak'; this.life=150; // 修正：分流之氣徹底洩漏，穿透護砂不再回流明堂
        }
    
    const t_prog = this.y / hy;
    if(adv2.fengyao && t_prog > 0.4 && t_prog < 0.6){
        this.vx += (hx - this.x) * 0.2 * dt; 
    } else if(adv2.fengyao && t_prog >= 0.6 && t_prog < 0.65 && !this.purified){
        this.purified = true;
        if(this.state === 'sha') { 
            this.state = 'moving'; this.life = this.maxLife; 
            // 視覺回饋：蜂腰化煞，產生金色淨化波紋
            shockwaves.push({x:this.x, y:this.y, r:0, maxR:baseDim*.06, life:25, type:'pure'});
        } 
        this.vx *= Math.pow(0.5, dt);
        this.vy *= Math.pow(0.5, dt);
    }
    if(this.purified) jitter*=.1;

    if(adv2.tianzhan && Math.abs(this.x - hx) < W*0.05 && this.y > H*0.2 && this.y < H*0.4){
        this.vy += 5.0 * pScale * dt; 
        // 天斬罡風：風洞效應劈砍而下，同時會向左右兩側產生強大的水平撕裂風，扯碎明堂
        this.vx += (this.x < hx ? -1 : 1) * 4.0 * pScale * dt;
        if(this.state==='moving' && Math.random() < 0.1 * dt) { this.state='sha'; this.life=60; }
    }

    if(adv2.hulong && this.y > 0 && this.y < hy - cR) {
        const drift = this.x - hx;
        if(Math.abs(drift) > W*0.12) this.vx -= Math.sign(drift) * 1.5 * pScale * dt; // 修正：護龍發揮實體漏斗作用，逼氣入穴
    }

    const dx_h=this.x-hx,dy_h=this.y-hy;
    const distSq=dx_h*dx_h+dy_h*dy_h;
    const mingTangY=hy+(face?cR*.8:-cR*.8);
    
    if(distSq<cR_sq*2.25){this.hasPassedMingTang=true} // 修正：嚴格限縮明堂判定範圍，拒絕邊緣漏氣蹭分
    
    if(distSq>cR_sq&&distSq<cR3_sq&&this.y<mingTangY+cR){
      this.vx+=(hx-this.x)*.0005*pScale*dt;
      this.vy+=(mingTangY-this.y)*.001*pScale*dt;
    }

    if(adv2.qian && this.y > hy - cR*0.5 && this.y < hy + cR*0.5 && Math.abs(dx_h) < cR*0.8){
        this.vx *= Math.pow(0.5, dt); 
        this.vy += (hy - this.y) * 0.05 * dt;
        // 鉗穴「急來緩受」：專治急龍、火星等暴猛之氣，鉗砂能將高速氣流瞬間夾住、強制收束
        if(this.vy > 1.5 * pScale && this.state === 'moving') {
            this.vy *= 0.2; // 瞬間煞車
            if(Math.random() < 0.1 * dt) { this.state = 'settled'; this.life = 600; } // 暴氣化吉
        }
    }

    const L=W*(state.ml==='ya'?.31:state.ml==='po'?.05:.18);
    const R=W*(state.mr==='ya'||state.mr==='tai'?.69:state.mr==='po'?.95:.82);
    
    if(adv2.qingquan){
        if(state.ml!=='none' && this.x < L + 20) { this.vx += 2.0 * pScale * dt; if(Math.random()<0.02*dt) { this.state='sha'; this.life=50; } }
        if(state.mr!=='none' && this.x > R - 20) { this.vx -= 2.0 * pScale * dt; if(Math.random()<0.02*dt) { this.state='sha'; this.life=50; } }
    }

    if(state.ml!=='none'&&this.x<L){
      this.x=L;this.vx=Math.abs(this.vx)*.5+.1*pScale;this.vy+=.1*pScale;
      
      if(state.ml==='you' && this.y > hy) this.vx += 0.5 * pScale * dt;
    }
    if(state.mr!=='none'&&this.x>R){
      this.x=R;this.vx=-Math.abs(this.vx)*.4-.05*pScale;
      
      if(state.mr==='you' && this.y > hy) this.vx -= 0.5 * pScale * dt;
      
      if(state.mr==='tai'&&Math.random()<.03*dt){this.state='sha';this.life=50;this.vx=-2.5*pScale;this.vy=1.5*pScale}
    }
    if(state.mr==='tai'&&this.x>W*.6&&this.y>H*.3){this.vx-=1.5*pScale*dt}
    if(state.ao&&this.x<W*.28&&this.y>H*.25&&this.y<H*.45){
      const dx=hx-this.x,dy=hy-this.y;const d=Math.max(1,Math.hypot(dx,dy));
      this.vx+=(dx/d)*3*pScale*dt;this.vy+=(dy/d)*3*pScale*dt;
      if(this.state==='moving'&&Math.random()<.03*dt) { this.state='sha'; this.life=50; }
    }
    
    if(elem.xia&&state.xing==='huo'&&this.y>hy-baseDim*.15&&this.y<hy){
      this.vx+=((this.x-hx)*.8 + (Math.random()-.5)*4.0)*dt; 
      this.vy+=(Math.random()-.5)*2.0*pScale*dt; // 火性炎上，氣場上下亂竄
      // 水火既濟：若前方有半月池(水)，可壓制火星炎燥；若無，極易化為凶煞
      let huoShaProb = elem.yue ? 0.01 : 0.08; 
      if(Math.random() < huoShaProb * dt) { this.state='sha'; this.life=50; } 
    }
    if(elem.xia&&state.xing==='mu'&&this.y>hy-baseDim*.1&&this.y<hy){
        // 木星垂旒：木氣直下，若有「乳突」穴則轉為生氣灌注；若無，則煞不住車直衝而下
        this.vy += (state.xue === 'ru' ? 0.1 : 0.8) * pScale * dt; 
        if(state.xue !== 'ru' && Math.random() < 0.03 * dt) { this.state = 'leak'; } // 無乳突接氣，木氣直瀉不收
    } 
    if(elem.xia&&state.xing==='shui'&&this.y>hy-baseDim*.1&&this.y<hy){this.vx+=Math.sin(this.y*.1)*.2*pScale*dt;} 
    if(elem.xia&&state.xing==='tu'&&this.y>hy-baseDim*.1&&this.y<hy){
      this.vy*=Math.pow(.7,dt); 
      this.vx*=Math.pow(.7,dt); 
    }
    if(elem.xia&&state.xing==='jin'&&this.y>hy-baseDim*.1&&this.y<hy){
      this.vx+=(hx-this.x)*.1*dt; 
      this.vy*=Math.pow(.85,dt); 
    }
    
    if(elem.xia&&state.xue==='wo'&&distSq<cR_sq*2.25){
      // 修正：金水星結窩為大吉（相生），木火星結窩為「形煞」（相剋）
      let woSync = (state.xing==='jin'||state.xing==='shui') ? 1.5 : (state.xing==='mu'||state.xing==='huo') ? 0.2 : 1;
      this.vx+=(hx-this.x)*.05*woSync*dt;this.vy+=(hy-this.y)*.05*woSync*dt;jitter*= (woSync>1 ? .1 : .5);
      if(woSync < 1 && this.state === 'moving' && Math.random() < 0.05 * dt) {
          this.state = state.xing==='huo' ? 'sha' : 'leak'; // 火星結窩犯重煞，木星結窩則洩氣
          if(this.state === 'sha') this.life = 50;
      }
    }

    if(elem.xia&&state.xue==='ru'&&distSq<cR_sq*1.5){
      // 修正：增加乳突穴形的實體引力。木土星結乳突為大吉，金水火星結突則為「鬥煞」
      let ruSync = (state.xing==='mu'||state.xing==='tu') ? 1.5 : (state.xing==='jin'||state.xing==='shui'||state.xing==='huo') ? 0.2 : 1;
      this.vx+=(hx-this.x)*.04*ruSync*dt;this.vy+=(hy-this.y)*.04*ruSync*dt;jitter*= (ruSync>1 ? .1 : .5);
      if(ruSync < 1 && this.state === 'moving' && Math.random() < 0.05 * dt) { 
          this.state = 'sha'; this.life = 60; // 突起犯金水火煞，化為銳利煞氣直插明堂
          this.vy += 1.5 * pScale; // 給予煞氣向下的衝擊力
      }
    }

    
    if(state.w==='lintou' && this.y < hy + cR * 1.5){ // 修正：淋頭水的毀滅性重力應貫穿整個明堂與來龍
      this.vy += 2.0 * pScale * dt;
      jitter += 0.1;
      // 淋頭水自高處直沖來龍，越靠近入首處(穴後)煞氣轉化機率越高，直接破脈
      let lintouProb = (this.y < hy - cR) ? 0.06 : 0.02;
      if(Math.random() < lintouProb * dt) { this.state = 'sha'; this.life = 40; }
      // 修正：淋頭瀑布無差別沖刷，讓所有已結或未結之氣也直接潰散落水，無法倖免
      if(this.state !== 'sha' && this.state !== 'swept' && this.y > hy - 10) {
          if(Math.random() < 0.1 * dt) { this.state = 'swept'; this.dir = (Math.random()<.5?-1:1); }
      }
    }

    if(!this.isUnderground){
      const inMingTangFront=this.y>hy&&this.y<hy+cR*1.5&&Math.abs(dx_h)<cR;
      const isChongSha=face&&(state.w==='lintou'||state.w==='ji')&&!elem.an;
      
      if(face&&inMingTangFront){
        if(isChongSha){
          this.vy+=.5*pScale*dt;
          this.vx+=dx_h*.15*dt;
          if(this.state==='moving'&&Math.random()<.08*dt){
            this.state='sha';this.life=60;
          }
        }else{
          this.vy-=.2*pScale*dt;
          if(elem.an && this.y > hy + cR * 0.5) this.vy -= .4 * pScale * dt; // 案山關攔內氣
        }
      }else if(!face&&state.w!=='none'&&state.w!=='lintou'&&this.y>riverY(this.x)-30){
        this.vy-=.5*pScale*dt;
      }
    }

    const rY=riverY(this.x);
    if(state.w!=='none'&&state.w!=='lintou'){
      const distR=Math.abs(this.y-rY);
      
      if(this.y>=rY-20&&this.y<=rY+20){this.hasTouchedWater=true}
      
      if(adv2.qin && Math.abs(this.x - hx) < W*0.1 && this.y > rY - 30 && this.y < rY + 10){
          this.vx *= Math.pow(0.6, dt); this.vy *= Math.pow(0.6, dt);
          if(this.state==='moving' && Math.random() < 0.05 * dt) { this.state='settled'; this.life=600; }
      }

      if(distR<40&&this.y<rY&&this.vy>0){
        this.vy*=Math.pow(.8,dt);
        const slope=(riverY(this.x+5)-riverY(this.x-5))/10;
        this.vx+=slope*.5*pScale*dt;
      }
      
      if(state.w==='you'&&this.y>rY-80&&this.y<=rY){
        
        const dx=hx-this.x,dy=hy-this.y;const d=Math.max(1,Math.hypot(dx,dy));
        this.vx+=(dx/d)*.08*pScale*dt;
        this.vy*=Math.pow(.85,dt); 
      }
      if((state.w==='you'||state.w==='jiuqu')&&this.y>rY-20&&this.y<=rY&&this.vy>0){
        this.vy*=Math.pow(0.5,dt);
        if(this.state==='moving'&&Math.random()<0.1*dt){this.state='settled';this.life=800;}
      }
      if(state.w==='fan'&&this.y>hy&&this.y<rY+20){
        
        const dx=this.x-hx,dy=this.y-hy;const d=Math.max(1,Math.hypot(dx,dy));
        this.vx+=(dx/d)*.15*pScale*dt; // 離心力將真氣向外扯
        this.vy+=.1*pScale*dt;
        
        // 反弓無情，如弓射箭：將接觸反弓弧面的氣轉為煞氣，並給予極大的反向初速，直射穴場
        if(this.state!=='sha' && Math.random() < 0.05 * dt) {
            this.state = 'sha'; this.life = 80;
            this.vx = -(dx/d) * 4.0 * pScale; // 負向量：反向直射
            this.vy = -(dy/d) * 4.0 * pScale;
        }
      }
      if(state.w==='gejiao'){
        if(distR<40&&this.y<rY){this.vy+=(40-distR)*.015*pScale*dt}
        // 割腳水淘空地基：貼穴太近，產生極強的「下拽真空」，連明堂內已經聚好的氣都會被硬生生扯入水中
        if (this.y > hy && this.y < rY) {
            this.vy += 1.2 * pScale * dt; // 真空下墜引力
            if(this.state === 'settled' && Math.random() < 0.05 * dt) {
                this.state = 'swept'; this.dir = this.x < hx ? -1 : 1;
            }
        }
      }
      if((state.w==='ji'||state.w==='fan')&&distR<20&&this.y<rY&&Math.random()<.05*dt){
        this.state='sha';this.life=50;
      }
      
      if(state.w==='jiuqu'&&Math.abs(this.x-W/2)>W*.15&&this.y>rY-20){
        this.vx*=Math.pow(.9,dt);this.vy*=Math.pow(.9,dt);
        if(this.state!=='settled'&&Math.random()<.02*dt){this.state='settled';this.life=800}
      }

      if(state.w==='bazi' && this.y > hy && this.y < rY){
          // 八字牽鼻水：無情外八字會產生極強的斜向拉力，將明堂真氣無情撕裂拖走
          this.vx += (this.x < hx ? -1 : 1) * 0.5 * pScale * dt; 
          this.vy += 0.8 * pScale * dt;
          if(this.state==='moving' && Math.random() < 0.02 * dt) { this.vy += 2.0 * pScale; } // 瞬間下墜
          if(this.state==='settled' && Math.random() < 0.08 * dt) { this.state='swept'; this.dir = this.x < hx ? -1 : 1; }
      }
    }

    
    const dxA = Math.abs(this.x - hx);
    // 修正：使其真正貼合視覺案山的拋物線 (案山範圍 W*0.36 ~ W*0.64, 頂點 W*0.5, H*0.76，底部界限約 H+4)
    const dxRatio = Math.min(1, dxA / (W * 0.14));
    const anshanBounceY = H * 0.76 + dxRatio * dxRatio * H * 0.24;
    // 修正：案山只攔截空中真氣，且限於視覺範圍內 (dxA < W*0.16)，解決邊界幽靈碰撞 Bug
    if(elem.an && dxA < W * 0.16 && this.y >= anshanBounceY && this.vy > 0 && this.state !== 'swept' && this.state !== 'sha'){
      if(adv2.guan) {
          this.vy = -Math.abs(this.vy) * 0.8; 
          this.vx += (hx - this.x) * 0.2 * dt; 
          // 官星截氣：威權守護，能將即將外洩或浮躁的氣強行扣留，並化為純正的吉氣
          if(Math.random() < 0.1 * dt) { 
              this.state = 'held'; this.purified = true; 
              shockwaves.push({x:this.x, y:this.y, r:0, maxR:baseDim*.05, life:20, type:'pure'}); // 官星化煞波紋
          }
          this.y = anshanBounceY - 1;
      } else {
          this.vy = -Math.abs(this.vy)*.4;
          // 修正：真實的「迴風返氣」。案山不僅往上托，更具有強大的向心捲流作用，強制將向外衝的氣導回穴場
          if(elem.mt) {
              this.vx += (hx - this.x) * 0.15 * dt; // 加強向太極中心的聚攏力
              this.vy -= 0.8 * pScale * dt; // 增強向上迴風的托力
              if(this.state==='moving' && Math.random() < 0.08 * dt) { this.state='settled'; this.life=500; }
          }
          this.y = anshanBounceY - 1; 
      }
    }
    
      if(elem.san && state.w!=='none'){
        const dx=W/2-this.x,dy=(face?H*.65:H*.39)-this.y;const dSq=dx*dx+dy*dy;const sanR=baseDim*.11;
        if(dSq<sanR*sanR){
          // 三叉水「水聚天心」：兩水交匯形成強大的水漩渦(太極水暈)，將真氣牢牢吸附並高速旋轉淨化
          const d = Math.max(1, Math.sqrt(dSq));
          this.vx += (dx/d) * 0.5 * pScale * dt; // 向心力
          this.vy += (dy/d) * 0.5 * pScale * dt;
          this.vx -= (dy/d) * 1.5 * pScale * dt; // 產生極強的切線旋轉力
          this.vy += (dx/d) * 1.5 * pScale * dt;
          this.vx *= Math.pow(.85, dt); // 水的阻力，防止粒子飛出
          this.vy *= Math.pow(.85, dt);
          
          if((this.state==='moving'||this.state==='sha')&&Math.random()<.1*dt){
              this.state='settled';this.life=800;this.purified=true;
              shockwaves.push({x:this.x, y:this.y, r:0, maxR:baseDim*.08, life:30, type:'pure'}); // 天心漩渦淨化波紋(稍微大一點)
          }
        }
      }
      if(elem.yue){
        const dx=(this.x-W/2)/(W*.16),dy=(this.y-(face?H*.62:H*.42))/(H*.07);const distNorm=dx*dx+dy*dy;
        if(distNorm<1){
          this.vx+=-dy*.25*pScale*dt;this.vy+=dx*.25*pScale*dt;
          
          if((this.state==='moving'||this.state==='sha')&&(distNorm<.2||Math.random()<.08*dt)){
              this.state='settled';this.life=800;this.purified=true;
              shockwaves.push({x:this.x, y:this.y, r:0, maxR:baseDim*.06, life:25, type:'pure'}); // 半月池淨化波紋
          }
        }
      }

    if(this.y>hy&&this.y<H*.88-10&&Math.abs(this.x-hx)<cR*1.5){
      const dx=this.x-hx,dy=this.y-hy;
      const d=Math.max(1,Math.hypot(dx,dy));
      const asymmetry=(state.ml==='you'?1.2:.8)-(state.mr==='you'?1.2:.8);
      this.vx+=(-dy/d)*.02*pScale*dt+asymmetry*.01*pScale*dt;
      this.vy+=(dx/d)*.02*pScale*dt;
      this.vy-=.02*pScale*dt;
      
      // 左動右靜：青龍(陽)主動推氣，白虎(陰)主靜收氣。真氣應在明堂內形成「左旋向右」的太極暗流
      if(state.ml==='you' && state.mr==='you') {
        this.vx += 0.03 * pScale * dt; // 青龍方給予微妙的向右推力
        if (this.x > hx && this.vx > 0) this.vx *= Math.pow(0.7, dt); // 到達白虎方則迅速減速收斂
        this.vy -= .03 * pScale * dt; 
        if(Math.random() < .06 * dt && this.state === 'moving') { this.state='settled'; this.life=500; } 
      }
      
      // 龍虎相鬥：青龍逼壓且白虎抬頭，明堂受極限擠壓，真氣化為鬥煞
      if(state.ml==='ya' && state.mr==='tai') {
          this.vx += (Math.random() - 0.5) * 2.0 * pScale * dt; // 內部亂流
          if(Math.random() < 0.05 * dt) { this.state='sha'; this.life=50; }
      }
    }

    const tX=Math.cos(windTime*.002)*15;
    const tY=Math.sin(windTime*.002)*15;
    const nx=noise((this.x/W)*4+tX,(this.y/H)*4+tY);
    const ny=noise((this.x/W)*4+100+tX,(this.y/H)*4+tY);
    
    this.vx+=nx*windAmp*3*pScale*dt;this.vy+=ny*windAmp*1.5*pScale*dt;
    this.vx+=(Math.random()-.5)*jitter*pScale*dt;
    
    let strengthMod=1;
    if(state.xue==='wo') strengthMod=1.6;
    if(state.xue==='ru') strengthMod=(state.d==='pingyang'||state.d==='huan') ? 1.8 : 0.5; // 修正：平洋一突勝千峰
    
    if(elem.taiji||elem.chao){
      const s=((elem.taiji?1:0)+(elem.chao ? 0.4 : 0))*strengthMod*(face?1:0.5);
      const dx=hx-this.x,dy=hy-this.y;const dSq=dx*dx+dy*dy;
      if(dSq<cR_sq*3.61&&dSq>1){
        const d=Math.sqrt(dSq);const strength=1-(d/(cR*1.9));
        this.vx+=(dx/d)*.03*strength*s*pScale*dt;
        if(dy>0)this.vy+=(dy/d)*.02*strength*s*pScale*dt;
        
        
        if(elem.taiji && dSq < cR_sq * 0.4) {
            if(state.d === 'si' || state.d === 'po') {
                // 煞穴反噬：死破龍強行結穴，太極無法消化腐氣，反向排斥引爆
                this.vx += (this.x - hx) * 0.1 * dt; 
                this.vy += (this.y - hy) * 0.1 * dt;
                if(Math.random() < 0.1 * dt) { this.state='sha'; this.life=40; }
            } else {
                this.vx *= Math.pow(0.5, dt); 
                this.vy *= Math.pow(0.5, dt);
                this.vx -= dy * 0.02 * dt; 
                this.vy += dx * 0.02 * dt; // 完美的太極螺旋聚氣
                // 修正：真氣在太極暈內旋轉沉澱後應化為結穴吉氣，避免無限重疊且能啟動流體排斥
                if (this.state === 'moving' && Math.random() < 0.02 * dt) { this.state = 'settled'; this.life = 600; }
            }
        }
      }
    }
    
    
    if(state.d==='pingyang' && !this.isUnderground){
        if(state.w==='none') {
            this.vx += (Math.random() - 0.5) * 4.0 * pScale * dt; 
        } else if(state.w!=='lintou' && this.y < riverY(this.x)) {
            this.vy += 0.25 * pScale * dt; 
        }
    }
    
    this.vx*=Math.pow(.96,dt);this.vy*=Math.pow(.96,dt);this.vy+=.08*pScale*dt;
    if(state.d==='si') { this.vx*=Math.pow(.85,dt); this.vy*=Math.pow(.85,dt); } // 修正：死病龍氣衰凝滯，無法順暢輸送
    
    // 水口交鎖，明堂停蓄：若下游有神獸關攔，且非凶水，明堂內部會形成如水壩般的「停蓄」氣場，極度聚氣
    let hasWaterLock = (elem.luo || elem.hua || adv2.shixiang || adv2.qin);
    if(hasWaterLock && !['gejiao','ji','lintou','none'].includes(state.w)) {
        if(this.y > hy && this.y < riverY(this.x) && this.state === 'moving') {
            this.vx *= Math.pow(0.85, dt); // 氣場受到水壩效應，極度穩定緩慢
            this.vy *= Math.pow(0.85, dt);
            if(Math.random() < 0.03 * dt) { this.state = 'settled'; this.life = 800; } // 迅速結氣化財
        }
    }
    
    if(state.d==='ji' && this.y > hy && !elem.an && state.w==='none' && this.vy > 2.0 * pScale){
        if(Math.random() < 0.1 * dt) { this.state='sha'; this.life=40; }
    }

    this.vx=Math.max(-3.5*pScale,Math.min(3.5*pScale,this.vx));
    if(this.state!=='sha'){
      let min_vy;
      if(this.vy<0){min_vy=-3*pScale}
      else{
        let baseMin = state.d==='ji' ? 1.8*pScale : (state.d==='huan' ? 0.12*pScale : 0.4*pScale);
        min_vy=(distSq<cR_sq*1.44)?.1*pScale:baseMin;
      }
      let maxVy = state.d==='ji' ? 5.0*pScale : (state.d==='huan' ? 1.2*pScale : 3*pScale);
      this.vy=Math.max(min_vy,Math.min(maxVy,this.vy));
    }else{this.vy=Math.max(-3.5*pScale,Math.min(3.5*pScale,this.vy))}
    
    // 破碎砂碎氣：山體崩塌破碎，無法護衛且會將真氣「割裂」。真氣撞擊後化為凶煞，並以尖銳的折角彈入明堂污染氣場
    if((state.ml==='po'&&this.x<W*.15)||(state.mr==='po'&&this.x>W*.85)){
      if(this.state !== 'sha' && Math.random() < 0.08 * dt){
          this.state = 'sha'; this.life = 60;
          // 以極大的反向初速，將碎裂的煞氣像子彈一樣彈入明堂中央
          this.vx = (state.ml==='po' && this.x<W*.15) ? 3.5 * pScale : -3.5 * pScale;
          this.vy = (Math.random() - 0.2) * 3.0 * pScale; 
          return true;
      }
    }
    if(!state.shu&&state.d==='sheng'&&this.y>hy-20&&this.y<hy&&Math.random()<.01*dt){
      this.state='sha';this.life=40;
    }
    
    for(let obs of obstacles){
      const dx=this.x-(obs.nx*W),dy=this.y-(obs.ny*H);const r=obs.rRatio*baseDim;const dSq=dx*dx+dy*dy;
      if(dSq<r*r){
        const d=Math.max(.001,Math.sqrt(dSq));
        this.x=(obs.nx*W)+(dx/d)*r*1.05; // 修正：將粒子實體擠出障礙物表面，防止連續碰撞導致的黑洞沾黏與效能崩潰
        this.y=(obs.ny*H)+(dy/d)*r*1.05;
        this.vx=(dx/d)*4*pScale;this.vy=(dy/d)*4*pScale;
        this.state='sha';this.life=60;shockwaves.push({x:this.x,y:this.y,r:0,maxR:baseDim*.1,life:35});break;
      }
    }
    
    const sf=(state.ml==='ya'||state.mr==='ya'?.7:1)*(state.d==='si'?.7:state.d==='sheng'?1.15:1);
    this.x+=this.vx*sf*dt;this.y+=this.vy*sf*dt;
    if(view.heat)heatAdd(this.x,this.y,.6);
    
    if(state.w!=='none'&&state.w!=='lintou'&&this.x>W*.11&&this.x<W*.89&&this.y>=rY-5){
      if(state.w==='you'||state.w==='jiuqu'){
        let baseLife = state.w==='jiuqu' ? 800 : (300+Math.random()*200);
        let validGuards = (state.ml !== 'none' || state.mr !== 'none');
        let guardMult = validGuards ? (1+(elem.luo ? 0.6 : 0)+(elem.hua ? 0.4 : 0)) : 1;
        this.state='settled';
        this.life=baseLife * guardMult;
        this.y=rY+6+Math.random()*12;if(state.w==='jiuqu'){this.vx*=.5;this.vy*=.5}
      }else{this.state='swept';this.dir=state.w==='ji'?1:(this.x<hx?-1:1)}
      return true;
    }
    
    if(elem.an&&this.y>=H*.82&&this.vy>-0.5){this.state='held';this.life=220+Math.random()*150;this.y=H*.82-2-Math.random()*18;return true}
    return!(this.y>H+margin||this.y<-margin*2||this.x<-margin||this.x>W+margin);
  }
  
  draw(){
    if(this.state==='sha'||(this.state==='swept'&&Math.abs(this.vx)>2)){
      const angle=Math.atan2(this.vy,this.vx);
      const speed=Math.hypot(this.vx,this.vy);
      const len=Math.min(25,speed*4);
      ctx.save();ctx.translate(this.x,this.y);ctx.rotate(angle);
      ctx.fillStyle=this.state==='sha'?'rgba(255,60,40,0.9)':'rgba(190,220,240,0.8)';
      ctx.beginPath();
      ctx.moveTo(len/2,0);ctx.lineTo(-len/2,-4);ctx.lineTo(-len/4,0);ctx.lineTo(-len/2,4);ctx.closePath();
      ctx.fill();ctx.restore();return;
    }
    let sprite;
    if(this.state==='leak')sprite=spriteCache.leak;
    else if(this.state==='settled')sprite=spriteCache.settled;
    else if(this.state==='held')sprite=spriteCache.held;
    else if(this.purified) sprite=spriteCache.pure; 
    else if(this.inPool > 0) sprite=spriteCache.pure;
    else sprite=this.faint?spriteCache.faint:spriteCache.normal;
    
    let pulse=1;if(this.state==='settled'||this.state==='held')pulse=1+.2*Math.sin(windTime*.15+this.ph);
    const drawW=sprite.width*pulse,drawH=sprite.height*pulse;
    ctx.drawImage(sprite,this.x-drawW/2,this.y-drawH/2,drawW,drawH);
  }
}

function houseY(){return H*ENV.houseY}
function dragonX(t){
    let base=W*.5;
    if(state.d==='sheng')base+=W*.1*Math.sin(t*Math.PI*2.2)*(1-t);
    if(state.d==='ji')base+=W*.03*Math.sin(t*Math.PI*4)*(1-t);
    if(state.d==='huan')base+=W*.18*Math.sin(t*Math.PI*1.8)*(1-t);
    if(state.d==='po')base+=W*.05*Math.sin(t*Math.PI*1.5)*(1-t);
    if(state.d==='pingyang')base+=W*.2*Math.sin(t*Math.PI);
    if(state.d==='huilong'){
        base = W * 0.5 + W * 0.35 * Math.sin((1 - t) * Math.PI); // 修正：完美的半圓弧 C 字迴龍，精準顧祖
    }
    base+=Math.sin(t*15)*(W*.015)*(1-t);base+=Math.sin(t*32)*(W*.005)*(1-t);
    return base;
}
function dragonY(t){
    if(state.d==='pingyang') return H*.1 + t * (houseY()-14 - H*.1); 
    if(state.d==='huilong'){
        return -20 + t * (houseY() + 20 - 14); 
    }
    return-20+t*(houseY()-14);
}
function riverY(x){let t=(x-W*ENV.riverStart)/(W*(ENV.riverEnd-ENV.riverStart));t=Math.max(0,Math.min(1,t));const c=Math.cos((t-.5)*Math.PI);if(state.w==='you')return H*.74+H*.12*c;if(state.w==='jiuqu')return H*.74+H*.06*Math.sin(t*Math.PI*4);if(state.w==='gejiao')return H*.58;if(state.w==='fan')return H*.8-H*.09*c;if(state.w==='ji')return H*ENV.riverBaseY;if(state.w==='bazi')return H * (0.65 + Math.abs(x/W - 0.5) * 0.666);return 1e9}
function heatAdd(x,y,a){if(!view.heat)return;const gx=Math.floor(x/W*gw),gy=Math.floor(y/H*gh);if(gx<0||gy<0||gx>=gw||gy>=gh)return;heat[gy*gw+gx]+=a}

function computeScores(){
  let isBadDragon = (state.d === 'si' || state.d === 'po');
  let D=Math.min(100, {sheng:90,si:40,po:25,pingyang:70,huilong:95,ji:60,huan:50}[state.d]+(state.shu && !isBadDragon ? 10 : 0)-(state.fenzhi?20:0)+(adv2.zutai?15:0)+(adv2.fengyao?10:0));
  if(state.d==='pingyang'&&state.w==='none') D -= 40;
  const mlScore={you:35,ya:15,po:10,none:0}[state.ml];const mrScore={you:35,tai:5,po:10,none:0}[state.mr];
  let S=Math.min(100,mlScore+mrScore+(elem.an?15:0)+(elem.chao?15:0)-(state.ao?30:0)-(state.tantou?20:0)+(state.guiyao?(!['po','si','huan'].includes(state.d)?10:-15):0)+(adv2.hulong?15:0)-(adv2.qingquan?20:0)-((state.ml==='ya'&&state.mr==='tai')?30:0));
  
  let validGuards = (state.ml !== 'none' || state.mr !== 'none' || state.d === 'pingyang');
  let waterExitScore=0;
  let isBadWater = ['gejiao','fan','bazi','ji'].includes(state.w);
  if(state.w!=='none'&&state.w!=='lintou'&&validGuards){
      if(elem.luo)waterExitScore+=15;if(elem.hua)waterExitScore+=15;if(adv2.shixiang)waterExitScore+=20;if(adv2.qin)waterExitScore+=10;
      if(isBadWater) waterExitScore *= 0.2; // 修正：明堂逢凶水，下游神獸無力回天
  }
  
  let baseWa = {you:60,jiuqu:90,gejiao:10,lintou:0,none:30,ji:10,fan:10,bazi:0}[state.w];
  let Wa=Math.min(100,baseWa+waterExitScore+((elem.san && !isBadWater)?15:0)+(elem.yue?15:0));
  let xueScore = 0;
  if(state.xue==='wo') {
      xueScore = (state.d==='ji'||state.d==='sheng')?15:5;
      if(state.xing==='jin' || state.xing==='shui') xueScore += 10; // 金水星喜結窩鉗
      if(state.xing==='mu' || state.xing==='huo') xueScore -= 10; // 木火星結窩為剋/煞(洩氣/鬥煞)
  }
  else if(state.xue==='ru') {
      xueScore = (state.d==='pingyang'||state.d==='huan')?15:-10;
      if(state.xing==='mu' || state.xing==='tu') xueScore += 10;
      if(state.xing==='jin' || state.xing==='shui' || state.xing==='huo') xueScore -= 10;
  }
  
  let xingScore = 0;
  if(state.xing==='jin') xingScore = 10;
  else if(state.xing==='mu') xingScore = 5;
  else if(state.xing==='shui') xingScore = -5;
  else if(state.xing==='tu') xingScore = 5;
  else if(state.xing==='huo') xingScore = (elem.yue || (state.w !== 'none' && state.w !== 'lintou')) ? -5 : -30;
  
  let X_raw = 0 + (elem.taiji?25:0) + (elem.xia?25:0) + (elem.mt?20:0) + (elem.xia?xueScore+xingScore:0) + (adv2.qian?15:0) - (adv2.tianzhan?25:0) - (adv2.qing?20:0);
  let X = !elem.xia ? Math.min(15, Math.max(0, X_raw)) : Math.max(0, Math.min(100, X_raw));
  let Xg_base = face ? 60 : (state.d === 'pingyang' && state.w !== 'none' ? 70 : 20);
  let waterBonus = (state.w==='you'||state.w==='jiuqu') ? 25 : 0;
  let Xg=face?Math.min(100,Xg_base+waterBonus+(elem.an?10:0)+(adv2.guan?15:0)) : Math.min(100, Xg_base+(state.d==='pingyang'?waterBonus:0)+(elem.an?5:0)+(elem.chao?0:0));
  if(!elem.xia) Xg *= 0.2;
  return[Math.max(0,D),Math.max(0,X),Math.max(0,S),Math.max(0,Wa),Math.max(0,Xg)];
}
const D_DESC={sheng:'躍龍起伏',si:'死病龍',po:'破龍崩瀉',pingyang:'平洋潛龍',huilong:'迴龍顧祖',ji:'急龍直入',huan:'緩龍退敗'};
const M_DESC=(ml,mr)=>`青龍${ml==='you'?'有情':ml==='ya'?'逼壓':ml==='po'?'破碎':'無'}、白虎${mr==='you'?'有情':mr==='tai'?'抬頭(煞)':mr==='po'?'破碎':'無'}`;
const W_DESC={you:'玉帶水(凹)',jiuqu:'九曲水(極吉)',gejiao:'割腳水(極凶)',lintou:'淋頭水(極凶)',ji:'直沖湍急(快水)',fan:'反弓水(凸)',bazi:'八字牽鼻(凶)',none:'無水為界'};
const D_TAG={sheng:['來龍・躍','#7fb08f'],si:['來龍・病','#d8a24a'],po:['來龍・瀉','#c04a3a'],pingyang:['平洋・潛','#7fb08f'],huilong:['迴龍・顧','#b98a2e'],ji:['急龍・沖','#d8a24a'],huan:['緩龍・退','#d8a24a']};

  const capacity=getCapacityLimit();

  if(effectiveAvg>=70 && elem.xia && elem.mt){rating='上吉・龍真穴的';color='#b98a2e';tail='巒頭完美，生氣凝聚，上上之局。'}
  else if(effectiveAvg>=35){
    if(!elem.xia){rating='中平・有龍無穴';color='#3f6b52';tail='龍脈護從雖美，惟穴星未結，難以乘氣。';}
    else if(!elem.mt){rating='中平・明堂未成';color='#3f6b52';tail='穴星已成但明堂不足，生氣易散。';}

  }

  }
  const r=document.getElementById('rating');r.textContent=rating;r.style.background=color;
  let multiplierNote=multiplier<1?`【總加權 ×${multiplier.toFixed(1)}】`:'';

  if(elem.yue) wDescText += '(半月池)';
  if(elem.san) wDescText += '(三叉水)';

  let shaNotes = [];
  if(adv2.qing) shaNotes.push('明堂傾瀉');
  if(adv2.tianzhan) shaNotes.push('天斬煞');
  if(state.ao) shaNotes.push('凹風煞');
  if(state.fenzhi) shaNotes.push('枝龍分流');
  if(state.ml==='ya') shaNotes.push('青龍逼壓');
  if(state.mr==='tai') shaNotes.push('白虎抬頭');
  if(state.w==='gejiao') shaNotes.push('割腳水');
  if(state.w==='lintou') shaNotes.push('淋頭水');
  if(state.w==='fan') shaNotes.push('反弓水');
  if(state.w==='bazi') shaNotes.push('八字水');
  if(adv2.qingquan) shaNotes.push('擎拳煞');
  if(state.tantou) shaNotes.push('探頭煞');
  let shaStr = shaNotes.length > 0 ? `【犯煞：${shaNotes.join('、')}】` : '';
  
  document.getElementById('verdict').textContent=`龍：${D_DESC[state.d]}；砂：${M_DESC(state.ml,state.mr)}；水：${wDescText}；向：${face?'向水':'背水'}。${shaStr}${multiplierNote}${tail}`;
  
  const st=document.getElementById('status');st.innerHTML='';
  const isCangFeng = state.ml==='you' && state.mr==='you' && !state.ao && !adv2.tianzhan && !adv2.qingquan;
  const cangFengTag = (state.d === 'pingyang' && !state.ao && !adv2.tianzhan) ? ['藏風・平洋', '#7fb08f'] : (isCangFeng ? ['藏風・得', '#7fb08f'] : ['藏風・瑕', '#d8a24a']);
  
  const xingLabels = {jin:'金星',mu:'木星',shui:'水星',huo:'火星(煞)',tu:'土星'};
  const xueLabels = {none:'無',wo:'窩鉗',ru:'乳突'};
  const xueStr = elem.xia ? (`星體・${xingLabels[state.xing]}` + (state.xue !== 'none' ? ` (${xueLabels[state.xue]})` : '')) : '穴星・未結';
  const isXueMatch = !( (state.xue==='wo' && (state.xing==='mu'||state.xing==='huo')) || (state.xue==='ru' && (state.xing==='jin'||state.xing==='shui'||state.xing==='huo')) );
  const xueColor = !elem.xia ? '#d8a24a' : (state.xing==='huo' ? '#c04a3a' : (!isXueMatch ? '#d8a24a' : '#7fb08f'));
  
  let dTag = [...D_TAG[state.d]];
  if(state.d === 'pingyang' && state.w === 'none') { dTag[0] = '平洋・無水'; dTag[1] = '#c04a3a'; }
  
  const isBadWater = ['gejiao','fan','bazi','ji','lintou'].includes(state.w);
  const isJieQi = (state.w === 'you' || state.w === 'jiuqu' || (elem.yue && !isBadWater) || (elem.san && !isBadWater));
  const jieQiTag = [isJieQi ? '界氣・得' : '界氣・散', isJieQi ? '#7fb0c9' : '#c04a3a'];
  
  const faceGood = (state.d === 'pingyang') ? !face : face;
  const faceTagStr = face ? '坐向・向水' : '坐向・背水';
  const faceTagColor = faceGood ? '#7fb08f' : '#c04a3a';

  const tags=[dTag, cangFengTag, jieQiTag, [xueStr,xueColor], [faceTagStr, faceTagColor]];
  if(adv2.qing) tags.push(['形煞・傾瀉', '#c04a3a']);
  if(adv2.tianzhan) tags.push(['形煞・天斬', '#c04a3a']);
  if(state.ao) tags.push(['形煞・凹風', '#c04a3a']);
  if(state.fenzhi) tags.push(['龍勢・分流洩氣', '#c04a3a']);
  if(adv2.qingquan) tags.push(['形煞・擎拳', '#c04a3a']);
  if(state.tantou) tags.push(['形煞・探頭', '#c04a3a']);
  tags.forEach(t=>{const s=document.createElement('span');s.textContent=t[0];s.style.borderColor=t[1];s.style.color=t[1];st.appendChild(s)});
  
  
  let autoDisabledChanged = false;

  const tantouBtn = document.querySelector('[data-k="tantou"]');
  if(tantouBtn) tantouBtn.disabled = !elem.an;
  if(!elem.an && state.tantou) {
      state.tantou = false;
      if(tantouBtn) tantouBtn.classList.remove('on');
      autoDisabledChanged = true;
  }
  const guanBtn = document.querySelector('[data-k="guan"]');
  if(guanBtn) guanBtn.disabled = !elem.an;
  if(!elem.an && adv2.guan) {
      adv2.guan = false;
      if(guanBtn) guanBtn.classList.remove('on');
      autoDisabledChanged = true;
  }

  
  const aoBtn = document.querySelector('[data-k="ao"]');
  if(aoBtn) aoBtn.disabled = false;

  
  const qingBtn = document.querySelector('[data-k="qing"]');
  if(qingBtn) qingBtn.disabled = !elem.mt;
  if(!elem.mt && adv2.qing) {
      adv2.qing = false;
      if(qingBtn) qingBtn.classList.remove('on');
      autoDisabledChanged = true;
  }
  
  
  const qingquanBtn = document.querySelector('[data-k="qingquan"]');
  const noSands = (state.ml === 'none' && state.mr === 'none');
  if(qingquanBtn) qingquanBtn.disabled = noSands;
  if(noSands && adv2.qingquan) {
      adv2.qingquan = false;
      if(qingquanBtn) qingquanBtn.classList.remove('on');
      autoDisabledChanged = true;
  }

  
  // 半月池：無水時仍可人工開鑿聚氣，僅在淋頭水時禁用
  const yueBtn = document.querySelector('[data-k="yue"]');
  if(yueBtn) {
      const isYueDisabled = (state.w === 'lintou');
      yueBtn.disabled = isYueDisabled;
      if(isYueDisabled && elem.yue) {
          elem.yue = false;
          yueBtn.classList.remove('on');
          autoDisabledChanged = true;
      }
  }

  // 其他依附於自然河道的水口/水法元件（無水或淋頭水時禁用）
  document.querySelectorAll('.water-dep').forEach(b=>{
      const isDisabled = (state.w === 'none' || state.w === 'lintou');
      b.disabled = isDisabled;
      if(isDisabled && b.classList.contains('on')) {
          b.classList.remove('on');
          const k = b.dataset.k;
          const g = b.dataset.g;
          if(g === 'elem') elem[k] = false;
          else if(g === 'adv2') adv2[k] = false;
          autoDisabledChanged = true;
      }
  });
  if(state.w === 'lintou' && elem.yue) {
      elem.yue = false;
      const yueBtn = document.querySelector('[data-k="yue"]');
      if(yueBtn) yueBtn.classList.remove('on');
  }

  if(autoDisabledChanged) bgDirty = true;

  document.getElementById('cap-num').textContent=`${capacity}/×${multiplier.toFixed(1)}`;
  document.getElementById('cap-fill').style.width=capacity+'%';
}

document.querySelectorAll('.seg').forEach(seg=>{
  if(!seg.dataset.k||seg.id==='face-seg')return;
  seg.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||b.classList.contains('tog')||b.classList.contains('preset'))return;
    seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    const oldW=state.w;state[seg.dataset.k]=b.dataset.v;
    if(seg.dataset.k==='w'){
      if(state.w!=='you'&&state.w!=='jiuqu'){ps.forEach(p=>{if(p.state==='settled'){p.state='swept';p.dir=p.x<W/2?-1:1}})}
      if(oldW==='lintou'&&state.w!=='lintou'){ps.forEach(p=>{if(p.vy>3)p.vy=1.5})}
      if(state.w==='none'){
        ps.forEach(p=>{if(p.state==='swept')p.state='moving'});
        if(elem.luo||elem.hua||elem.san||adv2.shixiang||adv2.qin){
          elem.luo=false;elem.hua=false;elem.san=false;
          adv2.shixiang=false; adv2.qin=false;
          document.querySelectorAll('.tog').forEach(x=>{
            if(['luo','hua','san','shixiang','qin'].includes(x.dataset.k)) x.classList.remove('on');
          });
        }
      }
    }
    if(seg.dataset.k==='d'){
      const newMax=ENV.maxParticles[state.d]||200;
      if(ps.length>newMax)ps.length=newMax;
      const isFaint=state.d==='si';
      ps.forEach(p=>p.faint=isFaint);
    }
    bgDirty=true;
    updateUI();
  });
  const cur=seg.querySelector('[data-v="'+state[seg.dataset.k]+'"]');if(cur)cur.classList.add('on');
});

document.querySelectorAll('.tog').forEach(b=>{
  b.addEventListener('click',()=>{
    const k=b.dataset.k;
    if(['luo','hua','san','shixiang','qin'].includes(k)&&(state.w==='none'||state.w==='lintou'))return;
    if(k==='yue'&&state.w==='lintou')return; // 淋頭水局不適合半月池
    
    if(['tantou','guan'].includes(k)&&!elem.an)return;
    if(k==='qing'&&!elem.mt)return;
    if(k==='qingquan'&&state.ml==='none'&&state.mr==='none')return;
    
    const o=b.dataset.g==='elem'?elem:b.dataset.g==='adv'?state:b.dataset.g==='adv2'?adv2:view;
    o[k]=!o[k];b.classList.toggle('on',o[k]);
    if(k==='shaMode')cv.style.cursor=o[k]?'crosshair':'default';
    if(k==='heat'&&!view.heat){if(heat)heat.fill(0)}
    bgDirty=true;
    updateUI();
  });
});

cv.addEventListener('click',e=>{
  if(!state.shaMode)return;
  const rect=cv.getBoundingClientRect();
  const nx=(e.clientX-rect.left)/rect.width;
  let ny=(e.clientY-rect.top)/rect.height;
  
  if(view.tilt) {
      // 反向映射：將視覺壓縮的 Y 座標還原回物理空間
      ny = 0.5 + (ny - 0.5) / 0.6;
      if(ny < 0 || ny > 1) return; // 點擊在浮島外的虛空處無效
  }
  
  let removed=false;
  for(let i=obstacles.length-1;i>=0;i--){

    obstacles.push({nx,ny,rRatio:.03});
    shockwaves.push({x:nx*W,y:ny*H,r:0,maxR:baseDim*.08,life:25});
  }
  bgDirty=true;

});

  ctx.save();if(state.w==='none'){ctx.restore();return}
  
  if(state.w==='lintou'){
    ctx.strokeStyle='rgba(150,200,230,.6)';ctx.lineWidth=2;ctx.setLineDash([10,15]);ctx.lineDashOffset=-waterOffset;
    for(let i=-15;i<=15;i+=5){ctx.beginPath();ctx.moveTo(W/2+i,0);ctx.lineTo(W/2+i,H*.55);ctx.stroke()}ctx.setLineDash([]);
    ctx.restore();return;
  }
  ctx.lineWidth=state.w==='jiuqu'?14:18;ctx.strokeStyle=state.w==='you'||state.w==='jiuqu'?'rgba(62,111,134,.9)':state.w==='gejiao'?'rgba(100,60,60,.9)':state.w==='bazi'?'rgba(80,120,150,.7)':'rgba(70,90,110,.9)';
  if(state.w !== 'bazi') {
    ctx.beginPath();for(let x=W*ENV.riverStart;x<=W*ENV.riverEnd;x+=6){const y=riverY(x);x<=W*ENV.riverStart+1?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();
  }
  
  if(state.w==='bazi'){
      ctx.lineWidth=10;ctx.strokeStyle='rgba(80,120,150,.5)';
      ctx.beginPath();ctx.moveTo(W*.5,H*.65);ctx.lineTo(W*.2,H*.85);ctx.stroke();
      ctx.beginPath();ctx.moveTo(W*.5,H*.65);ctx.lineTo(W*.8,H*.85);ctx.stroke();
  }

  ctx.lineWidth=2;ctx.strokeStyle=state.w==='you'||state.w==='jiuqu'?'rgba(190,230,240,.5)':'rgba(235,242,250,.7)';ctx.setLineDash([12,18]);ctx.lineDashOffset=-waterOffset;
  if(state.w !== 'bazi') {
    ctx.beginPath();for(let x=W*ENV.riverStart;x<=W*ENV.riverEnd;x+=6){const y=riverY(x);x<=W*ENV.riverStart+1?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();
  } else {
    ctx.beginPath();ctx.moveTo(W*.5,H*.65);ctx.lineTo(W*.2,H*.85);ctx.stroke();
    ctx.beginPath();ctx.moveTo(W*.5,H*.65);ctx.lineTo(W*.8,H*.85);ctx.stroke();
  }
  ctx.setLineDash([]);

  if(state.w==='jiuqu'){
    ctx.fillStyle='rgba(190,230,240,.4)';
    for(let k=1;k<=3;k++){const px=W*(ENV.riverStart+k*0.18),py=riverY(px);ctx.beginPath();ctx.arc(px,py,6+Math.sin(waterOffset*.1+k)*2,0,6.28);ctx.fill();}
  }else if(state.w==='ji'){
    ctx.strokeStyle='rgba(255,100,80,.8)';ctx.lineWidth=2;
    for(let k=0;k<3;k++){const py=H*(ENV.riverBaseY-0.2)+((waterOffset*2+k*60)%100);ctx.beginPath();ctx.moveTo(W/2-8,py-8);ctx.lineTo(W/2,py);ctx.lineTo(W/2+8,py-8);ctx.stroke();}
  }
  ctx.restore();
}

function drawHeat(dt){
  if(!view.heat||!heatCtx)return;
  const img=heatImg;
  for(let i=0;i<heat.length;i++){
    const v=Math.min(1,heat[i]*.14);
    img.data[i*4]=Math.floor(40+215*v);img.data[i*4+1]=Math.floor(60+150*v);img.data[i*4+2]=Math.floor(100+20*v);img.data[i*4+3]=Math.max(0,Math.floor(v*170));
    heat[i]*=Math.pow(.92,dt);if(heat[i]<.01)heat[i]=0;
  }
  heatCtx.putImageData(img,0,0);
  ctx.save();ctx.globalAlpha=.7;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(heatC,0,0,W,H);ctx.restore();
}

function drawWindArrows(dt){
  if(!view.wind)return;
  const step=Math.max(40,baseDim*.08);
  const tX=Math.cos(windTime*.002)*15;
  const tY=Math.sin(windTime*.002)*15;
  for(let y=step/2;y<H;y+=step)for(let x=step/2;x<W;x+=step){
    let shelter=1;
    if(state.ml==='you'&&state.mr==='you'&&elem.an)shelter=(x>W*.16&&x<W*.84&&y>H*.18)?.05:1;
    else if(state.ml==='you'&&state.mr==='you')shelter=(x>W*.16&&x<W*.84&&y>H*.18)?.4:1;
    else if(elem.an)shelter=(x>W*.35&&x<W*.65&&y>H*.18)?.6:1; // 修正：案山單獨存在時亦能提供正面部分擋風效果
    if(adv2.hulong && Math.abs(x - W/2) < W*0.2) shelter *= 0.2;
    if(state.d==='pingyang') shelter *= 0.2; // 修正：同步平洋龍的視覺抗風力
    if(state.ao&&x<W*.28&&y>H*.25&&y<H*.45)shelter=2.5;if(state.mr==='tai'&&x>W*.7)shelter=1.5;if(state.guiyao&&y<H*.45&&x>W*.3&&x<W*.7)shelter=.4;
    if(adv2.tianzhan && Math.abs(x - W/2) < W*0.05 && y > H*0.2 && y < H*0.4) shelter = 5.0;
    
    const nx=noise((x/W)*6+tX,(y/H)*6+tY);
    const ny=noise((x/W)*6+50+tX,(y/H)*6+tY);
    const base=shelter>1?1.5:.5;const wx=nx*base*shelter*2;const wy=ny*base*shelter*2;
    const len=Math.min(18,Math.hypot(wx,wy)*6+2);const angle=Math.atan2(wy,wx);const m=Math.hypot(wx,wy);
    ctx.strokeStyle=m<.5?'rgba(140,200,160,.2)':m<1.1?'rgba(220,200,140,.3)':'rgba(220,120,100,.4)';ctx.lineWidth=1.5;
    const x2=x+Math.cos(angle)*len,y2=y+Math.sin(angle)*len;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.moveTo(x2,y2);ctx.lineTo(x2-5*Math.cos(angle-.5),y2-5*Math.sin(angle-.5));ctx.moveTo(x2,y2);ctx.lineTo(x2-5*Math.cos(angle+.5),y2-5*Math.sin(angle+.5));ctx.stroke();
  }
}

function drawTaiji(){
  if(!elem.taiji)return;const hx=W/2,hy=houseY();
  ctx.save();ctx.translate(hx,hy);ctx.rotate(lastTime*.0015);ctx.strokeStyle='rgba(230,195,110,.85)';ctx.lineWidth=1.8; // 修正：太極代表內氣生機，不應被外部煞風(windTime)帶動
  ctx.beginPath();ctx.arc(0,0,10,0,6.28);ctx.stroke();ctx.beginPath();ctx.arc(0,-5,5,Math.PI*1.5,Math.PI*.5);ctx.stroke();ctx.beginPath();ctx.arc(0,5,5,Math.PI*1.5,Math.PI*.5,true);ctx.stroke();ctx.restore();
}

function drawShockwaves(dt){
  for(let i=shockwaves.length-1;i>=0;i--){
    const sw=shockwaves[i];
    sw.r+=(sw.maxR/35)*dt;
    sw.life-=dt;
    if(sw.life<=0){shockwaves.splice(i,1);continue}
    const progress=sw.r/sw.maxR;
    // 支援化煞為用的金色淨化波紋
    ctx.strokeStyle=sw.type==='pure'?`rgba(240,208,128,${1-progress})`:`rgba(255,80,60,${1-progress})`;
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(sw.x,sw.y,sw.r,0,6.28);ctx.stroke();
  }
}

let disp=[0,0,0,0,0],dispVel=[0,0,0,0,0];
function drawRadar(dt){
  const w=radarW,h=radarH;const cx=w/2,cy=h/2+10;
  const R=Math.min(w,h)/2-35;
  rCtx.clearRect(0,0,w,h);const labs=['龍','穴','砂','水','向'];
  rCtx.strokeStyle='rgba(246,241,231,.14)';rCtx.lineWidth=1;
  for(let r=1;r<=5;r++){rCtx.beginPath();for(let k=0;k<=5;k++){const a=-Math.PI/2+k*2*Math.PI/5;const x=cx+Math.cos(a)*R*r/5,y=cy+Math.sin(a)*R*r/5;k?rCtx.lineTo(x,y):rCtx.moveTo(x,y)}rCtx.stroke()}
  for(let k=0;k<5;k++){const a=-Math.PI/2+k*2*Math.PI/5;rCtx.beginPath();rCtx.moveTo(cx,cy);rCtx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);rCtx.stroke();rCtx.fillStyle='#cfc6b4';rCtx.font='13px "Noto Serif TC",serif';rCtx.textAlign='center';rCtx.textBaseline='middle';rCtx.fillText(labs[k],cx+Math.cos(a)*(R+12),cy+Math.sin(a)*(R+12))}
  const t=computeScores();
  for(let k=0;k<5;k++){dispVel[k]+=(t[k]-disp[k])*.06*dt;dispVel[k]*=Math.pow(.75,dt);disp[k]+=dispVel[k]*dt}
  rCtx.beginPath();for(let k=0;k<5;k++){const a=-Math.PI/2+k*2*Math.PI/5,v=disp[k]/100*R;const x=cx+Math.cos(a)*v,y=cy+Math.sin(a)*v;k?rCtx.lineTo(x,y):rCtx.moveTo(x,y)}
  rCtx.closePath();rCtx.fillStyle='rgba(185,138,46,.28)';rCtx.fill();rCtx.strokeStyle='#b98a2e';rCtx.lineWidth=2;rCtx.stroke();
}

function frame(timestamp){
  if(isPaused){requestAnimationFrame(frame);return}
  if(!lastTime){lastTime=timestamp;requestAnimationFrame(frame);return}
  let realDt=Math.min((timestamp-lastTime)/16.666,1.5);lastTime=timestamp;
  const dt = realDt * simTimeScale; // 應用時間縮放
  
  const currentWaterSpeed=state.w==='lintou'?25:state.w==='ji'?18:state.w==='fan'?5:state.w==='jiuqu'?1.5:3;
  waterOffset=(waterOffset+currentWaterSpeed*dt)%3000;
  const windSpeed=Math.max(0.5, state.ao?2.5:0, (state.ml==='po'||state.mr==='po')?2:0);
  windTime+=windSpeed*dt;
  
  if(state.tantou&&elem.an){tantouTimer+=dt;if(tantouTimer>120){for(let i=0;i<3;i++)ps.push(new Particle(true));tantouTimer=0}}
  
  // 1. 繪製不受壓縮的底層宇宙背景
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#151a1e');bg.addColorStop(1,'#0c1013');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  
  ctx.save();
  if(view.tilt){
      // 2. 2.5D 視角轉換：將繪圖原點移至中心，壓縮 Y 軸，再移回
      ctx.translate(W/2, H/2);
      ctx.scale(1, 0.6);
      ctx.translate(-W/2, -H/2);
      
      // 3. 繪製地塊基底厚度 (營造風水沙盤浮島感)
      ctx.fillStyle = '#080b0d';
      ctx.beginPath();
      ctx.moveTo(0, H/2); ctx.lineTo(0, H + H*0.5); ctx.lineTo(W, H + H*0.5); ctx.lineTo(W, H/2);
      ctx.fill();
  }

  if(bgDirty&&bgCanvas){const bctx=bgCanvas.getContext('2d');bctx.setTransform(DPR,0,0,DPR,0,0);bctx.clearRect(0,0,W,H);drawBgTerrain(bctx);bgDirty=false}
  if(bgCanvas)ctx.drawImage(bgCanvas,0,0,W,H);
  
  drawWaterFlow();drawHeat(dt);drawWindArrows(dt);drawTaiji();
  
  spawnAcc+=ENV.spawnRate[state.d]*dt;
  const maxP = ENV.maxParticles[state.d] || 200;
  while(spawnAcc>=1&&ps.length<maxP){ps.push(new Particle());spawnAcc--}
  if(ps.length>=maxP)spawnAcc=0;
  
  const hx=W/2,hy=houseY(),cR=baseDim*ENV.centerRBase;
  const centerR=cR*(elem.mt?1.3:1)*(elem.xia?1.12:1);
  const capacityLimit=getCapacityLimit();
  const globalMultiplier=getGlobalMultiplier();
  
  let scoreGather=0;
  let scoreScatter=0;
  let events=0;
  let avgKinetic=0;
  let mingTangCount=0;
  const centerRSq=centerR*centerR;
  const fastThresholdSq=(1.5*pScale)*(1.5*pScale);
  
  for(let i=0;i<ps.length;){
    const p=ps[i];const alive=p.update(dt);
    if(!alive){
      if(p.state!=='settled'&&p.state!=='held'){events++}
      ps[i]=ps[ps.length-1];ps.pop()
    }
    else{i++}
  }
  
  clearGrid();for(let p of ps)addToGrid(p);
  
  const shaRadius=baseDim*.03;const shaRadSq=shaRadius*shaRadius;
  for(let p of ps){
    if(p.state==='sha'&&(Math.abs(p.vx)>1||Math.abs(p.vy)>1)){
      const nearby=getNearby(p);
      for(let target of nearby){
        if(target!==p&&(target.state==='settled'||target.state==='held')){
          const dx=target.x-p.x,dy=target.y-p.y;
          if(dx*dx+dy*dy<shaRadSq){
            const d=Math.hypot(dx,dy)||1;
            target.state='sha';target.life=60; 
            target.vx=(dx/d)*2.5*pScale;target.vy=(dy/d)*2.5*pScale;
            p.vx*=0.8;p.vy*=0.8; 
          }
        }
      }
    }
  }
  
  for(let i=0; i<ps.length; ){
      if(ps[i].markedForDeath){
          ps[i] = ps[ps.length-1];
          ps.pop();
      } else {
          i++;
      }
  }
  
  for(let p of ps){
    const speedSq=p.vx*p.vx+p.vy*p.vy;
    const isFast=speedSq>fastThresholdSq;
    const dx=p.x-hx,dy=p.y-hy;
    const inMingTang=dx*dx+dy*dy<centerRSq;
    
    if(inMingTang){
      mingTangCount++;
      avgKinetic+=speedSq;
    }
    
    if(p.state==='settled'){
      if(p.hasPassedMingTang&&p.hasTouchedWater){
        scoreGather+=15;
      }else{
        scoreGather+=10;
      }
    }else if(p.state==='held'){
      scoreGather+=8;
    }else if(p.state==='sha'){
      scoreScatter+=15;
      if(inMingTang) scoreGather-=5; 
    }else if(p.state==='moving'){
      if(inMingTang){
        if(isFast){
          scoreScatter+=5;
          scoreGather-=3; 
        }else{
          scoreGather+=5;
        }
      }
    }
    p.draw();
  }
  
  if(mingTangCount>0){
    avgKinetic/=mingTangCount;
    const kineticPenalty=Math.min(30,avgKinetic*.3);
    scoreGather-=kineticPenalty;
  }
  
  drawShockwaves(dt);
  ctx.restore(); // 解除 2.5D 全域壓縮，避免影響 UI (如雷達圖與浮動數值)
  
  const normalizedGather=Math.max(0,scoreGather/10);
  const effectiveGather=Math.min(normalizedGather,capacityLimit)*globalMultiplier;
  
  if(effectiveGather>gIdx)gIdx+=(effectiveGather-gIdx)*.02*dt;
  else gIdx+=(effectiveGather-gIdx)*.1*dt;
  gIdx=Math.max(0,Math.min(gIdx,100));
  
  shaAcc=shaAcc*Math.pow(.97,dt)+(scoreScatter/10)*.25*dt+events*1.2;
  const sIdx=Math.min(100,shaAcc);
  
  const roundG=Math.round(gIdx);const roundS=Math.round(sIdx);
  if(roundG!==lastG){document.getElementById('g-fill').style.width=gIdx+'%';document.getElementById('g-num').textContent=roundG;lastG=roundG}
  if(roundS!==lastS){document.getElementById('s-fill').style.width=sIdx+'%';document.getElementById('s-num').textContent=roundS;lastS=roundS}
  
  drawRadar(dt);requestAnimationFrame(frame);
}

rs();updateUI();requestAnimationFrame(frame);
</script>
