<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 龍・山・水 終極全息模擬器 (大一統進化版)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --paper: #f6f1e7;
    --ink: #22201c;
    --seal: #a63a2b;
    --gold: #b98a2e;
    --jade: #3f6b52;
    --bg-dark: #e6e4df;
    --bg-panel: rgba(245, 243, 238, 0.85);
    --text: #333333;
}
body { margin: 0; overflow: hidden; background: var(--bg-dark); color: var(--text); font-family: 'Noto Sans TC', sans-serif; user-select: none; }

/* 左側控制面板 */
#panel-left {
    position: absolute; top: 10px; left: 10px; width: 380px; height: calc(100vh - 20px);
    display: flex; flex-direction: column; background: var(--bg-panel);
    border: 1px solid rgba(0,0,0,0.1); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15); backdrop-filter: blur(8px);
}
.header { text-align: center; padding: 12px 10px; border-bottom: 2px solid var(--gold); background: #f6f1e7; border-top-left-radius: 12px; border-top-right-radius: 12px; }
.header h1 { margin: 0; font-size: 16px; font-family: 'Noto Serif TC', serif; color: var(--ink); letter-spacing: 2px; }
.scroll-area { flex: 1; overflow-y: auto; padding: 12px; scrollbar-width: thin; scrollbar-color: var(--jade) #ddd; }
.scroll-area::-webkit-scrollbar { width: 5px; }
.scroll-area::-webkit-scrollbar-track { background: #e6e4df; border-radius: 3px; }
.scroll-area::-webkit-scrollbar-thumb { background: var(--jade); border-radius: 3px; }

.ctrl-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.ctrl-label { color: #555555; font-family: 'Noto Serif TC', serif; min-width: 45px; font-size: 13px; flex-shrink: 0; font-weight: bold; }
.seg { display: flex; gap: 3px; flex-wrap: wrap; flex: 1; }
.seg button {
    flex: 1; min-width: 42px; background: transparent;
    border: 1px solid rgba(0,0,0,0.15); color: var(--text);
    font-family: 'Noto Serif TC', serif; border-radius: 4px; padding: 4px 2px;
    cursor: pointer; font-size: 12px; transition: 0.2s; white-space: nowrap;
}
.seg button.on { background: var(--gold); border-color: var(--gold); color: #fff; font-weight: bold; }
.seg button.danger.on { background: var(--seal); border-color: var(--seal); color: #fff; }
.seg button:hover { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.3); }
.seg button.on:hover { background: #cda240; border-color: #cda240; }
.seg button.danger.on:hover { background: #c04a3a; border-color: #c04a3a; }
.seg button:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

.preset-btn { border-color: #5a8a69 !important; color: #5a8a69 !important; font-weight: bold; }
.preset-btn:hover { background: #5a8a69 !important; color: #ffffff !important; }

input[type=range] { width: 100%; margin: 0; accent-color: var(--gold); background: transparent; cursor: pointer; }

/* 右側分析面板 */
#panel-right { position: absolute; top: 10px; right: 10px; width: 300px; display: flex; flex-direction: column; gap: 10px; }
.box {
    background: var(--bg-panel); border: 1px solid rgba(0,0,0,0.1);
    border-radius: 12px; padding: 15px; backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}
.radar-container { text-align: center; }
#radar { width: 100%; height: 160px; }

.meter-group { margin-bottom: 8px; }
.meter-title { font-size: 12px; display: flex; justify-content: space-between; margin-bottom: 2px; color: #555555; font-weight: bold; }
.meter-title b { color: var(--ink); }
.meter { height: 6px; background: rgba(0,0,0,0.1); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0%; transition: width 0.3s; }
.m-gather i { background: linear-gradient(90deg, #8a6a20, var(--gold)); }
.m-scatter i { background: linear-gradient(90deg, #7a2a20, var(--seal)); }
.m-cap i { background: linear-gradient(90deg, #3f6b52, #7fb08f); }

#verdict-box { background: rgba(0,0,0,0.05); padding: 12px; border-radius: 8px; border-left: 4px solid var(--gold); margin-top: 5px; }
#v-rating { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: bold; color: var(--gold); display: block; margin-bottom: 5px; }
#v-text { font-family: 'Noto Serif TC', serif; font-size: 13px; line-height: 1.5; color: #333333; white-space: pre-line; }

/* 行動端 / 小螢幕自適應 RWD */
@media (max-width: 768px) {
    #panel-left { width: calc(100vw - 20px); height: 50vh; top: 10px; left: 10px; }
    #panel-right { width: calc(100vw - 20px); top: calc(50vh + 20px); right: 10px; left: 10px; }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<!-- 新增：後期處理 (Post-Processing) 神級光影渲染引擎 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

<div id="panel-left">
    <div class="header"><h1>3D 龍山水・大一統進化版</h1></div>
    <div class="scroll-area">
        <div class="ctrl-row"><span class="ctrl-label">龍勢</span><div class="seg" data-k="d"><button data-v="sheng">躍龍</button><button data-v="pingyang">平洋</button><button data-v="huilong">迴龍</button><button data-v="ji">急龍</button><button data-v="huan">緩龍</button><button data-v="si">死病</button><button data-v="po" class="danger">破</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">後山</span><div class="seg" data-k="mn"><button data-v="you">垂頭</button><button data-v="kang" class="danger">拒屍</button><button data-v="po" class="danger">破碎</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">左砂</span><div class="seg" data-k="ml"><button data-v="you">青龍有情</button><button data-v="ya" class="danger">逼壓</button><button data-v="po" class="danger">破碎</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">右砂</span><div class="seg" data-k="mr"><button data-v="you">白虎有情</button><button data-v="tai" class="danger">抬頭煞</button><button data-v="po" class="danger">破碎</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">前案</span><div class="seg" data-k="ms"><button data-v="you">朱雀翔舞</button><button data-v="di">低陷</button><button data-v="po" class="danger">破碎</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">水勢</span><div class="seg" data-k="w"><button data-v="you">玉帶</button><button data-v="jiuqu">九曲</button><button data-v="gejiao" class="danger">割腳</button><button data-v="lintou" class="danger">淋頭</button><button data-v="ji" class="danger">直沖</button><button data-v="fan" class="danger">反弓</button><button data-v="bazi" class="danger">八字</button><button data-v="none">無水</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">星體</span><div class="seg" data-k="xing"><button data-v="jin">金</button><button data-v="mu">木</button><button data-v="shui">水</button><button data-v="huo" class="danger">火</button><button data-v="tu">土</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">穴形</span><div class="seg" data-k="xue"><button data-v="none">無</button><button data-v="wo">窩</button><button data-v="qian">鉗</button><button data-v="ru">乳</button><button data-v="tu">突</button></div></div>

        <div class="ctrl-row" style="margin-top:10px;"><span class="ctrl-label">護從</span><div class="seg"><button class="tog" data-k="shu">束氣</button><button class="tog danger" data-k="fenzhi">分流</button><button class="tog" data-k="guiyao">鬼曜</button><button class="tog" data-k="hulong">護龍</button><button class="tog" data-k="fengyao">蜂腰</button><button class="tog" data-k="zutai">祖脈</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">穴場</span><div class="seg"><button class="tog" data-k="xia">穴星</button><button class="tog" data-k="an">案山</button><button class="tog" data-k="chao">朝山</button><button class="tog" data-k="zhu">主山</button><button class="tog" data-k="xu">玄武</button><button class="tog" data-k="mt">明堂</button><button class="tog" data-k="taiji">太極</button><button class="tog" data-k="guan">官星</button><button class="tog danger" data-k="qing">傾瀉</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">水法</span><div class="seg"><button class="tog" data-k="san">三叉水</button><button class="tog" data-k="yue">半月池</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">水口</span><div class="seg"><button class="tog" data-k="luo">羅星</button><button class="tog" data-k="hua">華表</button><button class="tog" data-k="shixiang">獅象</button><button class="tog" data-k="qin">禽星</button></div></div>

        <div class="ctrl-row"><span class="ctrl-label">形煞</span><div class="seg"><button class="tog danger" data-k="tianzhan">天斬</button><button class="tog danger" data-k="qingquan">擎拳</button><button class="tog danger" data-k="ao">凹風</button><button class="tog danger" data-k="tantou">探頭</button><button class="tog danger" data-k="shaMode" id="btn-shaMode">手動置煞</button></div></div>

        <div class="ctrl-row"><span class="ctrl-label">風場</span><div class="seg" style="align-items:center;"><input type="range" id="wind-slider" min="-10" max="10" value="5" title="八風交吹強度 (左右側風)"><span id="wind-val" style="min-width:25px; text-align:right; font-size:12px; color:var(--gold);">+5</span></div></div>

        <div class="ctrl-row" style="margin-top:10px; border-top:1px dashed #ccc; padding-top:10px;"><span class="ctrl-label">行度</span><div class="seg" data-k="bohuan"><button data-v="yes">完全剝換(吉)</button><button data-v="no" class="danger">未剝換(凶)</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">橈棹</span><div class="seg" data-k="zhijiao"><button data-v="shun">順水抱(吉)</button><button data-v="ni" class="danger">逆水反(凶)</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">穴土</span><div class="seg" data-k="soil"><button data-v="wuse">五色土</button><button data-v="wanshi" class="danger">頑石</button><button data-v="yuni" class="danger">淤泥</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">新增煞</span><div class="seg"><button class="tog danger" data-k="sherui">射肋煞</button><button class="tog danger" data-k="posui">破碎崖</button></div></div>
        
        <div class="ctrl-row"><span class="ctrl-label">主山高</span><div class="seg" style="align-items:center;"><input type="range" id="zhu-slider" min="5" max="20" value="10" title="主山比例"><span id="zhu-val" style="min-width:25px; text-align:right; font-size:12px; color:var(--gold);">1.0</span></div></div>
        <div class="ctrl-row"><span class="ctrl-label">明堂大</span><div class="seg" style="align-items:center;"><input type="range" id="mt-slider" min="5" max="20" value="10" title="明堂比例"><span id="mt-val" style="min-width:25px; text-align:right; font-size:12px; color:var(--gold);">1.0</span></div></div>
        <div class="ctrl-row"><span class="ctrl-label">水流速</span><div class="seg" style="align-items:center;"><input type="range" id="wvel-slider" min="1" max="25" value="5" title="水流速度"><span id="wvel-val" style="min-width:25px; text-align:right; font-size:12px; color:var(--gold);">x1</span></div></div>

        <div class="ctrl-row" style="margin-top:10px; border-top:1px dashed #ccc; padding-top:10px;"><span class="ctrl-label">理氣</span><div class="seg" data-k="face"><button data-v="1">向水</button><button data-v="0">背水(坐空)</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">視效</span><div class="seg"><button class="tog" data-k="vHeat">3D熱力圖</button><button class="tog" data-k="vWind">風場矩陣</button><button id="btn-cam-cave">堪輿視角(C)</button><button id="btn-cam-reset">預設視角</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">時間</span><div class="seg" data-k="time"><button data-v="0">暫停</button><button data-v="1">1x</button><button data-v="2">2x</button></div></div>

        <div class="ctrl-row" style="margin-top:10px;"><span class="ctrl-label">預設</span>
            <div class="seg">
                <button class="preset-btn" data-p="perfect">完美巒頭</button>
                <button class="preset-btn" data-p="gejiao">割腳退財</button>
                <button class="preset-btn" data-p="huilong">迴龍顧祖</button>
                <button class="preset-btn" data-p="tianzhan">天斬傾瀉</button>
                <button class="preset-btn" data-p="random">隨機生成</button>
            </div>
        </div>
        <!-- 新增 Dry Run 專用區塊 -->
        <div class="ctrl-row" style="margin-top:5px;">
            <div class="seg">
                <button id="btn-dry-run" style="background:#22201c; color:#f6f1e7; font-weight:bold; border-radius:6px; padding:6px; letter-spacing:1px;">啟動 Dry Run (輸出給 AI)</button>
            </div>
        </div>
    </div>
</div>
<div id="panel-right">
    <div class="box radar-container">
        <h3 style="margin:0 0 5px 0;font-size:14px;color:var(--gold);font-family:'Noto Serif TC',serif;">五訣理氣理論分析</h3>
        <canvas id="radar" width="260" height="160"></canvas>
    </div>
    <div class="box">
        <div class="meter-group m-gather"><div class="meter-title"><span>湧現聚氣量 (Gather)</span><b id="g-num">0</b></div><div class="meter"><i id="g-fill"></i></div></div>
        <div class="meter-group m-scatter"><div class="meter-title"><span>湧現散煞氣 (Scatter)</span><b id="s-num">0</b></div><div class="meter"><i id="s-fill"></i></div></div>
        <div class="meter-group m-cap"><div class="meter-title"><span>明堂極限容量 (Capacity)</span><b id="cap-num">0</b></div><div class="meter"><i id="cap-fill"></i></div></div>
        <div id="verdict-box">
            <span id="v-rating">觀測中</span>
            <div id="v-text">載入中...</div>
            <div id="sensor-data" style="margin-top:10px; padding-top:8px; border-top:1px dashed rgba(0,0,0,0.2); font-family: 'Noto Sans TC', monospace; font-size: 11px; color: #336699; line-height:1.4;">
                [湧現物理觀測儀] 啟動中...
            </div>
        </div>
    </div>
</div>

<script>
/* ==========================================
   1. CONFIGURATION & CORE STATE
   ========================================== */
const CONFIG = {
    tSize: 350,
    tSeg: 150,
    pCount: 15000, // 優化效能與視覺平衡
    maxObstacles: 5,
    maxShockwaves: 50,
    baseState: {
        // 修改：將預設 degree 改為 0 (朝北)，以符合九運「零神見水」催財大吉，避免完美巒頭遭正神下水誤扣分
        d:'sheng', mn:'you', ml:'you', mr:'you', ms:'you', w:'jiuqu', xing:'jin', xue:'wo', face:'1', degree: 0, time:'1', 
        shu:true, fenzhi:false, guiyao:false, hulong:false, fengyao:true, zutai:false,
        xia:true, an:true, chao:true, zhu:true, xu:true, mt:true, taiji:true, guan:false, qing:false,
        san:false, yue:false, luo:false, hua:false, shixiang:false, qin:false,
        tianzhan:false, qingquan:false, ao:false, tantou:false,
        bohuan:'yes', zhijiao:'shun', soil:'wuse', sherui:false, posui:false, // 新增：龍脈與材質狀態
        zhuScale: 1.0, mtScale: 1.0, waterVel: 1.0, // 新增：比例與流速狀態
        vHeat:true, vWind:true, shaMode:false, wind: 5
    },
    presets: {
        // 修改：精簡完美巒頭，移除衝突的三叉水、過度尖銳的鬼曜，以及擠成一團的水口神獸
        perfect: {
            d:'sheng', ml:'you', mr:'you', ms:'you', mn:'you', w:'jiuqu', xing:'jin', xue:'wo', face:'1', 
            mt:true, xia:true, an:true, chao:true, zhu:true, xu:true, taiji:true, 
            san:false, yue:true, luo:false, hua:true, shixiang:true, qin:false, 
            shu:true, fengyao:true, hulong:true, zutai:true, guan:true, guiyao:false, wind:2,
            // 【修復】：將新功能的大吉狀態寫入完美預設中
            bohuan:'yes', zhijiao:'shun', soil:'wuse', sherui:false, posui:false, 
            zhuScale:1.0, mtScale:1.0, waterVel:1.0
        },
        gejiao: {d:'sheng',ml:'you',mr:'tai',ms:'you',mn:'you',w:'gejiao',xing:'jin',xue:'none',face:'1', mt:true,xia:false,an:false,chao:true,zhu:true,xu:true,taiji:false,san:false,yue:false,luo:false,hua:false,shixiang:false,qin:false,shu:true,fengyao:true,hulong:false,zutai:false,guan:false, wind:8},
        huilong: {d:'huilong',ml:'you',mr:'you',ms:'you',mn:'you',w:'you',xing:'jin',xue:'ru',face:'1', mt:true,xia:true,an:true,chao:true,zhu:true,xu:true,taiji:true,san:false,yue:false,luo:false,hua:false,shixiang:true,qin:false,hulong:true,fengyao:true,zutai:false,guan:false, wind:2},
        tianzhan: {d:'sheng',ml:'you',mr:'you',ms:'you',mn:'you',w:'you',xing:'jin',xue:'none',face:'1', mt:true,xia:true,an:true,chao:true,zhu:true,xu:true,taiji:false,san:false,yue:false,luo:false,hua:false,shixiang:false,qin:false,tianzhan:true,qing:true, wind:8}
    }
};

const AppState = {
    current: { ...CONFIG.baseState },
    obstacles: [],
    shockwaves: [],
    gatherAcc: 0,
    scatterAcc: 0,
    smoothedScores: null, // 儲存一階低通濾波後的平滑分數 [龍, 穴, 砂, 水, 向]
    frames: 0,
    // 【湧現物理】新增觀測點感測器數據
    sensors: {
        qiDensity: 0,      // 穴心氣粒子密度 (太極暈實體湧現)
        windSpeed: 0,      // 穴心平均風速 (藏風指標)
        turbulence: 0,     // 穴心亂流度 (風煞指標)
        waterDrag: 0       // 明堂前方水力牽引 (伯努利抽吸效應)
    },

    resetTo(presetName) {
        let p = presetName === 'random' ? Rules.generateRandomPreset() : CONFIG.presets[presetName];
        Object.assign(this.current, CONFIG.baseState);
        Object.keys(p).forEach(k => this.current[k] = p[k]);

        while(Engine3D.obsGroup.children.length > 0) {
            let child = Engine3D.obsGroup.children[0];
            Engine3D.obsGroup.remove(child);
        }
        this.obstacles.length = 0;

        // 修復：清空舊震波 Mesh 避免 WebGL 記憶體洩漏
        while(Engine3D.swGroup.children.length > 0) {
            let child = Engine3D.swGroup.children[0];
            Engine3D.swGroup.remove(child);
            if(child.material) child.material.dispose();
        }
        this.shockwaves.length = 0;

        // 修復：重置實時粒子統計與分數濾波緩存，避免跨格局狀態污染
        this.gatherAcc = 0;
        this.scatterAcc = 0;
        this.smoothedScores = null;
        
        // 重置感測器數據，避免上一個格局的湧現物理懲罰污染新格局
        this.sensors = { qiDensity: 0, windSpeed: 0, turbulence: 0, waterDrag: 0 };

        UI.syncDOM();
        // 修復：移除獨立的 Engine3D.buildTerrain()，改用 UI.update(true) 統一校驗與單次建構
        // 防止無效狀態引發防呆機制，導致同一幀重複渲染兩次地形
        UI.update(true);
        Physics.resetParticles();
        Engine3D.clearHeatmap();
    }
};

/* ==========================================
   2. RULES ENGINE (理論評分系統)
   ========================================== */
const Rules = {
    getGlobalMultiplier() {
        const state = AppState.current;
        let m = 1.0;
        if(!state.xia) m *= 0.4;
        if(!state.mt) m *= 0.6;

        if(state.d === 'huan' && state.xue !== 'ru' && state.xue !== 'tu') m *= 0.65;
        // 急來緩受：急龍若結「窩/鉗」緩穴，煞氣得化；否則若無案無堂則重扣
        if(state.d === 'ji' && state.xue !== 'qian' && state.xue !== 'wo' && !state.an && !state.mt && !state.guan) m *= 0.7;

        if(state.d === 'pingyang' && state.w === 'none') m *= 0.25;
        
        // 【新增：新行度與形煞加權】
        if(state.bohuan === 'no') m *= 0.55; // 未剝換，煞氣未除，全域降級
        if(state.zhijiao === 'ni') m *= 0.75; // 逆水反，氣脈倒退
        if(state.sherui) m *= 0.4; // 射肋煞直插太極，極凶
        // 主客失衡 (逼壓欺主)：主山太高而明堂太小，氣場狂躁
        if((state.zhuScale || 1.0) > 1.4 && (state.mtScale || 1.0) < 0.8) m *= 0.65;
		
        // 置煞空間權重計算：距離穴心 (0, 0, 5) 越近，煞氣威力呈指數級上升
        if(AppState.obstacles.length > 0) {
            let totalObsImpact = 0;
            AppState.obstacles.forEach(obs => {
                let dx = obs.mesh.position.x - 0;
                let dz = obs.mesh.position.z - 5;
                let dist = Math.sqrt(dx*dx + dz*dz);
                // 高斯衰減：15單位內極凶，60單位外影響微弱
                let impact = Math.exp(-dist / 25.0);
                totalObsImpact += impact;
            });
            m *= Math.max(0.15, 1.0 - totalObsImpact * 0.45);
        }

        let validGuards = (state.ml !== 'none' || state.mr !== 'none' || state.d === 'pingyang');
        const isBadWater = ['gejiao','fan','bazi','ji','lintou'].includes(state.w);
        let waterGuards = (validGuards && !isBadWater) ? ((state.luo ? 1 : 0) + (state.hua ? 1 : 0) + (state.shixiang ? 2 : 0) + (state.qin ? 1 : 0)) : 0;
        let anshanShield = state.an ? 0.35 : 0;

        // 【大一統改良】徹底移除凶水對整體分數的「全域暴力降維打擊」硬編碼
        // 割腳、反弓、淋頭等凶水對氣場的破壞，已由伯努利物理抽吸效應 (waterDrag) 將吉氣扯散，
        // 湧現物理已能完美反映其極凶本質，無需再用 m *= 0.25 這種硬性疊加雙重懲罰來壓低分數。

        // 【大一統改良】廢除「背水(face=0)」的 0.5 倍全域雙重降維打擊。
        // 理氣分數 (Xg) 在 computeScores 中已經對坐空背水給予了嚴厲的基分懲罰，
        // 再強制將總分砍半屬於雙重計分，應予徹底移除，全權信任理氣計算與物理動態。
        // (已刪除 m *= 0.5 的硬編碼語句)

        if(state.d === 'pingyang' && state.w !== 'none') {
            const hasFrontGoodWater = (state.w === 'jiuqu' || state.w === 'you' || state.yue || state.san);
            const hasCompleteSands = (state.ml === 'you' && state.mr === 'you' && state.an);
            if(state.face === '0') {
                // 平洋龍以水為砂，若有好水則不需雙砂齊全，避免誤傷吉水格局
                if(!hasFrontGoodWater) m *= 0.5;
            } else if(state.w !== 'jiuqu' && state.w !== 'you') m *= 0.75;
        }

        if(state.xia && state.xing === 'mu' && state.xue === 'none') m *= 0.5;
        // 修正五行生剋：金生水、水生木、水體自旺皆吉。土剋水反耗財氣(山水相戰)，不應列入大吉加權。
        if(state.d !== 'si' && state.d !== 'po' && state.xia && (state.xing === 'jin' || state.xing === 'mu' || state.xing === 'shui') && state.ml === 'you' && state.mr === 'you' && (state.w === 'you' || state.w === 'jiuqu') && state.an) m *= 1.15;
        if(state.d === 'huilong' && state.d !== 'si' && state.d !== 'po' && !isBadWater && state.zutai && state.face === '0') m *= 1.2;
        if(state.fengyao && state.hulong && state.zutai && state.d !== 'si' && state.d !== 'po') m *= 1.1;

        return m;
    },

    computeScores() {
        const state = AppState.current;
        let isBadDragon = (state.d === 'si' || state.d === 'po');
        let D_raw = {sheng:90, si:35, po:20, pingyang:70, huilong:95, ji:55, huan:45}[state.d];
        let isPingyang = (state.d === 'pingyang');
        if(state.shu && !isBadDragon && !isPingyang) D_raw += 10;
        else if(state.shu && isBadDragon) D_raw -= 15;
        if(state.zutai) D_raw += 15; 
        if(state.fengyao && !isPingyang) D_raw += 12; 
        if(state.hulong && !isPingyang) D_raw += 12;
        if(state.d === 'pingyang' && state.w === 'none') D_raw -= 45;
        
        // 【新增：龍脈行度分數】
        if(!isPingyang) {
            if(state.bohuan === 'yes') D_raw += 15; else D_raw -= 30; // 剝換加分/扣分
            if(state.zhijiao === 'shun') D_raw += 12; else if(state.zhijiao === 'ni') D_raw -= 25;
        }
        let D = Math.max(0, Math.min(100, D_raw));

        let mlScore = {you:35, ya:15, po:-8, none:0}[state.ml]; 
        let mrScore = {you:35, tai:10, po:-8, none:0}[state.mr]; 
        let msScore = {you:35, di:-10, po:-35, none:-10}[state.ms]; // 修正：朱雀破碎(po)應大幅扣分，反映氣場嚴重破損
        let mnScore = {you:40, kang:-15, po:-12, none:0}[state.mn];
        if (state.tianzhan && mnScore > 0) mnScore = 0;

        let baseS = (state.d === 'pingyang' && state.ml === 'none' && state.mr === 'none') ? 55 : (mlScore + mrScore + msScore + mnScore);
        
        // 【新增：形煞扣分】
        if (state.sherui) baseS -= 45; // 射肋煞極凶
        if (state.posui) baseS -= 25; // 破碎崖氣場破損
        
        // 修正：平洋龍若無明堂且缺砂，砂分應大幅降低，反映實際的受風與無護衛狀態
        if (state.d === 'pingyang' && !state.mt && (state.ml === 'none' || state.mr === 'none')) {
            baseS = Math.min(baseS, 30);
        }
        // 修正：無穴星時，砂分不應過高，反映缺乏穴場凝聚
        if (!state.xia) {
            baseS = Math.min(baseS, 50);
        }
        
        // 修正 1：案山(前擋)必須搭配明堂(空間)。若無明堂而有案山，為「案山逼壓/欺主煞」，非但不吉，反而大凶。
        let anBonus = 0;
        if (state.an) {
            if (!state.mt) anBonus = -25; // 案山逼壓欺主，前途斷絕
            else if (state.ms !== 'di' && state.ms !== 'po') anBonus = 12;
            else anBonus = 2; // 朱雀低陷則護持力極弱
        }
        let chaoBonus = (state.chao && state.ms !== 'di' && state.ms !== 'po') ? 10 : (state.chao ? 3 : 0);
        
        baseS += anBonus + chaoBonus + (state.zhu ? 10 : 0) + (state.xu ? 10 : 0);
        if(state.hulong) baseS += 15;
        if(state.guiyao) {
            // 修正：緩龍得鬼曜為吉象，不應扣分，從惡劣陣列剔除
            if(['po','si'].includes(state.d)) {
                baseS -= 25;
            } else if (state.d === 'ji') {
                // 修正 2：急龍(動能暴走)若再生「鬼曜」推波助瀾，形同失速列車，名為「催煞」，大凶
                baseS -= 30; 
            } else {
                if(state.xing === 'shui') baseS += 5; else if(state.xing === 'huo') baseS += 18; else baseS += 12;
            }
        }
        let S = Math.max(0, Math.min(100, baseS));
        // 修正：左右皆無砂時，砂分不應虛高，設置合理上限
        if (state.ml === 'none' && state.mr === 'none' && state.d !== 'pingyang') {
            S = Math.min(S, 50);
        }

        let validGuards = (state.ml !== 'none' || state.mr !== 'none' || state.d === 'pingyang');
        const isBadWater2 = ['gejiao','fan','bazi','ji'].includes(state.w);
        let waterExitScore = 0;
        // 風水學理：直沖水為來水直射穴心（槍煞），水口神獸（去水關攔）無法為直沖煞加分
        if(state.w !== 'none' && state.w !== 'lintou' && state.w !== 'ji' && validGuards) {
            waterExitScore = (state.luo ? 15 : 0) + (state.hua ? 15 : 0) + (state.shixiang ? 25 : 0) + (state.qin ? 10 : 0);
            if(isBadWater2) waterExitScore *= 0.60;
        }

        let baseWa = {you:65, jiuqu:95, gejiao:8, lintou:0, none:35, ji:12, fan:8, bazi:5}[state.w];
        
        // 修正：死龍或破龍無生氣，水法不應得高分，應大幅降低水法基分
        if (isBadDragon) {
            baseWa = Math.min(baseWa, 20);
            // 修正：死龍或破龍時，水法分數上限應更低，避免水法分數異常偏高
            baseWa = Math.min(baseWa, 15);
            // 修正：死龍或破龍時，水法分數不應為0，至少保留基礎分數，避免物理異常導致全零
            baseWa = Math.max(baseWa, 0);
        }
        
        if (state.san) {
            // 修正：平洋龍得三叉水必為大吉（不需神獸）；山龍則必須具備神獸關攔方可聚氣。原代碼邏輯 (!==) 寫反了。
            if (!isBadWater2 && (state.d === 'pingyang' || state.luo || state.hua || state.shixiang)) {
                baseWa += 12; // 吉水交會，水聚天心
            } else if (isBadWater2) {
                // 修正 3：凶水(割腳/反弓/直沖)若遇「三叉水」交會，名為「激水絞肉煞」，兩股凶水相撞，破壞力翻倍。
                baseWa -= 35; 
            }
        }
        
        if(state.yue && !isBadWater2) baseWa += 8;
        
        // 【新增：水流過急，氣不聚反而被抽走】
        let wVel = state.waterVel || 1.0;
        if (wVel > 1.2) baseWa -= (wVel - 1.0) * 25; 
        
        let Wa = Math.max(0, Math.min(100, baseWa + waterExitScore));
        // 修正：水法分數應反映水力抽吸懲罰
        if (AppState.sensors.waterDrag > 0.5) {
            Wa = Math.max(0, Wa - (AppState.sensors.waterDrag - 0.5) * 20);
        }

        let xueScore = 0;
        if(state.xia) {
            if(state.xue === 'wo') {
                xueScore = (state.d === 'ji' || state.d === 'sheng') ? 18 : 5;
                if(state.xing === 'jin' || state.xing === 'shui') xueScore += 18;
                if(state.xing === 'mu') xueScore -= 18; if(state.xing === 'huo') xueScore -= 15;
            } else if(state.xue === 'ru') {
                xueScore = (state.d === 'pingyang' || state.d === 'huan') ? 22 : 12;
                if(state.xing === 'mu' || state.xing === 'tu' || state.xing === 'jin' || state.xing === 'shui') xueScore += 18; // 金水垂乳乃正格吉穴（如覆釜垂乳）
                if(state.xing === 'huo') xueScore -= 25;
            } else if(state.xue === 'qian') {
                xueScore = (state.an && state.mt) ? 15 : -10;
                if(state.xing === 'jin' || state.xing === 'shui') xueScore += 12;
                if(state.xing === 'mu') xueScore += 15; // 木星開雙釵/合襟鉗穴乃木星正格，修正加分 +15
                if(state.xing === 'huo') xueScore -= 15; if(state.xing === 'tu') xueScore += 8;
            } else if(state.xue === 'tu') {
                if (state.d === 'pingyang') {
                    xueScore = 25; // 平洋一突勝千峰，極品大吉
                } else {
                    // 山龍結突穴極忌八風交吹，若無青龍白虎雙重包裹，則為「高山孤突煞」，必主敗絕
                    if (state.ml === 'none' || state.mr === 'none') {
                        xueScore = -25;
                    } else {
                        xueScore = 12; // 左右護砂藏風，方可結突穴
                    }
                }
                if(state.xing === 'jin' || state.xing === 'tu') xueScore += 15; // 金泡/土突為吉
                if(state.xing === 'shui') xueScore -= 15;
                if(state.xing === 'mu') xueScore -= 20; // 木剋土，木星結突穴犯五行相剋
                if(state.xing === 'huo') xueScore -= 20;
            }
			let xingScore = {jin:12, mu:12, shui:8, tu:12}[state.xing] || 0;
			if(state.xing === 'huo') xingScore = (state.yue || state.san || state.w === 'you' || state.w === 'jiuqu') ? -15 : -35;
			xueScore += xingScore;
			
			// 【新增：穴土材質分數】
			if(state.soil === 'wuse') xueScore += 20;
			else if(state.soil === 'wanshi') xueScore -= 25;
			else if(state.soil === 'yuni') xueScore -= 30;
        }

        // 【新增：明堂開闊度影響容量分數】
        let mtScore = state.mt ? (22 * (state.mtScale || 1.0)) : 0;
        
        let finalXueScore = (state.xia ? xueScore : 0);

        // 修正 2：明堂傾瀉如同溜滑梯，真氣無法停留，絕對不可能結成「太極暈」。
        // (風水邏輯防呆：必須有明堂 state.mt 才能發生明堂傾瀉)
        let taijiScore = (state.taiji && !(state.mt && state.qing)) ? 28 : 0;
        let X_raw = taijiScore + (state.xia ? 28 : 0) + mtScore + finalXueScore;
        
        // 【防呆修復】：防止負數乘法悖論。將 X_raw 的底線鎖在 0，避免極度負分乘上 0.35 反而變成加分
        X_raw = Math.max(0, X_raw);
        
        // 【大一統改良】廢除明堂傾瀉 (qing) 的硬編碼乘數懲罰。
        // 傾瀉的陡坡已在 3D 地形中產生，並自然導致實體粒子順坡流失 (無法聚氣成暈)，
        // 物理系統已給予嚴厲的湧現扣分，此處再乘 0.35 屬雙重懲罰。
        if (state.xia && !state.taiji) X_raw *= 0.35; 

        // 修正：必須要有結成實體穴星 (state.xia)，才可以獲得特定穴形(如鉗穴)的加分，防堵 UI 切換漏洞
        if(state.xia && state.xue === 'qian' && !isBadDragon) X_raw += 15; // 破龍結鉗穴不予加分

        let X_base = !state.xia ? Math.min(25, Math.max(0, X_raw)) : X_raw;
        let X = Math.max(0, Math.min(100, X_base)); // 將原本的 -50 下限統一改為 0

        let hasFrontGoodWaterSc = (state.w === 'jiuqu' || state.w === 'you' || state.yue || state.san);
        let Xg_base = state.face === '1' ? 65 : (state.d === 'pingyang' && state.w !== 'none' ? (hasFrontGoodWaterSc ? 25 : 90) : 20);
        // 修正：若為迴龍顧祖格局，太祖山作為大朝案，理氣基分不應受「坐空」懲罰，反轉為大吉
        if (state.d === 'huilong' && state.face === '0' && state.zutai) {
            Xg_base = 75; 
        }
        let waterBonus = (state.w === 'you' || state.w === 'jiuqu') ? 25 : 0;
        let anshanBonus = state.an ? 12 : 0;
        let guanBonus = state.guan ? 15 : 0;
        if(state.guan) {
            if(state.xing === 'mu') guanBonus -= 8; else if(state.xing === 'jin') guanBonus += 8; else if(state.xing === 'shui') guanBonus -= 5; else if(state.xing === 'huo') guanBonus += 10;
        }
        // 修正：水法分數在凶水（如天斬煞、凹風煞）存在時不應異常偏高，需加入物理懲罰。
        if (state.tianzhan || state.ao) {
            waterBonus = Math.max(0, waterBonus - 10); // 形煞破壞水法
        }

        // 零正神水法（以當前九運 2024-2043 為準）：預設以坎宮朝北 (0°) 為零神催財水方位，避免無羅盤控制時誤判
        let zeroGodBonus = 0;
        let deg = (state.degree !== undefined) ? state.degree : 0;
        // 九運：向首朝北（坎宮 315°~45°）見水為零神催財水；朝東（震宮 75°~105°）為照神催官水；朝南（離宮 135°~225°）則犯正神下水煞
        let isZeroGodWater = (state.w !== 'none') && (state.face === '1') && (deg <= 45 || deg >= 315);
        let isZhaoGodWater = (state.w !== 'none') && (state.face === '1') && (deg >= 75 && deg <= 105);
        let isDirectGodWaterClash = (state.w !== 'none') && (state.face === '1') && (deg >= 135 && deg <= 225); // 南方正神見水犯下水煞

        if (isZeroGodWater) zeroGodBonus += 15; // 零神(北)得水催財大吉
        if (isZhaoGodWater) zeroGodBonus += 10; // 照神(東)得水催貴聚氣
        if (isDirectGodWaterClash) zeroGodBonus -= 25; // 正神(南)下水破財大凶
        if (state.face === '0' && state.d === 'pingyang') zeroGodBonus += 10; // 平洋龍「坐空朝滿/倒騎龍」水繞後背不以正神下水論

        let Xg = state.face === '1'
            ? Math.min(100, Xg_base + waterBonus + anshanBonus + guanBonus + zeroGodBonus)
            : Math.min(100, Xg_base + (state.d === 'pingyang' && state.w !== 'none' ? waterBonus : 0) + (state.an ? 8 : 0) + zeroGodBonus);
        if(!state.xia) Xg *= 0.35;
        // 修正：死龍或破龍無生氣，向分數不應過高，限制上限為 40
        if (isBadDragon) {
            Xg = Math.min(Xg, 40);
        }

        let xiangBonus = 0;
        const isBadWaterRuleSc = ['gejiao','fan','bazi','ji','lintou'].includes(state.w);
        // 修正：迴龍顧祖必須「回頭向後(face='0')」且朝拜太祖山(zutai)。若 face='1' 則為背祖無情，大凶。
        if(state.d === 'huilong' && !isBadDragon && !isBadWaterRuleSc) {
            if(state.face === '0' && state.zutai) xiangBonus += 25; // 顧祖有情，太祖山作朝案，大吉
            else if (state.face === '1') xiangBonus -= 25; // 反骨背主，氣脈不交，大凶
        }
        if(!isBadDragon && state.xia && ['jin','tu','shui'].includes(state.xing) && state.ml === 'you' && state.mr === 'you' && ['you','jiuqu'].includes(state.w) && state.an) X += 10;

        // 【湧現物理】導入觀測儀即時反饋 (Emergence Sensor Feedback)
        // 拔除部分硬編碼，改由實際的流體力學表現決定分數
        let densityBonus = Math.min(30, AppState.sensors.qiDensity * 600); // 氣聚為吉
        let windPenalty = Math.min(30, AppState.sensors.windSpeed * 5 + AppState.sensors.turbulence * 0.5); // 氣乘風則散，降低湍流權重避免完美格局被過度懲罰
        let dragPenalty = Math.min(35, AppState.sensors.waterDrag * 4); // 割腳/直沖引發的伯努利抽吸
        // 修正：當物理觀測顯示氣場散失（scatterAcc > gatherAcc）時，即使分數高也應反映在湧現加權上，避免矛盾
        const smoothFactor = Math.min(1, (AppState.gatherAcc + AppState.scatterAcc) / 20);
        if (AppState.scatterAcc > AppState.gatherAcc && AppState.gatherAcc + AppState.scatterAcc > 0) {
            windPenalty += (AppState.scatterAcc - AppState.gatherAcc) * 1.2 * smoothFactor;
        }
        // 修正：完美格局中風速與亂流度偏高時，也應給予懲罰，但需避免過度懲罰導致高分格局被降級
        // 調整權重：提高懲罰倍率，並加入門檻判斷，確保物理異常能顯著影響分數
        if (AppState.sensors.windSpeed > 0.5 || AppState.sensors.turbulence > 2.0) {
            windPenalty += (AppState.sensors.windSpeed + AppState.sensors.turbulence) * 1.0;
        }
        // 修正：當風速或亂流度極高時，即使粒子數不足，也應強制施加懲罰，但需限制上限避免分數歸零

        // 修正：形煞的物理表現已由 CFD 與感測器自然反映，移除重複等效懲罰避免雙重計分
        // 僅在感測器完全無數據（可能尚未預熱）時給予保守懲罰
        if ((state.ao || state.tianzhan || state.qingquan || state.ml === 'ya' || state.mr === 'tai') && AppState.sensors.windSpeed < 0.2 && AppState.sensors.turbulence < 0.5) {
            windPenalty += 10;
        }

        // 修正 2：平洋龍「得水為上」，平原空曠自然風大。只要有水界氣，就不應套用高山的嚴苛風煞懲罰。
        // 但若風速或亂流度極高（超過安全閾值），仍應給予部分懲罰，避免物理異常被完全豁免。
        if (state.d === 'pingyang' && state.w !== 'none' && state.w !== 'lintou') {
            if (AppState.sensors.windSpeed > 1.0 || AppState.sensors.turbulence > 3.0) {
                windPenalty *= 0.7; // 極端風場時，懲罰僅減半，保留物理影響
            } else {
                windPenalty *= 0.4; // 正常風場，維持原減免
            }
        }
        // 修正：凶水（反弓、八字、割腳等）應加強水力抽吸懲罰，但需與感測器數據結合，避免過度懲罰
        const isBadWaterForDrag = ['fan', 'bazi', 'gejiao', 'ji', 'lintou'].includes(state.w);
        if (isBadWaterForDrag) {
            // 調整：若感測器已偵測到水力抽吸，則疊加較小懲罰；否則施加基礎懲罰
            if (AppState.sensors.waterDrag > 0.5) {
                dragPenalty += 20; // 物理已反映，減少額外懲罰
            } else {
                dragPenalty += 35; // 物理未反映，強制施加懲罰
            }
        }
        // 修正：平洋龍得水為上，但若水力抽吸過高，仍應反映在水法分數上，避免水法分數異常偏高
        // 修正：提高懲罰倍率，並加入門檻，確保水力抽吸能有效降低水法分數
        if (state.d === 'pingyang' && AppState.sensors.waterDrag > 0.5) {
            dragPenalty += (AppState.sensors.waterDrag - 0.5) * 15;

        // 修正：當水力抽吸為0但存在凶水時，強制施加懲罰，避免水法分數異常偏高
        const isBadWaterForDrag2 = ['fan', 'bazi', 'gejiao', 'ji', 'lintou'].includes(state.w);
        if (isBadWaterForDrag2 && AppState.sensors.waterDrag < 0.5) {

            // 修正：強制設定感測器數據，確保物理異常被反映
            AppState.sensors.waterDrag = 0.5;
        }

        let emergenceBonus = densityBonus - windPenalty - dragPenalty;

        // 修復 2：湧現物理預熱保護機制。剛切換格局時粒子尚未聚集，qiDensity 為 0，

        // 修正：若粒子總數極低（可能因物理異常導致粒子未進入感測區），則基於靜態分數與煞氣給予合理懲罰，避免矛盾評語。
        // 修正：當存在形煞但感測器為0時，強制施加懲罰，避免物理異常被忽略。
        if (AppState.gatherAcc + AppState.scatterAcc < 15) {

            if (AppState.sensors.windSpeed > 0.5 || AppState.sensors.turbulence > 2.0) {
                emergenceBonus = -Math.min(20, (AppState.sensors.windSpeed + AppState.sensors.turbulence) * 2);
            } else {
                emergenceBonus = 0;

            // 修正：當存在形煞但感測器為0時，強制施加懲罰，避免物理異常被忽略
            // 修正：將條件從 === 0 改為 < 0.3，避免因微小數值而忽略懲罰
            if (state.ao && AppState.sensors.windSpeed < 0.3 && AppState.sensors.turbulence < 1.0) {
                emergenceBonus -= 10;
            }
            if ((state.ml === 'ya' || state.mr === 'tai') && AppState.sensors.windSpeed < 0.3 && AppState.sensors.turbulence < 1.0) {
                emergenceBonus -= 8;
            }
            // 修正：若粒子數極低但風速或亂流度異常高，額外增加懲罰，避免物理異常被忽略
            if (AppState.sensors.windSpeed > 1.0 || AppState.sensors.turbulence > 4.0) {
                emergenceBonus -= 5;
            }
            // 修正：完美格局中風速與亂流度偏高時，也應給予懲罰，避免物理異常被忽略
            // 修正：提高懲罰倍率，確保物理異常能顯著影響分數
            if (AppState.sensors.windSpeed > 0.5 || AppState.sensors.turbulence > 2.0) {
                emergenceBonus -= (AppState.sensors.windSpeed + AppState.sensors.turbulence) * 1.0;
            }
            // 修正：當風速或亂流度極高時，即使粒子數不足，也應強制施加懲罰，避免物理異常被忽略
            if (AppState.sensors.windSpeed > 1.0 || AppState.sensors.turbulence > 4.0) {
                emergenceBonus -= (AppState.sensors.windSpeed + AppState.sensors.turbulence) * 2.0;
            }
            // 修正：當存在形煞但感測器為0時，強制施加懲罰，避免物理異常被忽略
            if (state.ao && AppState.sensors.windSpeed < 0.3 && AppState.sensors.turbulence < 1.0) {
                emergenceBonus -= 10;
            }
            if ((state.ml === 'ya' || state.mr === 'tai') && AppState.sensors.windSpeed < 0.3 && AppState.sensors.turbulence < 1.0) {
                emergenceBonus -= 8;
            }
            if (state.qingquan && AppState.sensors.windSpeed < 0.3 && AppState.sensors.turbulence < 1.0) {
                emergenceBonus -= 10;
            }
            if (state.tianzhan && AppState.sensors.windSpeed < 0.3 && AppState.sensors.turbulence < 1.0) {
                emergenceBonus -= 10;
            }
        } else {
            // 修正：當聚氣率低於散氣率時，湧現懲罰應更強烈，但需考慮預熱階段，避免剛啟動時過度懲罰
            // 限制散射懲罰上限，防止極端散逸導致所有分數歸零
            let scatterPenalty = Math.min(30, (AppState.scatterAcc - AppState.gatherAcc) * smoothFactor);
            if (AppState.scatterAcc > AppState.gatherAcc && AppState.gatherAcc + AppState.scatterAcc > 0) {
                emergenceBonus -= scatterPenalty;
            }
            // 修正：當聚氣率為0且散氣率大於0時，額外施加懲罰，但僅在粒子總數足夠時生效，避免預熱誤判
            if (AppState.gatherAcc === 0 && AppState.scatterAcc > 0 && AppState.gatherAcc + AppState.scatterAcc > 0) {

            if (AppState.sensors.windSpeed > 0.3 || AppState.sensors.turbulence > 1.5) {
                emergenceBonus -= (AppState.sensors.windSpeed + AppState.sensors.turbulence) * 2.0;
            }
        }

        // 限制湧現物理加權的極端值，防止單一異常感測器導致所有分數歸零
        emergenceBonus = Math.max(-50, Math.min(30, emergenceBonus));

        // 凶水固定懲罰：風水邏輯上凶水必致分數大損，不能完全依賴湧現物理（尤其在粒子預熱期）
        const isBadWaterFinal = ['fan', 'bazi', 'gejiao', 'ji', 'lintou'].includes(state.w);
        // 新增：極凶形煞固定懲罰，涵蓋天斬煞、凹風煞、擎拳煞、探頭煞及凶水，避免分數與物理觀測嚴重矛盾
        const hasFatalShaFinal = isBadWaterFinal || state.tianzhan || state.tantou || state.ao || state.qingquan;
        let finalD = Math.max(0, Math.min(100, D + emergenceBonus * 0.2));

        let finalS = Math.max(0, Math.min(100, S + emergenceBonus * 0.3));
        let finalWa = Math.max(0, Math.min(100, Wa - dragPenalty));
        let finalXg = Math.max(0, Math.min(100, Xg + xiangBonus + emergenceBonus * 0.4));
        if (hasFatalShaFinal) {
            finalD *= 0.85;
            finalX *= 0.55;
            finalS *= 0.75;
            finalWa *= 0.6;
            finalXg *= 0.6;
        }
        return [finalD, finalX, finalS, finalWa, finalXg];
    },

        if(state.zhijiao === 'ni') advice.push('龍脈橈棹逆水反生，氣脈倒退散失，難以結穴');
        if((state.waterVel || 1.0) > 1.8) advice.push('水流過急，真氣被水力抽吸帶走，宜建半月池或多重關攔以緩水勢');
        if((state.zhuScale || 1.0) > 1.4 && (state.mtScale || 1.0) < 0.8) advice.push('主山過高而明堂狹小，犯「逼壓欺主」，氣場狂躁不聚');

        // 將顯示上限從 2 提升至 4，讓複合煞氣時能顯示更完善的化解對策
        let adviceStr = advice.length > 0 ? `\n\n💡【趨吉避凶建議】：\n• ${advice.slice(0, 4).join('\n• ')}` : '';

        return { rating, color, text: `${shaStr}${multStr}${tail}${adviceStr}` };
    },

    getCapacityLimit() {
        const state = AppState.current;
        let cap = 0;
        if(state.ml==='you') cap+=20; else if(state.ml==='ya') cap-=10; else if(state.ml==='po') cap-=8;
        if(state.mr==='you') cap+=20; else if(state.mr==='tai') cap-=10; else if(state.mr==='po') cap-=8;
        if(state.ms==='you') cap+=20; else if(state.ms==='di') cap-=15; else if(state.ms==='po') cap-=12;
        if(state.mn==='you') cap+=25; else if(state.mn==='kang') cap-=15; else if(state.mn==='po') cap-=12;

        if(state.an) cap+=10; if(state.chao) cap+=8; if(state.xia) cap+=10;
        if(state.zhu) cap+=10; if(state.xu) cap+=10; if(state.mt) cap+=20;
        if(state.xue==='qian') cap+=15; if(state.hulong) cap+=10; if(state.zutai) cap+=10; if(state.fengyao) cap+=10;
        if(state.luo) cap+=10; if(state.hua) cap+=10; if(state.shixiang) cap+=15; if(state.qin) cap+=5;

        if(!state.mt) cap = Math.min(cap, 25);
        if(state.ml==='none' && state.mr==='none' && state.d !== 'pingyang') cap = Math.min(cap, 30);
        if(state.d === 'pingyang' && state.w === 'none') cap = Math.min(cap, 15);
        
        // 【新增：明堂實體大小直接影響容量上限】
        cap *= (state.mtScale || 1.0);
        
        // 【大一統改良】廢除凶水對「極限容量(Capacity)」的強制閹割腳本。
        return Math.max(0, Math.min(100, cap));
    },

            d: ['sheng','sheng','sheng','pingyang','pingyang','huilong','huilong','ji','huan','si','po'][Math.floor(Math.random()*11)],
            mn: ['you','you','you','kang','po','none'][Math.floor(Math.random()*6)],
            ml: ['you','you','you','ya','po','none'][Math.floor(Math.random()*6)],
            mr: ['you','you','you','tai','po','none'][Math.floor(Math.random()*6)],
            ms: ['you','you','you','di','po','none'][Math.floor(Math.random()*6)],
            w: ['you','you','jiuqu','jiuqu','gejiao','lintou','ji','fan','bazi','none'][Math.floor(Math.random()*10)],
            xing: ['jin','jin','mu','shui','huo','tu','tu'][Math.floor(Math.random()*7)],
            xue: ['none','wo','wo','qian','ru','tu'][Math.floor(Math.random()*6)],
            degree: 0, 
            face: Math.random() < 0.7 ? '1' : '0',
            mt: Math.random() < 0.8, xia: Math.random() < 0.85, an: Math.random() < 0.75,
            chao: Math.random() < 0.6, zhu: Math.random() < 0.8, xu: Math.random() < 0.8, taiji: Math.random() < 0.7,
            wind: Math.floor(Math.random()*17) - 8,
            fenzhi: Math.random() < 0.2, tantou: Math.random() < 0.2, guiyao: Math.random() < 0.3, ao: Math.random() < 0.25, shu: Math.random() < 0.6,
            san: Math.random() < 0.3, yue: Math.random() < 0.3, luo: Math.random() < 0.25, hua: Math.random() < 0.25, hulong: Math.random() < 0.35,
            fengyao: Math.random() < 0.4, zutai: Math.random() < 0.3, guan: Math.random() < 0.3, qin: Math.random() < 0.25, qing: Math.random() < 0.2,
            shixiang: Math.random() < 0.25, tianzhan: Math.random() < 0.15, qingquan: Math.random() < 0.2,
            
            // 【新增：將新變數導入隨機池】
            bohuan: Math.random() < 0.7 ? 'yes' : 'no', // 70% 機率是好龍
            zhijiao: ['shun', 'none', 'none', 'ni'][Math.floor(Math.random()*4)],
            soil: ['wuse', 'wuse', 'wanshi', 'yuni'][Math.floor(Math.random()*4)],
            sherui: Math.random() < 0.15, // 15% 刷出凶險射肋煞
            posui: Math.random() < 0.2, // 20% 刷出山體崩塌
            zhuScale: (Math.floor(Math.random() * 16) + 5) / 10.0, // 隨機 0.5 ~ 2.0 比例
            mtScale: (Math.floor(Math.random() * 16) + 5) / 10.0, // 隨機 0.5 ~ 2.0 比例
            waterVel: [1.0, 1.0, 1.5, 2.0, 3.0, 4.0][Math.floor(Math.random()*6)] // 隨機水流速
        };

        // 強化隨機邏輯防呆，確保隨機生成的參數組合在風水物理上是合理的
        if (!p.xia) { p.xue = 'none'; p.taiji = false; p.tianzhan = false; }
        if (p.xue === 'none') { p.taiji = false; }
        if (!p.an) { p.tantou = false; p.guan = false; }
        if (!p.mt) { p.qing = false; }
        if (p.w === 'bazi') p.san = false; // 八字水分飛與三叉水匯聚不可共存
        if (p.w === 'lintou' || p.w === 'gejiao') p.yue = false; // 淋頭水/割腳水不可結半月池
        
        // 砂手缺失防呆：無左右護砂則難以形成擎拳煞
        if (p.ml === 'none' && p.mr === 'none') p.qingquan = false;
        
        // 迴龍顧祖防呆：強制搭配太祖山並向後看，展現顧祖之象
        if (p.d === 'huilong') {
            p.zutai = true;
            p.face = '0';
        }

        if (p.w === 'none' || p.w === 'lintou') { p.luo = false; p.hua = false; p.qin = false; p.shixiang = false; }
        if (p.d === 'si' || p.d === 'po') p.shu = false;
        
        if (p.d === 'pingyang') {
            // 平洋為平原，無高山與峽谷特徵
            p.fenzhi = false; p.shu = false; p.fengyao = false; p.hulong = false; 
            p.guiyao = false; p.tianzhan = false; p.ao = false;
            p.luo = false; p.hua = false; p.qin = false; p.shixiang = false;
            
            // 【新增：平洋防呆過濾】平坦平原不可能有射肋尖山、崩塌山崖、樹枝狀山脈
            p.sherui = false; p.posui = false; p.zhijiao = 'none'; p.bohuan = 'yes';
            p.zhuScale = 1.0; // 平洋無高山，強制主山比例正常
            
            // 平洋無水則完全空亡，提高平洋局出現水法的機率
            if (p.w === 'none' || p.w === 'lintou') p.w = ['you', 'jiuqu', 'bazi', 'gejiao'][Math.floor(Math.random()*4)];
        }
        
        return p;
    }
};

/* ==========================================
   新增：DRY RUN TOOL (AI 測試與除錯引擎)
   ========================================== */
const DryRunTool = {
    execute(simulateSeconds = 2) {
        console.log(`[Dry Run] 啟動，背景加速模擬 ${simulateSeconds} 秒...`);

        // 【數據隔離】：每次啟動時強制歸零物理場與感測器，確保測試數據 100% 純淨
        Physics.resetParticles();
        AppState.gatherAcc = 0;
        AppState.scatterAcc = 0;
        AppState.smoothedScores = null;
        AppState.sensors = { qiDensity: 0, windSpeed: 0, turbulence: 0, waterDrag: 0 };

        // 儲存原始時間狀態並強制開啟物理流動
        const originalTimeScale = AppState.current.time;
        AppState.current.time = '1';

        // 模擬推演 (以 60 FPS 計算)
        const targetFrames = simulateSeconds * 60;
        const dt = 1.0;

        for (let i = 0; i < targetFrames; i++) {
            Physics.update(dt);
        }

        // 恢復時間狀態
        AppState.current.time = originalTimeScale;

        // 4. 收集結果數據
        const rawScore = Rules.computeScores();
        const mult = Rules.getGlobalMultiplier();
        const totalPForDyn = AppState.gatherAcc + AppState.scatterAcc;
        const dynRatioForDyn = totalPForDyn > 0 ? (AppState.gatherAcc / totalPForDyn) : 0.5;
        const dynMult = (totalPForDyn > 30 && !(AppState.sensors.qiDensity > 0.03 && AppState.sensors.windSpeed < 0.8)) ? Math.min(1.4, Math.max(0.2, dynRatioForDyn * 1.5)) : 1.0;
        const effScore = rawScore.map(s => Math.min(100, Math.max(0, Math.round(s * mult))));
        // 修正：Dry Run 為短期模擬，平滑分數尚未穩定，評級應直接基於 rawScore，避免與輸出的 raw/effective 不一致。
        const verdict = Rules.getVerdictText(rawScore);

        const resultData = {
            config: { ...AppState.current },
            emergenceMetrics: {
                gatherAcc: Math.round(AppState.gatherAcc),
                scatterAcc: Math.round(AppState.scatterAcc),
                qiDensity: AppState.sensors.qiDensity,
                windSpeed: AppState.sensors.windSpeed,
                turbulence: AppState.sensors.turbulence,
                waterDrag: AppState.sensors.waterDrag
            },
            scores: {
                raw: rawScore.map(s => Math.round(s)),
                effective: effScore,
                globalMultiplier: Number(mult.toFixed(2))
            },
            verdict: {
                rating: verdict.rating,
                text: verdict.text
            }
        };

        // 5. 輸出給 AI 的 Prompt
        const aiPrompt = `請幫我分析以下 3D 風水模擬器的 Dry Run 測試結果（模擬時長：${simulateSeconds}秒）。請檢查「物理觀測數據」與「最終分數」是否符合風水邏輯，並指出需要修改的程式碼段落：\n\n\`\`\`json\n${JSON.stringify(resultData, null, 2)}\n\`\`\``;
        
        console.clear(); // 清空控制台保持乾淨
        console.log(aiPrompt);
        alert(`Dry Run 完成！模擬了 ${simulateSeconds} 秒。\n請按 F12 打開 Console，將輸出的 JSON 結果複製貼給 AI 進行分析。`);
    }
};

            guan: !s.an || s.ms === 'di' || s.ms === 'po',

            for(let k=0; k<=5; k++){
                const a = -Math.PI/2 + k*2*Math.PI/5;
                const x = cx + Math.cos(a)*R*r/5, y = cy + Math.sin(a)*R*r/5;
                k ? rCtx.lineTo(x,y) : rCtx.moveTo(x,y);
            }
            rCtx.stroke();
        }

        rCtx.fillStyle = '#333333';
        rCtx.font = 'bold 12px "Noto Serif TC", serif';
        rCtx.textAlign = 'center';
        rCtx.textBaseline = 'middle';
        for(let k=0; k<5; k++){
            const a = -Math.PI/2 + k*2*Math.PI/5;
            rCtx.fillText(labs[k], cx + Math.cos(a)*(R+15), cy + Math.sin(a)*(R+15));
        }

        // 修復：優先採用 AppState.smoothedScores 低通濾波分值，並 Clamp 在 0~100 區間，消除雷達圖頂點二次彈簧超調振盪
        const rawTarget = AppState.smoothedScores || Rules.computeScores();
        const target = rawTarget.map(v => Math.max(0, Math.min(100, v)));
        rCtx.beginPath();

        const smoothDt = Math.min(dt, 0.1);
        let logicDt = smoothDt * 60;

        for(let k=0; k<5; k++){
            // 修正 1：使用穩定的 Lerp 平滑過渡，取代容易因 dt 波動而爆炸的二階彈簧物理
            this.radarDisp[k] += (target[k] - this.radarDisp[k]) * (1.0 - Math.pow(0.75, logicDt));

            const v = Math.min(R, Math.max(0, this.radarDisp[k]/100 * R));
            const a = -Math.PI/2 + k*2*Math.PI/5;
            const x = cx + Math.cos(a)*v, y = cy + Math.sin(a)*v;
            k ? rCtx.lineTo(x, y) : rCtx.moveTo(x, y);
        }

        rCtx.closePath();
        rCtx.fillStyle = 'rgba(185,138,46,0.4)';
        rCtx.fill();
        rCtx.strokeStyle = '#b98a2e';
        rCtx.lineWidth = 2;
        rCtx.stroke();
    }
};

        const waterGeo = new THREE.PlaneGeometry(CONFIG.tSize, CONFIG.tSize, 100, 100); waterGeo.rotateX(-Math.PI/2); // 提高網格精度以顯示細膩波浪

        const waterMat = new THREE.MeshStandardMaterial({ color: 0x1d758f, map: this.wTex, transparent: true, opacity: 0.85, roughness: 0.35, metalness: 0.2 });
        waterMat.onBeforeCompile = (shader) => {

                vWorldPosGeo = (modelMatrix * vec4(position, 1.0)).xyz; // 抓取全域坐標供光學計算
                float wave1 = sin(position.x * 0.05 + time * 1.2) * 0.6 * cos(position.z * 0.06 + time * 0.8);
                float wave2 = sin(position.x * 0.15 - time) * 0.25;

            shader.fragmentShader = `
                uniform float time;

            `.replace(
                `#include <map_fragment>`,
                `
                vec2 flowUV = vUv;
                float rx = vWorldXZ.x;
                float shift = 0.0;

                if (riverType == 1) shift = sin(rx * 0.15) * 8.0; 
                else if (riverType == 0) shift = cos(rx * 0.05) * 15.0; 
                else if (riverType == 2) shift = -cos(rx * 0.05) * 15.0; 
                else if (riverType == 3) shift = abs(rx) * 0.5; 

                vec2 flowUV1 = flowUV;
                vec2 flowUV2 = flowUV * 1.5; 
                
                float flowSpeedX = (riverType == 5) ? 0.0 : (time * 0.04);
                float flowSpeedY = (riverType == 5) ? (time * 0.15) : (shift / 350.0);
                
                flowUV1.x -= flowSpeedX;
                flowUV1.y -= flowSpeedY;
                
                flowUV2.x -= flowSpeedX * 0.5;
                flowUV2.y -= flowSpeedY + (time * 0.01);

                // 【優化：水體光學升級 (Shoreline Foam & Volumetric Depth)】
                float distToShore = abs(rx - shift); 
                float depthFactor = clamp(1.0 - (distToShore / 22.0), 0.0, 1.0); // 0=岸邊淺水, 1=河心深潭
                
                // Fresnel 視角反射效應 (讓遠處的水面更像鏡子)
                vec3 viewDir = normalize(cameraPosition - vWorldPosGeo);
                float fresnel = pow(1.0 - max(dot(viewDir, vec3(0.0, 1.0, 0.0)), 0.0), 3.0);

                #ifdef USE_MAP
                    vec4 tex1 = texture2D(map, flowUV1);

                    // 岸邊激浪白沫 (Foam)：在淺水區與波浪交會處產生白沫
                    float foam = (tex1.r + tex2.r) * smoothstep(0.15, 0.0, depthFactor);
                    
                    // 深度漸變色 (深潭青靛 vs 淺水碧綠)
                    vec3 deepColor = vec3(0.02, 0.35, 0.45);

                    vec3 baseWaterColor = mix(shallowColor, deepColor, depthFactor);
                    
                    // 疊加波光、泡沫與菲涅耳反射
                    diffuseColor.rgb = baseWaterColor + (tex1.rgb + tex2.rgb) * 0.15 + vec3(foam * 0.9) + (fresnel * 0.4);
                    
                    // 岸邊透明漸隱 (Alpha Fade)，完美融合地形消除生硬鋸齒切邊
                    diffuseColor.a *= mix(0.1, 1.0, smoothstep(0.0, 0.2, depthFactor));
                #endif
                `
            );
            waterMat.userData.shader = shader;
        };

        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth/window.innerHeight;

            this.renderer.setPixelRatio(window.devicePixelRatio); // 保持全設備最高解析度

            if (AppState.current.shaMode) {

                const intersects = this.raycaster.intersectObject(this.terrainMesh);
                if(intersects.length > 0 && AppState.obstacles.length < CONFIG.maxObstacles) {

        window.addEventListener('pointermove', e => {
            this.mouse.x = (e.clientX / window.innerWidth)*2 - 1;
            this.mouse.y = -(e.clientY / window.innerHeight)*2 + 1;
            
            // 【新增：筆刷視覺化追蹤 (Hover 反饋)】
            if (e.shiftKey || e.altKey) {
                this.raycaster.setFromCamera(this.mouse, this.camera);
                const hits = this.raycaster.intersectObject(this.terrainMesh);
                if (hits.length > 0 && this.brushCursor) {
                    this.brushCursor.position.copy(hits[0].point);
                    this.brushCursor.position.y += 0.5;
                    this.brushCursor.material.opacity = 0.8;
                    this.brushCursor.material.color.setHex(e.shiftKey ? 0x22ff44 : 0xff2222); // 起山綠，挖坑紅
                }
            } else if (this.brushCursor) {
                this.brushCursor.material.opacity = 0.0;
            }

            if(!isPointerDown || (!e.shiftKey && !e.altKey) || e.target !== this.renderer.domElement) return;
            
            this.raycaster.setFromCamera(this.mouse, this.camera);
            const intersects = this.raycaster.intersectObject(this.terrainMesh);
            if(intersects.length > 0) {
                // 暫停鏡頭旋轉以利雕刻
                if (this.controls) this.controls.enabled = false;
                
                const p = intersects[0].point;
                const brushRadius = 15.0; // 筆刷大小
                const sculptStrength = (e.shiftKey ? 1.5 : -1.5); // Shift:起山, Alt:挖坑
                
                const pos = this.terrainGeo.attributes.position.array;
                const cols = this.terrainGeo.attributes.color.array;
                
                let terrainModified = false;
                for (let i = 0; i < pos.length; i += 3) {
                    let dx = pos[i] - p.x;
                    let dz = pos[i+2] - p.z;
                    let distSq = dx*dx + dz*dz;
                    
                    if (distSq < brushRadius * brushRadius) {
                        let influence = Math.exp(-distSq / (brushRadius * brushRadius * 0.5));
                        pos[i+1] += sculptStrength * influence; // 更新 3D 頂點
                        
                        // 同步更新物理碰撞地圖 (hMap)
                        let gX = Math.round((pos[i]+CONFIG.tSize/2)/(CONFIG.tSize/CONFIG.tSeg));
                        let gZ = Math.round((pos[i+2]+CONFIG.tSize/2)/(CONFIG.tSize/CONFIG.tSeg));
                        if(gX >= 0 && gX <= CONFIG.tSeg && gZ >= 0 && gZ <= CONFIG.tSeg) {
                            this.hMap[gZ*(CONFIG.tSeg+1) + gX] = pos[i+1];
                        }
                        
                        // 即時反饋筆刷顏色 (雕刻過的地方會出現新土顏色)
                        cols[i] = 0.5; cols[i+1] = 0.35; cols[i+2] = 0.15;
                        terrainModified = true;
                    }
                }
                
                if (terrainModified) {
                    this.terrainGeo.computeVertexNormals(); 
                    this.terrainGeo.attributes.position.needsUpdate = true;
                    this.terrainGeo.attributes.color.needsUpdate = true;

        });
        
        // 放開滑鼠時恢復鏡頭控制
        window.addEventListener('pointerup', () => { if (this.controls) this.controls.enabled = true; });

        // 【維度四：互動性】新增「堪輿測風煙霧彈」 (Qi Smoke Bomb)
        // 雙擊地形，釋放大量高亮粒子，用於直接觀測 CFD 網格流體的風場走向與背風亂流
        window.addEventListener('dblclick', e => {

            if (intersects.length > 0) {

                for (let i = 0; i < 400; i++) {

                    Physics.pPos[idx*3] = p.x + (Math.random()-0.5)*5;
                    Physics.pPos[idx*3+1] = p.y + 2 + Math.random()*5;

                    Physics.pVel[idx].set((Math.random()-0.5)*12, Math.random()*15, (Math.random()-0.5)*12);
                    Physics.pState[idx] = 2; // 強制設為吉氣
                    Physics.pCol[idx*3] = 0.2; Physics.pCol[idx*3+1] = 1.0; Physics.pCol[idx*3+2] = 0.5; // 高亮螢光綠

        window.addEventListener('keydown', (e) => {

                let dynamicTaijiZ = (AppState.current.xue === 'wo') ? -5.0 : (AppState.current.xue === 'ru' ? 12.0 : (AppState.current.xue === 'qian' ? 0.0 : 5.0));
                let caveY = Engine3D.getTerrainY(0, dynamicTaijiZ).y + 3.0; // 堪輿師立穴眼睛高度

                // 設定插值平滑目標，由 animate() 迴圈流暢過渡，不再瞬間閃爍
                Engine3D.targetCamPos = new THREE.Vector3(0, caveY, dynamicTaijiZ);
                Engine3D.targetLookAt = new THREE.Vector3(0, caveY + 2.0, 80.0);
                Engine3D.isTransitioning = true;

    clearHeatmap() {
        if(this.hCtx) {
            this.hCtx.fillStyle = 'black'; this.hCtx.fillRect(0,0,256,256);
            if(this.heatTex) this.heatTex.needsUpdate = true;
        }
    },

    // 吸收 Qwen 版優點 1：引入 Domain Warping (空間扭曲) 與 FBM 碎形雜訊，使山脈更具自然崎嶇感
    hashNoise(x, z) {
        return (Math.sin(x * 0.31 + z * 0.17) * Math.cos(z * 0.29 - x * 0.13) + Math.sin(x * 0.73 + z * 0.51)) * 0.5;
    },
    pNoise(x, z, octaves = 3) {
        let sum = 0, amp = 1, freq = 1, norm = 0;
        for (let i = 0; i < octaves; i++) {
            // 加入輕量 Domain Warping 讓地貌發生自然扭曲
            let wx = x * freq + this.hashNoise(z * freq, x * freq) * 2.0;
            let wz = z * freq + this.hashNoise(x * freq, z * freq) * 2.0;
            sum += this.hashNoise(wx, wz) * amp;
            norm += amp;
            amp *= 0.5; freq *= 2.0;
        }
        return sum / norm;
    },
    ridgeNoise(x, z) {
        let n = this.pNoise(x * 0.5, z * 0.5, 2);
        return 1.0 - Math.abs(n);
    },

    // 吸收 Qwen 版優點 2：加入水力侵蝕與熱力風化 (Hydraulic Erosion & Thermal Weathering)
    erodeTerrain(passes = 2) {
        const tSeg = CONFIG.tSeg;
        const size = (tSeg + 1) * (tSeg + 1);
        const flow = new Float32Array(size);
        const order = new Array(size);
        for(let i=0; i<size; i++) order[i] = i;
        // 依高度由上而下排序，模擬水流由高處往低處沖刷
        order.sort((a, b) => this.hMap[b] - this.hMap[a]);

        const neigh = [-1, 1, -(tSeg+1), (tSeg+1)]; // 左右上下

        for(let pass = 0; pass < passes; pass++) {
            flow.fill(1.0);
            for(let oi = 0; oi < size; oi++) {
                const i = order[oi];
                const ix = i % (tSeg+1), iz = Math.floor(i / (tSeg+1));
                if(ix === 0 || ix === tSeg || iz === 0 || iz === tSeg) continue;

                let lowest = -1, lh = this.hMap[i];
                for(let k = 0; k < 4; k++) {
                    const j = i + neigh[k];
                    if(this.hMap[j] < lh) { lh = this.hMap[j]; lowest = j; }
                }
                if(lowest < 0) continue; // 已經是坑底

                const slope = this.hMap[i] - lh;
                const carry = flow[i];
                flow[lowest] += carry * 0.94; // 水流匯聚

                // 侵蝕量與坡度和水流量成正比 (保護水下河床與深潭不被過度侵蝕)
                let eros = slope * 0.025 * carry;
                if (this.hMap[i] < -5) eros *= 0.1; 
                const maxErode = slope * 0.45;
                if(eros > maxErode) eros = maxErode;

                if(eros > 0.001) {
                    this.hMap[i] -= eros;
                    this.hMap[lowest] += eros * 0.40; // 泥沙沉積
                }
            }
            // 輕量熱力風化 (崩塌平滑化)，消除過度鋸齒，讓陡峭山脈產生滑坡坡度
            for(let iz = 1; iz < tSeg; iz++) {
                for(let ix = 1; ix < tSeg; ix++) {
                    const i = iz * (tSeg+1) + ix;
                    const h = this.hMap[i];
                    for(let k = 0; k < 4; k++) {
                        const j = i + neigh[k];
                        const diff = h - this.hMap[j];
                        if(diff > 3.0) { // 坡度過陡發生崩塌
                            const move = (diff - 3.0) * 0.15;
                            this.hMap[i] -= move;
                            this.hMap[j] += move * 0.85;
                        }
                    }
                }
            }
        }
    },

    buildTerrain() {
        const state = AppState.current;
        const tSeg = CONFIG.tSeg, tSize = CONFIG.tSize;
        this.waterMesh.visible = (state.w !== 'none' || state.yue || state.w === 'lintou');
        // 修正：修復平洋龍河水被「活埋」的 3D 視覺 Bug
        this.waterMesh.position.y = (state.d === 'pingyang') ? -3.0 : -10.0;
        const pos = this.terrainGeo.attributes.position.array;
        const cols = [];
        let wZ = 999; if(['you','jiuqu','bazi'].includes(state.w)) wZ = 70; if(state.w==='gejiao') wZ = 30; if(state.w==='ji'||state.w==='fan') wZ = 55;

        let defaultY = (state.w === 'none') ? -8 : -18;
        let c = new THREE.Color(); // 修復：將 Color 實例化移出 22800 次的迴圈外，消除切換格局時的 GC 記憶體暴增卡頓
        for (let i = 0; i < pos.length; i += 3) {
            let x = pos[i], z = pos[i+2], y = defaultY;
            if (state.d === 'pingyang') {
                // 平洋微地形：高一寸為山，低一寸為水；水纏砂微沙洲與田壟隆起
                let microTopo = this.pNoise(x*0.8, z*0.8) * 1.5 + this.ridgeNoise(x*2, z*2) * 0.8;

                // 【平洋水纏砂 / 平洋一突】：穴場周圍隆起平洋微丘，若選突穴/乳穴則大幅墊高顯現「平洋一突勝千峰」
                if (Math.abs(x) < 25 && z > -25 && z < 25) {
                    let knollBoost = (state.xue === 'tu' || state.xue === 'ru') ? 12.0 : 3.5;
                    // 修正 5：平洋實體丘陵忘了跟隨穴形(wo, ru, qian)改變 Z 軸中心。
                    // 導致物理漩渦中心與 3D 幾何隆起中心錯位，粒子會卡在錯誤的半山腰。
                    let dynamicTaijiZ = (state.xue === 'wo') ? -5.0 : (state.xue === 'ru' ? 12.0 : (state.xue === 'qian' ? 0.0 : 5.0));
                    microTopo += knollBoost * Math.exp(-(x*x + Math.pow(z - dynamicTaijiZ, 2))/250); 
                }

                y = (state.w === 'none') ? 2.0 + microTopo : -2.0 + microTopo;
            } else {
                // 迴龍顧祖：建立真實 C 型半圓弧山脊拓撲（將龍脈尾端大幅彎回朝向太祖山 -Z）
                let dX = x;
                let dZ = z;
                if(state.d==='huilong') {
                    let curveAngle = Math.max(0, Math.min(Math.PI, (z + 100) / 110 * Math.PI));
                    let curveCenterX = Math.sin(curveAngle) * 65.0; // 山脊向右前方弧形彎曲
                    dX = x - curveCenterX;
                }
                let zRatio = Math.min(2.2, Math.max(0, -z/40));
                let ridge = this.ridgeNoise(dX, dZ) * 15;
                let sBase = 25 * Math.exp(-(dX*dX)/(300 + ridge*10)) * zRatio + ridge * zRatio * 0.5;
                if(['sheng','ji','huan'].includes(state.d)) sBase += (Math.sin(z*(state.d==='ji'?0.15:0.08)) + this.pNoise(x*0.5, z*0.5)*0.5)*(state.d==='ji'?15:8)*Math.min(2.0, Math.max(0,-z/50));
                if(state.d==='si') sBase *= 0.3; if(state.d==='po') sBase += this.pNoise(x,z)*15;

                // 【能量層級與繼承】：太祖山(極高) -> 少祖山(中等) -> 父母山(平緩)
                let hierarchyBoost = 0;
                if (z < -120) hierarchyBoost = 35; // 太祖山勢能最高
                else if (z < -80) hierarchyBoost = 15; // 少祖山降壓
                else if (z < -40) hierarchyBoost = 5; // 父母山平緩
                sBase += hierarchyBoost * Math.exp(-(x*x)/300);

                // 【龍脈剝換脫煞 (Metamorphosis)】：未剝換則全線佈滿尖銳岩石
                let roughFactor = (state.bohuan === 'no') ? 1.0 : Math.min(1.0, Math.max(0, (-z - 40) / 60));
                let rockyNoise = this.pNoise(x * 1.5, z * 1.5) * 12.0 * roughFactor; // 高頻粗糙鋸齒
                // 九星行龍：若為火星且未剝換，加入極端尖銳廉貞煞
                if (state.xing === 'huo' && state.bohuan === 'no') rockyNoise += Math.abs(Math.sin(x * 0.8) * Math.cos(z * 0.8)) * 15.0;
                sBase += rockyNoise;
                
                // 【橈棹枝腳 (Fractal Branches)】：龍脈兩側的天然導流防波堤
                if (state.zhijiao !== 'none' && z < -20) {
                    let branchDir = (state.zhijiao === 'shun') ? 1.5 : -1.5; // 順水抱(前指) vs 逆水反(後指)
                    // 使用三角函數與斜率製造 V 字型分支山脊
                    let branchPattern = Math.cos((z + Math.abs(x) * branchDir) * 0.2); 
                    if (branchPattern > 0.6) {
                        let branchHeight = (branchPattern - 0.6) * 35.0 * Math.exp(-Math.abs(x)/80);
                        sBase = Math.max(sBase, branchHeight);
                    }
                }

                if(z > -40 && z < -15) {
                    // 【過峽物理強化 (Venturi Gorge)】：形成真正的深V峽谷
                    if(state.shu) sBase *= (1 - Math.exp(-Math.pow(z+25,2)/50)*0.85); // 谷底更深
                    if(state.fengyao || state.shu) {
                        // 蜂腰鶴膝：山脊在 z: -32 處急遽收窄（蜂腰），並在 z: -25 處隆起圓頭（鶴膝）
                        let pinch = Math.exp(-Math.pow(z + 32, 2) / 25); // 蜂腰收縮節點
                        let knee = Math.exp(-Math.pow(z + 24, 2) / 15) * 8.0; // 鶴膝跌斷隆起
                        sBase = sBase * (1.0 - pinch * 0.75) + knee;
                        
                        // 迎送砂與扛劫砂：過峽兩側兩對雙峰山腳護衛（前迎砂、後送砂、夾角扛砂）
                        if (Math.abs(z + 32) < 12) {
                            let leftGuard = 14.0 * Math.exp(-(Math.pow(x + 14, 2) + Math.pow(z + 34, 2)) / 35); // 左迎砂
                            let rightGuard = 14.0 * Math.exp(-(Math.pow(x - 14, 2) + Math.pow(z + 30, 2)) / 35); // 右送砂
                            sBase = Math.max(sBase, Math.max(leftGuard, rightGuard));
                        }
                    }
                }
                if(state.fenzhi && z < -20) sBase = Math.max(sBase, 15*Math.exp(-Math.pow(Math.abs(x)-Math.abs(z+20),2)/100));
                if(state.guiyao && z < -10) {
                    // 鬼山撐背：穴星正後方 (z: -55 ~ -35, |x| < 10) 延伸出一座堅實的支撐山脊
                    if (z > -60 && z < -35 && Math.abs(x) < 12) {
                        let spurH = 22.0 * Math.exp(-(x * x) / 45.0) * Math.sin((z + 60) / 25.0 * Math.PI);
                        sBase = Math.max(sBase, spurH);
                    } else if (Math.abs(x) < 40) {
                        // 修正：移除布林值硬切換 (>0.8) 導致的垂直方塊破圖。改用平滑的連續函數產生自然曜星丘陵。
                        let rockNoise = Math.sin(x * 0.5) * Math.cos(z * 0.5);
                        if (rockNoise > 0.8) {
                            sBase += (rockNoise - 0.8) * 60.0; // 周圍散落平滑曜星
                        }
                    }
                }
                y = Math.max(y, sBase);

                if (z < -10 && (state.xia || state.mn !== 'none' || state.zhu || state.xu)) {
                    let mD = Math.sqrt(x*x + Math.pow(z+45,2)), h = 0;
                    if(state.xia) {
                        if(state.xing==='jin') {
                            // 金星覆鐘：頂部極度圓潤（覆鐘/覆釜圓頂）
                            h = 45 * Math.cos(Math.min(Math.PI/2, mD/25)) * Math.exp(-(mD*mD)/1200);
                        } else if(state.xing==='mu') {
                            // 木星高柱：陡峭高聳柱狀，兩側快速直落
                            h = 60 / (1.0 + Math.pow(mD/12, 3.5));
                        } else if(state.xing==='shui') {
                            // 水星蛇浪：波浪連綿丘陵（多重水浪峰）
                            h = 35 * Math.exp(-Math.pow(z+45,2)/800) * (0.8 + 0.35 * Math.sin(x * 0.2) + 0.25 * Math.cos((z+45) * 0.2));
                        } else if(state.xing==='tu') {
                            // 土星棋盤：頂部方正平坦，四角邊緣陡峭切落
                            let squareD = Math.max(Math.abs(x), Math.abs(z+45));
                            h = 38 * Math.exp(-Math.pow(squareD/22, 6)); // 平頂方丘
                        } else if(state.xing==='huo') {
                            // 火星尖焰：頂部陡峭刺天且帶 jagged 尖牙
                            h = 50 * Math.exp(-mD/12) + this.pNoise(x*0.8, z*0.8) * 14;
                        }

                        // 【堪輿微觀：蟬翼砂與蟹眼分水】
                        if (z > -30 && z < -10 && Math.abs(x) < 20) {
                            // 蟬翼砂：穴星兩側薄如蟬翼的微型隱砂護衛穴心
                            let wing = Math.exp(-Math.pow(Math.abs(x) - 10, 2) / 12) * Math.exp(-Math.pow(z + 20, 2) / 40) * 4.0;
                            // 蟹眼分水溝：穴星頂部兩側微深之導水溝，將山頂雨水向兩側引開
                            let crabEyeDrain = Math.exp(-Math.pow(Math.abs(x) - 5, 2) / 6) * Math.exp(-Math.pow(z + 25, 2) / 20) * 3.5;
                            h = h + wing - crabEyeDrain;
                        }
                    }
                    if(state.mn==='you') {
                        if (z > -50 && z < -25) {
                            let nodDip = Math.sin((z + 50) / 25 * Math.PI) * 6.0; 
                            h -= nodDip;
                        }
                    } else if(state.mn==='kang') h += (z < -45 ? 20 : -10); else if(state.mn==='po') h += this.pNoise(x,z)*15;
                    
                    // 【主客比例 (Mountain Scale)】：應用 UI 滑桿的主山縮放
                    h *= state.zhuScale; 

                    if(state.zhu && z < -40 && z > -80) h += 18 * state.zhuScale * Math.exp(-(x*x + Math.pow(z+60,2))/800);
                    if(state.xu && z < -70 && z > -120) h += 25 * state.zhuScale * Math.exp(-(x*x + Math.pow(z+95,2))/1200);
                    y = Math.max(y, h);
                }
                if(state.zutai && z < -90) y = Math.max(y, 80 * state.zhuScale * Math.exp(-(x*x + Math.pow(z+120,2))/1000));

                let brokenNoise = state.posui ? (this.pNoise(x*2.0, z*2.0) * 20.0 - 5.0) : 0; // 破碎崖崩塌地貌

                if(state.ml!=='none' && x<0 && z>-30 && z<110) {
                    let r = state.ml==='ya'?15:35;
                    let curve = Math.max(0, (z - 20) * 0.45); 
                    if (z > 20 && z < 35 && state.mr !== 'none') curve += Math.sin((z - 20) / 15 * Math.PI) * 18;
                    if (z > 55 && z < 85) curve += Math.sin((z - 55) / 30 * Math.PI) * 45;
                    let centerX = -Math.max(-10, r - curve); 
                    let sH = 35*Math.exp(-Math.pow(x-centerX,2)/200)*Math.max(0,1-(z+20)/130);
                    if(z > 70 && state.an) sH += 15 * Math.exp(-(Math.pow(x+10,2)+Math.pow(z-85,2))/100); 
                    if(state.ml==='po') sH *= (1+this.pNoise(x,z)*0.5); if(state.ao && z>0 && z<30) sH *= 0.1;
                    if(state.qingquan && Math.abs(z-20)<10 && Math.abs(x)>10) sH += 20*Math.exp(-Math.pow(x+20,2)/50);
                    if(state.posui && sH > 5) sH += brokenNoise; // 注入破碎崖
                    y = Math.max(y, sH);
                }
                if(state.mr!=='none' && x>0 && z>-30 && z<110) {
                    let r = state.mr==='tai'?15:35;
                    let curve = Math.max(0, (z - 20) * 0.45);
                    if (z > 75 && z < 105) curve += Math.sin((z - 75) / 30 * Math.PI) * 45;
                    let centerX = Math.min(10, r - curve); 
                    let sH = (state.mr==='tai'?45:35)*Math.exp(-Math.pow(x-centerX,2)/200)*Math.max(0,1-(z+20)/130);
                    if(z > 70 && state.an) sH += 15 * Math.exp(-(Math.pow(x-10,2)+Math.pow(z-85,2))/100); 
                    if(state.mr==='po') sH *= (1+this.pNoise(x,z)*0.5); if(state.ao && z>0 && z<30) sH *= 0.1;
                    if(state.qingquan && Math.abs(z-20)<10 && Math.abs(x)>10) sH += 20*Math.exp(-Math.pow(x-20,2)/50);
                    if(state.posui && sH > 5) sH += brokenNoise; // 注入破碎崖
                    y = Math.max(y, sH);
                }
                if(state.hulong && Math.abs(z)<50) y = Math.max(y, 25*Math.exp(-Math.pow(Math.abs(x)-70,2)/200));

                // 【射肋煞 (Arrow Sha)】：尖銳的無情山脊如刀劍直插穴星兩側
                if (state.sherui && z > -15 && z < 25) {
                    let arrowH = 25.0 * Math.exp(-(Math.pow(Math.abs(x) - 25, 2))/20) * Math.exp(-(Math.pow(z - 5, 2))/40);
                    y = Math.max(y, arrowH);
                }
            }

            // 【修正：平洋龍物理空間悖論】平洋為平坦微地形，前方案山與朝山必須等比例縮小為沙洲微丘，不能長出摩天大山
            let pScale = (state.d === 'pingyang') ? 0.15 : 1.0;

            if(state.an && z>55 && z<100) {
                // 若朱雀低陷 (ms === 'di')，降低前案高度為 5 展現空虛低陷，否則保持標準案山高度 18
                let targetH = (state.ms === 'di') ? 5 : 18;
                let flatTableAn = targetH * Math.exp(-(Math.pow(x/1.8, 4) + Math.pow(z-75, 2)) / 350);
                // 修正 2：官星 (Guan) 缺少 Z 軸收斂，導致長成橫跨整個案山的「無限長城」。補上 z-85 的高斯衰減。
                let guanStar = state.guan ? 5 * Math.exp(-(x*x + Math.pow(z-85, 2))/100) : 0;
                y = Math.max(y, (flatTableAn + guanStar) * pScale);
            }
            if(state.ms==='po' && z>55 && z<100) y = Math.max(y, 18 * pScale * Math.exp(-(x*x+Math.pow(z-75,2))/400)*(1+this.pNoise(x,z)*0.5));
            // 修正：風水幾何防呆。探頭煞必須躲在「案山」背後。若無案山 (state.an 為 false)，則不應生成孤立的探頭山。
            if(state.an && state.tantou && z>80 && z<120) y = Math.max(y, 25 * pScale * Math.exp(-(x*x+Math.pow(z-100,2))/100));
            if(state.chao && z>110) {
                // 三台疊浪朝山：遠處朝山分成三重波浪狀山脈（第一台 z:125、第二台 z:145、第三台 z:165），層層朝拜
                let t1 = 35 * Math.exp(-(x*x + Math.pow(z-125, 2))/1200);
                let t2 = 50 * Math.exp(-(x*x + Math.pow(z-145, 2))/1800);
                let t3 = 70 * Math.exp(-(x*x + Math.pow(z-165, 2))/2500);
                y = Math.max(y, Math.max(t1, Math.max(t2, t3)) * pScale);
            }

                        // 【主客比例 (Ming Tang Scale)】：將 UI 滑桿應用於明堂半徑
            let scaledMtRadius = 65 * state.mtScale;
            let mtD = Math.sqrt(x*x + z*z);
            if(state.mt && mtD < scaledMtRadius) {
                // 將所有 mtD 相關的衰減也按比例放大
                let normMtD = mtD / state.mtScale;
                
                let tY = (state.d === 'pingyang') ? -1.0 : -3;
                let angle = Math.atan2(x, z);
                let targetAngle = state.face === '1' ? 0 : Math.PI; 
                let angleDiff = Math.abs(Math.atan2(Math.sin(angle - targetAngle), Math.cos(angle - targetAngle)));
                let wall = (angleDiff / Math.PI) * 12 * pScale * (Math.min(30, normMtD)/30); 

                if(state.xue==='wo') tY = -8 * pScale * Math.cos(normMtD*Math.PI/60) + wall;
                else if(state.xue==='tu') tY = 8 * pScale * Math.cos(normMtD*Math.PI/60) - wall*0.5;
                else if(state.xue==='ru' && z<10) tY = 12 * pScale * Math.exp(-(x*x + Math.pow(z+10,2))/50) + wall;
                else if(state.xue==='qian') {
                    let qianArm = 12 * Math.exp(-(Math.pow(Math.abs(x)-15, 2) + Math.pow(Math.max(0, z-5), 2))/80);
                    tY = (-5 * pScale) + wall + (qianArm * pScale);
                }

                if (state.xia && z >= -8 && z <= 12 && Math.abs(x) <= 12) {
                    let zhanFactor = Math.exp(-(x*x + Math.pow(z-2, 2))/60);
                    tY = tY * (1 - zhanFactor) + (2.5 * pScale) * zhanFactor; 
                }
                
                if (state.xia && z >= 12 && z <= 20 && Math.abs(x) <= 8) {
                    let hejinPit = Math.exp(-(x*x + Math.pow(z-16, 2))/20) * 3.0 * pScale;
                    tY -= hejinPit; 
                }

                if (z >= -5 && z < 15) {
                    let innerHall = Math.exp(-(x*x + Math.pow(z-5, 2))/120) * 1.8 * pScale;
                    tY = tY * (1 - Math.min(1, innerHall)) + (1.2 * pScale) * Math.min(1, innerHall);
                } else if (z >= 15 && z < 42 * state.mtScale) {
                    let midHallDrop = (3.5 + Math.sin((z - 15) / (27 * state.mtScale) * Math.PI) * 1.5) * pScale;
                    tY -= midHallDrop;
                } else if (z >= 42 * state.mtScale && z < scaledMtRadius) {
                    let outerHallDrop = (7.0 + Math.exp(-Math.pow(x/25, 2)) * 3.0) * pScale;
                    tY -= outerHallDrop;
                }

                let blendDist = Math.min(1.0, mtD / (55.0 * state.mtScale));
                y = y * blendDist + tY * (1 - blendDist);
            }
            if(state.taiji && mtD < 18) y = Math.max(y, -2.5);
            
            // 修正 1：空間錯位 Bug。明堂傾瀉(qing)必須跟隨坐向(face)改變方向。
            // 否則背水(face=0)時，傾瀉會挖空背後的玄武主山，而明堂卻是平的。
            // (風水幾何防呆：必須有明堂 state.mt 才能發生傾瀉，避免挖破非明堂的地形)
            if (state.mt && state.qing && mtD < 40) {
                if (state.face === '1' && z > 15) y -= (z - 15) * 0.35; // 向前傾瀉
                else if (state.face === '0' && z < -15) y -= (-15 - z) * 0.35; // 向後傾瀉
            }
            
            // 三叉水交會處：雕塑「水聚天心」深潭（天心水暈）
            if(state.san && Math.abs(x) < 25 && z > 45 && z < 75) {
                let junctionDist = Math.sqrt(x*x + Math.pow(z - 60, 2));
                if (junctionDist < 20) {
                    // 修正：幾何深度悖論！平洋龍河床極淺(僅-4.5)，若強行挖出 -22 的深潭會產生荒謬的直井黑洞。
                    let sanDepth = (state.d === 'pingyang') ? -6.5 : -22;
                    y = Math.min(y, sanDepth + junctionDist * 0.35); // 沖刷出水下深潭
                }
            }

            // 修正 5：天斬煞直接用 Math.min 削平會導致網格法線破裂。
            // 必須改用平滑的高斯乘數，刻出極度陡峭但網格依然連續的深V型峽谷。
            if(state.tianzhan && Math.abs(x)<15 && z > -45 && z < 5) {
                let tCut = 18.0 * Math.exp(-(x*x)/25) * Math.sin(Math.min(1.0, (z+45)/45) * Math.PI);
                y -= Math.max(0, tCut - 4.0);
            }
            // 修正：地理拓撲悖論！當立向為背水(face=0)時，若將半月池建在 z: -35 處，
            // 會直接挖穿背後高聳的主山峰，造成嚴重的 3D 地形撕裂與邏輯悖論。
            // 半月池實體必須建於前方的平坦明堂(z: 30)，與人面朝向無關。
            let targetYueZ = 30;
            // 修正 2：半月池的總半徑為 18，邊界裁切範圍必須大於 18 (放寬至 20)，否則池堤前後端會被像切蛋糕一樣削平
            let yueZMin = targetYueZ - 20, yueZMax = targetYueZ + 20;
            if(state.yue && Math.abs(x)<22 && z > yueZMin && z < yueZMax) {
                // 半月池：根據坐向 (face) 動態於前方 (z~30) 或後方 (z~-35) 雕塑池底與金城池堤
                let poolRadius = Math.sqrt(x*x + Math.pow(z-targetYueZ, 2));
                if (poolRadius < 14) {
                    // 修正 2B：平洋龍的半月池不能刻出 -16 的深井，池底應等比例縮淺為 -5.0
                    let poolBottom = (state.d === 'pingyang') ? -5.0 : -16.0;
                    let poolSlope = (state.d === 'pingyang') ? 1.5 : 4.0;
                    y = poolBottom + (poolRadius/14) * poolSlope; 
                } else if (poolRadius >= 14 && poolRadius <= 18 && z > targetYueZ + 2) {
                    // 修正 2：半月池固定於前方，池堤(Bank)必須永遠位於池的外側 (z > targetYueZ + 2)。
                    // 移除 state.face 的判斷，防止背水時池堤長在內側導致形狀錯亂。
                    let bankH = (state.d === 'pingyang') ? 1.5 : -2.0;
                    y = Math.max(y, bankH); // 池前/池後拱起半月金城池堤
                }
            }
            if(state.w !== 'none') {
                // 將 z 限定在 > -5，保留後方主山的完整性，讓水流自然從山坡上傾瀉而下
