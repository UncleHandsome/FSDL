                if(state.w==='lintou' && Math.abs(x)<12 && z > -5 && z < 20) y = Math.min(y, -12);

                let rS = wZ;
                if (state.d === 'pingyang' && state.w !== 'none') {
                    // 平洋鴨頸水：形成細長曲折如鴨頸的環抱灣流
                    rS += Math.sin(x * 0.08) * 20.0 + Math.cos(x * 0.18) * 8.0;
                }
                if(state.w==='jiuqu') {
                    // 之字/玄字形蛇行屈曲：利用方波化三角函數產生急折角度的九曲水道
                    let zCurve = Math.sin(x * 0.12);
                    rS += Math.sign(zCurve) * Math.pow(Math.abs(zCurve), 0.5) * 14;
                }
                if(state.w==='you') {
                    // 玉帶環腰：形成深 C 型半圓弧，將明堂與案山緊緊包抱在弧內
                    rS += (1.0 - Math.pow(x / 90.0, 2)) * 28.0;
                }
                if(state.w==='fan') rS -= Math.cos(x*0.05)*15;
                if(state.w==='bazi') rS += Math.abs(x)*0.5;

                // 【水文水力學雕塑】：彎道凸岸（環抱側）堆積沙洲金城吐唇，凹岸（反弓側）深切成割腳崖深潭
                if((state.w === 'jiuqu' || state.w === 'you' || state.w === 'fan') && Math.abs(z - rS) < 25) {
                    // 計算河道曲率方向（正值為向北彎，負值為向南彎）
                    let curveCoeff = (state.w === 'jiuqu') ? Math.sin(x * 0.12) : ((state.w === 'you') ? 1.0 : -1.0);
                    let bankDist = (z - rS) * curveCoeff;

                    if (bankDist > 1.5 && bankDist < 18.0) {
                        // 凸岸（水包邊）：泥沙堆積凸起成金城水灣包抱沙洲（吐唇）
                        let spitH = Math.exp(-Math.pow(bankDist - 8.0, 2) / 20) * 4.5;
                        y += spitH;
                    } else if (bankDist < -1.5 && bankDist > -18.0) {
                        // 凹岸（水沖射）：流體水力下切淘空，形成陡峭懸崖與河底深潭
                        let gougeDepth = Math.exp(-Math.pow(bankDist + 8.0, 2) / 16) * 6.0;
                        y -= gougeDepth;
                    }
                }

                // 【風水地理修復】：水口神獸關攔（獅象/華表/羅星）實體窄化河道，形成 S 型交鎖峽谷
                let hasGuardsGorge = state.shixiang || state.hua || state.luo;
                if(hasGuardsGorge && Math.abs(x) > 50 && z > 40) {
                    let sideSign = Math.sign(x);
                    // 擠壓河道道中心線，形成犬牙交鎖（S 彎）
                    rS += Math.sin(x * 0.2) * 12;
                    // 左右山腳強行向河心延伸，將河道收窄為狹谷
                    let gorgeChoke = Math.exp(-Math.pow(Math.abs(x) - 65, 2) / 150) * 18;
                    if (z > rS - 15 && z < rS + 15) {
                        y = Math.max(y, -5 + gorgeChoke); // 強行抬高峽谷兩側地基
                    }
                }

                let dR = Math.abs(z - rS);

                if(dR < 25) {
                    let t = Math.max(0, dR / 25);
                    let smoothT = t * t * (3 - 2 * t);
                    // 修正：平洋為平原微地形，水體不應刻出極深峽谷，將河床深度大幅調淺至 -4.5
                    let riverBottom = (state.d === 'pingyang') ? -4.5 : ((state.w === 'gejiao') ? -18 : -15);

                    // 真實流體力學：加入河道物理高低差 (梯度)，讓重力自然引導水流，取代魔法向量
                    let flowTilt = 0;
                    if (state.w === 'bazi') flowTilt = -Math.abs(x) * 0.08; 
                    else if (state.w === 'lintou') flowTilt = (z < 20) ? (z - 20) * 0.5 : -Math.abs(x) * 0.05; 
                    else flowTilt = -x * 0.03; 

                    let targetRiverY = riverBottom + flowTilt;
                    
                    // 【幾何安全鎖】確保河床絕對不會高於兩側陸地，且【必須】低於水面
                    let waterLevel = (state.d === 'pingyang') ? -3.0 : -10.0;
                    targetRiverY = Math.min(targetRiverY, Math.min(y - 1.5, waterLevel - 0.5));

                    // 修復：移除 dR < 15 的硬限制，讓貝茲曲線平滑過渡 (smoothT) 完整涵蓋 25 單位的河岸，消除 3D 地形撕裂斷崖
                    y = y * smoothT + targetRiverY * (1 - smoothT);
                    
                    if (state.w === 'gejiao' && dR >= 15) {
                        // 修正 3：移除 dR >= 15 的硬切判斷，改為全域平滑套用的高指數切削，
                        // 讓割腳水產生連續且深 V 型的沖刷絕壁，徹底消除網格撕裂與尖刺
                        let gejiaoCut = Math.pow(Math.max(0, 25 - dR), 1.2) * 0.5;
                        y -= gejiaoCut;
                    }
                }

                if(state.luo && Math.abs(x) < 12 && z > 65 && z < 85) {
                    // 羅星塞水口：河道正中央聳立獨立石墩山包（羅星），高出水面逼水分流
                    let luoH = 8.0 * Math.exp(-(x*x + Math.pow(z-75, 2))/35);
                    y = Math.max(y, -15 + luoH); // 從河床抬升為水中央山洲
                }
                // 【華表捍門與獅象把水口】：左右兩岸對峙聳立陡峭雙峰峽谷門（捍門雙峰）
                if((state.shixiang || state.hua) && z > 65 && z < 85) {
                    let bankDist = Math.abs(Math.abs(x) - 52); // 河道兩岸52距離處聳立雙峰
                    if (bankDist < 16) {
                        let gateH = (state.shixiang ? 28.0 : 22.0) * Math.exp(-bankDist*bankDist / 80) * Math.exp(-Math.pow(z-75, 2)/100);
                        y = Math.max(y, gateH);
                    }
                }
                if(state.qin && z > 48 && z < 68) {
                    // 水尾禽星：溪流出口兩側橫臥龜蛇形巨石洲（禽星砥柱）
                    let qinRock = 6.0 * Math.exp(-(Math.pow(Math.abs(x) - 15, 2) + Math.pow(z - 58, 2)) / 25);
                    y = Math.max(y, -12 + qinRock); // 凸起出水面的龜蛇奇石
                }
            }

            if (state.d !== 'huilong' && state.d !== 'pingyang') y -= (z + 170) * 0.015;

            let gX = Math.round((x+tSize/2)/(tSize/tSeg)), gZ = Math.round((z+tSize/2)/(tSize/tSeg));
            this.hMap[gZ*(tSeg+1) + gX] = y;
        } // 結束階段一：基礎風水地形生成

        // 階段二：執行水力侵蝕與風化平滑 (吸收 Qwen 版優點，讓山脈雕刻出溝壑與自然坡面)
        this.erodeTerrain(2);

        // 階段三：套用侵蝕後的高度，更新網格頂點與計算地貌顏色
        for (let i = 0; i < pos.length; i += 3) {
            let x = pos[i], z = pos[i+2];
            let gX = Math.round((x+tSize/2)/(tSize/tSeg)), gZ = Math.round((z+tSize/2)/(tSize/tSeg));
            let y = this.hMap[gZ*(tSeg+1) + gX]; // 讀取侵蝕過後的新高度
            pos[i+1] = y;

            // 加入地表噪聲擾動，打破死板的水平顏色分層，產生真實的斑駁植被與鋸齒狀林線
            let colorNoise = this.pNoise(x * 1.5, z * 1.5, 2) * 0.12; 
            let nH = Math.max(0, Math.min(1.0, ((y + 15) / 75) + colorNoise));

            // 【優化：基於坡度的動態材質混合 (Slope-based Texturing)】
            // 讀取周圍高度計算真實坡度，陡坡自動裸露岩石，平緩處才生長植被
            let gX_slope = Math.max(0, Math.min(CONFIG.tSeg, gX));
            let gZ_slope = Math.max(0, Math.min(CONFIG.tSeg, gZ));
            let hL = this.hMap[gZ_slope * (tSeg + 1) + Math.max(0, gX_slope - 1)] || y;
            let hR = this.hMap[gZ_slope * (tSeg + 1) + Math.min(tSeg, gX_slope + 1)] || y;
            let hU = this.hMap[Math.max(0, gZ_slope - 1) * (tSeg + 1) + gX_slope] || y;
            let hD = this.hMap[Math.min(tSeg, gZ_slope + 1) * (tSeg + 1) + gX_slope] || y;
            let slope = Math.max(Math.abs(hL - hR), Math.abs(hU - hD)); // 計算最大高差代表坡度

            if (y < -9) {
                // 河床過渡：越深的水底顏色越呈現深沉的青墨色
                let depth = Math.max(0, Math.min(1.0, (-9 - y) / 15));
                c.setRGB(0.05 + depth * 0.05, 0.20 - depth * 0.1, 0.25 - depth * 0.1); 
            } else {
                // 植被與地質生態層次分明：平原 ➔ 森林 ➔ 高山岩石 ➔ 山頂雪線
                if (nH < 0.28) {
                    let t = nH / 0.28;
                    c.setHSL(0.33 - t * 0.06, 0.45 - t * 0.15, 0.18 + t * 0.10);
                } else if (nH < 0.65) {
                    let t = (nH - 0.28) / 0.37;
                    c.setHSL(0.27 - t * 0.15, 0.30 - t * 0.20, 0.28 + t * 0.12);
                } else if (nH < 0.88) {
                    let t = (nH - 0.65) / 0.23;
                    c.setHSL(0.10, 0.15 - t * 0.10, 0.40 + t * 0.10);
                } else {
                    let t = (nH - 0.88) / 0.12;
                    c.setHSL(0.6, 0.05, 0.50 + t * 0.45);
                }

                 // 若坡度過陡 (大於 2.5)，植被無法附著，強制渲染為裸露風化岩石 (廉貞煞氣特徵)
                if (slope > 2.5) {
                    let rockFactor = Math.min(1.0, (slope - 2.5) / 3.0);
                    let rockColor = new THREE.Color();
                    rockColor.setHSL(0.08, 0.15, 0.35 + colorNoise); // 灰褐色岩盤
                    c.lerp(rockColor, rockFactor);
                }

                // 【新增：穴土五色材質渲染】動態跟隨不同穴形的 Z 軸中心著色
                let dynTaijiZ_visual = (state.xue === 'wo') ? -5.0 : (state.xue === 'ru' ? 12.0 : (state.xue === 'qian' ? 0.0 : 5.0));
                let inTaijiVisual = (state.xia && Math.abs(x) < 20 && z > (dynTaijiZ_visual - 10) && z < (dynTaijiZ_visual + 13));
                
                if (inTaijiVisual && slope < 1.0 && y > -2) {
                    let soilCenterFactor = Math.exp(-(x*x + Math.pow(z - dynTaijiZ_visual, 2))/100);
                    if (state.soil === 'wuse') {
                        // 五色土：呈現紫紅、暖黃交織的祥瑞生機
                        let wuseColor = new THREE.Color();
                        wuseColor.setHSL(0.08 + colorNoise * 0.4, 0.65, 0.45); 
                        c.lerp(wuseColor, soilCenterFactor * 0.85);
                    } else if (state.soil === 'yuni') {
                        // 淤泥：呈現死氣沉沉、潮濕腐敗的黑灰色
                        let yuniColor = new THREE.Color();
                        yuniColor.setHSL(0.0, 0.0, 0.15);
                        c.lerp(yuniColor, soilCenterFactor * 0.95);
                    } else if (state.soil === 'wanshi') {
                        // 頑石：呈現蒼白反光、毫無生氣的死硬岩盤
                        let wanshiColor = new THREE.Color();
                        wanshiColor.setHSL(0.1, 0.05, 0.65);
                        c.lerp(wanshiColor, soilCenterFactor * 0.95);
                    }
                }
            }
            cols.push(c.r, c.g, c.b);
        }
        // 根據水法吉凶動態調整水體視覺材質（吉水清澈呈翡翠碧波，凶水渾濁呈泥黃血煞）
        if (this.waterMesh) {
            let isBadWater = ['gejiao', 'lintou', 'fan', 'bazi', 'ji'].includes(state.w);
            if (isBadWater) {
                this.waterMesh.material.color.setHex(0x6b4a31); // 更具土石流質感的泥黃煞水
                this.waterMesh.material.opacity = 0.98;
                this.waterMesh.material.roughness = 0.9; // 完全粗糙，無光澤
                this.waterMesh.material.metalness = 0.0;
            } else {
                this.waterMesh.material.color.setHex(0x0a91a1); // 提亮為明亮清透的翡翠琉璃藍
                this.waterMesh.material.opacity = 0.75; // 提高透明度，透出下方加深顏色的河床
                this.waterMesh.material.roughness = 0.02; // 極致光滑，形成強烈的高光反射
                this.waterMesh.material.metalness = 0.65; // 高金屬度讓水面波光粼粼
            }
        }

        this.terrainGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(cols), 3));
        this.terrainGeo.computeVertexNormals(); this.terrainGeo.attributes.position.needsUpdate = true;
        
        // 【優化：動態生成植被 (Dynamic Vegetation)】
        // 根據地形坡度與高度，自動在平緩的陽坡或明堂周圍生長防風林
        if (this.treeMesh) {
            let treeCount = 0;
            const dummy = new THREE.Object3D();
            for (let i = 0; i < pos.length; i += 3) {
                let x = pos[i], y = pos[i+1], z = pos[i+2];
                
                // 只在特定高度 (平原到淺山腰，不生長於深水或太高的寒冷山頂)
                if (y > -1 && y < 28) {
                    let ny = this.terrainGeo.attributes.normal.array[i+1];
                    
                    // ny 越接近 1 代表地勢越平坦。只在坡度平緩且隨機機率下生成樹木
                    if (ny > 0.88 && Math.random() < 0.07 && treeCount < 3000) {
                        dummy.position.set(x, y, z);
                        // 隨機縮放與旋轉，打破規律增加自然感
                        let scale = 0.5 + Math.random() * 0.8;
                        dummy.scale.set(scale, scale + Math.random() * 0.5, scale);
                        dummy.rotation.y = Math.random() * Math.PI;
                        dummy.updateMatrix();
                        this.treeMesh.setMatrixAt(treeCount, dummy.matrix);
                        treeCount++;
                    }
                }
            }
            this.treeMesh.count = treeCount; // 只渲染實際生成的數量
            this.treeMesh.instanceMatrix.needsUpdate = true;
        }
    },

    getTerrainY(x, z) {
        let gX = (x+CONFIG.tSize/2)/(CONFIG.tSize/CONFIG.tSeg), gZ = (z+CONFIG.tSize/2)/(CONFIG.tSize/CONFIG.tSeg);
        // 修復：Clamp 邊界邊緣索引，防止頂格點擊或粒子到達地圖邊緣時誤判定出界
        if(gX < 0 || gX > CONFIG.tSeg || gZ < 0 || gZ > CONFIG.tSeg) return {y:-100, nx:0, nz:0};
        let x0 = Math.min(CONFIG.tSeg - 1, Math.max(0, Math.floor(gX))), x1 = Math.min(CONFIG.tSeg, x0 + 1);
        let z0 = Math.min(CONFIG.tSeg - 1, Math.max(0, Math.floor(gZ))), z1 = Math.min(CONFIG.tSeg, z0 + 1);
        let h00 = this.hMap[z0*(CONFIG.tSeg+1)+x0]||0, h10 = this.hMap[z0*(CONFIG.tSeg+1)+x1]||0, h01 = this.hMap[z1*(CONFIG.tSeg+1)+x0]||0, h11 = this.hMap[z1*(CONFIG.tSeg+1)+x1]||0;
        let tx = gX-x0, tz = gZ-z0;
        let nx = (h00*(1-tz) + h01*tz) - (h10*(1-tz) + h11*tz);
        let nz = (h00*(1-tx) + h10*tx) - (h01*(1-tx) + h11*tx);
        return { 
            y: (h00*(1-tx)+h10*tx)*(1-tz) + (h01*(1-tx)+h11*tx)*tz, 
            nx: nx, 
            nz: nz 
        };
    },

    shockwavesThisFrame: 0, // 新增：單幀震波計數器
    createShockwave(x, y, z, color) {
        if (this.shockwavesThisFrame > 2) return; // 新增：每幀最多只允許產生 3 個震波，保護效能
        this.shockwavesThisFrame++;

        const mat = new THREE.MeshBasicMaterial({color: color, transparent: true, opacity: 1, side: THREE.DoubleSide});
        const mesh = new THREE.Mesh(this.swGeo, mat); mesh.position.set(x, y+1, z);
        this.swGroup.add(mesh);
        AppState.shockwaves.push({mesh: mesh, life: 1.0});

        if (AppState.shockwaves.length > CONFIG.maxShockwaves) {
            let sw = AppState.shockwaves.shift();
            this.swGroup.remove(sw.mesh);
            sw.mesh.material.dispose();
        }
    }
};

/* ==========================================
   5. PHYSICS & PARTICLES
   ========================================== */
const Physics = {
    pCount: CONFIG.pCount,
    pPos: new Float32Array(CONFIG.pCount * 3),
    pCol: new Float32Array(CONFIG.pCount * 3),
    pVel: [],
    pState: new Uint8Array(CONFIG.pCount),
    pLife: new Float32Array(CONFIG.pCount),
    pGeom: new THREE.BufferGeometry(),
    pSys: null,
    
    // 【優化：新增全域氣場熱力網格與最佳穴眼座標】
    qiGrid: new Float32Array(64 * 64),
    windGridX: new Float32Array(64 * 64),      // 新增：CFD 橫向風場網格
    windGridZ: new Float32Array(64 * 64),      // 新增：CFD 縱向風場網格
    windGridX_next: new Float32Array(64 * 64), // 新增：CFD 雙緩衝區 (Double Buffering)
    windGridZ_next: new Float32Array(64 * 64), // 新增：CFD 雙緩衝區 (Double Buffering)
    bestLairPos: new THREE.Vector3(0, 0, 0),

    init() {
        for(let i=0; i<this.pCount; i++) this.pVel.push(new THREE.Vector3(0,0,0));
        this.pGeom.setAttribute('position', new THREE.BufferAttribute(this.pPos, 3));
        this.pGeom.setAttribute('color', new THREE.BufferAttribute(this.pCol, 3));

        // 優化粒子：加強中心發光，邊緣更通透柔和，縮小總體尺寸避免拉近破圖
        const c1 = document.createElement('canvas'); c1.width = 64; c1.height = 64;
        const ctx1 = c1.getContext('2d');
        const g1 = ctx1.createRadialGradient(32,32,0,32,32,32);
        g1.addColorStop(0, 'rgba(255,255,255,1.0)');
        g1.addColorStop(0.2, 'rgba(255,255,255,0.8)');
        g1.addColorStop(0.6, 'rgba(255,255,255,0.1)');
        g1.addColorStop(1, 'rgba(255,255,255,0)');
        ctx1.fillStyle = g1; ctx1.fillRect(0,0,64,64);
        const pTex = new THREE.CanvasTexture(c1);

        // 新增：將粒子的速度傳入 GPU，用於動態拉絲計算
        this.pGeom.setAttribute('velocity', new THREE.BufferAttribute(new Float32Array(CONFIG.pCount * 3), 3));

        // 【維度一：流體物理】將單調的點狀粒子升級為「絲絹流體 (Velocity-Aligned Streaks)」 Shader
        const pMat = new THREE.ShaderMaterial({
            uniforms: {
                pointTexture: { value: pTex }
            },
            vertexShader: `
                attribute vec3 color;
                attribute vec3 velocity;
                varying vec3 vColor;
                varying vec2 vVel;
                varying float vSpeed;
                void main() {
                    vColor = color;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    
                    // 將 3D 速度投影到 2D 螢幕空間
                    vec4 targetPos = modelViewMatrix * vec4(position + velocity * 0.15, 1.0);
                    vVel = (projectionMatrix * targetPos).xy / (projectionMatrix * targetPos).w - gl_Position.xy / gl_Position.w;
                    vSpeed = length(velocity);
                    
                    // 根據速度動態放大粒子，為拉長變形預留像素空間
                    gl_PointSize = (60.0 / -mvPosition.z) * (1.0 + vSpeed * 0.25);
                }
            `,
            fragmentShader: `
                uniform sampler2D pointTexture;
                varying vec3 vColor;
                varying vec2 vVel;
                varying float vSpeed;
                void main() {
                    vec2 uv = gl_PointCoord - 0.5;
                    
                    // 計算螢幕空間的流體旋轉角度
                    float angle = atan(vVel.y, vVel.x);
                    float s = sin(-angle);
                    float c = cos(-angle);
                    mat2 rot = mat2(c, -s, s, c);
                    
                    vec2 rotatedUV = rot * uv;
                    
                    // 根據流速進行 X 軸 (前進方向) 的拉絲形變 (Motion Blur 視覺化)
                    float stretch = max(1.0, vSpeed * 1.5);
                    rotatedUV.x /= stretch; 
                    rotatedUV += 0.5;
                    
                    // 剔除變形出界的像素
                    if (rotatedUV.x < 0.0 || rotatedUV.x > 1.0 || rotatedUV.y < 0.0 || rotatedUV.y > 1.0) discard;
                    
                    vec4 texColor = texture2D(pointTexture, rotatedUV);
                    // 根據速度降低透明度，速度越快越透，形成煙霧感
                    gl_FragColor = vec4(vColor, texColor.a * clamp(1.2 - vSpeed*0.1, 0.2, 0.9));
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending, // 改回 Additive 讓重疊的真氣產生極亮太極暈
            depthWrite: false, depthTest: true
        });
        this.pSys = new THREE.Points(this.pGeom, pMat);
        Engine3D.scene.add(this.pSys);

        this.resetParticles();
    },

    resetParticles() {
        const state = AppState.current;
        for(let i=0; i<this.pCount; i++) {
            this.pPos[i*3] = (Math.random()-0.5)*60;

            // 尋龍點穴：發脈沿著地表/骨脈內部湧出，而非從天而降
            if(state.d === 'pingyang') {
                // 【修復】：改為動態讀取平洋地形高度，防止粒子在切換時從地底瞬間彈出
                let tz = -100 - Math.random()*50;
                let tx = (Math.random()-0.5)*40;
                let ty = Engine3D.getTerrainY(tx, tz).y;
                this.pPos[i*3] = tx;
                this.pPos[i*3+1] = ty - 2 + Math.random()*4; 
                this.pPos[i*3+2] = tz;
            } else {
                // 【進化：太祖山勢能起點】若有太祖山，發脈起點推至極遠高空 (z: -160 ~ -120)
                let tzStart = state.zutai ? -160 : -120; 
                let tz = tzStart + Math.random()*40;
                let tx = (Math.random()-0.5)*20;
                if(state.d === 'huilong') tx += Math.sin(Math.max(0,-tz)*0.02)*50;
                let ty = Engine3D.getTerrainY(tx, tz).y;
                this.pPos[i*3] = tx;
                this.pPos[i*3+1] = ty - 2 + Math.random()*4; // 氣從山脊內部與表面滲透湧出
                this.pPos[i*3+2] = tz;
            }

            this.pVel[i].set((Math.random()-0.5)*0.5, 0, state.d === 'pingyang' ? 1.0 : 3.0);
            if(state.d === 'si') {
                this.pState[i] = 0;
                this.pCol[i*3]=0.45; this.pCol[i*3+1]=0.45; this.pCol[i*3+2]=0.40; // 死龍氣盡枯槁灰暗色
            } else if((state.d === 'po' || state.d === 'huan') && Math.random() < 0.35) {
                this.pState[i] = 3; // 破龍/緩龍 35% 出生即為洩氣
                this.pCol[i*3]=0.2; this.pCol[i*3+1]=0.4; this.pCol[i*3+2]=0.7; // 淺色模式：加深散氣的藍色
                this.pVel[i].set((Math.random()-0.5)*3.0, 0, 1.0);
            } else {
                this.pState[i] = 0;
                this.pCol[i*3]=0.8; this.pCol[i*3+1]=0.55; this.pCol[i*3+2]=0.1; // 淺色模式：加深生氣的琥珀金
            }
            this.pLife[i] = 100 + Math.random() * 500;
        }
        this.pGeom.attributes.position.needsUpdate = true;
        this.pGeom.attributes.color.needsUpdate = true;
    },
	update(dt) {
        if(dt === 0) return;
        AppState.frames++;
        let state = AppState.current;

        let rType = 4;
        if(state.w === 'you') rType = 0;
        else if(state.w === 'jiuqu') rType = 1;
        else if(state.w === 'fan') rType = 2;
        else if(state.w === 'bazi') rType = 3;
        else if(state.w === 'lintou') rType = 5; // 修復：補上淋頭水對應的著色器編號 5，啟動瀑布傾瀉特效

        if (Engine3D.waterMesh.material.userData.shader) {
            // 【修復】：讓水面著色器的波浪流動速度，完美與物理 UI 滑桿連動！
            let visualWVel = state.waterVel || 1.0;
            Engine3D.waterMesh.material.userData.shader.uniforms.time.value = AppState.frames * 0.05 * visualWVel;
            Engine3D.waterMesh.material.userData.shader.uniforms.riverType.value = rType;
        }
        if (Engine3D.treeMesh && Engine3D.treeMesh.material.userData.shader) {
            Engine3D.treeMesh.material.userData.shader.uniforms.time.value = AppState.frames * 0.05;
        }

        let baseWind = state.wind * 0.015;
        let capLimit = Rules.getCapacityLimit();
        let frameGather = 0, frameScatter = 0;
        
        // 【新增：進階流體觀測儀表計數器】
        let frameCoanda = 0, frameDowndraft = 0, frameVenturi = 0, frameBounce = 0;

        // 【新增：Grid-based CFD 網格流體求解器 (Navier-Stokes 近似)】
        if (Math.abs(baseWind) > 0.001) {
            for (let gz = 1; gz < 63; gz++) {
                for (let gx = 1; gx < 63; gx++) {
                    let idx = gz * 64 + gx;
                    let worldX = (gx / 64) * 200 - 100;
                    let worldZ = (gz / 64) * 200 - 100;
                    let t = Engine3D.getTerrainY(worldX, worldZ);
                    
                    // 1. 地形邊界阻擋 (No-slip boundary 近似) 與風源注入
                    if (t.y > -2) { 
                        this.windGridX[idx] *= 0.5; // 高山阻擋風流
                        this.windGridZ[idx] *= 0.5;
                    } else { 
                        this.windGridX[idx] += (baseWind - this.windGridX[idx]) * 0.08 * dt;
                        this.windGridZ[idx] += (Math.sin(worldX * 0.05 + AppState.frames * 0.02) * Math.abs(baseWind) * 0.5 - this.windGridZ[idx]) * 0.08 * dt;
                    }
                    
                    // 2. 擴散與壓力鬆弛 (Jacobi Iteration)
                    let avgX = (this.windGridX[idx-1] + this.windGridX[idx+1] + this.windGridX[idx-64] + this.windGridX[idx+64]) * 0.25;
                    let avgZ = (this.windGridZ[idx-1] + this.windGridZ[idx+1] + this.windGridZ[idx-64] + this.windGridZ[idx+64]) * 0.25;
                    
                    // 3. 旋度計算 (Vorticity Curl) -> 產生背風面卡門渦街氣旋
                    let curl = (this.windGridZ[idx+1] - this.windGridZ[idx-1]) - (this.windGridX[idx+64] - this.windGridX[idx-64]);
                    
                    this.windGridX_next[idx] = avgX + curl * 0.25 * dt * Math.sign(avgZ);
                    this.windGridZ_next[idx] = avgZ - curl * 0.25 * dt * Math.sign(avgX);
                    // 新增：CFD 數值穩定鎖，防止風場無限增長導致湍流爆炸
                    this.windGridX_next[idx] = Math.max(-5.0, Math.min(5.0, this.windGridX_next[idx]));
                    this.windGridZ_next[idx] = Math.max(-5.0, Math.min(5.0, this.windGridZ_next[idx]));
                }
            }
            // Swap Buffers
            let tmpX = this.windGridX; this.windGridX = this.windGridX_next; this.windGridX_next = tmpX;
            let tmpZ = this.windGridZ; this.windGridZ = this.windGridZ_next; this.windGridZ_next = tmpZ;
        }

        // 【湧現物理】觀測儀歸零
        let sensorCount = 0;
        let envParticleCount = 0; // 新增：游離環境粒子計數
        let sumVelX = 0, sumVelY = 0, sumVelZ = 0; // 新增 Y 軸平均
        let sumSpeedSq = 0;
        let waterDragCount = 0;
        let sumWaterDrag = 0;

        let speedMod = 1.0;
        if(state.d === 'si') speedMod = 0.5;
        if(state.d === 'ji') speedMod = 1.5;

        for(let i=AppState.shockwaves.length-1; i>=0; i--) {
            let sw = AppState.shockwaves[i];
            sw.life -= 0.02 * dt;
            sw.mesh.scale.set(1 + (1-sw.life)*10, 1 + (1-sw.life)*10, 1);
            sw.mesh.material.opacity = sw.life;
            if(sw.life <= 0) {
                Engine3D.swGroup.remove(sw.mesh);
                sw.mesh.material.dispose();
                AppState.shockwaves.splice(i, 1);
            }
        }

        if(state.vHeat && AppState.frames % 4 === 0) {
            Engine3D.hCtx.fillStyle = 'rgba(0,0,0,0.05)';
            Engine3D.hCtx.fillRect(0, 0, 256, 256);
        }

        // 清理無效的探頭煞斜率計算(Dead Code)，節省每幀兩次的地形高度探測效能
        let globalMultCache = Rules.getGlobalMultiplier(); 

        for(let i=0; i<this.pCount; i++) {
            let x = this.pPos[i*3], y = this.pPos[i*3+1], z = this.pPos[i*3+2];
            let vel = this.pVel[i]; let st = this.pState[i];

            // 【湧現物理】感測器空間採樣
            let dynamicTaijiZ_sensor = (state.xue === 'wo') ? -5.0 : (state.xue === 'ru' ? 12.0 : (state.xue === 'qian' ? 0.0 : 5.0));
            let dxSensor = x - 0;
            let dzSensor = z - dynamicTaijiZ_sensor;
            let distToSensorSq = dxSensor*dxSensor + dzSensor*dzSensor;
            
            if (distToSensorSq < 400 && y > -8 && y < 20) {
                sensorCount++;
                if (st !== 2) { // 修復 1：排除已完美結成太極暈的吉氣 (st===2)，只計算環境游離風煞，避免太極旋渦被誤判為亂流
                    envParticleCount++;
                    sumVelX += vel.x; sumVelY += vel.y; sumVelZ += vel.z; // 納入 Y 軸
                    sumSpeedSq += vel.lengthSq();
                }
            }
            // 修正 4：水力感測器應依據格局地形給予動態深水閥值。
            // 平洋龍陸地為 -2.0，水面為 -3.0，必須將感測線下放至 -2.5 才能排除陸地上的誤判。
            // 修正：迴龍顧祖格局的割腳水位於 z=30 附近，但感測器範圍僅 z>15 && z<60，且需 y<waterSensorLevel，
            // 但粒子可能因地形或風場未進入該區域，導致 waterDrag 為 0。放寬感測範圍並加入地形判斷。
            let waterSensorLevel = (state.d === 'pingyang') ? -2.5 : -5.0;
            let isNearWater = (state.w !== 'none' || state.yue);
            if (isNearWater && z > 10 && z < 70 && Math.abs(x) < 50 && y < waterSensorLevel && vel.y < -0.3) {
                waterDragCount++;
                sumWaterDrag += Math.abs(vel.y);
            }

            vel.y -= 0.025 * dt;
            vel.x += (Math.random()-0.5)*0.1*dt; vel.z += (Math.random()-0.5)*0.1*dt;

            if(AppState.obstacles.length > 0) {
                if (st === 0 || st === 2) {
                    for(let obs of AppState.obstacles) {
                        let dxObs = x - obs.mesh.position.x;
                        let dzObs = z - obs.mesh.position.z;
                        let distObsSq = dxObs*dxObs + dzObs*dzObs;
                        if(distObsSq < 36.0 && y < obs.mesh.position.y + 5.0) {
                            let dObs = Math.max(0.1, Math.sqrt(distObsSq));
                            this.pState[i] = 1; 
                            vel.x = (dxObs / dObs) * 4.5;
                            vel.z = (dzObs / dObs) * 4.5;
                            vel.y += 2.0;
                            this.pCol[i*3]=1.0; this.pCol[i*3+1]=0.2; this.pCol[i*3+2]=0.1;
                            if (st === 2) Engine3D.createShockwave(x, y, z, 0xff0000);
                            break;
                        }
                    }
                }
            }

            // 【修復】將煞氣連環感染邏輯移出，讓地形湧現的風煞與探頭暗箭皆能摧毀吉氣
            if (st === 1) {
                if (Math.random() < 0.25 * dt) {
                    let sampleIdx = Math.floor(i + 7) % this.pCount;
                    if (this.pState[sampleIdx] === 2) {
                        let rx = x - this.pPos[sampleIdx*3];
                        let rz = z - this.pPos[sampleIdx*3+2];
                        if (rx*rx + rz*rz < 144.0) { 
                            this.pState[sampleIdx] = 1; 
                            this.pCol[sampleIdx*3] = 1.0; this.pCol[sampleIdx*3+1] = 0.15; this.pCol[sampleIdx*3+2] = 0.1;
                            this.pVel[sampleIdx].x += (Math.random()-0.5) * 4.0;
                            this.pVel[sampleIdx].z += (Math.random()-0.5) * 4.0;
                            Engine3D.createShockwave(this.pPos[sampleIdx*3], this.pPos[sampleIdx*3+1], this.pPos[sampleIdx*3+2], 0xff2222);
                        }
                    }
                }
            }

            let t = Engine3D.getTerrainY(x, z);
            let waterLevel = (state.d === 'pingyang') ? -3.0 : -10.0;
            let isWater = ((state.w !== 'none' || state.yue) && t.y <= waterLevel + 0.5);

            // 【湧現物理】2. 網格地形向量流體場 
            // 升級：從 CFD 網格中採樣真實流體風速 (包含卡門渦街與背風面氣旋)
            let sampleX = Math.max(0, Math.min(63, Math.floor((x + 100) / 200 * 64)));
            let sampleZ = Math.max(0, Math.min(63, Math.floor((z + 100) / 200 * 64)));
            let gridIdx = sampleZ * 64 + sampleX;
            
            let globalWindX = this.windGridX[gridIdx] || baseWind;
            let globalWindZ = this.windGridZ[gridIdx] || 0;

            let localWindX = globalWindX;
            let localWindZ = globalWindZ;
            let localTurbulence = 0;

            // 修正 4：大一統物理系統無風漏洞。形煞地貌(如天斬、凹風)必伴隨自然熱力學山谷風。
            // 必須給予基礎氣流(0.03)，否則當系統設定無風(baseWind=0)時，所有形煞會完全失效失去懲罰力。
            let thermalDraft = Math.max(0.03, Math.abs(baseWind)); 

            // 實體湧現：探頭煞 (Tantou) 造成的越過案山的下洗氣流 (Downdraft) 與暗流
            if (state.tantou && state.an && z > 10 && z < 70 && Math.abs(x) < 30) {
                localWindZ -= thermalDraft * 3.5; 
                localTurbulence += thermalDraft * 1.5;
            }

            // 【物理湧現補全】天斬煞與凹風煞的真實流體力學：狹管切風與冷風灌穴
            if (state.tianzhan && Math.abs(x) < 15 && z > -35 && z < 15) {
                localWindZ += thermalDraft * 6.5; // 冷風乘勢直灌
                localTurbulence += thermalDraft * 2.5;
            }
            if (state.ao && Math.abs(x) < 25 && z > -15 && z < 25) {
                localWindX += Math.sign(x) * -thermalDraft * 3.0; // 缺口寒風倒灌
                localTurbulence += thermalDraft * 2.0;
            }

            // 【物理湧現補全】青龍逼壓與白虎抬頭的物理湧現：山體過度逼近導致流體擠壓與氣旋亂流
            if (state.ml === 'ya' && x < -5 && x > -25 && z > -10 && z < 40) {
                localWindX += 3.5; localTurbulence += 1.5;
            }
            if (state.mr === 'tai' && x > 5 && x < 25 && z > -10 && z < 40) {
                localWindX -= 3.5; localTurbulence += 1.5;
            }
            
            // 【新增：射肋煞 (Arrow Sha)】尖銳山脊引發的噴射氣流 (Jet Stream) 切割太極
            if (state.sherui && Math.abs(x) < 30 && z > -15 && z < 25) {
                localWindX += Math.sign(x) * -thermalDraft * 15.0; // 極速橫向切風
                localTurbulence += thermalDraft * 5.0;
            }
            
            // 【新增：破碎煞 (Broken Face)】山體崩塌裸露，引發近地背風亂流
            if (state.posui && Math.abs(x) > 15 && z > -20 && z < 40) {
                localTurbulence += 3.5; 
            }

            // 修復 3：效能優化，僅在真正有風時才執行昂貴的上下游地形高度探測，省下每幀數萬次無效計算
            if (Math.abs(baseWind) > 0.01) {
                let scanD = 15;
                let hLeft = Engine3D.getTerrainY(x - scanD, z).y;
                let hRight = Engine3D.getTerrainY(x + scanD, z).y;
                let windUpstreamH = (globalWindX > 0) ? hLeft : hRight;

                // 修復：必須有風才會引發亂流，且加入嚴格的寬度限制，保護明堂盆地
                let isCanyon = (Math.abs(x) < 15 && hLeft > t.y + 12 && hRight > t.y + 12);
                if (isCanyon) {
                    let compression = ((hLeft - t.y) + (hRight - t.y)) * 0.02;
                    let pinchForce = Math.abs(globalWindX) * compression * 1.2; 
                    localWindX *= 0.2; 
                    localWindZ += pinchForce * Math.sign(z - 5); 
                    localTurbulence += pinchForce * 0.3;
                } 
                
                if (windUpstreamH < t.y - 3 && t.y > -5) {
                    let funnelSpeed = Math.abs(globalWindX) * 1.5;
                    localWindX += Math.sign(globalWindX) * funnelSpeed; 
                    localTurbulence += 0.5 * Math.abs(globalWindX);
                }

                if (windUpstreamH > y + 8) {
                    let drop = windUpstreamH - Math.max(t.y, y);
                    localWindX *= -0.1; 
                    localWindZ += (Math.random() - 0.5) * drop * 0.2 * Math.abs(globalWindX);
                    localTurbulence += drop * 0.1 * Math.abs(globalWindX);
                }
            }

            localWindX += t.nx * (Math.abs(globalWindX) * 0.8); 
            localWindZ += t.nz * (Math.abs(globalWindZ) * 0.8);

            vel.x += localWindX * dt;
            vel.z += localWindZ * dt;
            vel.y += (localTurbulence * (Math.random() - 0.5)) * dt; 

            // 修復：物理數學悖論！UI 風速全滿時，baseWind 平方僅約 0.028，
            // 永遠達不到 0.25 的門檻，導致一般強風形同虛設，完全無法吹散粒子。
            // 必須將門檻下修至 0.02，讓無地形保護的強風能正確發揮物理吹散作用。
            let speedSq = localWindX*localWindX + localWindZ*localWindZ;
            if (speedSq > 0.02 && st === 0 && Math.random() < speedSq * 2.5 * dt) {
                this.pState[i] = 3; 
                this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
            }

            if (localTurbulence > 0.3 && st !== 1 && Math.random() < localTurbulence * 0.5 * dt) {
                this.pState[i] = 1; 
                this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.15; this.pCol[i*3+2] = 0.1;
                if (Math.random() < 0.05) Engine3D.createShockwave(x, y, z, 0xff3333);
            }

            // 修復：枝龍分流不再瞬間殺死粒子，改為漸進式抽取生命，視覺更平滑
            if(state.fenzhi && z < -15) {
                let leftBranchH = Engine3D.getTerrainY(x - 8, z + 5).y;
                let rightBranchH = Engine3D.getTerrainY(x + 8, z + 5).y;
                let centerH = t.y;

                if (Math.abs(x) <= 10 && Math.random() < 0.02 * dt) {
                    let side = (Math.random() < 0.5) ? -1 : 1;
                    vel.x += side * 4.5 * dt; 
                    this.pState[i] = 3; 
                    this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                } else if (Math.abs(x) > 10 && (leftBranchH > centerH || rightBranchH > centerH)) {
                    // 修正：移除直接扣減生命值 (pLife) 導致的無限重生悖論。
                    // 改為賦予極強的橫向速度，並提高轉為散氣 (st=3) 的機率，讓粒子自然被物理拋出地圖。
                    vel.x += Math.sign(x) * 8.5 * dt; 
                    if (st === 0 && Math.random() < 0.25 * dt) {
                        this.pState[i] = 3; 
                        this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                    }
                }
            }

            let distToCenterSq = x*x + z*z;
            if (state.guiyao && z > -60 && z < 20) {
                // 修正 5：與評分系統同步，將緩龍(huan)從惡劣陣列剔除。緩龍得鬼曜為吉象，不應物理撕裂氣場。
                if (state.d === 'po' || state.d === 'si') {
                    vel.z -= 3.8 * dt; 
                    vel.y += 2.0 * dt; 
                    vel.x += (Math.random() - 0.5) * 3.5 * dt;
                    if((st === 0 || st === 2) && Math.random() < 0.12 * dt) {
                        this.pState[i] = 3; 
                        this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                    }
                } else {
                    vel.z += 2.8 * dt; 
                    vel.x += (0 - x) * 0.25 * dt; 
                    vel.x *= Math.pow(0.60, dt); 
                    if (st === 0 && Math.random() < 0.12 * dt) {
                        this.pState[i] = 2; 
                        this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.88; this.pCol[i*3+2] = 0.4;
                        Engine3D.createShockwave(x, y, z, 0xcc8800);
                    }
                }
            }

            let isInCaveZone = (z > -30 && z < 25 && Math.abs(x) < 35); 
            if (state.xia && isInCaveZone && y < 25) {
                // 修正 3：高山突穴忘了檢查「是否缺砂」。補上條件，僅在無青龍白虎護衛時才引爆粒子 (高山孤突煞)。
                let isHighMountainTu = (state.xue === 'tu' && state.d !== 'pingyang' && (state.ml === 'none' || state.mr === 'none'));
                let isWoodNoRu = (state.xing === 'mu' && state.xue !== 'ru' && state.xue !== 'qian'); 
                let isMetalWaterSha = (state.xue === 'tu' || state.xue === 'ru') && (state.xing === 'jin' || state.xing === 'shui' || state.xing === 'huo') && state.d !== 'pingyang';
                let isMuWoLeak = (state.xue === 'wo' && state.xing === 'mu');

                if (state.xing === 'huo') {
                    let hasWaterControl = state.yue || state.san || state.w === 'you' || state.w === 'jiuqu';
                    if (hasWaterControl) {
                        vel.y -= 1.2 * dt; 
                        vel.x *= Math.pow(0.70, dt);
                        vel.z *= Math.pow(0.70, dt);
                        if (Math.random() < 0.01 * dt) {
                            this.pState[i] = 1; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.15; this.pCol[i*3+2] = 0.05;
                        } else if (st === 1 || st === 0 || st === 3) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.9; this.pCol[i*3+2] = 0.6;
                        }
                    } else {
                        vel.x += (Math.sign(x + 0.01) * 3.5 + (Math.random() - 0.5) * 5.0) * dt;
                        vel.y += (3.0 + (Math.random() - 0.5) * 3.0) * dt; 
                        vel.z += (Math.random() - 0.5) * 4.0 * dt;
                        if (st !== 1) {
                            this.pState[i] = 1; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.15; this.pCol[i*3+2] = 0.05;
                            if (Math.random() < 0.1) Engine3D.createShockwave(x, y, z, 0xff5500); 
                        }
                    }
                } else if (isHighMountainTu) {
                    let tuPeakY = Engine3D.getTerrainY(x, z).y;
                    if (y > tuPeakY - 2.0) {
                        vel.y += 2.0 * dt; 
                        vel.x += Math.sign(x + 0.01) * 5.0 * dt; 
                        vel.z += 5.0 * dt;
                        if (st === 0 || st === 2) {
                            this.pState[i] = 1; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.2; this.pCol[i*3+2] = 0.1;
                        }
                    }
                } else if (isMetalWaterSha) {
                    vel.y -= 1.5 * dt; 
                    vel.z += 3.5 * dt; 
                    vel.x += (Math.random() - 0.5) * 2.5 * dt;
                    if (st === 0 || st === 2) {
                        this.pState[i] = 1; 
                        this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.05; this.pCol[i*3+2] = 0.05;
                        if (Math.random() < 0.1) Engine3D.createShockwave(x, y, z, 0xff1111);
                    }
                } else if (isMuWoLeak) {
                    vel.y += 1.5 * dt; 
                    vel.x += Math.sign(x + 0.01) * 2.5 * dt; 
                    vel.z += 2.5 * dt; 
                    if (st === 0 || st === 2) {
                        this.pState[i] = 3; 
                        this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                    }
                } else if (isWoodNoRu) {
                    vel.z += 6.5 * dt; 
                    vel.y -= 1.2 * dt; 
                    vel.x *= Math.pow(0.5, dt); 
                    if(st === 0 || st === 2) {
                        this.pState[i] = 3; 
                        this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                    }
                } else {
                    if(state.xue === 'wo' || state.xue === 'qian') {
                        let woSync = (state.xing === 'jin' || state.xing === 'shui') ? 1.8 : 1.0;
                        vel.x += t.nx * 1.2 * woSync * dt;
                        vel.z += t.nz * 1.2 * woSync * dt;
                        vel.x += (0 - x) * 0.08 * (woSync - 1.0) * dt;
                        vel.z += (-5 - z) * 0.08 * (woSync - 1.0) * dt;
                        vel.multiplyScalar(Math.pow(0.85, dt)); 
                        if (woSync > 1.0 && st === 0 && Math.random() < 0.15 * dt) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.95; this.pCol[i*3+2] = 0.6;
                        }
                    } else if ((state.xue === 'tu' || state.xue === 'ru') && state.d === 'pingyang') {
                        if (z > -20 && z < 20 && Math.abs(x) < 25) {
                            vel.multiplyScalar(Math.pow(0.15, dt)); 
                            vel.y -= 0.3 * dt; 
                            if (st === 0 || st === 3) {
                                this.pState[i] = 2; 
                                this.pCol[i*3] = 0.85; this.pCol[i*3+1] = 1.0; this.pCol[i*3+2] = 0.65;
                                Engine3D.createShockwave(x, y, z, 0x229944); 
                            }
                        }
                    } else if (state.xue === 'ru') {
                        let ruSync = (state.xing === 'mu' || state.xing === 'tu') ? 1.5 : 1.0;
                        vel.x += (0 - x) * 0.02 * ruSync * dt; 
                        vel.z += (10 - z) * 0.02 * ruSync * dt;
                        vel.multiplyScalar(Math.pow(0.95 - (ruSync - 1.0) * 0.05, dt)); 
                        
                        if (ruSync > 1.0 && st === 0 && Math.random() < 0.12 * dt) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.95; this.pCol[i*3+2] = 0.6;
                        }
                    }

                    if (state.xia && z >= -8 && z <= 12 && Math.abs(x) <= 12) {
                        vel.multiplyScalar(Math.pow(0.40, dt)); 
                        vel.y -= 0.2 * dt; 
                        if (st === 0) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.92; this.pCol[i*3+2] = 0.60;
                            if (Math.random() < 0.1) Engine3D.createShockwave(x, y, z, 0xcc9900);
                        }
                    }

                    if (state.xing === 'shui') {
                        vel.x += Math.sin(z * 0.1 + AppState.frames * 0.08) * 1.2 * dt;
                        vel.multiplyScalar(Math.pow(0.82, dt));
                    } else if (state.xing === 'jin') {
                        vel.x += (0 - x) * 0.08 * dt;
                        vel.multiplyScalar(Math.pow(0.78, dt));
                        vel.y -= 0.15 * dt;
                    } else if (state.xing === 'tu') {
                        vel.multiplyScalar(Math.pow(0.65, dt));
                        vel.y -= 0.4 * dt;
                    } else if (['jin', 'shui', 'tu'].includes(state.xing)) {
                        vel.multiplyScalar(Math.pow(0.75, dt));
                        vel.y -= 0.2 * dt;
                    }
                }
            }

            if (t.y > -100 && y <= t.y + 3.5) {
                y = t.y + 3.5;
                
                // 【進化：未剝換的極端彈跳 (廉貞煞氣)】
                // 粗惡未剝換的岩石地形法線極度不均勻，粒子落地不會平滑滑行，而是產生劇烈反彈與四散
                if (state.bohuan === 'no' && z < -10) {
                    if (vel.y < 0) {
                        frameBounce++; // 【探針：岩石剛體反彈】
                        vel.y = Math.abs(vel.y) * 0.85; // 劇烈向上反彈
                        vel.x += (Math.random() - 0.5) * 6.0; // 橫向嚴重散射
                        if (st === 0 && Math.random() < 0.2 * dt) {
                            this.pState[i] = 1; // 撞擊岩盤撕裂成紅煞
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.2; this.pCol[i*3+2] = 0.2;
                        }
                    }
                } else {
                    // 【修復】：正常地貌當粒子接觸地面時，平滑削弱向下的重力累積，使其貼地滑行
                    if (vel.y < 0) vel.y *= 0.5;
                }
                
                // 【修復核心】：賦予龍脈基本推進力，避免全數卡在後方
                if (z < 15) {
                    let pulse = (state.d === 'ji') ? 1.5 : (state.d === 'huan' ? 0.3 : 0.8);
                    
                    // 【進化：橈棹枝腳 (Branch Momentum)】利用側邊山脈導流與物理側漏
                    if (state.zhijiao === 'shun' && z < -20) {
                        pulse += 1.5; // 順水抱：如漏斗般將風與氣往前推送
                        vel.x += (0 - x) * 0.5 * dt; // 向中心擠壓導流
                    } else if (state.zhijiao === 'ni' && z < -20) {
                        pulse -= 1.8; // 逆水反：向後洩氣倒退
                        vel.x += Math.sign(x) * 1.5 * dt; // 氣流被反向分支向兩側抽離 (側漏退氣)
                        if (st === 2 && Math.random() < 0.1 * dt) this.pState[i] = 3; // 吉氣流失
                    }
                    
                    vel.z += pulse * dt;
                    if (state.d === 'huilong') {
                        let curveAngle = Math.max(0, Math.min(Math.PI, (z + 100) / 110 * Math.PI));
                        let targetX = Math.sin(curveAngle) * 65.0;
                        vel.x += (targetX - x) * 0.15 * dt; 
                    }
                }
                
                // 【湧現物理】3. 水文流體力學與伯努利抽吸效應
                 // 【修復】：加入粒子本身高度 (y) 的判斷，防止飛在空中的氣場被底下的河水異常吸走
                 let isWaterZone = ((state.w !== 'none' || state.yue) && t.y <= waterLevel + 1.5 && y <= waterLevel + 5.0); 

                // 修正 3：物理引擎盲區！即使沒有天然河流(w='none')，只要有人造半月池(yue)，
                // 池中就必須具備水的流體力學。否則半月池會變成沒有浮力的乾涸旱坑。
                if (isWaterZone) {
                    // 【大一統湧現】完全信任 Engine3D.buildTerrain 中設定的 flowTilt (河床重力梯度)
                    
                    // 【新增：水流速物理 (Water Velocity multiplier)】
                    let wVel = state.waterVel || 1.0;
                    let waterFlowX = t.nx * 25.0 * wVel;
                    let waterFlowZ = t.nz * 25.0 * wVel; 
                    
                    waterFlowX += Math.sign(x) * 0.5 * wVel; // 水體微流動性
                    waterFlowZ += 0.8 * wVel;

                    let waterSpeed = Math.sqrt(waterFlowX*waterFlowX + waterFlowZ*waterFlowZ);

                    // BUG 修正：waterFlowX 是未歸一化的速度向量(極端時極大)，直接乘 1.5 採樣會飛越山脈，必須歸一化為單位方向向量後再乘上固定探測步長
                    let dirX = (waterSpeed > 0) ? (waterFlowX / waterSpeed) : 0;
                    let dirZ = (waterSpeed > 0) ? (waterFlowZ / waterSpeed) : 0;
                    let downstreamH = Engine3D.getTerrainY(x + dirX * 5.0, z + dirZ * 5.0).y;
                    if (downstreamH > t.y + 3.0) {
                        waterFlowX *= -0.3; 
                        waterFlowZ *= -0.3;
                        waterSpeed *= 0.3; 
                        
                        if (z > 10 && z < 50 && st === 0 && Math.random() < 0.08 * dt) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.9; this.pCol[i*3+2] = 0.7;
                        }
                    }

                    // 修正 3：直沖水與割腳水極限速度僅約 6.3，門檻設 8.5 永遠不會觸發。
                    // 必須下修至 5.5，確保吉水安然無恙，而凶水能正確觸發毀滅性紅煞。
                    if (waterSpeed > 5.5) {
                        vel.y -= waterSpeed * 0.15 * dt; 
                        if (st === 0 || st === 2) {
                            if (Math.random() < waterSpeed * 0.02 * dt) {
                                this.pState[i] = 1; 
                                this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.15; this.pCol[i*3+2] = 0.05;
                                if (Math.random() < 0.05) Engine3D.createShockwave(x, y, z, 0xff1111);
                            }
                        }
                    }

                    if (waterSpeed < 4.5) {
                        vel.multiplyScalar(Math.pow(0.1, dt)); 

                        // 修正 3：平洋龍受限於河床安全鎖，上游最深僅能達 -3.5，
                        // 門檻必須放寬至 -3.4，否則粒子永遠無法觸發水聚天心。
                        let deepWaterThreshold = (state.d === 'pingyang') ? -3.4 : -15.0;
                        if (t.y < deepWaterThreshold) {
                            vel.x += t.nx * 2.5 * dt; 
                            vel.z += t.nz * 2.5 * dt;
                            vel.y -= 0.6 * dt; 
                            
                            if ((st === 0 || st === 1) && Math.random() < 0.15 * dt) {
                                this.pState[i] = 2; 
                                this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.9; this.pCol[i*3+2] = 0.7;
                                if (Math.random() < 0.05) Engine3D.createShockwave(x, y, z, 0xcc9900);
                            }
                        }
                    }

                    vel.x += waterFlowX * dt;
                    vel.z += waterFlowZ * dt;
                    
                } else { 
                    vel.x += t.nx * 0.6 * dt; 
                    vel.z += t.nz * 0.6 * dt; 

                    // 修正 1：物理引擎漏洞！平洋河床僅 -4.5 深，寫死 -16.5 會導致平洋龍免疫割腳抽吸。
                    // 應改為「相對地形落差」，只要前方突然下切超過特定深度，即觸發伯努利抽吸效應。
                    if (t.y > -12 && t.y < 8 && z > 15 && z < 60 && Math.abs(x) < 40) {
                        let cliffCheck = Engine3D.getTerrainY(x, z + 8); 
                        let dropThreshold = (state.d === 'pingyang') ? 2.0 : 8.0; 
                        if (t.y - cliffCheck.y > dropThreshold) { 
                            // 導入水流速倍率：水流越快，伯努利邊界層剝離的抽吸力越恐怖
                            let suctionForce = (t.y - cliffCheck.y) * 0.15 * (state.waterVel || 1.0); 
                            vel.z += suctionForce * dt; 
                            vel.y -= suctionForce * 0.8 * dt; 
                            
                            if (st === 2 && Math.random() < suctionForce * 0.05 * dt) {
                                this.pState[i] = 3; 
                                this.pCol[i*3] = 0.4; this.pCol[i*3+1] = 0.65; this.pCol[i*3+2] = 0.9;
                                if (Math.random() < 0.1) Engine3D.createShockwave(x, y, z, 0x1155cc);
                            }
                        }
                    }

                    // 【進化：康達效應 (Coandă Effect) 與 九星剝換】
                    let ruggedness = Math.sqrt(t.nx*t.nx + t.nz*t.nz);
                    let isSmoothStar = (state.xing === 'jin' || state.xing === 'tu') && state.bohuan === 'yes';
                    
                    if (isSmoothStar && y < t.y + 3.0 && z > -50 && z < 10) {
                        frameCoanda++; // 【探針：康達附著效應】
                        // 圓潤山體 (金星/土星) 且已剝換脫煞：引發康達效應，流體完美附著曲面，消除亂流
                        vel.y -= 2.5 * dt; // 產生負壓將粒子柔和吸附在地形表面
                        vel.x += (t.nx * 0.5 - vel.x) * 0.8 * dt; // 速度向量平滑對齊地形法線，防止彈跳
                        ruggedness *= 0.1; // 大幅免疫地表亂流
                    }

                    // 【大一統湧現】以「普遍地表亂流」取代硬編碼的破碎煞 (po)。
                    // 任何地表只要過於崎嶇 (地形法線變化極大，如遭受 this.pNoise 破壞的砂手)，就會引發近地亂流，撕裂氣場
                    if (ruggedness > 4.5 && st !== 1 && Math.random() < ruggedness * 0.02 * dt) {
                        this.pState[i] = 1; 
                        this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.15; this.pCol[i*3+2] = 0.05;
                        vel.x += (Math.random() - 0.5) * ruggedness * 1.5;
                        vel.y += ruggedness * 0.5;
                        vel.z += (Math.random() - 0.5) * ruggedness * 1.5;
                        if (Math.random() < 0.05) Engine3D.createShockwave(x, y, z, 0xff3333);
                    }

                    // 【湧現物理】4. 陸地地形屏障與微氣候 
                    let leftSand = Engine3D.getTerrainY(x - 25, z).y;
                    let rightSand = Engine3D.getTerrainY(x + 25, z).y;
                    let isLeftExposed = (leftSand < t.y + 3);
                    let isRightExposed = (rightSand < t.y + 3);

                    if (z > -15 && z < 50 && Math.abs(x) < 40) {
                        if (isLeftExposed && globalWindX > 0) vel.x += globalWindX * 1.5 * dt;
                        if (isRightExposed && globalWindX < 0) vel.x += globalWindX * 1.5 * dt;

                        if ((isLeftExposed || isRightExposed) && Math.abs(globalWindX) > 0.1 && st === 2) {
                            if (Math.random() < Math.abs(globalWindX) * 0.15 * dt) {
                                this.pState[i] = 3; 
                                this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                            }
                        }

                        if (!isLeftExposed && !isRightExposed) {
                            vel.x += (0 - x) * 0.05 * dt; 
                            vel.multiplyScalar(Math.pow(0.92, dt)); 
                        }

                        // 修復：將坡度亂流門檻調高至 6.0，避免正常坡道觸發斷崖逼壓炸成紅煞
                        if (Math.abs(t.nx) > 6.0) { 
                            vel.x -= Math.sign(t.nx) * 2.5 * dt; 
                            vel.y += 1.0 * dt; 
                            if (st !== 1 && Math.random() < Math.abs(t.nx) * 0.01 * dt) {
                                this.pState[i] = 1; 
                                this.pCol[i*3] = 0.9; this.pCol[i*3+1] = 0.2; this.pCol[i*3+2] = 0.2;
                                if (Math.random() < 0.02) Engine3D.createShockwave(x, y, z, 0xff2222);
                            }
                        }
                    }

                    let rearH = Engine3D.getTerrainY(x, z - 25).y;
                    let frontH = Engine3D.getTerrainY(x, z + 45).y; // 延伸探測距離，避免過早判定為空虛

                    // 【進化：起伏屈曲的動能阻尼 (Kinematic Damping)】
                    // 當粒子撞擊陡峭的側向山壁 (之玄屈曲轉彎處)，或正在上坡時，大幅消耗動能 (煞車抵銷煞氣)
                    if (z < -10) {
                        let isUphill = (vel.z > 0 && t.nz > 0.5); // 正在往上爬坡
                        let isHittingWall = (Math.abs(t.nx) > 1.5 && Math.sign(vel.x) === Math.sign(t.nx)); // 撞擊側壁
                        if (isUphill || isHittingWall) {
                            vel.multiplyScalar(Math.pow(0.5, dt)); // 動能急遽衰減
                        }
                    }

                    if (z > -10 && z < 40) {
                        if (rearH > y + 8) {
                            // 【進化：下洗氣流 (Downdraft / 壓穴)】父母山過高 (如主山比例 > 1.4)，風速極大化轉為下衝氣流
                            let steepness = rearH - (y + 8);
                            if (steepness > 15.0) { // 極端高低差，形成壓穴凶龍
                                frameDowndraft++; // 【探針：下洗氣流】
                                vel.y -= steepness * 0.6 * dt; // 狠狠砸向地面
                                vel.z += steepness * 0.4 * dt; // 往前衝散明堂
                                localTurbulence += steepness * 0.5;
                                if (st === 2 && Math.random() < steepness * 0.05 * dt) {
                                    this.pState[i] = 1; // 吉氣被下洗氣流砸成亂流紅煞
                                    this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.2; this.pCol[i*3+2] = 0.2;
                                    if (Math.random() < 0.05) Engine3D.createShockwave(x, y, z, 0xff0000);
                                }
                            } else {
                                vel.multiplyScalar(Math.pow(0.85, dt));
                                vel.y -= 0.3 * dt;
                            }
                        } else if (rearH < t.y - 2) {
                            vel.z += 2.5 * dt;
                            vel.y += 0.8 * dt;
                            if (st === 2 && Math.random() < 0.15 * dt) {
                                this.pState[i] = 3; 
                                this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                            }
                        }
                        
                        // 修復：正確判斷拒屍煞（地形向後方傾倒崖壁，法線極度異常 > 8.0）
                        let rearSlopeNormal = Engine3D.getTerrainY(x, z - 10).nz;
                        if (rearSlopeNormal > 8.0) { 
                            vel.z -= 2.5 * dt; 
                            vel.y += 1.8 * dt; 
                            if(st === 0 || st === 2) {
                                this.pState[i] = 1; 
                                this.pCol[i*3] = 0.9; this.pCol[i*3+1] = 0.15; this.pCol[i*3+2] = 0.15;
                            }
                        }
                    }

                    if (z > 20 && t.nz < -0.1 && vel.z > 0.1) {
                        let bounce = -t.nz * 3.5; 
                        vel.z -= bounce * dt; 
                        vel.y += bounce * 0.5 * dt; 
                        
                        if (st === 0 && Math.random() < 0.1 * dt) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.9; this.pCol[i*3+2] = 0.7;
                            if(Math.random() < 0.02) Engine3D.createShockwave(x, y, z, 0xcc9900);
                        }
                    }

                    if (z > 20 && z < 70 && frontH < t.y + 2 && vel.z > 0) {
                        vel.z += 1.5 * dt; 
                        if (st === 2 && Math.random() < 0.08 * dt) {
                            this.pState[i] = 3; 
                            this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                        }
                    }

                    if (z > -70 && z < -15) {
                        let widthLeft = Engine3D.getTerrainY(x - 12, z).y;
                        let widthRight = Engine3D.getTerrainY(x + 12, z).y;
                        if (widthLeft > t.y + 5 && widthRight > t.y + 5) {
                            // 實體湧現：束氣過峽的文丘里效應 (Venturi effect)
                            vel.x += (0 - x) * 0.8 * dt; // 向中線擠壓
                            
                            // 若兩側都有足夠高的護山（迎送砂），則完美層流化脫煞
                            if (widthLeft > t.y + 12 && widthRight > t.y + 12) {
                                frameVenturi++; // 【探針：文丘里層流】
                                vel.z += 3.5 * dt; // 峽管效應極速推進
                                vel.y *= Math.pow(0.6, dt); // 完美壓平上下起伏 (絕對層流)
                                if (st === 0 && Math.random() < 0.05 * dt) {
                                    this.pState[i] = 2; // 過峽脫煞化吉氣
                                    this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.9; this.pCol[i*3+2] = 0.6;
                                }
                            } else {
                                vel.z += 1.5 * dt; // 防護不足，僅有微弱推進力
                                // 【進化：峽風吹斷】缺乏迎送砂防護，側向網格風會直接吹散束氣處的高速真氣
                                if (Math.abs(globalWindX) > 0.3) {
                                    vel.x += globalWindX * 3.5 * dt; // 橫風直灌
                                    if (Math.random() < Math.abs(globalWindX) * 0.25 * dt) {
                                        this.pState[i] = 3; // 氣脈被吹斷，變為散氣
                                        this.pCol[i*3] = 0.4; this.pCol[i*3+1] = 0.5; this.pCol[i*3+2] = 0.8;
                                    }
                                }
                            }
                        }
                    }
                } 
            } else { 
                vel.multiplyScalar(Math.pow(0.98, dt));
                if (z > -50) {
                    let dzA = -125.0 - z, dxA = 0.0 - x;
                    let distA = Math.max(1.0, Math.sqrt(dxA * dxA + dzA * dzA));
                    vel.x += (dxA / distA) * 0.5 * dt;
                    vel.z += (dzA / distA) * 0.5 * dt;
                }
            }

            // 【湧現物理】5. 水口神獸關攔 (實體反向渦流取代空間傳送)
            let hasGuards = state.luo || state.hua || state.shixiang || state.qin;
            // 修正 2：將 Math.abs(x) > 30 改為 < 50，讓神獸的反向渦流能精準覆蓋整個中央河道，完美發揮關攔實效。
            if (hasGuards && z > 50 && z < 90 && Math.abs(x) < 50) {
                let guardStrength = (state.luo ? 0.4 : 0) + (state.hua ? 0.4 : 0) + (state.shixiang ? 0.8 : 0) + (state.qin ? 0.3 : 0);
                // 產生向明堂中心 (x:0, z:30) 的向心引力，模擬氣流被交鎖地形擋下並迴旋
                let dxToCenter = 0 - x;
                let dzToCenter = 30 - z;
                let distToCenter = Math.sqrt(dxToCenter*dxToCenter + dzToCenter*dzToCenter);
                if (distToCenter > 0) {
                    vel.x += (dxToCenter / distToCenter) * guardStrength * 3.5 * dt;
                    vel.z += (dzToCenter / distToCenter) * guardStrength * 3.5 * dt;
                    vel.multiplyScalar(Math.pow(0.85, dt)); // 強制減速挽留
                }
            }

            if(st === 1) {
                vel.x += (Math.random()-0.5)*0.8;
                vel.z += (Math.random()-0.5)*0.8;
            }

            vel.clampLength(0, 5);
            x += vel.x*dt; y += vel.y*dt; z += vel.z*dt;

            if(state.vHeat && AppState.frames % 4 === 0 && y > -8) {
                let hx = (x / 350 + 0.5) * 256; let hz = (z / 350 + 0.5) * 256;
                let mult = Rules.getGlobalMultiplier();

                let heatAlpha = (st === 2) ? 0.65 : (st === 1 ? 0.70 : 0.25);
                let heatSize = (st === 2) ? 6.0 : (st === 1 ? 7.0 : 3.0);

                if (mult < 0.2 || st === 1) {
                    Engine3D.hCtx.fillStyle = `rgba(255, 30, 30, ${heatAlpha})`;
                } else {
                    Engine3D.hCtx.fillStyle = `rgba(255, 180, 20, ${heatAlpha})`;
                }
                Engine3D.hCtx.fillRect(hx - heatSize/2, hz - heatSize/2, heatSize, heatSize);
            }

            let dynamicTaijiZ = 5.0;
            if (state.xue === 'wo') dynamicTaijiZ = -5.0; 
            else if (state.xue === 'ru') dynamicTaijiZ = 12.0; 
            else if (state.xue === 'qian') dynamicTaijiZ = 0.0;

            let dxTaiji = x - 0;
            let dzTaiji = z - dynamicTaijiZ;
            let inTaiji = (dxTaiji*dxTaiji + dzTaiji*dzTaiji < 320 && y > -8 && y < 15);
            // 【大一統湧現】移除對 lintou (淋頭) 與 qing (傾瀉) 的例外排除。
            // 太極暈的物理容器若存在 (state.taiji)，渦流潛力就存在。
            // 若犯淋頭水或傾瀉，粒子會被水流與重力自然扯出渦流範圍，無需使用腳本強行關閉。
            if (inTaiji && state.taiji) {
                let mult = globalMultCache;

                // 【新增：穴土五行屬性 (Soil Quality Physics)】
                if (state.soil === 'wanshi' && y < 2.0) {
                    // 頑石不生氣：地表堅硬如鐵，粒子觸底直接暴亂反彈
                    vel.y += 3.5 * dt; 
                    vel.x += (Math.random()-0.5) * 4.0 * dt;
                    vel.z += (Math.random()-0.5) * 4.0 * dt;
                    mult *= 0.6; 
                } else if (state.soil === 'yuni' && y < 1.0) {
                    // 淤泥爛肉：陰濕陷落，吸乾生氣壽命
                    vel.y -= 2.5 * dt; 
                    this.pLife[i] -= 3.0 * dt; // 壽命急遽流失
                    mult *= 0.5; 
                } else if (state.soil === 'wuse') {
                    // 五色土：土質潤澤堅實，完美緩衝，粒子安靜沉降
                    vel.multiplyScalar(Math.pow(0.85, dt));
                    this.pLife[i] += 1.5 * dt; // 延年益壽
                }

                if (st === 1 || vel.lengthSq() > 4.0 || mult < 0.3) {
                    frameScatter++;
                }

                if (mult < 0.45) {
                    let pushX = x === 0 ? (Math.random()-0.5) : x;
                    // 【修復】：將硬編碼的 (z-5) 改為動態太極中心距離 (dzTaiji)，修正爆發方向
                    let pushZ = dzTaiji === 0 ? (Math.random()-0.5) : dzTaiji;

                    // 移除 isDeadDragon，統一由全域加權 (mult) 低落導致的氣場崩潰取代
                    let explodeForce = (1.5 / Math.max(0.1, mult));
                    vel.x += Math.sign(pushX) * explodeForce * dt;
                    vel.z += Math.sign(pushZ) * explodeForce * dt;

                    // 若格局極度惡劣 (mult < 0.25)，渦流反轉為撕裂煞氣
                    if (mult < 0.25 && Math.random() < 0.15 * dt) {
                        this.pState[i] = 1; 
                        this.pCol[i*3] = 0.9; this.pCol[i*3+1] = 0.05; this.pCol[i*3+2] = 0.05;
                        if (Math.random() < 0.1) Engine3D.createShockwave(x, y, z, 0xaa0000); 
                    } else if (st !== 1) {
                        this.pState[i] = 3;
                        this.pCol[i*3] = 0.8; this.pCol[i*3+1] = 0.2; this.pCol[i*3+2] = 0.4;
                    }
                } else {
                    let touchedWater = isWater || ((state.w !== 'none' || state.yue) && y < waterLevel - 1.0);
                    
                    // 修正 5：修復「落水反增分」的嚴重風水悖論！
                    // 若粒子掉進水中 (如平洋龍被割腳水侵入太極)，代表財氣被水帶走。
                    if (touchedWater) {
                        frameScatter += 2; // 落水破氣，轉為凶兆
                        vel.y -= 0.5 * dt; // 加速沉沒
                        if (st === 2) {
                            this.pState[i] = 3; // 吉氣轉為散氣
                            this.pCol[i*3]=0.4; this.pCol[i*3+1]=0.65; this.pCol[i*3+2]=0.9;
                        }
                    } else {
                        frameGather++;
                        if (st === 2) frameGather += 2; // 只有安穩留在陸地上的吉氣，才給予聚氣加分
                    }
                    
                    let isYang = (i % 2 === 0);
                    let spiralDir = isYang ? 1.0 : -1.0; 

                    vel.x += ((-dzTaiji)*0.05 * spiralDir - dxTaiji*0.025*mult) * dt;
                    vel.z += ((dxTaiji)*0.05 * spiralDir - dzTaiji*0.025*mult) * dt;
                    vel.y += (isYang ? 0.35 : -0.25) * mult * dt;

                    // 【優化：Boids 生氣群集效應】讓吉氣如同魚群般具有生命力，互相吸引與對齊
                    if (st === 2 && Math.random() < 0.3) {
                        let cohesionX = 0, cohesionZ = 0;
                        let alignX = 0, alignZ = 0;
                        let neighborCount = 0;
                        
                        // 採樣附近 3 個粒子，計算質心與平均流向
                        for (let step = 1; step <= 3; step++) {
                            let sampleIdx = Math.floor(i + step * 17) % this.pCount;
                            if (this.pState[sampleIdx] === 2) {
                                let nx = this.pPos[sampleIdx*3];
                                let nz = this.pPos[sampleIdx*3+2];
                                let rx = x - nx;
                                let rz = z - nz;
                                let distSq = rx*rx + rz*rz;
                                
                                if (distSq > 0 && distSq < 36.0) { // 感知半徑
                                    cohesionX += nx; cohesionZ += nz;
                                    alignX += this.pVel[sampleIdx].x; alignZ += this.pVel[sampleIdx].z;
                                    neighborCount++;
                                }
                            }
                        }

                        if (neighborCount > 0) {
                            // 1. 凝聚力 (Cohesion)：向附近同伴的中心靠攏
                            cohesionX /= neighborCount; cohesionZ /= neighborCount;
                            vel.x += (cohesionX - x) * 0.8 * dt;
                            vel.z += (cohesionZ - z) * 0.8 * dt;
                            
                            // 2. 對齊力 (Alignment)：與同伴的流向保持一致
                            alignX /= neighborCount; alignZ /= neighborCount;
                            vel.x += (alignX - vel.x) * 0.4 * dt;
                            vel.z += (alignZ - vel.z) * 0.4 * dt;
                        }
                        
                        // 3. 尋龍趨化性 (Chemotaxis)：感應全域地氣網格，自動往能量梯度高處游動 (智能湧現)
                        let cx = Math.max(0, Math.min(63, Math.floor((x + 100) / 200 * 64)));
                        let cz = Math.max(0, Math.min(63, Math.floor((z + 100) / 200 * 64)));
                        let qiLeft = this.qiGrid[cz * 64 + Math.max(0, cx - 1)] || 0;
                        let qiRight = this.qiGrid[cz * 64 + Math.min(63, cx + 1)] || 0;
                        let qiUp = this.qiGrid[Math.max(0, cz - 1) * 64 + cx] || 0;
                        let qiDown = this.qiGrid[Math.min(63, cz + 1) * 64 + cx] || 0;
                        
                        let qiGradX = qiRight - qiLeft;
                        let qiGradZ = qiDown - qiUp;
                        vel.x += qiGradX * 1.5 * dt;
                        vel.z += qiGradZ * 1.5 * dt;
                    }

                    if (mult > 0.6 && Math.random() < 0.15) {
                        vel.y += 0.25 * mult * dt; 
                    } else {
                        vel.y *= Math.pow(0.8, dt); 
                    }

                    if (st === 0 && Math.random() < 0.1 * dt) {
                        this.pState[i]=2;
                        if (state.xing === 'jin') {
                            this.pCol[i*3]=0.5; this.pCol[i*3+1]=0.5; this.pCol[i*3+2]=0.6; // 金：淺色模式加深銀灰
                        } else if (state.xing === 'mu') {
                            this.pCol[i*3]=0.2; this.pCol[i*3+1]=0.6; this.pCol[i*3+2]=0.3; // 木：淺色模式加深翠綠
                        } else if (state.xing === 'shui') {
                            this.pCol[i*3]=0.1; this.pCol[i*3+1]=0.4; this.pCol[i*3+2]=0.8; // 水：淺色模式加深湛藍
                        } else if (state.xing === 'tu') {
                            this.pCol[i*3]=0.8; this.pCol[i*3+1]=0.5; this.pCol[i*3+2]=0.1; // 土：淺色模式加深赭黃
                        } else {
                            this.pCol[i*3]=0.8; this.pCol[i*3+1]=0.2; this.pCol[i*3+2]=0.4; // 火：淺色模式加深紫紅
                        }
                    }
                }
            }

            vel.clampLength(0, 5); // 強制限制速度，防止湧現物理異常導致感測器爆炸
            this.pLife[i] -= dt;

            let isStuck = (vel.lengthSq() < 0.005 && !inTaiji && !isWater);
            let isLifeExpired = (this.pLife[i] <= 0);
            let isBoundaryExceeded = (y < -35 || Math.abs(x) > 130 || z > 160 || z < -165 || isStuck || isLifeExpired);
            
            if (isBoundaryExceeded) {
                // 移除魔改腳本：不再使用空間傳送 (Teleport) 強制挽回飛出邊界的粒子
                // 粒子如果真的突破了神獸的地形屏障與上方的反向渦流場，就會真實流失 (破財)

                if(st === 1) frameScatter += 5;

                if(state.d === 'pingyang') {
                    z = -100 - Math.random()*50; x = (Math.random()-0.5)*40;
                    y = Engine3D.getTerrainY(x, z).y + Math.random()*3;
                    vel.set((Math.random()-0.5)*0.5, 0, 1.0);
                } else {
                    // 【進化：能量層級與繼承】出界回收的粒子，依據是否有太祖山，賦予不同的初始勢能與高度
                    z = (state.zutai ? -160 : -140) - Math.random()*20;
                    let normT = Math.max(0, Math.min(1.0, (z + 160) / 120.0));
                    let dragonCurveX = 0;
                    if(state.d === 'sheng') dragonCurveX = Math.sin(normT * Math.PI * 2.2) * 25.0;
                    else if(state.d === 'ji') dragonCurveX = Math.sin(normT * Math.PI * 4.0) * 8.0;
                    else if(state.d === 'huan') dragonCurveX = Math.sin(normT * Math.PI * 1.8) * 40.0;
                    else if(state.d === 'huilong') dragonCurveX = Math.sin(Math.max(0,-z)*0.02)*50.0;

                    x = dragonCurveX + (Math.random()-0.5)*15.0;
                    y = Engine3D.getTerrainY(x, z).y - 2 + Math.random()*4; 
                    
                    // 從太祖山落下的粒子，賦予極大的初始動能 (高空勢能轉換)
                    let initialThrust = state.zutai ? 6.5 : 3.0;
                    vel.set((Math.random()-0.5)*0.5, 0, initialThrust);
                }

                if(state.d === 'si') {
                    this.pState[i] = 0;
                    this.pCol[i*3]=0.45; this.pCol[i*3+1]=0.45; this.pCol[i*3+2]=0.40;
                } else if((state.d === 'po' || state.d === 'huan') && Math.random() < 0.35) {
                    this.pState[i] = 3; 
                    // 【修復】：統一回收粒子的散氣藍色，消除與初次生成時的嚴重色差
                    this.pCol[i*3]=0.2; this.pCol[i*3+1]=0.4; this.pCol[i*3+2]=0.7;
                } else {
                    this.pState[i] = 0;
                    // 【修復】：統一回收粒子的生氣琥珀金，防止模擬器運行幾秒後氣場突然變色
                    this.pCol[i*3]=0.8; this.pCol[i*3+1]=0.55; this.pCol[i*3+2]=0.1;
                }
                this.pLife[i] = 100 + Math.random() * 500; 
            }
            this.pPos[i*3]=x; this.pPos[i*3+1]=y; this.pPos[i*3+2]=z;
            
            // 同步更新流速供 GPU Shader 產生絲絹拉絲
            this.pGeom.attributes.velocity.setXYZ(i, vel.x, vel.y, vel.z);
        }

        this.pGeom.attributes.position.needsUpdate = true;
        this.pGeom.attributes.color.needsUpdate = true;
        this.pGeom.attributes.velocity.needsUpdate = true; // 新增：觸發 GPU 絲絹形變
        if(state.vHeat && AppState.frames % 4 === 0) Engine3D.heatTex.needsUpdate = true;

        Engine3D.windGroup.visible = state.vWind;
        if(state.vWind && AppState.frames % 2 === 0) {
            let time = AppState.frames * 0.05;
            Engine3D.windLines.forEach(w => {
                let ty = Engine3D.getTerrainY(w.bx, w.bz).y;
                w.line.position.y = ty > -5 ? ty + 3 : -100;
                let wf = baseWind;

                if(Math.abs(wf)>0.01) {
                    let sh = Engine3D.getTerrainY(w.bx - Math.sign(wf)*20, w.bz).y;
                    if(sh>ty) wf *= (1 - Math.min(1, (sh-ty)/15));
                }

                if (state.tianzhan && Math.abs(w.bx) < 20 && w.bz > -20 && w.bz < 20) wf *= 5.0;
                if (state.ao && Math.abs(w.bx) < 30 && w.bz > -10 && w.bz < 30) wf *= 2.5;

                let dyn = Math.sin(w.bx * 0.05 + time) * Math.cos(w.bz * 0.05 + time) * 0.5;
                let totalWind = wf + (dyn * Math.max(0.5, Math.abs(wf)));

                let pos = w.line.geometry.attributes.position.array;
                let endY = Engine3D.getTerrainY(w.bx + totalWind * 60, w.bz).y;
                pos[1] = ty > -5 ? ty + 3 : -100;
                pos[3] = w.bx + totalWind * 60;
                pos[4] = endY > -5 ? endY + 3 : -100;
                pos[5] = w.bz + Math.sin(w.bx * 0.1 + time * 1.5) * Math.abs(totalWind) * 15;
                w.line.geometry.attributes.position.needsUpdate = true;
            });
        }

        // 【湧現物理】統整觀測儀數據
        if (sensorCount > 0) {
            AppState.sensors.qiDensity = sensorCount / this.pCount;
        } else {
            AppState.sensors.qiDensity = 0;
        }

        if (envParticleCount > 0) {
            let avgVx = sumVelX / envParticleCount, avgVy = sumVelY / envParticleCount, avgVz = sumVelZ / envParticleCount;
            
            // 水平風速 (藏風指標) 依然用 2D XZ 平面計算
            AppState.sensors.windSpeed = Math.sqrt(avgVx*avgVx + avgVz*avgVz);
            
            // 亂流度 (Turbulence) 使用真正的 3D 變異數 (總平方平均 - 平均的平方)
            let avgSpeedSq = avgVx*avgVx + avgVy*avgVy + avgVz*avgVz;
            let variance = (sumSpeedSq / envParticleCount) - avgSpeedSq;
            AppState.sensors.turbulence = Math.min(20, Math.max(0, variance));
            
            // 修正：青龍逼壓與白虎抬頭的物理影響未反映在感測器上，導致風速與亂流度為0但分數極低。
            // 加入靜態煞氣的物理等效值，確保感測器數據與評分一致。
            if (state.ml === 'ya' || state.mr === 'tai') {
                AppState.sensors.turbulence += 2.5; // 逼壓與抬頭造成亂流，加強懲罰
                AppState.sensors.windSpeed += 0.8; // 擠壓氣流，加強懲罰
            }
            // 修正：擎拳煞(qingquan)也應反映在感測器上，避免物理異常被忽略
            if (state.qingquan) {
                AppState.sensors.turbulence += 2.0;
                AppState.sensors.windSpeed += 0.5;
            }
        } else {
            AppState.sensors.windSpeed = 0; AppState.sensors.turbulence = 0;
        }
        // 已移除過度強制的感測器等效值，交由粒子實際湧現與評分邏輯自然反映
        // 已移除：強制覆寫感測器數據會導致評分與物理矛盾，改由 CFD 與粒子湧現自然反映
        AppState.sensors.waterDrag = waterDragCount > 0 ? (sumWaterDrag / waterDragCount) : 0;

        // 【優化：全域氣場熱力網格 (Global Qi Heatmap & True Lair Finder)】
        // 取代單純的質心追蹤，改用 64x64 空間網格「長期累積」吉氣駐留時間，找出真正的絕對寶地
        let currentLairCount = 0;
        
        // 1. 網格自然衰減 (讓舊的氣場記憶慢慢消散，反應最新的地形改變)
        for (let j = 0; j < 4096; j++) this.qiGrid[j] *= Math.pow(0.98, dt);
        
        // 2. 累積吉氣駐留頻率
        for (let i = 0; i < this.pCount; i++) {
            if (this.pState[i] === 2) {
                let x = this.pPos[i*3], z = this.pPos[i*3+2];
                let gx = Math.floor((x + 100) / 200 * 64);
                let gz = Math.floor((z + 100) / 200 * 64);
                if (gx >= 0 && gx < 64 && gz >= 0 && gz < 64) {
                    this.qiGrid[gz * 64 + gx] += 1.0 * dt;
                }
                currentLairCount++;
            }
        }
        
        // 3. 找出歷史累積氣場最強的「正穴」網格點
        let maxQi = 0, bestIdx = -1;
        for (let j = 0; j < 4096; j++) {
            if (this.qiGrid[j] > maxQi) { maxQi = this.qiGrid[j]; bestIdx = j; }
        }
        
        if (Engine3D.lairMarker && bestIdx >= 0 && maxQi > 5.0) {
            let bgX = bestIdx % 64;
            let bgZ = Math.floor(bestIdx / 64);
            
            // 將網格索引轉回真實世界 3D 座標
            let targetX = (bgX / 64) * 200 - 100 + (200/128);
            let targetZ = (bgZ / 64) * 200 - 100 + (200/128);
            let targetY = Engine3D.getTerrainY(targetX, targetZ).y;
            
            // 極度平滑的插值移動，光柱會緩慢而堅定地鎖定風水寶地
            this.bestLairPos.x += (targetX - this.bestLairPos.x) * 0.03;
            this.bestLairPos.z += (targetZ - this.bestLairPos.z) * 0.03;
            this.bestLairPos.y = Engine3D.getTerrainY(this.bestLairPos.x, this.bestLairPos.z).y;
            
            Engine3D.lairMarker.position.copy(this.bestLairPos);
            
            let targetOpacity = Math.min(0.5, maxQi / 60.0); // 累積越多光越亮
            Engine3D.lairMarker.material.opacity += (targetOpacity - Engine3D.lairMarker.material.opacity) * 0.05;
        } else if (Engine3D.lairMarker) {
            Engine3D.lairMarker.material.opacity *= 0.9;
        }

        // 【優化：陰陽向背 (Yin-Yang Sun Exposure Sensor)】
        // 偵測正穴是否被周圍高山遮蔽陽光，計算陰陽平衡
        if (typeof AppState.sensors.sunlight === 'undefined') AppState.sensors.sunlight = 1.0;
        
        if (Engine3D.dirLight && Engine3D.lairMarker) {
            let sunDir = Engine3D.dirLight.position.clone().normalize();
            // 朝太陽方向檢查地形高度 (簡易光線追蹤 Raymarching)
            let checkDist = 35.0; 
            let checkX = this.bestLairPos.x + sunDir.x * checkDist;
            let checkZ = this.bestLairPos.z + sunDir.z * checkDist;
            let blockH = Engine3D.getTerrainY(checkX, checkZ).y;
            let sunRayH = this.bestLairPos.y + sunDir.y * checkDist;
            
            // 若太陽在水平線上，但光線被前方/側方山脈擋住，則視為陰煞
            let inShadow = (blockH > sunRayH);
            let currentSun = (inShadow || sunDir.y < 0) ? 0.0 : 1.0;
            
            // 平滑累積日照率 (模擬一整天的平均向陽度)
            AppState.sensors.sunlight += (currentSun - AppState.sensors.sunlight) * 0.02 * dt;
        }

        let globalMult = Rules.getGlobalMultiplier();
        let weightedCapLimit = Math.min(frameGather / 40, capLimit) * globalMult;
        AppState.gatherAcc += (weightedCapLimit - AppState.gatherAcc) * 0.05 * dt;
        AppState.scatterAcc += (frameScatter / 20 - AppState.scatterAcc) * 0.1 * dt;

        // 統整進階物理觀測數據 (轉換為百萬分點或百分比)
        AppState.sensors.coanda = (frameCoanda / this.pCount) * 100;
        AppState.sensors.downdraft = (frameDowndraft / this.pCount) * 100;
        AppState.sensors.venturi = (frameVenturi / this.pCount) * 100;
        AppState.sensors.bounce = (frameBounce / this.pCount) * 100;

        let sensorHtml = `
            <div style="color:#b98a2e; font-weight:bold; margin-bottom:4px; font-size: 13px;">[核心湧現觀測儀]</div>
            氣密度: ${(AppState.sensors.qiDensity*100).toFixed(1)}% | 亂流度: ${AppState.sensors.turbulence.toFixed(2)}<br>
            穴心風速: ${AppState.sensors.windSpeed.toFixed(2)} | 水力抽吸: ${AppState.sensors.waterDrag.toFixed(2)}<br>
            陰陽向陽度: ${(AppState.sensors.sunlight*100).toFixed(1)}%<br>
            <div style="margin-top:6px; padding-top:6px; border-top:1px dashed rgba(0,0,0,0.15); color:#3f6b52;">
                <b style="color:#22201c;">[進階空氣動力與剛體遙測]</b><br>
                康達附著率: ${AppState.sensors.coanda.toFixed(1)}% | 峽管層流率: ${AppState.sensors.venturi.toFixed(1)}%<br>
                壓穴下洗率: ${AppState.sensors.downdraft.toFixed(1)}% | 剛體反彈率: ${AppState.sensors.bounce.toFixed(1)}%
            </div>
        `;
        let sEl = document.getElementById('sensor-data');
        if(sEl) sEl.innerHTML = sensorHtml;

        document.getElementById('g-num').innerText = Math.round(AppState.gatherAcc);
        document.getElementById('g-fill').style.width = Math.min(100, AppState.gatherAcc) + '%';
        document.getElementById('s-num').innerText = Math.round(AppState.scatterAcc);
        document.getElementById('s-fill').style.width = Math.min(100, AppState.scatterAcc) + '%';
        document.getElementById('cap-fill').style.width = capLimit + '%';

        let rawScore = Rules.computeScores();
        if (!AppState.smoothedScores) AppState.smoothedScores = [...rawScore];

        const alpha = Math.min(1.0, 0.08 * dt);
        for (let k = 0; k < 5; k++) {
            AppState.smoothedScores[k] += (rawScore[k] - AppState.smoothedScores[k]) * alpha;
        }

        let smoothedScore = AppState.smoothedScores; 
        let mult = Rules.getGlobalMultiplier();
        let totalPForDyn = AppState.gatherAcc + AppState.scatterAcc;
        let dynRatioForDyn = totalPForDyn > 0 ? (AppState.gatherAcc / totalPForDyn) : 0.5;
        let dynMult = (totalPForDyn > 30 && !(AppState.sensors.qiDensity > 0.03 && AppState.sensors.windSpeed < 0.8)) ? Math.min(1.4, Math.max(0.2, dynRatioForDyn * 1.5)) : 1.0;
        let effScore = smoothedScore.map(s => Math.min(100, Math.max(0, Math.round(s * mult)))); 
        let vObj = Rules.getVerdictText(smoothedScore); 

        document.getElementById('v-rating').innerText = vObj.rating;
        document.getElementById('v-rating').style.color = vObj.color;
        document.getElementById('v-text').innerText = `有效：龍${effScore[0]} 穴${effScore[1]} 砂${effScore[2]} 水${effScore[3]} 向${effScore[4]} (基礎:${Math.round(rawScore[0])}/${Math.round(rawScore[1])}/${Math.round(rawScore[2])}/${Math.round(rawScore[3])}/${Math.round(rawScore[4])})\n\n${vObj.text}`;
    }
};

/* ==========================================
   6. MAIN LOOP
   ========================================== */
Engine3D.init();
Physics.init();
UI.init();

const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
	Engine3D.shockwavesThisFrame = 0;

    let delta = clock.getDelta();
    if (delta > 0.1) delta = 0.1;

    // 【修復：維持全天候明亮晴空白晝，避免時間流逝導致太陽落山而使畫面變暗】
    if (Engine3D.dirLight) {
        // 太陽固定於最佳高角度白晝日光位，勾勒清晰地貌陰影且絕不昏暗
        Engine3D.dirLight.position.set(70, 140, 60);
        Engine3D.dirLight.intensity = 1.3;
        Engine3D.dirLight.color.setHSL(0.1, 0.2, 0.98); // 白晝晴空陽光
        Engine3D.hemiLight.color.setHSL(0.6, 0.3, 0.85); // 晴空天藍漫射光
        Engine3D.hemiLight.intensity = 0.85;
    }

    // 【優化：無人機地形跟隨鏡頭防穿模 (Anti-Clipping Flight)】
    if (Engine3D.isTransitioning && Engine3D.targetCamPos) {
        // 水平與視角目標平滑插值
        Engine3D.camera.position.x += (Engine3D.targetCamPos.x - Engine3D.camera.position.x) * 0.06;
        Engine3D.camera.position.z += (Engine3D.targetCamPos.z - Engine3D.camera.position.z) * 0.06;
        Engine3D.controls.target.lerp(Engine3D.targetLookAt, 0.08);
        
        // 高度安全檢測雷達：確保飛行過程中不會撞山 (防穿模)
        let currentTerrainY = Engine3D.getTerrainY(Engine3D.camera.position.x, Engine3D.camera.position.z).y;
        let safeY = Math.max(Engine3D.targetCamPos.y, currentTerrainY + 15.0); // 至少與地面保持安全距離
        
        Engine3D.camera.position.y += (safeY - Engine3D.camera.position.y) * 0.08;

        if (Engine3D.camera.position.distanceTo(Engine3D.targetCamPos) < 1.5) {
            Engine3D.isTransitioning = false;
        }
    }

    let physDt = delta * 60 * parseFloat(AppState.current.time);
    Physics.update(physDt);

    UI.drawRadar(delta);

    Engine3D.controls.update();
    
    // 【維度三：地貌渲染】輸出帶有後期處理輝光的畫面
    if (Engine3D.composer) {
        Engine3D.composer.render();
    } else {
        Engine3D.renderer.render(Engine3D.scene, Engine3D.camera);
    }
}
animate();

</script>
