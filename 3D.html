                    localWindZ -= thermalDraft * 2.5;
                    localTurbulence += thermalDraft * 3.0;
                }
            }
            
            // 【新增：剪刀煞物理湧現】交叉口形成喇叭狀風洞，兩股煞氣匯聚直劈太極
            if (state.road === 'jiandao') {
                let leftDist = Math.abs(x + (z-15)*0.6) * 0.8;
                let rightDist = Math.abs(x - (z-15)*0.6) * 0.8;
                if (Math.min(leftDist, rightDist) < 6.0 && z > 0 && z < 100) {
                    localWindX += Math.sign(x) * -thermalDraft * 6.0; // 向交叉點擠壓的側切風
                    localWindZ -= thermalDraft * 7.5; // 雙倍風洞效應直吹穴場
                    localTurbulence += thermalDraft * 5.0;
                }
            }

            // 【物理湧現補全】青龍逼壓與白虎抬頭的物理湧現：山體過度逼近導致流體擠壓與氣旋亂流
            if (state.ml === 'ya' && x < -5 && x > -25 && z > -10 && z < 40) {
                localWindX += 3.5; localTurbulence += 1.5;
            }
            if (state.mr === 'tai' && x > 5 && x < 25 && z > -10 && z < 40) {
                localWindX -= 3.5; localTurbulence += 1.5;
            }
            
            // 【新增：射肋煞 (Arrow Sha)】尖銳山脊引發的噴射氣流 (Jet Stream) 切割太極
            if (state.sherui && Math.abs(x) < 30 && z > -15 && z < 25) {
                localWindX += Math.sign(x) * -thermalDraft * 15.0; // 極速橫向切風
                localTurbulence += thermalDraft * 5.0;
            }
            
            // 【新增：破碎煞 (Broken Face)】山體崩塌裸露，引發近地背風亂流
            if (state.posui && Math.abs(x) > 15 && z > -20 && z < 40) {
                localTurbulence += 3.5; 
            }

            // 修復 3：效能優化，僅在真正有風時才執行昂貴的上下游地形高度探測，省下每幀數萬次無效計算
            if (Math.abs(baseWind) > 0.01) {
                let scanD = 15;
                let hLeft = Engine3D.getTerrainY(x - scanD, z).y;
                let hRight = Engine3D.getTerrainY(x + scanD, z).y;
                let windUpstreamH = (globalWindX > 0) ? hLeft : hRight;

                // 修復：必須有風才會引發亂流，且加入嚴格的寬度限制，保護明堂盆地
                let isCanyon = (Math.abs(x) < 15 && hLeft > t.y + 12 && hRight > t.y + 12);
                if (isCanyon) {
                    let compression = ((hLeft - t.y) + (hRight - t.y)) * 0.02;
                    let pinchForce = Math.abs(globalWindX) * compression * 1.2; 
                    localWindX *= 0.2; 
                    localWindZ += pinchForce * Math.sign(z - 5); 
                    localTurbulence += pinchForce * 0.3;
                } 
                
                if (windUpstreamH < t.y - 3 && t.y > -5) {
                    let funnelSpeed = Math.abs(globalWindX) * 1.5;
                    localWindX += Math.sign(globalWindX) * funnelSpeed; 
                    localTurbulence += 0.5 * Math.abs(globalWindX);
                }

                if (windUpstreamH > y + 8) {
                    let drop = windUpstreamH - Math.max(t.y, y);
                    localWindX *= -0.1; 
                    localWindZ += (Math.random() - 0.5) * drop * 0.2 * Math.abs(globalWindX);
                    localTurbulence += drop * 0.1 * Math.abs(globalWindX);
                }
            }

            localWindX += t.nx * (Math.abs(globalWindX) * 0.8); 
            localWindZ += t.nz * (Math.abs(globalWindZ) * 0.8);

            vel.x += localWindX * dt;
            vel.z += localWindZ * dt;
            vel.y += (localTurbulence * (Math.random() - 0.5)) * dt; 

            // 修復：物理數學悖論！UI 風速全滿時，baseWind 平方僅約 0.028，
            // 永遠達不到 0.25 的門檻，導致一般強風形同虛設，完全無法吹散粒子。
            // 必須將門檻下修至 0.02，讓無地形保護的強風能正確發揮物理吹散作用。
            let speedSq = localWindX*localWindX + localWindZ*localWindZ;
            // 【太極暈防護罩】穴心周圍為藏風聚氣之地，風場與亂流不得干擾凝聚中的吉氣。
            // 修正：若存在致命形煞（路沖/鐮刀/天斬/凹風等），則太極暈不再提供免役，讓煞氣真實摧毀氣場。
            let distToTaijiShieldSq = dxTaiji*dxTaiji + dzTaiji*dzTaiji;
            let taijiShieldRadiusSq = (state.d === 'pingyang') ? 1000 : 320;
            let inTaijiShield = (distToTaijiShieldSq < taijiShieldRadiusSq && y > t.y - 5 && y < t.y + 15);
            // 修正：風速過大時，吉氣(st===2)也會被轉為散氣，避免形煞無法穿透聚氣區
            if (speedSq > 0.02 && (st === 0 || st === 2) && !(inTaijiShield && state.taiji && !hasDynamicFatalSha) && Math.random() < speedSq * 2.5 * dt) {
                this.pState[i] = 3; 
                this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
            }

            // 修正：門檻從 0.3 下修至 0.25，確保路沖等煞氣觸發的亂流能實際生效
            if (localTurbulence > 0.25 && st !== 1 && !(inTaijiShield && state.taiji && !hasDynamicFatalSha) && Math.random() < localTurbulence * 0.5 * dt) {
                this.pState[i] = 1; 
                this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.15; this.pCol[i*3+2] = 0.1;
                if (Math.random() < 0.05) Engine3D.createShockwave(x, y, z, 0xff3333);
            }

            // 修復：枝龍分流不再瞬間殺死粒子，改為漸進式抽取生命，視覺更平滑
            if(state.fenzhi && z < -15) {
                let leftBranchH = Engine3D.getTerrainY(x - 8, z + 5).y;
                let rightBranchH = Engine3D.getTerrainY(x + 8, z + 5).y;
                let centerH = t.y;

                if (Math.abs(x) <= 10 && Math.random() < 0.02 * dt) {
                    let side = (Math.random() < 0.5) ? -1 : 1;
                    vel.x += side * 4.5 * dt; 
                    this.pState[i] = 3; 
                    this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                } else if (Math.abs(x) > 10 && (leftBranchH > centerH || rightBranchH > centerH)) {
                    // 修正：移除直接扣減生命值 (pLife) 導致的無限重生悖論。
                    // 改為賦予極強的橫向速度，並提高轉為散氣 (st=3) 的機率，讓粒子自然被物理拋出地圖。
                    vel.x += Math.sign(x) * 8.5 * dt; 
                    if (st === 0 && Math.random() < 0.25 * dt) {
                        this.pState[i] = 3; 
                        this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                    }
                }
            }

            let distToCenterSq = x*x + z*z;
            if (state.guiyao && z > -60 && z < 20) {
                // 修正 5：與評分系統同步，將緩龍(huan)從惡劣陣列剔除。緩龍得鬼曜為吉象，不應物理撕裂氣場。
                if (state.d === 'po' || state.d === 'si') {
                    vel.z -= 3.8 * dt; 
                    vel.y += 2.0 * dt; 
                    vel.x += (Math.random() - 0.5) * 3.5 * dt;
                    if((st === 0 || st === 2) && Math.random() < 0.12 * dt) {
                        this.pState[i] = 3; 
                        this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                    }
                } else {
                    vel.z += 2.8 * dt; 
                    vel.x += (0 - x) * 0.25 * dt; 
                    vel.x *= Math.pow(0.60, dt); 
                    if (st === 0 && Math.random() < 0.12 * dt) {
                        this.pState[i] = 2; 
                        this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.88; this.pCol[i*3+2] = 0.4;
                        Engine3D.createShockwave(x, y, z, 0xcc8800);
                    }
                }
            }

            let isInCaveZone = (dzTaiji > -30 && dzTaiji < 25 && Math.abs(dxTaiji) < 35); 
            // 修正：死龍/破龍為絕地，不得有穴星聚氣機制，即使存在 xia 與穴形，也禁止任何吉氣轉化
            if (state.xia && state.d !== 'si' && state.d !== 'po' && isInCaveZone && y < t.y + 25) {
                // 修正 3：高山突穴忘了檢查「是否缺砂」。補上條件，僅在無青龍白虎護衛時才引爆粒子 (高山孤突煞)。
                let isHighMountainTu = (state.xue === 'tu' && state.d !== 'pingyang' && (state.ml === 'none' || state.mr === 'none'));
                let isWoodNoRu = (state.xing === 'mu' && state.xue !== 'ru' && state.xue !== 'qian'); 
                let isMetalWaterSha = (state.xue === 'tu' || state.xue === 'ru') && (state.xing === 'jin' || state.xing === 'shui' || state.xing === 'huo') && state.d !== 'pingyang';
                let isMuWoLeak = (state.xue === 'wo' && state.xing === 'mu');

                if (state.xing === 'huo') {
                    let hasWaterControl = state.yue || state.san || state.w === 'you' || state.w === 'jiuqu';
                    if (hasWaterControl) {
                        vel.y -= 1.2 * dt; 
                        vel.x *= Math.pow(0.70, dt);
                        vel.z *= Math.pow(0.70, dt);
                        if (Math.random() < 0.01 * dt) {
                            this.pState[i] = 1; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.15; this.pCol[i*3+2] = 0.05;
                        } else if (st === 1 || st === 0 || st === 3) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.9; this.pCol[i*3+2] = 0.6;
                        }
                    } else {
                        vel.x += (Math.sign(x + 0.01) * 3.5 + (Math.random() - 0.5) * 5.0) * dt;
                        vel.y += (3.0 + (Math.random() - 0.5) * 3.0) * dt; 
                        vel.z += (Math.random() - 0.5) * 4.0 * dt;
                        if (st !== 1) {
                            this.pState[i] = 1; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.15; this.pCol[i*3+2] = 0.05;
                            if (Math.random() < 0.1) Engine3D.createShockwave(x, y, z, 0xff5500); 
                        }
                    }
                } else if (isHighMountainTu) {
                    let tuPeakY = Engine3D.getTerrainY(x, z).y;
                    if (y > tuPeakY - 2.0) {
                        vel.y += 2.0 * dt; 
                        vel.x += Math.sign(x + 0.01) * 5.0 * dt; 
                        vel.z += 5.0 * dt;
                        if (st === 0 || st === 2) {
                            this.pState[i] = 1; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.2; this.pCol[i*3+2] = 0.1;
                        }
                    }
                } else if (isMetalWaterSha) {
                    vel.y -= 1.5 * dt; 
                    vel.z += 3.5 * dt; 
                    vel.x += (Math.random() - 0.5) * 2.5 * dt;
                    if (st === 0 || st === 2) {
                        this.pState[i] = 1; 
                        this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.05; this.pCol[i*3+2] = 0.05;
                        if (Math.random() < 0.1) Engine3D.createShockwave(x, y, z, 0xff1111);
                    }
                } else if (isMuWoLeak) {
                    vel.y += 1.5 * dt; 
                    vel.x += Math.sign(x + 0.01) * 2.5 * dt; 
                    vel.z += 2.5 * dt; 
                    if (st === 0 || st === 2) {
                        this.pState[i] = 3; 
                        this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                    }
                } else if (isWoodNoRu) {
                    vel.z += 6.5 * dt; 
                    vel.y -= 1.2 * dt; 
                    vel.x *= Math.pow(0.5, dt); 
                    if(st === 0 || st === 2) {
                        this.pState[i] = 3; 
                        this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                    }
                } else {
                    if(state.xue === 'wo' || state.xue === 'qian') {
                        let woSync = (state.xing === 'jin' || state.xing === 'shui') ? 1.8 : 1.0;
                        vel.x += t.nx * 1.2 * woSync * dt;
                        vel.z += t.nz * 1.2 * woSync * dt;
                        vel.x += (-dxTaiji) * 0.08 * (woSync - 1.0) * dt;
                        vel.z += (-dzTaiji) * 0.08 * (woSync - 1.0) * dt;
                        vel.multiplyScalar(Math.pow(0.85, dt)); 
                        if (woSync > 1.0 && st === 0 && Math.random() < 0.15 * dt) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.95; this.pCol[i*3+2] = 0.6;
                        }
                    } else if ((state.xue === 'tu' || state.xue === 'ru') && state.d === 'pingyang') {
                        if (dzTaiji > -20 && dzTaiji < 20 && Math.abs(dxTaiji) < 25) {
                            vel.multiplyScalar(Math.pow(0.15, dt)); 
                            vel.y -= 0.3 * dt; 
                            if (st === 0 || st === 3) {
                                this.pState[i] = 2; 
                                this.pCol[i*3] = 0.85; this.pCol[i*3+1] = 1.0; this.pCol[i*3+2] = 0.65;
                                Engine3D.createShockwave(x, y, z, 0x229944); 
                            }
                        }
                    } else if (state.xue === 'ru') {
                        let ruSync = (state.xing === 'mu' || state.xing === 'tu') ? 1.5 : 1.0;
                        vel.x += (-dxTaiji) * 0.02 * ruSync * dt; 
                        vel.z += (5 - dzTaiji) * 0.02 * ruSync * dt;
                        vel.multiplyScalar(Math.pow(0.95 - (ruSync - 1.0) * 0.05, dt)); 
                        
                        if (ruSync > 1.0 && st === 0 && Math.random() < 0.12 * dt) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.95; this.pCol[i*3+2] = 0.6;
                        }
                    } else if (state.xue === 'ping') {
                        // 坪穴：氣場舒緩，粒子平鋪慢流，在平坦棋盤上沉降
                        vel.multiplyScalar(Math.pow(0.85, dt));
                        vel.y -= 0.1 * dt;
                        vel.x += (Math.random() - 0.5) * 0.5 * dt;
                        vel.z += (Math.random() - 0.5) * 0.5 * dt;
                        if (st === 0 && Math.random() < 0.15 * dt) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.95; this.pCol[i*3+2] = 0.6;
                        }
                    } else if (state.xue === 'ya') {
                        // 崖穴：氣流急促，撞擊背後峭壁後形成強烈逆流旋渦駐留
                        vel.x += (-dxTaiji) * 0.05 * dt;
                        vel.z -= 5.0 * dt; // 貼壁逆流
                        vel.multiplyScalar(Math.pow(0.75, dt));
                        if (st === 0 && Math.random() < 0.2 * dt) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.95; this.pCol[i*3+2] = 0.6;
                        }
                    }

                    if (state.xia && state.xue !== 'none' && dzTaiji >= -8 && dzTaiji <= 12 && Math.abs(dxTaiji) <= 12) {
                        vel.multiplyScalar(Math.pow(0.40, dt)); 
                        vel.y -= 0.2 * dt; 
                        if (st === 0) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.92; this.pCol[i*3+2] = 0.60;
                            if (Math.random() < 0.1) Engine3D.createShockwave(x, y, z, 0xcc9900);
                        }
                    }

                    if (state.xing === 'shui') {
                        vel.x += Math.sin(z * 0.1 + AppState.frames * 0.08) * 1.2 * dt;
                        vel.multiplyScalar(Math.pow(0.82, dt));
                    } else if (state.xing === 'jin') {
                        vel.x += (-dxTaiji) * 0.08 * dt;
                        vel.multiplyScalar(Math.pow(0.78, dt));
                        vel.y -= 0.15 * dt;
                    } else if (state.xing === 'tu') {
                        vel.multiplyScalar(Math.pow(0.65, dt));
                        vel.y -= 0.4 * dt;
                    } else if (['jin', 'shui', 'tu'].includes(state.xing)) {
                        vel.multiplyScalar(Math.pow(0.75, dt));
                        vel.y -= 0.2 * dt;
                    }
                }
            }

            if (t.y > -100 && y <= t.y + 3.5) {
                
                // 【進化：地下水頭壓強 (Hydraulic Head & Phreatic Surface)】
                // 地下水位線動態分佈：高山水位深，平洋水位淺。
                let waterTable = (state.d === 'pingyang') ? -2.5 : Math.max(-10.0, -z * 0.08 - 4.0);
                let phreaticDepth = waterTable - t.y; // 地下水層與地表的距離
                
                // 當龍脈下行，地表接近地下水位時，水頭壓強將地氣「逼出地表」 (界水則止)
                if (phreaticDepth > -5.0 && phreaticDepth < 2.0) {
                    vel.y += (2.0 - phreaticDepth) * 1.5 * dt; // 潛水層上浮力 (Buoyancy)
                    if (st === 0 && Math.random() < 0.05 * dt) framePhreatic++; // 【探針：水壓結穴懸浮】
                } else if (phreaticDepth >= 2.0) {
                    vel.y -= phreaticDepth * 2.0 * dt; // 水壓過大，沖心洗穴 (凶)
                    if (st === 2) this.pState[i] = 3; 
                }

                // 【進化：高斯曲率與主應力張量斷裂 (Tensor Fracture)】
                // 計算鄰近地形的法線變化率 (近似曲率)
                let tLeft = Engine3D.getTerrainY(x - 2, z).nx;
                let tRight = Engine3D.getTerrainY(x + 2, z).nx;
                let gaussianCurvature = Math.abs(tLeft - tRight);
                
                if (gaussianCurvature > 1.2 && z < 0 && !(inTaijiShield && state.taiji && !hasDynamicFatalSha)) { // 曲率不連續，發生應力斷裂（太極暈內只在無致命形煞時免疫，避免完美局誤傷）
                    frameTensorFracture++; // 【探針：張力斷裂漏氣】
                    vel.x += Math.sign(t.nx) * gaussianCurvature * 5.0 * dt; // 氣脈從裂縫噴出側漏
                    vel.y -= 1.5 * dt; // 失去張力支撐，下墜
                    if (st === 2 && !(inTaijiShield && state.taiji && !hasDynamicFatalSha) && Math.random() < 0.1 * dt) this.pState[i] = 3;
                }

                y = t.y + 3.5;
                
                // 【進化：未剝換的極端彈跳 (廉貞煞氣)】
                // 粗惡未剝換的岩石地形法線極度不均勻，粒子落地不會平滑滑行，而是產生劇烈反彈與四散
                if (state.bohuan === 'no' && z < -10) {
                    if (vel.y < 0) {
                        frameBounce++; // 【探針：岩石剛體反彈】
                        vel.y = Math.abs(vel.y) * 0.85; // 劇烈向上反彈
                        vel.x += (Math.random() - 0.5) * 6.0; // 橫向嚴重散射
                        if (st === 0 && Math.random() < 0.2 * dt) {
                            this.pState[i] = 1; // 撞擊岩盤撕裂成紅煞
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.2; this.pCol[i*3+2] = 0.2;
                        }
                    }
                } else {
                    // 【修復】：正常地貌當粒子接觸地面時，平滑削弱向下的重力累積，使其貼地滑行
                    if (vel.y < 0) vel.y *= 0.5;
                }
                
                // 【修復核心】：賦予龍脈全域持續推進力，確保氣脈能穿越長距離抵達穴位
                if (z < 60) {
                    let pulse = (state.d === 'ji') ? 1.5 : (state.d === 'huan' ? 0.4 : (state.d === 'pingyang' ? 2.5 : 0.8));
                    // 距離衰減：離穴位越遠推力越強，靠近時減弱
                    let pullDist = Math.max(0, (lz - z));
                    let pullFactor = Math.min(1.0, pullDist / 100.0);
                    pulse *= (0.3 + pullFactor * 0.7);
                    // 【修正】若粒子已接近太極暈（半徑25），推進力應隨距離縮短而衰減，避免將粒子推出聚氣區
                    let taijiDistSqPulse = dxTaiji*dxTaiji + dzTaiji*dzTaiji;
                    if (taijiDistSqPulse < 625) {
                        let taijiDistPulse = Math.sqrt(taijiDistSqPulse);
                        pulse *= Math.max(0.05, (taijiDistPulse - 3) / 22); // 越靠近穴心推進力越低
                    }
                    
                    // 【進化：橈棹枝腳 (Branch Momentum)】利用側邊山脈導流與物理側漏
                    if (state.zhijiao === 'shun' && z < -20) {
                        pulse += 1.5; // 順水抱：如漏斗般將風與氣往前推送
                        vel.x += (0 - x) * 0.5 * dt; // 向中心擠壓導流
                    } else if (state.zhijiao === 'ni' && z < -20) {
                        pulse -= 1.8; // 逆水反：向後洩氣倒退
                        vel.x += Math.sign(x) * 1.5 * dt; // 氣流被反向分支向兩側抽離 (側漏退氣)
                        if (st === 2 && Math.random() < 0.1 * dt) this.pState[i] = 3; // 吉氣流失
                    }
                    
                    vel.z += pulse * dt;
                    if (state.d === 'huilong') {
                        // 【進化：螺旋渦流與動量倒灌 (Helical Vorticity & Momentum Inversion)】
                        // 計算 C 型山體迴旋內弧側的低壓中心點
                        let vortexCenterX = (state.manualXue ? state.xueX : 0);
                        let vortexCenterZ = (state.manualXue ? state.xueZ : 5.0);
                        let rx = x - vortexCenterX;
                        let rz = z - vortexCenterZ;
                        let rSq = rx*rx + rz*rz;
                        
                        if (rSq < 10000.0) { // 進入低壓渦旋陷阱區
                            frameHelicity++; // 【探針：螺旋倒灌】
                            // 流體力學叉積 (Cross Product) 產生旋轉向心力
                            let vortexForceX = -rz * 0.05;
                            let vortexForceZ = rx * 0.05;
                            // 伯努利低壓抽吸 (Bernoulli Suction)
                            let suction = 1500.0 / Math.max(10.0, rSq);
                            
                            vel.x += (vortexForceX - rx * suction) * dt;
                            vel.z += (vortexForceZ - rz * suction) * dt;
                            
                            // 修正：移除過度動量反轉，改為輕微導向，避免阻斷龍脈
                            if (z > -20 && vel.z > 0) vel.z -= 0.5 * dt; 
                        }
                    }
                }
                
                // 【湧現物理】3. 水文流體力學與伯努利抽吸效應
                 // 【修復】：加入粒子本身高度 (y) 的判斷，防止飛在空中的氣場被底下的河水異常吸走
                 let isWaterZone = ((state.w !== 'none' || state.yue) && t.y <= waterLevel + 1.5 && y <= waterLevel + 5.0); 

                // 修正 3：物理引擎盲區！即使沒有天然河流(w='none')，只要有人造半月池(yue)，
                // 池中就必須具備水的流體力學。否則半月池會變成沒有浮力的乾涸旱坑。
                if (isWaterZone) {
                    // 【大一統湧現】完全信任 Engine3D.buildTerrain 中設定的 flowTilt (河床重力梯度)
                    
                    // 【新增：水流速物理 (Water Velocity multiplier)】
                    let wVel = state.waterVel || 1.0;
                    let waterFlowX = t.nx * 25.0 * wVel;
                    let waterFlowZ = t.nz * 25.0 * wVel; 
                    
                    waterFlowX += Math.sign(x) * 0.5 * wVel; // 水體微流動性
                    waterFlowZ += 0.8 * wVel;

                    let waterSpeed = Math.sqrt(waterFlowX*waterFlowX + waterFlowZ*waterFlowZ);

                    // BUG 修正：waterFlowX 是未歸一化的速度向量(極端時極大)，直接乘 1.5 採樣會飛越山脈，必須歸一化為單位方向向量後再乘上固定探測步長
                    let dirX = (waterSpeed > 0) ? (waterFlowX / waterSpeed) : 0;
                    let dirZ = (waterSpeed > 0) ? (waterFlowZ / waterSpeed) : 0;
                    let downstreamH = Engine3D.getTerrainY(x + dirX * 5.0, z + dirZ * 5.0).y;
                    if (downstreamH > t.y + 3.0) {
                        waterFlowX *= -0.3; 
                        waterFlowZ *= -0.3;
                        waterSpeed *= 0.3; 
                        
                        if (z > 10 && z < 50 && st === 0 && Math.random() < 0.08 * dt) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.9; this.pCol[i*3+2] = 0.7;
                        }
                    }

                    // 【進化：彎道二次流與邊界層剝離 (Helicoidal Secondary Flow)】
                    // 根據水流速度與彎道曲率，計算垂直於主流方向的螺旋剪切力
                    let isOuterBank = (state.w === 'gejiao' || state.w === 'fan');
                    let isInnerBank = (state.w === 'you' || state.w === 'jiuqu');
                    
                    if (isOuterBank && Math.abs(x) < 30) {
                        frameBoundarySep++; // 【探針：邊界層剝離撕裂】
                        // 反弓/割腳 (凹岸)：強烈的下切二次流 (Downwelling Secondary Flow)
                        let helicoidalShear = waterSpeed * 0.45;
                        vel.z += Math.sign(z - t.y) * helicoidalShear * dt; // 將岸上粒子強制扯入河心
                        vel.y -= helicoidalShear * 0.8 * dt; // 垂直絞殺拖入深水
                        
                        if (st === 0 || st === 2) {
                            if (Math.random() < helicoidalShear * 0.15 * dt) {
                                this.pState[i] = 1; 
                                this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.15; this.pCol[i*3+2] = 0.05;
                                if (Math.random() < 0.05) Engine3D.createShockwave(x, y, z, 0xff1111);
                            }
                        }
                    } else if (isInnerBank && Math.abs(x) < 30) {
                        // 玉帶/九曲 (凸岸)：溫和的上升二次流 (Upwelling)，將水氣與生氣輕柔推上岸邊
                        let gentleUpwelling = waterSpeed * 0.15;
                        vel.z += (dzTaiji > 0 ? -1 : 1) * gentleUpwelling * dt; // 推向太極中心
                        vel.y += gentleUpwelling * 0.5 * dt; // 輕柔托舉
                    }

                    // 修正 3：直沖水與極端洪水的直線沖刷破壞
                    if (waterSpeed > 5.5 && state.w === 'ji') {
                        vel.y -= waterSpeed * 0.15 * dt; 
                        if (st === 0 || st === 2) {
                            if (Math.random() < waterSpeed * 0.02 * dt) {
                                this.pState[i] = 1; 
                                this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.15; this.pCol[i*3+2] = 0.05;
                            }
                        }
                    }

                    if (waterSpeed < 4.5) {
                        vel.multiplyScalar(Math.pow(0.1, dt)); 

                        // 修正 3：平洋龍受限於河床安全鎖，上游最深僅能達 -3.5，
                        // 門檻必須放寬至 -3.4，否則粒子永遠無法觸發水聚天心。
                        let deepWaterThreshold = (state.d === 'pingyang') ? -3.4 : -15.0;
                        if (t.y < deepWaterThreshold) {
                            vel.x += t.nx * 2.5 * dt; 
                            vel.z += t.nz * 2.5 * dt;
                            vel.y -= 0.6 * dt; 
                            
                            if ((st === 0 || st === 1) && Math.random() < 0.15 * dt) {
                                this.pState[i] = 2; 
                                this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.9; this.pCol[i*3+2] = 0.7;
                                if (Math.random() < 0.05) Engine3D.createShockwave(x, y, z, 0xcc9900);
                            }
                        }
                    }

                    vel.x += waterFlowX * dt;
                    vel.z += waterFlowZ * dt;
                    
                } else { 
                    vel.x += t.nx * 0.6 * dt; 
                    vel.z += t.nz * 0.6 * dt; 

                    // 修正 1：物理引擎漏洞！平洋河床僅 -4.5 深，寫死 -16.5 會導致平洋龍免疫割腳抽吸。
                    // 應改為「相對地形落差」，只要前方突然下切超過特定深度，即觸發伯努利抽吸效應。
                    // 【修復物理 BUG】：將絕對座標改為相對穴心的 dzTaiji，讓死亡抽吸力場完美跟隨動態河道移動
                    if (t.y > -12 && t.y < 8 && dzTaiji > 10 && dzTaiji < 55 && Math.abs(x) < 40) {
                        let cliffCheck = Engine3D.getTerrainY(x, z + 8); 
                        let dropThreshold = (state.d === 'pingyang') ? 2.0 : 8.0; 
                        if (t.y - cliffCheck.y > dropThreshold) { 
                            // 導入水流速倍率：水流越快，伯努利邊界層剝離的抽吸力越恐怖
                            let suctionForce = (t.y - cliffCheck.y) * 0.15 * (state.waterVel || 1.0); 
                            vel.z += suctionForce * dt; 
                            vel.y -= suctionForce * 0.8 * dt; 
                            
                            if (st === 2 && Math.random() < suctionForce * 0.05 * dt) {
                                this.pState[i] = 3; 
                                this.pCol[i*3] = 0.4; this.pCol[i*3+1] = 0.65; this.pCol[i*3+2] = 0.9;
                                if (Math.random() < 0.1) Engine3D.createShockwave(x, y, z, 0x1155cc);
                            }
                        }
                    }

                    // 【進化：熱力學斜坡風 (Diurnal Thermal Slope-Wind)】
                    // 利用太陽向量與地形法線的內積計算熱輻射吸收 (Solar Flux)
                    let sunVec = new THREE.Vector3(70, 140, 60).normalize();
                    let surfaceNormal = new THREE.Vector3(-t.nx, 1.0, -t.nz).normalize();
                    let solarFlux = surfaceNormal.dot(sunVec);
                    
                    if (Math.abs(x) < 40 && z > -20 && z < 40) {
                        // 陽坡受熱上升 (Updraft)，陰坡冷卻下沉 (Downdraft)
                        let thermalDeltaP = (solarFlux - 0.5) * 3.5; 
                        vel.y += thermalDeltaP * dt;
                        
                        // 若兩側護砂不對稱 (如逼壓 vs 無)，會引發單向橫切風，撕裂氣場腔室
                        let leftH = Engine3D.getTerrainY(x - 20, z).y;
                        let rightH = Engine3D.getTerrainY(x + 20, z).y;
                        if (Math.abs(leftH - rightH) > 10.0) {
                            frameThermalShear++; // 【探針：熱力學橫切風撕裂】
                            vel.x += Math.sign(rightH - leftH) * Math.abs(thermalDeltaP) * 1.5 * dt;
                            if (st === 2 && Math.random() < 0.05 * dt) this.pState[i] = 1; // 吉氣被熱切風吹散
                        }
                    }

                    // 【進化：傅立葉/小波變換的能譜衰減 (Wavelet Energy Cascade)】
                    let ruggedness = Math.sqrt(t.nx*t.nx + t.nz*t.nz);
                    
                    // 檢查穴星附近的高頻噪聲頻譜是否呈現指數級衰減 (Exponential Decay)
                    // 【修復物理 BUG】：將檢測區間與衰減中心點全面改為動態相對座標 (dzTaiji)，避免高山點穴時引發毀滅性的假亂流
                    if (dzTaiji > -15 && dzTaiji < 15 && Math.abs(x) < 25) {
                        let expectedDecay = Math.exp(-Math.pow(dzTaiji + 15, 2) / 50.0); // 理論應衰減至此
                        if (ruggedness > expectedDecay + 1.0) {
                            // 殘留高頻分量：煞氣未化，引發微觀量子態亂流 (Micro-turbulence)
                            frameWaveletSpike++; // 【探針：高頻煞氣未化】
                            vel.x += (Math.random() - 0.5) * ruggedness * 3.0 * dt;
                            vel.z += (Math.random() - 0.5) * ruggedness * 3.0 * dt;
                            if (st === 2 && Math.random() < ruggedness * 0.1 * dt) this.pState[i] = 1;
                        }
                    }

                    // 【進化：康達效應 (Coandă Effect) 與 九星剝換】
                    let isSmoothStar = (state.xing === 'jin' || state.xing === 'tu') && state.bohuan === 'yes';
                    
                    if (isSmoothStar && y < t.y + 6.0 && z > -50 && z < 10) {
                        frameCoanda++; // 【探針：康達附著效應】
                        // 圓潤山體 (金星/土星) 且已剝換脫煞：引發康達效應，流體完美附著曲面，消除亂流
                        vel.y -= 2.5 * dt; // 產生負壓將粒子柔和吸附在地形表面
                        vel.x += (t.nx * 0.5 - vel.x) * 0.8 * dt; // 速度向量平滑對齊地形法線，防止彈跳
                        ruggedness *= 0.1; // 大幅免疫地表亂流
                    }

                    // 【大一統湧現】以「普遍地表亂流」取代硬編碼的破碎煞 (po)。
                    // 任何地表只要過於崎嶇 (地形法線變化極大，如遭受 this.pNoise 破壞的砂手)，就會引發近地亂流，撕裂氣場
                    // 【修正】太極暈內的地形已有人工平整，不因微小 ruggedness 轉紅煞，避免完美局誤判散氣
                    if (ruggedness > 7.0 && st !== 1 && Math.random() < ruggedness * 0.01 * dt && !(inTaijiShield && state.taiji && !hasDynamicFatalSha)) {
                        this.pState[i] = 1; 
                        this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.15; this.pCol[i*3+2] = 0.05;
                        vel.x += (Math.random() - 0.5) * ruggedness * 1.5;
                        vel.y += ruggedness * 0.5;
                        vel.z += (Math.random() - 0.5) * ruggedness * 1.5;
                        if (Math.random() < 0.05) Engine3D.createShockwave(x, y, z, 0xff3333);
                    }

                    // 【湧現物理】4. 陸地地形屏障與微氣候 
                    let leftSand = Engine3D.getTerrainY(x - 25, z).y;
                    let rightSand = Engine3D.getTerrainY(x + 25, z).y;
                    let isLeftExposed = (leftSand < t.y + 3);
                    let isRightExposed = (rightSand < t.y + 3);

                    if (z > -15 && z < 50 && Math.abs(x) < 40) {
                        if (isLeftExposed && globalWindX > 0) vel.x += globalWindX * 1.5 * dt;
                        if (isRightExposed && globalWindX < 0) vel.x += globalWindX * 1.5 * dt;

                        if ((isLeftExposed || isRightExposed) && Math.abs(globalWindX) > 0.1 && st === 2) {
                            if (Math.random() < Math.abs(globalWindX) * 0.15 * dt) {
                                this.pState[i] = 3; 
                                this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                            }
                        }

                        if (!isLeftExposed && !isRightExposed) {
                            vel.x += (0 - x) * 0.05 * dt; 
                            vel.multiplyScalar(Math.pow(0.92, dt)); 
                        }

                        // 修復：將坡度亂流門檻調高至 6.0，避免正常坡道觸發斷崖逼壓炸成紅煞
                        if (Math.abs(t.nx) > 9.0) { 
                            // 【進化：量子力學 WKB 近似穿隧效應 (Quantum Tunneling of Qi)】
                            // 束氣過峽 (shu) 會使勢壘寬度極小化。計算穿透機率：
                            let barrierThickness = (state.shu || state.fengyao) ? 2.5 : 15.0; // 蜂腰束氣使山壁變薄
                            let tunnelingProb = Math.exp(-barrierThickness * 0.35) * dt;
                            
                            if (st === 0 && Math.random() < tunnelingProb) {
                                // 發生量子穿隧！粒子瞬間躍遷穿透山體，直接抵達太極暈中心，並化為極度精純的吉氣
                                this.pState[i] = 2;
                                this.pPos[i*3] = this.bestLairPos.x + (Math.random()-0.5)*5.0;
                                this.pPos[i*3+1] = this.bestLairPos.y + 2.0;
                                this.pPos[i*3+2] = this.bestLairPos.z + (Math.random()-0.5)*5.0;
                                this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.95; this.pCol[i*3+2] = 0.6;
                                Engine3D.createShockwave(this.pPos[i*3], this.pPos[i*3+1], this.pPos[i*3+2], 0xffffff); // 躍遷白光
                            } else {
                                // 穿隧失敗，發生古典剛體碰撞與煞氣撕裂
                                vel.x -= Math.sign(t.nx) * 2.5 * dt; 
                                vel.y += 1.0 * dt; 
                                if (st !== 1 && Math.random() < Math.abs(t.nx) * 0.005 * dt) {
                                    this.pState[i] = 1; 
                                    this.pCol[i*3] = 0.9; this.pCol[i*3+1] = 0.2; this.pCol[i*3+2] = 0.2;
                                    if (Math.random() < 0.02) Engine3D.createShockwave(x, y, z, 0xff2222);
                                }
                            }
                        }
                    }

                    let rearH = Engine3D.getTerrainY(x, z - 25).y;
                    let frontH = Engine3D.getTerrainY(x, z + 45).y; // 延伸探測距離，避免過早判定為空虛

                    // 【進化：起伏屈曲的動能阻尼 (Kinematic Damping)】
                    // 當粒子撞擊陡峭的側向山壁 (之玄屈曲轉彎處)，或正在上坡時，大幅消耗動能 (煞車抵銷煞氣)
                    if (z < -10) {
                        let isUphill = (vel.z > 0 && t.nz > 0.5); // 正在往上爬坡
                        let isHittingWall = (Math.abs(t.nx) > 1.5 && Math.sign(vel.x) === Math.sign(t.nx)); // 撞擊側壁
                        if (isUphill || isHittingWall) {
                            vel.multiplyScalar(Math.pow(0.5, dt)); // 動能急遽衰減
                        }
                    }

                    // 【修復物理 BUG】：將下洗氣流與拒屍煞的作用域改為相對於動態穴星的區間 (dzTaiji)，確保明堂永遠能正確受測
                    if (dzTaiji > -15 && dzTaiji < 35) {
                        if (rearH > y + 8) {
                            // 【進化：下洗氣流 (Downdraft / 壓穴)】父母山過高 (如主山比例 > 1.4)，風速極大化轉為下衝氣流
                            let steepness = rearH - (y + 8);
                            if (steepness > 15.0) { // 極端高低差，形成壓穴凶龍
                                frameDowndraft++; // 【探針：下洗氣流】
                                vel.y -= steepness * 0.6 * dt; // 狠狠砸向地面
                                vel.z += steepness * 0.4 * dt; // 往前衝散明堂
                                localTurbulence += steepness * 0.5;
                                if (st === 2 && Math.random() < steepness * 0.05 * dt) {
                                    this.pState[i] = 1; // 吉氣被下洗氣流砸成亂流紅煞
                                    this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.2; this.pCol[i*3+2] = 0.2;
                                    if (Math.random() < 0.05) Engine3D.createShockwave(x, y, z, 0xff0000);
                                }
                            } else {
                                vel.multiplyScalar(Math.pow(0.85, dt));
                                vel.y -= 0.3 * dt;
                            }
                        } else if (rearH < t.y - 2) {
                            vel.z += 2.5 * dt;
                            vel.y += 0.8 * dt;
                            if (st === 2 && Math.random() < 0.15 * dt) {
                                this.pState[i] = 3; 
                                this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                            }
                        }
                        
                        // 修復：正確判斷拒屍煞（地形向後方傾倒崖壁，法線極度異常 > 8.0）
                        let rearSlopeNormal = Engine3D.getTerrainY(x, z - 10).nz;
                        if (rearSlopeNormal > 8.0) { 
                            vel.z -= 2.5 * dt; 
                            vel.y += 1.8 * dt; 
                            if(st === 0 || st === 2) {
                                this.pState[i] = 1; 
                                this.pCol[i*3] = 0.9; this.pCol[i*3+1] = 0.15; this.pCol[i*3+2] = 0.15;
                            }
                        }
                    }

                    if (z > 20 && t.nz < -0.1 && vel.z > 0.1) {
                        let bounce = -t.nz * 3.5; 
                        vel.z -= bounce * dt; 
                        vel.y += bounce * 0.5 * dt; 
                        
                        if (st === 0 && Math.random() < 0.1 * dt) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.9; this.pCol[i*3+2] = 0.7;
                            if(Math.random() < 0.02) Engine3D.createShockwave(x, y, z, 0xcc9900);
                        }
                    }

                    if (z > 20 && z < 70 && frontH < t.y + 2 && vel.z > 0) {
                        vel.z += 1.5 * dt; 
                        if (st === 2 && Math.random() < 0.08 * dt) {
                            this.pState[i] = 3; 
                            this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                        }
                    }

                    if (z > -70 && z < -15) {
                        let widthLeft = Engine3D.getTerrainY(x - 12, z).y;
                        let widthRight = Engine3D.getTerrainY(x + 12, z).y;
                        if (widthLeft > t.y + 5 && widthRight > t.y + 5) {
                            // 實體湧現：束氣過峽的文丘里效應 (Venturi effect)
                            vel.x += (0 - x) * 0.8 * dt; // 向中線擠壓
                            
                            // 若兩側都有足夠高的護山（迎送砂），則完美層流化脫煞
                            if (widthLeft > t.y + 12 && widthRight > t.y + 12) {
                                frameVenturi++; // 【探針：文丘里層流】
                                vel.z += 3.5 * dt; // 峽管效應極速推進
                                vel.y *= Math.pow(0.6, dt); // 完美壓平上下起伏 (絕對層流)
                                if (st === 0 && Math.random() < 0.05 * dt) {
                                    this.pState[i] = 2; // 過峽脫煞化吉氣
                                    this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.9; this.pCol[i*3+2] = 0.6;
                                }
                            } else {
                                vel.z += 1.5 * dt; // 防護不足，僅有微弱推進力
                                // 【進化：峽風吹斷】缺乏迎送砂防護，側向網格風會直接吹散束氣處的高速真氣
                                if (Math.abs(globalWindX) > 0.3) {
                                    vel.x += globalWindX * 3.5 * dt; // 橫風直灌
                                    if (Math.random() < Math.abs(globalWindX) * 0.25 * dt) {
                                        this.pState[i] = 3; // 氣脈被吹斷，變為散氣
                                        this.pCol[i*3] = 0.4; this.pCol[i*3+1] = 0.5; this.pCol[i*3+2] = 0.8;
                                    }
                                }
                            }
                        }
                    }
                } 
            } else { 
                vel.multiplyScalar(Math.pow(0.98, dt));
                if (z > -50) {
                    let dzA = -125.0 - z, dxA = 0.0 - x;
                    let distA = Math.max(1.0, Math.sqrt(dxA * dxA + dzA * dzA));
                    vel.x += (dxA / distA) * 0.5 * dt;
                    vel.z += (dzA / distA) * 0.5 * dt;
                }
            }

            // 【湧現物理】5. 水口神獸關攔 (實體反向渦流取代空間傳送)
            let hasGuards = state.luo || state.hua || state.shixiang || state.qin;
            // 【修復空間 BUG】：神獸的物理反向渦流也必須跟隨穴位 Z 軸位移 (lz)，否則手動點穴後物理力場會留在原地，與 3D 模型完全脫節
            let guardZOffset = (state.w !== 'none' ? (lz - 5.0) : 0);
            if (hasGuards && z > 50 + guardZOffset && z < 90 + guardZOffset && Math.abs(x) < 50) {
                let guardStrength = (state.luo ? 0.4 : 0) + (state.hua ? 0.4 : 0) + (state.shixiang ? 0.8 : 0) + (state.qin ? 0.3 : 0);
                // 產生向明堂中心 (x:0, z:30+offset) 的向心引力，模擬氣流被交鎖地形擋下並迴旋
                let dxToCenter = 0 - x;
                let dzToCenter = (30 + guardZOffset) - z;
                let distToCenter = Math.sqrt(dxToCenter*dxToCenter + dzToCenter*dzToCenter);
                if (distToCenter > 0) {
                    vel.x += (dxToCenter / distToCenter) * guardStrength * 3.5 * dt;
                    vel.z += (dzToCenter / distToCenter) * guardStrength * 3.5 * dt;
                    vel.multiplyScalar(Math.pow(0.85, dt)); // 強制減速挽留
                }
            }

            if(st === 1) {
                vel.x += (Math.random()-0.5)*0.8;
                vel.z += (Math.random()-0.5)*0.8;
            }

            // 【進化：北半球科里奧利力 (Coriolis Force)】
            // 氣流前進時受地球自轉影響，恆定向速度向量的「右側」產生微小偏向力
            // 叉積計算: (v_x, 0, v_z) cross (0, 1, 0) = (v_z, 0, -v_x) -> 向右向量
            let coriolisStrength = 0.08; 
            const oldVelX = vel.x;
            const oldVelZ = vel.z;
            vel.x += oldVelZ * coriolisStrength * dt;
            vel.z += -oldVelX * coriolisStrength * dt;
            
            // 湧現檢測：若右側白虎過高 (tai) 或逼壓，右偏的氣流撞擊後會引發白虎煞氣暴走
            if (state.mr === 'tai' && x > 10 && x < 35 && z > 0 && vel.x > 0) {
                frameCoriolisCrash++; // 【探針：科里奧利白虎撞擊】
                vel.x *= -1.5; // 被白虎陡壁猛烈反彈
                vel.y += 2.5 * dt;
                if (st === 2 && Math.random() < 0.15 * dt) this.pState[i] = 1;
            }

            // 【全局太極吸引場】吉格局粒子在靠近穴場時受到向心力，強化聚氣
        // 【全局太極吸引場】吉格局粒子在靠近穴場時受到向心力，強化聚氣
        // 【修正】增強吸引強度（0.2→0.45）並加入近距離速度阻尼，使完美格局的粒子能有效駐留於太極暈內
        // 修正：致命形煞存在時，太極暈不得提供任何向心力，讓煞氣能真正驅散氣場
        if (state.taiji && !hasDynamicFatalSha && globalMultCache > 0.8) {
            let attractDistSq = dxTaiji*dxTaiji + dzTaiji*dzTaiji;
            if (attractDistSq < 3600) {
                let attractDist = Math.sqrt(attractDistSq);
                if (attractDist > 0.1) {
                    let attractForce = 0.45 * globalMultCache * (1 - attractDist/60);
                    vel.x += (-dxTaiji/attractDist) * attractForce * dt;
                    vel.z += (-dzTaiji/attractDist) * attractForce * dt;
                    // 近距離額外阻尼（半徑 20 內），抵銷粒子慣性，確保粒子被太極暈捕獲
                    if (attractDistSq < 400) {
                        let proximityDamping = Math.pow(0.90, dt);
                        vel.x *= proximityDamping;
                        vel.z *= proximityDamping;
                    }
                }
            }
        }
            vel.clampLength(0, 5);
            x += vel.x*dt; y += vel.y*dt; z += vel.z*dt;

            // 【防穿模安全鎖】若粒子穿過地表超過3單位，強制拉回地表上方並反彈，杜絕碰撞衰減
            let terrainAfter = Engine3D.getTerrainY(x, z);
            if (terrainAfter.y > -100 && y < terrainAfter.y - 3.0) {
                y = terrainAfter.y + 3.5;
                if (vel.y < 0) vel.y *= -0.2;
            }

            if(state.vHeat && AppState.frames % 4 === 0 && y > -8) {
                let hx = (x / 350 + 0.5) * 256; let hz = (z / 350 + 0.5) * 256;
                let mult = Rules.getGlobalMultiplier();

                let heatAlpha = (st === 2) ? 0.65 : (st === 1 ? 0.70 : 0.25);
                let heatSize = (st === 2) ? 6.0 : (st === 1 ? 7.0 : 3.0);

                if (mult < 0.2 || st === 1) {
                    Engine3D.hCtx.fillStyle = `rgba(255, 30, 30, ${heatAlpha})`;
                } else {
                    Engine3D.hCtx.fillStyle = `rgba(255, 180, 20, ${heatAlpha})`;
                }
                Engine3D.hCtx.fillRect(hx - heatSize/2, hz - heatSize/2, heatSize, heatSize);
            }

            let inTaiji = (dxTaiji*dxTaiji + dzTaiji*dzTaiji < (state.d === 'pingyang' ? 1000 : 320) && y > t.y - 5 && y < t.y + 15);
            // 【大一統湧現】移除對 lintou (淋頭) 與 qing (傾瀉) 的例外排除。
            // 太極暈的物理容器若存在 (state.taiji)，渦流潛力就存在。
            // 若犯淋頭水或傾瀉，粒子會被水流與重力自然扯出渦流範圍，無需使用腳本強行關閉。
            // 修正：必須有實際穴形（xue !== 'none'）、非死/破龍且無致命形煞，才允許太極暈物理作用
            if (inTaiji && state.taiji && state.xia && state.xue !== 'none' && state.d !== 'si' && state.d !== 'po') {
                let mult = globalMultCache;

                // 【進化：達西定律與多孔介質滲透流 (Darcy's Law of Porous Media)】
                if (state.soil === 'wanshi' && y < 2.0) {
                    // 頑石 (零孔隙率)：地表堅硬如鐵，無法發生滲透，粒子觸底產生絕緣反彈
                    vel.y += 3.5 * dt; 
                    vel.x += (Math.random()-0.5) * 4.0 * dt;
                    vel.z += (Math.random()-0.5) * 4.0 * dt;
                    mult *= 0.6; 
                } else if (state.soil === 'yuni' && y < 1.0) {
                    frameDarcyDrag++; // 【探針：達西高黏滯阻力】
                    // 淤泥 (高黏滯度, 極低滲透率)：極端 Viscous Drag (黏滯阻力) 吞噬動能
                    let viscousDrag = 0.02; // 流體在泥沼中的極速衰減系數
                    vel.x *= viscousDrag; vel.z *= viscousDrag;
                    vel.y -= 2.5 * dt; 
                    this.pLife[i] -= 5.0 * dt; // 缺氧/壽命急遽流失
                    mult *= 0.5; 
                } else if (state.soil === 'wuse') {
                    // 五色土 (理想孔隙率 $\kappa$)：形成穩定的微觀滲透流 (Seepage Flow)
                    let seepagePermeability = 0.85; 
                    vel.multiplyScalar(Math.pow(seepagePermeability, dt)); // 均勻柔和減速
                    vel.y += (0.1 - vel.y) * 0.5 * dt; // 保持懸浮在土層表面的完美呼吸態
                    this.pLife[i] += 1.5 * dt; // 延年益壽
                }

                let velLenSq = vel.lengthSq();
                let velSpeed = velLenSq > 0 ? Math.sqrt(velLenSq) : 0;
                let radialVel = 0;
                let distTaiji = Math.sqrt(dxTaiji*dxTaiji + dzTaiji*dzTaiji);
                if (distTaiji > 0.1) {
                    radialVel = (dxTaiji*vel.x + dzTaiji*vel.z) / distTaiji;
                }
                let distToTaiji = Math.sqrt(dxTaiji*dxTaiji + dzTaiji*dzTaiji);
               let taijiRadius = (state.d === 'pingyang') ? Math.sqrt(1000) : Math.sqrt(320);
               let escapeDistThreshold = taijiRadius * 0.75;
               let escapeVelThreshold = 2.5;
               let isEscaping = (distToTaiji > escapeDistThreshold && (dxTaiji*vel.x + dzTaiji*vel.z) > 1.0 && vel.lengthSq() > escapeVelThreshold*escapeVelThreshold);
               if (st === 1 || st === 3 || isEscaping || mult < 0.45) {
                   frameScatter++;
               }

                    if (mult < 0.45) {
                    let pushX = x === 0 ? (Math.random()-0.5) : x;
                    // 【修復】：將硬編碼的 (z-5) 改為動態太極中心距離 (dzTaiji)，修正爆發方向
                    let pushZ = dzTaiji === 0 ? (Math.random()-0.5) : dzTaiji;

                    // 移除 isDeadDragon，統一由全域加權 (mult) 低落導致的氣場崩潰取代
                    let explodeForce = (1.5 / Math.max(0.1, mult));
                    vel.x += Math.sign(pushX) * explodeForce * dt;
                    vel.z += Math.sign(pushZ) * explodeForce * dt;

                    // 若格局極度惡劣 (mult < 0.25)，渦流反轉為撕裂煞氣
                    if (mult < 0.25 && Math.random() < 0.15 * dt) {
                        this.pState[i] = 1; 
                        this.pCol[i*3] = 0.9; this.pCol[i*3+1] = 0.05; this.pCol[i*3+2] = 0.05;
                        if (Math.random() < 0.1) Engine3D.createShockwave(x, y, z, 0xaa0000); 
                    } else if (st !== 1) {
                        this.pState[i] = 3;
                        this.pCol[i*3] = 0.8; this.pCol[i*3+1] = 0.2; this.pCol[i*3+2] = 0.4;
                    }
                } else {
                    let touchedWater = isWater || ((state.w !== 'none' || state.yue) && y < waterLevel - 1.0);
                    
                    // 修正 5：修復「落水反增分」的嚴重風水悖論！
                    // 若粒子掉進水中 (如平洋龍被割腳水侵入太極)，代表財氣被水帶走。
                    if (touchedWater) {
                        frameScatter += 2; // 落水破氣，轉為凶兆
                        vel.y -= 0.5 * dt; // 加速沉沒
                        if (st === 2) {
                            this.pState[i] = 3; // 吉氣轉為散氣
                            this.pCol[i*3]=0.4; this.pCol[i*3+1]=0.65; this.pCol[i*3+2]=0.9;
                        }
                    } else {
                        // 修正：僅有吉氣 (st=2) 或普通氣 (st=0) 才計入聚氣，避免煞氣/散氣被同時重複計入聚散統計
                        if (st === 0 || st === 2) {
                            frameGather++;
                            if (st === 2) frameGather += 2; // 只有安穩留在陸地上的吉氣，才給予聚氣加分
                        }
                    }
                    
                    let isYang = (i % 2 === 0);
                    let spiralDir = isYang ? 1.0 : -1.0; 

                    // 【診斷修正】增強太極暈凝聚效果：提高向心吸引係數與阻尼，解決完美格局聚氣不足
                    let attractStrength = (mult > 0.8 ? 0.36 : 0.24) * mult;
                    vel.x += ((-dzTaiji)*0.06 * spiralDir - dxTaiji*attractStrength) * dt;
                    vel.z += ((dxTaiji)*0.06 * spiralDir - dzTaiji*attractStrength) * dt;
                    vel.y += (isYang ? 0.35 : -0.25) * mult * dt;
                    // 在太極暈內增加額外阻尼，使粒子更容易被束縛 (吉格局加強阻尼至0.80)
                    vel.multiplyScalar(Math.pow(mult > 0.8 ? 0.80 : 0.88, dt));

                    // 【優化：Boids 生氣群集效應】讓吉氣如同魚群般具有生命力，互相吸引與對齊
                    if (st === 2 && Math.random() < 0.3) {
                        let cohesionX = 0, cohesionZ = 0;
                        let alignX = 0, alignZ = 0;
                        let neighborCount = 0;
                        
                        // 採樣附近 3 個粒子，計算質心與平均流向
                        for (let step = 1; step <= 3; step++) {
                            let sampleIdx = Math.floor(i + step * 17) % this.pCount;
                            if (this.pState[sampleIdx] === 2) {
                                let nx = this.pPos[sampleIdx*3];
                                let nz = this.pPos[sampleIdx*3+2];
                                let rx = x - nx;
                                let rz = z - nz;
                                let distSq = rx*rx + rz*rz;
                                
                                if (distSq > 0 && distSq < 36.0) { // 感知半徑
                                    cohesionX += nx; cohesionZ += nz;
                                    alignX += this.pVel[sampleIdx].x; alignZ += this.pVel[sampleIdx].z;
                                    neighborCount++;

                                    // 【進化：倫納德-瓊斯勢 (Lennard-Jones Potential) 微觀量子排斥】
                                    // 模擬太極暈內的氣體達到「超流體 (Superfluid)」狀態，形成完美晶格間距，避免粒子塌縮重疊
                                    if (distSq < 2.5) {
                                        let repulsion = 4.5 / (distSq + 0.1); // 反平方比斥力核心
                                        vel.x += (rx * repulsion) * dt;
                                        vel.z += (rz * repulsion) * dt;
                                    }
                                }
                            }
                        }

                        if (neighborCount > 0) {
                            // 1. 凝聚力 (Cohesion)：向附近同伴的中心靠攏
                            cohesionX /= neighborCount; cohesionZ /= neighborCount;
                            vel.x += (cohesionX - x) * 0.8 * dt;
                            vel.z += (cohesionZ - z) * 0.8 * dt;
                            
                            // 2. 對齊力 (Alignment)：與同伴的流向保持一致
                            alignX /= neighborCount; alignZ /= neighborCount;
                            vel.x += (alignX - vel.x) * 0.4 * dt;
                            vel.z += (alignZ - vel.z) * 0.4 * dt;
                        }
                        
                        // 3. 尋龍趨化性 (Chemotaxis)：感應全域地氣網格，自動往能量梯度高處游動 (智能湧現)
                        let cx = Math.max(0, Math.min(63, Math.floor((x + 100) / 200 * 64)));
                        let cz = Math.max(0, Math.min(63, Math.floor((z + 100) / 200 * 64)));
                        let qiLeft = this.qiGrid[cz * 64 + Math.max(0, cx - 1)] || 0;
                        let qiRight = this.qiGrid[cz * 64 + Math.min(63, cx + 1)] || 0;
                        let qiUp = this.qiGrid[Math.max(0, cz - 1) * 64 + cx] || 0;
                        let qiDown = this.qiGrid[Math.min(63, cz + 1) * 64 + cx] || 0;
                        
                        let qiGradX = qiRight - qiLeft;
                        let qiGradZ = qiDown - qiUp;
                        vel.x += qiGradX * 1.5 * dt;
                        vel.z += qiGradZ * 1.5 * dt;
                    }

                    if (mult > 0.6 && Math.random() < 0.15) {
                        vel.y += 0.25 * mult * dt; 
                    } else {
                        vel.y *= Math.pow(0.8, dt); 
                    }

                    if (st === 0 && Math.random() < (globalMultCache > 0.8 ? 0.35 : 0.1) * dt) {
                        this.pState[i]=2;
                        if (state.xing === 'jin') {
                            this.pCol[i*3]=0.5; this.pCol[i*3+1]=0.5; this.pCol[i*3+2]=0.6; // 金：淺色模式加深銀灰
                        } else if (state.xing === 'mu') {

            // 當穴星存在且氣場累積大於 5.0 時才發出金色光柱
            let targetOpacity = (hasRealXue && maxQi > 5.0) ? Math.min(0.5, maxQi / 60.0) : 0.0;
            Engine3D.lairMarker.material.opacity += (targetOpacity - Engine3D.lairMarker.material.opacity) * 0.05;
        }

        // 【優化：陰陽向背 (Yin-Yang Sun Exposure Sensor)】
        // 偵測正穴是否被周圍高山遮蔽陽光，計算陰陽平衡
        if (typeof AppState.sensors.sunlight === 'undefined') AppState.sensors.sunlight = 1.0;
        
        if (Engine3D.dirLight && Engine3D.lairMarker) {
            let sunDir = Engine3D.dirLight.position.clone().normalize();
            // 朝太陽方向檢查地形高度 (簡易光線追蹤 Raymarching)
            let checkDist = 35.0; 
            let checkX = this.bestLairPos.x + sunDir.x * checkDist;
            let checkZ = this.bestLairPos.z + sunDir.z * checkDist;
            let blockH = Engine3D.getTerrainY(checkX, checkZ).y;
            let sunRayH = this.bestLairPos.y + sunDir.y * checkDist;
            
            // 若太陽在水平線上，但光線被前方/側方山脈擋住，則視為陰煞
            let inShadow = (blockH > sunRayH);
            let currentSun = (inShadow || sunDir.y < 0) ? 0.0 : 1.0;
            
            // 平滑累積日照率 (模擬一整天的平均向陽度)
            AppState.sensors.sunlight += (currentSun - AppState.sensors.sunlight) * 0.02 * dt;
        }

        // 【進化：TDA 拓撲數據分析 (Topological Data Analysis - Betti-1 Approximation)】
        // 計算明堂空間的拓撲閉合不變量 (Topological Invariants)
        if (!AppState.sensors.betti1Closure) AppState.sensors.betti1Closure = 0;
        let closedSectors = 0;
        let totalSectors = 16;
        let scanRadius = (state.mtScale || 1.0) * 45.0; // 依照明堂比例掃描
        for(let a = 0; a < totalSectors; a++) {
            let angle = (a / totalSectors) * Math.PI * 2;
            let checkX = this.bestLairPos.x + Math.cos(angle) * scanRadius;
            let checkZ = this.bestLairPos.z + Math.sin(angle) * scanRadius;
            let h = Engine3D.getTerrainY(checkX, checkZ).y;
            // 若該方位的地形高於穴心基準線，則視為拓撲閉合
            if(h > this.bestLairPos.y + 2.5) closedSectors++; 
        }
        let currentBetti = closedSectors / totalSectors;
        // 平洋龍無高山，改以水法環抱度作為拓撲補償
        if (state.d === 'pingyang') currentBetti = (state.w === 'you' || state.w === 'jiuqu' || state.yue) ? 0.85 : 0.2;
        AppState.sensors.betti1Closure += (currentBetti - AppState.sensors.betti1Closure) * 0.05 * dt;

        let globalMult = Rules.getGlobalMultiplier();
        let weightedCapLimit = Math.min(capLimit, frameGather / 10 * globalMult);
        AppState.gatherAcc += (weightedCapLimit - AppState.gatherAcc) * 0.05 * dt;
        AppState.scatterAcc += (frameScatter / 40 - AppState.scatterAcc) * 0.1 * dt;

        // 統整進階物理觀測數據 (轉換為百萬分點或百分比)
        AppState.sensors.coanda = (frameCoanda / this.pCount) * 100;
        AppState.sensors.downdraft = (frameDowndraft / this.pCount) * 100;
        AppState.sensors.venturi = (frameVenturi / this.pCount) * 100;
        AppState.sensors.bounce = (frameBounce / this.pCount) * 100;
        
        // 統整深層 PDE/地質物理觀測數據
        AppState.sensors.phreatic = (framePhreatic / this.pCount) * 200;
        AppState.sensors.tensorFrac = (frameTensorFracture / this.pCount) * 500;
        AppState.sensors.helicity = (frameHelicity / this.pCount) * 100;
        AppState.sensors.thermalShear = (frameThermalShear / this.pCount) * 300;
        AppState.sensors.waveletSpike = (frameWaveletSpike / this.pCount) * 200;
        
        // 終極三大地球物理探針
        AppState.sensors.coriolisCrash = (frameCoriolisCrash / this.pCount) * 500;
        AppState.sensors.darcyDrag = (frameDarcyDrag / this.pCount) * 100;
        AppState.sensors.boundarySep = (frameBoundarySep / this.pCount) * 300;
        
        // 【流體力學無因次量 (Dimensionless Quantities)】
        // 雷諾數 (Re) > 4000 為湍流(煞)，< 2000 為層流(吉)；弗勞德數 (Fr) > 1.0 為超臨界急流(散財)
        let reynoldsNum = Math.round(AppState.sensors.windSpeed * 1500 + AppState.sensors.turbulence * 800);
        let froudeNum = Math.max(0, AppState.sensors.waterDrag / 5.0 + ((state.waterVel || 1.0) - 1.0) * 0.4);

        let sensorHtml = `
            <div style="color:#b98a2e; font-weight:bold; margin-bottom:4px; font-size: 13px;">[核心湧現觀測儀]</div>
            氣密度: ${(AppState.sensors.qiDensity*100).toFixed(1)}% | 亂流度: ${AppState.sensors.turbulence.toFixed(2)}<br>
            穴心風速: ${AppState.sensors.windSpeed.toFixed(2)} | 水力抽吸: ${AppState.sensors.waterDrag.toFixed(2)}<br>
            雷諾數 (Re): ${reynoldsNum} ${reynoldsNum > 4000 ? '<span style="color:#a63a2b;">(湍流煞)</span>' : '<span style="color:#3f6b52;">(層流吉)</span>'} | 水流弗勞德數 (Fr): ${froudeNum.toFixed(2)}<br>
            香農資訊熵: ${AppState.sensors.shannonEntropy.toFixed(3)} Bits | 拓撲閉合度 (β₁): ${(AppState.sensors.betti1Closure*100).toFixed(1)}%<br>
            陰陽向陽度: ${(AppState.sensors.sunlight*100).toFixed(1)}%<br>
            <div style="margin-top:6px; padding-top:6px; border-top:1px dashed rgba(0,0,0,0.15); color:#3f6b52; font-size:10.5px;">
                <b style="color:#22201c; font-size:11px;">[進階 PDE 與非線性地質遙測]</b><br>
                耗散駐波共振 (Resonant Q): ${qFactor.toFixed(1)} | 拓撲分形維度 (D): ${fractalDim.toFixed(3)}<br>
                水壓懸浮率: ${AppState.sensors.phreatic.toFixed(1)}% | 螺旋倒灌率: ${AppState.sensors.helicity.toFixed(1)}%<br>
                康達附著率: ${AppState.sensors.coanda.toFixed(1)}% | 峽管層流率: ${AppState.sensors.venturi.toFixed(1)}%<br>
                <span style="color:#a63a2b;">
                張力斷裂: ${AppState.sensors.tensorFrac.toFixed(1)}% | 熱切風撕裂: ${AppState.sensors.thermalShear.toFixed(1)}%<br>
                壓穴下洗: ${AppState.sensors.downdraft.toFixed(1)}% | 高頻煞殘留: ${AppState.sensors.waveletSpike.toFixed(1)}%<br>
                科氏力撞擊: ${AppState.sensors.coriolisCrash.toFixed(1)}% | 達西泥沼阻力: ${AppState.sensors.darcyDrag.toFixed(1)}%<br>
                邊界層二次流剝離: ${AppState.sensors.boundarySep.toFixed(1)}%
                </span>
            </div>
        `;
        let sEl = document.getElementById('sensor-data');
        if(sEl) sEl.innerHTML = sensorHtml;

        document.getElementById('g-num').innerText = Math.round(AppState.gatherAcc);
        document.getElementById('g-fill').style.width = Math.min(100, AppState.gatherAcc) + '%';
        document.getElementById('s-num').innerText = Math.round(AppState.scatterAcc);
        document.getElementById('s-fill').style.width = Math.min(100, AppState.scatterAcc) + '%';
        document.getElementById('cap-fill').style.width = capLimit + '%';

        let rawScore = Rules.computeScores();
        if (!AppState.smoothedScores) AppState.smoothedScores = [...rawScore];

        const alpha = Math.min(1.0, 0.08 * dt);
        for (let k = 0; k < 5; k++) {
            AppState.smoothedScores[k] += (rawScore[k] - AppState.smoothedScores[k]) * alpha;
        }

        let smoothedScore = AppState.smoothedScores; 
        let mult = Rules.getGlobalMultiplier();
        let totalPForDyn = AppState.gatherAcc + AppState.scatterAcc;
        let dynRatioForDyn = totalPForDyn > 0 ? (AppState.gatherAcc / totalPForDyn) : 0.5;
        let dynMult = (totalPForDyn > 30 && !(AppState.sensors.qiDensity > 0.03 && AppState.sensors.windSpeed < 0.8)) ? Math.min(1.4, Math.max(0.2, dynRatioForDyn * 1.5)) : 1.0;
        let effScore = smoothedScore.map(s => Math.min(100, Math.max(0, Math.round(s * mult)))); 
        let vObj = Rules.getVerdictText(smoothedScore); 

        document.getElementById('v-rating').innerText = vObj.rating;
        document.getElementById('v-rating').style.color = vObj.color;
        document.getElementById('v-text').innerText = `有效：龍${effScore[0]} 穴${effScore[1]} 砂${effScore[2]} 水${effScore[3]} 向${effScore[4]} (基礎:${Math.round(rawScore[0])}/${Math.round(rawScore[1])}/${Math.round(rawScore[2])}/${Math.round(rawScore[3])}/${Math.round(rawScore[4])})\n\n${vObj.text}`;
    }
};

/* ==========================================
   6. MAIN LOOP
   ========================================== */
const Input = {
    keys: { w:false, a:false, s:false, d:false, q:false, e:false, shift:false, arrowup:false, arrowdown:false, arrowleft:false, arrowright:false },
    init() {
        window.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            const k = e.key.toLowerCase();
            if (this.keys.hasOwnProperty(k)) {
                this.keys[k] = true;
                if (k.startsWith('arrow')) e.preventDefault(); // 防止方向鍵影響 UI 焦點元件
            }
        });
        window.addEventListener('keyup', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            const k = e.key.toLowerCase();
            if (this.keys.hasOwnProperty(k)) this.keys[k] = false;
        });
    }
};

Engine3D.init();
Physics.init();
UI.init();
Input.init(); // 啟動鍵盤監聽

const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
	Engine3D.shockwavesThisFrame = 0;

    let delta = clock.getDelta();
    if (delta > 0.1) delta = 0.1;

    // 【修復：維持全天候明亮晴空白晝，避免時間流逝導致太陽落山而使畫面變暗】
    if (Engine3D.dirLight) {
        // 太陽固定於最佳高角度白晝日光位，勾勒清晰地貌陰影且絕不昏暗
        Engine3D.dirLight.position.set(70, 140, 60);
        Engine3D.dirLight.intensity = 1.3;
        Engine3D.dirLight.color.setHSL(0.1, 0.2, 0.98); // 白晝晴空陽光
        Engine3D.hemiLight.color.setHSL(0.6, 0.3, 0.85); // 晴空天藍漫射光
        Engine3D.hemiLight.intensity = 0.85;
    }

    // 【優化：無人機地形跟隨鏡頭防穿模與平滑廣角切換 (Anti-Clipping Flight & Dynamic FOV)】
        if (Engine3D.isTransitioning && Engine3D.targetCamPos) {
            Engine3D.transitionFrames = (Engine3D.transitionFrames || 0) + 1;
            // 水平與視角目標平滑插值
            Engine3D.camera.position.x += (Engine3D.targetCamPos.x - Engine3D.camera.position.x) * 0.08;
            Engine3D.camera.position.z += (Engine3D.targetCamPos.z - Engine3D.camera.position.z) * 0.08;
            Engine3D.controls.target.lerp(Engine3D.targetLookAt, 0.08);
            
            // FOV 廣角視角平滑過渡
            if (Engine3D.targetFov && Math.abs(Engine3D.camera.fov - Engine3D.targetFov) > 0.1) {
                Engine3D.camera.fov += (Engine3D.targetFov - Engine3D.camera.fov) * 0.08;
                Engine3D.camera.updateProjectionMatrix();
            }

            // 高度安全檢測雷達：調降門檻至 +1.2m，避免與人眼高度(+1.8m)產生高差矛盾
            let currentTerrainY = Engine3D.getTerrainY(Engine3D.camera.position.x, Engine3D.camera.position.z).y;
            let safeY = Math.max(Engine3D.targetCamPos.y, currentTerrainY + 1.2); 
            
            Engine3D.camera.position.y += (safeY - Engine3D.camera.position.y) * 0.08;

            // 達到目標距離，或超過 45 幀防死鎖機制，強制結束動畫狀態
            if (Engine3D.camera.position.distanceTo(Engine3D.targetCamPos) < 2.0 || Engine3D.transitionFrames > 45) {
                Engine3D.isTransitioning = false;
                Engine3D.transitionFrames = 0;
            }
        }
        
        // 【修復：WASD 水平漫遊與方向鍵圍繞中心旋轉邏輯】
        // 若玩家按下任何移動鍵，立即終止動畫過渡並讓出控制權
        if (Input.keys.w || Input.keys.s || Input.keys.a || Input.keys.d || Input.keys.q || Input.keys.e || 
            Input.keys.arrowup || Input.keys.arrowdown || Input.keys.arrowleft || Input.keys.arrowright) {
            Engine3D.isTransitioning = false;
        }

        if (!Engine3D.isTransitioning) {
            let speed = Input.keys.shift ? 100.0 * delta : 35.0 * delta;
            let moveDir = new THREE.Vector3();
            
            // 修正 1：平移時強制鎖定水平 XZ 平面
            let forward = new THREE.Vector3();
            Engine3D.camera.getWorldDirection(forward);
            forward.y = 0; 
            // 防呆：如果完全垂直俯視，forward.y 歸零後會變成 0 向量，需賦予預設方向防止座標崩壞
            if (forward.lengthSq() < 0.001) forward.set(0, 0, -1);
            forward.normalize();
            
            let right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
            
            if (Input.keys.w) moveDir.add(forward);
            if (Input.keys.s) moveDir.sub(forward);
            if (Input.keys.a) moveDir.sub(right);
            if (Input.keys.d) moveDir.add(right);
            if (Input.keys.q) moveDir.y -= 1; // Q 鍵：垂直下降
            if (Input.keys.e) moveDir.y += 1; // E 鍵：垂直上升
            
            if (moveDir.lengthSq() > 0) {
                moveDir.normalize().multiplyScalar(speed);
                Engine3D.camera.position.add(moveDir);
                Engine3D.controls.target.add(moveDir); // 旋轉中心同步平移，維持正確半徑
            }
			
			const rotX = (Input.keys.arrowright ? 1 : 0) - (Input.keys.arrowleft ? 1 : 0);
			const rotY = (Input.keys.arrowdown ? 1 : 0) - (Input.keys.arrowup ? 1 : 0);

			// 修正 2：真正 100% 原地轉頭 (相機位置 camera.position 保持 0 位移，僅旋轉目標視線點)
			if (rotX !== 0 || rotY !== 0) {
				let rotSpeed = 1.5 * delta;
				
				// 1. 以相機位置為原點，計算出當前的視線方向向量
				let lookVector = Engine3D.controls.target.clone().sub(Engine3D.camera.position);
				let radius = lookVector.length();
				if (radius < 2.0) radius = 20.0; // 保持合理的視線目標距離，避免 target 離相機太近導致滾輪縮放異常
				
				// 2. 將視線向量轉為球座標
				let spherical = new THREE.Spherical().setFromVector3(lookVector);
				
				// 3. 調整 Yaw (左右轉頭) 與 Pitch (抬頭/低頭)
				spherical.theta += rotX * rotSpeed; // 右鍵頭向右轉，左鍵頭向左轉
				spherical.phi += rotY * rotSpeed;   // 上鍵抬頭，下鍵低頭
				
				// 4. 限制俯仰角度，防止頭轉到地底或過度翻轉
				spherical.phi = Math.max(0.1, Math.min(Math.PI/2 - 0.05, spherical.phi));
				spherical.makeSafe();
				
				// 5. 算出新目標點 T = 相機位置 C + 新視線向量，相機位置 C 保持 100% 靜止
				lookVector.setFromSpherical(spherical);
				Engine3D.controls.target.copy(Engine3D.camera.position.clone().add(lookVector));
				Engine3D.camera.lookAt(Engine3D.controls.target);
				Engine3D.controls.update(); // 同步 OrbitControls
			}
		}

    let physDt = delta * 60 * parseFloat(AppState.current.time);
    Physics.update(physDt);

    UI.drawRadar(delta);

    Engine3D.controls.update();
    
    // 【全域防穿模安全鎖】移至此處：確保滑鼠滾輪(Zoom)與拖曳平移(Pan)都不會讓相機鑽入地底，造成視角破壞
    let currentGroundY = Engine3D.getTerrainY(Engine3D.camera.position.x, Engine3D.camera.position.z).y;
    // 如果鏡頭跑到地圖外 (getTerrainY 會回傳 -100)，則給予一個合理的最低高度(例如 -5.0)，避免掉入無底洞
    let safeMinY = currentGroundY === -100 ? -5.0 : currentGroundY + 1.8; 
    
    if (Engine3D.camera.position.y < safeMinY) {
        let deltaY = safeMinY - Engine3D.camera.position.y;
        Engine3D.camera.position.y = safeMinY;
        Engine3D.controls.target.y += deltaY; // 同步補償目標點，確保視角不抖動
        Engine3D.controls.update(); // 因為修改了位置與目標，需要重新同步
    }

    // 【維度三：地貌渲染】輸出帶有後期處理輝光的畫面
    if (Engine3D.composer) {
        Engine3D.composer.render();
    } else {
        Engine3D.renderer.render(Engine3D.scene, Engine3D.camera);
    }
}
animate();

</script>
