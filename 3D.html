<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 龍・山・水 終極全息模擬器 (大一統進化版)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --paper: #f6f1e7;
    --ink: #22201c;
    --seal: #a63a2b;
    --gold: #b98a2e;
    --jade: #3f6b52;
    --bg-dark: #e6e4df;
    --bg-panel: rgba(245, 243, 238, 0.85);
    --text: #333333;
}
body { margin: 0; overflow: hidden; background: var(--bg-dark); color: var(--text); font-family: 'Noto Sans TC', sans-serif; user-select: none; }

/* 左側控制面板 */
#panel-left {
    position: absolute; top: 10px; left: 10px; width: 380px; height: calc(100vh - 20px);
    display: flex; flex-direction: column; background: var(--bg-panel);
    border: 1px solid rgba(0,0,0,0.1); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15); backdrop-filter: blur(8px);
    transition: transform 0.3s ease; z-index: 1000;
}
#panel-left.collapsed { transform: translateX(-385px); }

.panel-fold-btn {
    position: absolute; top: 10px; width: 28px; height: 28px; background: #f6f1e7;
    border: 1px solid rgba(0,0,0,0.2); border-radius: 50%; display: flex;
    align-items: center; justify-content: center; cursor: pointer; font-size: 12px;
    color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: 0.2s; z-index: 1001;
}
.panel-fold-btn:hover { background: var(--gold); color: #fff; }
#fold-left-btn { right: -14px; }
#fold-right-btn { left: -14px; }

.header { text-align: center; padding: 12px 10px; border-bottom: 2px solid var(--gold); background: #f6f1e7; border-top-left-radius: 12px; border-top-right-radius: 12px; }
.header h1 { margin: 0; font-size: 16px; font-family: 'Noto Serif TC', serif; color: var(--ink); letter-spacing: 2px; }
.scroll-area { flex: 1; overflow-y: auto; padding: 12px; scrollbar-width: thin; scrollbar-color: var(--jade) #ddd; }
.scroll-area::-webkit-scrollbar { width: 5px; }
.scroll-area::-webkit-scrollbar-track { background: #e6e4df; border-radius: 3px; }
.scroll-area::-webkit-scrollbar-thumb { background: var(--jade); border-radius: 3px; }

.ctrl-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.ctrl-label { color: #555555; font-family: 'Noto Serif TC', serif; min-width: 45px; font-size: 13px; flex-shrink: 0; font-weight: bold; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; align-items: center; }
.seg button {
    flex: 1 1 0px; min-width: max-content; max-width: 92px; background: rgba(255, 255, 255, 0.3);
    border: 1px solid rgba(0,0,0,0.15); color: var(--text);
    font-family: 'Noto Serif TC', serif; border-radius: 4px; padding: 5px 4px;
    cursor: pointer; font-size: 12px; transition: 0.2s; white-space: nowrap; text-align: center;
}
.seg button.on { background: var(--gold); border-color: var(--gold); color: #fff; font-weight: bold; }
.seg button.danger.on { background: var(--seal); border-color: var(--seal); color: #fff; }
.seg button:hover { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.3); }
.seg button.on:hover { background: #cda240; border-color: #cda240; }
.seg button.danger.on:hover { background: #c04a3a; border-color: #c04a3a; }
.seg button:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

.preset-btn { border-color: #5a8a69 !important; color: #5a8a69 !important; font-weight: bold; }
.preset-btn:hover { background: #5a8a69 !important; color: #ffffff !important; }

input[type=range] { width: 100%; margin: 0; accent-color: var(--gold); background: transparent; cursor: pointer; }

/* 右側分析面板 */
#panel-right { position: absolute; top: 10px; right: 10px; width: 300px; max-height: calc(100vh - 20px); display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 1000; }
.right-scroll-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; scrollbar-color: var(--jade) #ddd; padding-right: 2px; }
.right-scroll-area::-webkit-scrollbar { width: 5px; }
.right-scroll-area::-webkit-scrollbar-track { background: #e6e4df; border-radius: 3px; }
.right-scroll-area::-webkit-scrollbar-thumb { background: var(--jade); border-radius: 3px; }
#panel-right.collapsed { transform: translateX(305px); }
.box {
    background: var(--bg-panel); border: 1px solid rgba(0,0,0,0.1);
    border-radius: 12px; padding: 15px; backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}
.radar-container { text-align: center; }
#radar { width: 100%; height: 160px; }

.meter-group { margin-bottom: 8px; }
.meter-title { font-size: 12px; display: flex; justify-content: space-between; margin-bottom: 2px; color: #555555; font-weight: bold; }
.meter-title b { color: var(--ink); }
.meter { height: 6px; background: rgba(0,0,0,0.1); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0%; transition: width 0.3s; }
.m-gather i { background: linear-gradient(90deg, #8a6a20, var(--gold)); }
.m-scatter i { background: linear-gradient(90deg, #7a2a20, var(--seal)); }
.m-cap i { background: linear-gradient(90deg, #3f6b52, #7fb08f); }

#verdict-box { background: rgba(0,0,0,0.05); padding: 12px; border-radius: 8px; border-left: 4px solid var(--gold); margin-top: 5px; }
#v-rating { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: bold; color: var(--gold); display: block; margin-bottom: 5px; }
#v-text { font-family: 'Noto Serif TC', serif; font-size: 13px; line-height: 1.5; color: #333333; white-space: pre-line; }

/* 行動端 / 小螢幕自適應 RWD */
@media (max-width: 768px) {
    #panel-left { width: calc(100vw - 20px); height: 50vh; top: 10px; left: 10px; }
    #panel-right { width: calc(100vw - 20px); max-height: calc(50vh - 30px); top: calc(50vh + 20px); right: 10px; left: 10px; }
}
#controls-hint {
    position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
    background: rgba(34, 32, 28, 0.85); color: #f6f1e7; padding: 10px 20px;
    border-radius: 30px; font-size: 13px; letter-spacing: 1px;
    pointer-events: none; z-index: 1000; font-family: 'Noto Sans TC', sans-serif;
    border: 1px solid var(--gold); box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    white-space: nowrap; backdrop-filter: blur(4px);
}
@media (max-width: 768px) { #controls-hint { display: none; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<!-- 新增：後期處理 (Post-Processing) 神級光影渲染引擎 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

<div id="panel-left">
    <button id="fold-left-btn" class="panel-fold-btn" title="折疊/展開左側面板">◀</button>
    <div class="header"><h1>3D 龍山水・大一統進化版</h1></div>
    <div class="scroll-area">
        <div class="ctrl-row"><span class="ctrl-label">龍勢</span><div class="seg" data-k="d"><button data-v="sheng">躍龍</button><button data-v="pingyang">平洋</button><button data-v="huilong">迴龍</button><button data-v="heng">橫龍</button><button data-v="ji">急龍</button><button data-v="huan">緩龍</button><button data-v="gufeng" class="danger">孤峰</button><button data-v="si">死病</button><button data-v="po" class="danger">破</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">後山</span><div class="seg" data-k="mn"><button data-v="you">垂頭</button><button data-v="pingfeng">屏風</button><button data-v="kang" class="danger">拒屍</button><button data-v="po" class="danger">破碎</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">左砂</span><div class="seg" data-k="ml"><button data-v="you">青龍有情</button><button data-v="xiasha" style="color:#b98a2e;font-weight:bold;">下砂收水</button><button data-v="jiaoya">交牙</button><button data-v="ya" class="danger">逼壓</button><button data-v="fanbei" class="danger">反背</button><button data-v="po" class="danger">破碎</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">右砂</span><div class="seg" data-k="mr"><button data-v="you">白虎有情</button><button data-v="xiasha" style="color:#b98a2e;font-weight:bold;">下砂收水</button><button data-v="jiaoya">交牙</button><button data-v="tai" class="danger">抬頭</button><button data-v="kaikou" class="danger">開口</button><button data-v="fanbei" class="danger">反背</button><button data-v="po" class="danger">破碎</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">地勢</span><div class="seg" data-k="terrain"><button data-v="flat">平坦</button><button data-v="slope" class="danger">前傾(退氣)</button><button data-v="backhigh">後仰(聚)</button><button data-v="fanpo" class="danger">反坡(堵)</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">前案</span><div class="seg" data-k="ms"><button data-v="you">朱雀翔舞</button><button data-v="bijia">筆架三台</button><button data-v="yin" style="color:#b98a2e;font-weight:bold;">印砂</button><button data-v="di">低陷</button><button data-v="po" class="danger">破碎</button><button data-v="sunken" class="danger">深坑</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">水勢</span><div class="seg" data-k="w"><button data-v="you">玉帶</button><button data-v="jiuqu">九曲</button><button data-v="jushui" style="color:#0a91a1;font-weight:bold;">聚水天心</button><button data-v="hejin" style="color:#0a91a1;font-weight:bold;">合襟</button><button data-v="hulu" style="color:#0a91a1;font-weight:bold;">葫蘆</button><button data-v="fuliu" style="color:#0a91a1;font-weight:bold;">伏流</button><button data-v="sishui" style="color:#b98a2e;font-weight:bold;">四水</button><button data-v="jiaojian" class="danger">交劍</button><button data-v="gejiao" class="danger">割腳</button><button data-v="lintou" class="danger">淋頭</button><button data-v="ji" class="danger">直沖</button><button data-v="fan" class="danger">反弓</button><button data-v="bazi" class="danger">八字</button><button data-v="tfork" class="danger">丁字</button><button data-v="juanlian" class="danger">捲簾</button><button data-v="pubu" class="danger">瀑布</button><button data-v="liulei" class="danger">流淚</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">星體</span><div class="seg" data-k="xing"><button data-v="jin">金</button><button data-v="mu">木</button><button data-v="shui">水</button><button data-v="huo" class="danger">火</button><button data-v="tu">土</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">穴形</span><div class="seg" data-k="xue"><button data-v="none">無</button><button data-v="wo">窩</button><button data-v="qian">鉗</button><button data-v="ru">乳</button><button data-v="tu">突</button><button data-v="ping">坪</button><button data-v="ya">崖</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">定穴</span><div class="seg"><button class="tog" data-k="manualXue" id="btn-manualXue">手動點穴</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">穴高</span><div class="seg" style="align-items:center;"><input type="range" id="xueh-slider" min="0" max="20" value="0" title="穴位海拔（谷底~半山~高山）"><span id="xueh-val" style="min-width:25px; text-align:right; font-size:12px; color:var(--gold);">平洋</span></div></div>
        <div class="ctrl-row"><span class="ctrl-label">穴飾</span><div class="seg"><button class="tog" data-k="showCompass">3D羅盤</button><button class="tog" data-k="showDragonLine">龍脈線</button></div></div>

        <div class="ctrl-row" style="margin-top:10px;"><span class="ctrl-label">護從</span><div class="seg"><button class="tog" data-k="tianma" style="color:#b98a2e;font-weight:bold;">天馬山</button><button class="tog" data-k="caoshe">草蛇灰線</button><button class="tog" data-k="chuanzhang" style="color:#b98a2e;font-weight:bold;">穿帳</button><button class="tog" data-k="dazhang" style="color:#b98a2e;font-weight:bold;">開帳</button><button class="tog" data-k="dushui" style="color:#b98a2e;font-weight:bold;">渡水</button><button class="tog" data-k="dieduan">跌斷</button><button class="tog" data-k="shu">束氣</button><button class="tog danger" data-k="fenzhi">分流</button><button class="tog" data-k="guiyao">鬼曜</button><button class="tog" data-k="hulong">護龍</button><button class="tog" data-k="fengyao">蜂腰</button><button class="tog" data-k="zutai">祖脈</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">穴場</span><div class="seg"><button class="tog" data-k="shidao" style="color:#b98a2e;font-weight:bold;">天心十道</button><button class="tog" data-k="feie" style="color:#b98a2e;font-weight:bold;">飛蛾砂</button><button class="tog" data-k="emei" style="color:#b98a2e;font-weight:bold;">蛾眉砂</button><button class="tog" data-k="longtuzhu" style="color:#b98a2e;font-weight:bold;">龍吐珠</button><button class="tog" data-k="luocheng" style="color:#b98a2e;font-weight:bold;">重羅城</button><button class="tog" data-k="xia">穴星</button><button class="tog" data-k="an">案山</button><button class="tog" data-k="chao">朝山</button><button class="tog" data-k="zhu">主山</button><button class="tog" data-k="xu">玄武</button><button class="tog" data-k="mt">明堂</button><button class="tog" data-k="baitai" style="color:#b98a2e;font-weight:bold;">拜台</button><button class="tog" data-k="bendi" style="color:#b98a2e;font-weight:bold;">盆地</button><button class="tog" data-k="taiji">太極</button><button class="tog" data-k="guan">官星</button><button class="tog danger" data-k="qing">傾瀉</button><button class="tog danger" data-k="yangwa">仰瓦</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">水法</span><div class="seg"><button class="tog" data-k="san">三叉水</button><button class="tog" data-k="yue">半月池</button><button class="tog" data-k="tianchi" style="color:#0a91a1;font-weight:bold;">高山天池</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">隨龍水</span><div class="seg" data-k="suilong"><button data-v="none">無</button><button data-v="shuang">雙側夾送</button><button data-v="zuo">單左(青龍)</button><button data-v="you">單右(白虎)</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">水口</span><div class="seg"><button class="tog" data-k="riyue" style="color:#b98a2e;font-weight:bold;">日月</button><button class="tog" data-k="luo">羅星</button><button class="tog" data-k="hua">華表</button><button class="tog" data-k="shixiang">獅象</button><button class="tog" data-k="qin">禽星</button></div></div>

        <div class="ctrl-row"><span class="ctrl-label">道路</span><div class="seg" data-k="road"><button data-v="none">無</button><button data-v="huanbao">環抱</button><button data-v="zhichong" class="danger">直沖</button><button data-v="sickle" class="danger">鐮刀煞</button><button data-v="zuocha" class="danger">左斜</button><button data-v="youcha" class="danger">右斜</button><button data-v="jiandao" class="danger">剪刀煞</button><button data-v="lanyao" class="danger">高架攔腰</button><button data-v="wuwei" class="danger">無尾巷</button></div></div>

        <div class="ctrl-row"><span class="ctrl-label">形煞</span><div class="seg"><button class="tog danger" data-k="tianjing">天井</button><button class="tog danger" data-k="tianzhan">天斬</button><button class="tog danger" data-k="qingquan">擎拳</button><button class="tog danger" data-k="ao">凹風</button><button class="tog danger" data-k="tantou">探頭</button><button class="tog danger" data-k="tasha">孤陽塔</button><button class="tog danger" data-k="shaMode" id="btn-shaMode">手動置煞</button></div></div>


        <div class="ctrl-row"><span class="ctrl-label">風場</span><div class="seg" style="align-items:center;"><input type="range" id="wind-slider" min="-10" max="10" value="5" title="八風交吹強度 (左右側風)"><span id="wind-val" style="min-width:25px; text-align:right; font-size:12px; color:var(--gold);">+5</span></div></div>

        <div class="ctrl-row" style="margin-top:10px; border-top:1px dashed #ccc; padding-top:10px;"><span class="ctrl-label">行度</span><div class="seg" data-k="bohuan"><button data-v="yes">完全剝換(吉)</button><button data-v="no" class="danger">未剝換(凶)</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">橈棹</span><div class="seg" data-k="zhijiao"><button data-v="shun">順水抱(吉)</button><button data-v="ni" class="danger">逆水反(凶)</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">穴土</span><div class="seg" data-k="soil"><button data-v="wuse">五色土</button><button data-v="wanshi" class="danger">頑石</button><button data-v="yuni" class="danger">淤泥</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">新增煞</span><div class="seg"><button class="tog danger" data-k="sherui">射肋煞</button><button class="tog danger" data-k="posui">破碎崖</button><button class="tog danger" data-k="wugong">蜈蚣脊</button><button class="tog danger" data-k="bidao">刀削壁</button></div></div>
        
        <div class="ctrl-row"><span class="ctrl-label">主山高</span><div class="seg" style="align-items:center;"><input type="range" id="zhu-slider" min="5" max="20" value="10" title="主山比例"><span id="zhu-val" style="min-width:25px; text-align:right; font-size:12px; color:var(--gold);">1.0</span></div></div>
        <div class="ctrl-row"><span class="ctrl-label">明堂大</span><div class="seg" style="align-items:center;"><input type="range" id="mt-slider" min="5" max="20" value="10" title="明堂比例"><span id="mt-val" style="min-width:25px; text-align:right; font-size:12px; color:var(--gold);">1.0</span></div></div>
        <div class="ctrl-row"><span class="ctrl-label">水流速</span><div class="seg" style="align-items:center;"><input type="range" id="wvel-slider" min="1" max="25" value="5" title="水流速度"><span id="wvel-val" style="min-width:25px; text-align:right; font-size:12px; color:var(--gold);">x1</span></div></div>

        <div class="ctrl-row" style="margin-top:10px; border-top:1px dashed #ccc; padding-top:10px;"><span class="ctrl-label">理氣</span><div class="seg" data-k="face"><button data-v="1">向水</button><button data-v="0">背水(坐空)</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">視效</span><div class="seg"><button class="tog" data-k="vHeat">3D熱力圖</button><button class="tog" data-k="vWind">風場矩陣</button><button class="tog" data-k="zhihua">制化佈局</button><button id="btn-cam-cave">堪輿視角(C)</button><button id="btn-cam-reset">預設視角</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">時間</span><div class="seg" data-k="time"><button data-v="0">暫停</button><button data-v="1">1x</button><button data-v="2">2x</button></div></div>

        <div class="ctrl-row" style="margin-top:10px;"><span class="ctrl-label">預設</span>
            <div class="seg">
                <button class="preset-btn" data-p="perfect">完美巒頭</button>
                <button class="preset-btn" data-p="gejiao">割腳退財</button>
                <button class="preset-btn" data-p="huilong">迴龍顧祖</button>
                <button class="preset-btn" data-p="tianzhan">天斬傾瀉</button>
                <button class="preset-btn" data-p="diwang">帝王十道</button>
                <button class="preset-btn" data-p="pingyang">平洋水龍</button>
                <button class="preset-btn" data-p="cliff">懸崖險穴</button>

const AppState = {
    current: { ...CONFIG.baseState },
    history: [],       // 儲存隨機設定/預設格局的歷史紀錄
    historyIndex: -1,  // 當前瀏覽的歷史索引
    obstacles: [],
    shockwaves: [],
    gatherAcc: 0,
    scatterAcc: 0,
    smoothedScores: null, // 儲存一階低通濾波後的平滑分數 [龍, 穴, 砂, 水, 向]
    frames: 0,
    // 【湧現物理】新增觀測點感測器數據
    sensors: {
        qiDensity: 0,      // 穴心氣粒子密度 (太極暈實體湧現)
        windSpeed: 0,      // 穴心平均風速 (藏風指標)
        turbulence: 0,     // 穴心亂流度 (風煞指標)
        waterDrag: 0       // 明堂前方水力牽引 (伯努利抽吸效應)
    },

    resetTo(presetName, isHistoryLoad = false) {
        let p;
        let actualName = presetName;
        
        if (isHistoryLoad) {
            p = this.history[this.historyIndex].data;
            actualName = this.history[this.historyIndex].name;
        } else {
            p = presetName === 'random' ? Rules.generateRandomPreset() : CONFIG.presets[presetName];
            // 存入歷史紀錄 (若不在最新進度，截斷後續歷史)
            if (this.historyIndex < this.history.length - 1) {
                this.history = this.history.slice(0, this.historyIndex + 1);
            }
            this.history.push({ name: presetName, data: JSON.parse(JSON.stringify(p)) });
            this.historyIndex = this.history.length - 1;
        }

        Object.assign(this.current, CONFIG.baseState);
        this.current.presetName = actualName; // 👈 新增：紀錄當前預設名稱，讓 JSON 能印出來
        Object.keys(p).forEach(k => this.current[k] = p[k]);
        // 【新增：死破龍強制防呆】死龍或破龍為絕地，不得有穴星、穴形、太極暈與穴高
        if (this.current.d === 'si' || this.current.d === 'po') {
            this.current.xia = false;
            this.current.xue = 'none';
            this.current.taiji = false;
            this.current.xueHeight = 0;
            this.current.manualXue = false;
        }
        // 【修正】重置幀計數，讓預熱保護機制在每次切換格局時從零開始，避免舊幀數干擾上吉判定
        this.frames = 0;

        while(Engine3D.obsGroup.children.length > 0) {
            let child = Engine3D.obsGroup.children[0];
            Engine3D.obsGroup.remove(child);
        }
        this.obstacles.length = 0;

        // 修復：清空舊震波 Mesh 避免 WebGL 記憶體洩漏
        while(Engine3D.swGroup.children.length > 0) {
            let child = Engine3D.swGroup.children[0];
            Engine3D.swGroup.remove(child);
            if(child.material) child.material.dispose();
        }
        this.shockwaves.length = 0;

        // 修復：重置實時粒子統計與分數濾波緩存，避免跨格局狀態污染
        this.gatherAcc = 0;
        this.scatterAcc = 0;
        this.smoothedScores = null;
        
        // 重置感測器數據，避免上一個格局的湧現物理懲罰污染新格局
        this.sensors = {
            qiDensity: 0, windSpeed: 0, turbulence: 0, waterDrag: 0,
            shannonEntropy: 0, betti1Closure: 0, sunlight: 1.0,
            phreatic: 0, helicity: 0, coanda: 0, venturi: 0,
            tensorFrac: 0, thermalShear: 0, downdraft: 0, waveletSpike: 0,
            coriolisCrash: 0, darcyDrag: 0, boundarySep: 0, bounce: 0
        };

        // 【新增：重置 CFD 風場與氣場網格，防止切換格局時風速/氣場殘留影響新格局】
        Physics.windGridX.fill(0);
        Physics.windGridZ.fill(0);
        Physics.windGridX_next.fill(0);
        Physics.windGridZ_next.fill(0);
        Physics.qiGrid.fill(0);
        if (Physics.bestLairPos) Physics.bestLairPos.set(0, 0, 5); // ★ 重置聚氣最佳觀測點

        UI.syncDOM();
        // 修復：移除獨立的 Engine3D.buildTerrain()，改用 UI.update(true) 統一校驗與單次建構
        // 防止無效狀態引發防呆機制，導致同一幀重複渲染兩次地形
        UI.update(true);
        Physics.resetParticles();
        Engine3D.clearHeatmap();
    },

    prevHistory() {
        if (this.historyIndex > 0) {
            this.historyIndex--;
            this.resetTo(null, true);
        }
    },

    nextHistory() {
        if (this.historyIndex < this.history.length - 1) {
            this.historyIndex++;
            this.resetTo(null, true);
        } else {
            // 到底沒有就生新的
            this.resetTo('random');
        }
    }
};

/* ==========================================
   2. RULES ENGINE (理論評分系統)
   ========================================== */
const Rules = {
    getGlobalMultiplier() {
        const state = AppState.current;
        let m = 1.0;
        // 死龍或破龍為生氣枯竭的絕地，全域嚴厲降級，確保最終分數與大凶評級一致
        if(state.d === 'si' || state.d === 'po') m *= 0.15;
        if(!state.xia) m *= 0.4;
        if(!state.mt) m *= 0.6;

        if(state.d === 'huan' && state.xue !== 'ru' && state.xue !== 'tu' && !state.bendi) m *= 0.65;
        // 急來緩受：急龍若結「窩/鉗」緩穴，煞氣得化；否則若無案無堂則重扣
        if(state.d === 'ji' && state.xue !== 'qian' && state.xue !== 'wo' && !state.an && !state.mt && !state.guan) m *= 0.7;

        if(state.d === 'pingyang' && state.w === 'none') m *= 0.25;
        
        // 【新增：新行度與形煞加權】
        if(state.bohuan === 'no') m *= 0.55; // 未剝換，煞氣未除，全域降級
        if(state.zhijiao === 'ni') m *= 0.75; // 逆水反，氣脈倒退
        if(state.sherui) m *= 0.4; // 射肋煞直插太極，極凶
        if(state.fenzhi) m *= 0.7; // 枝龍分流，龍氣散佚
        if(state.ml === 'ya' || state.mr === 'tai') m *= 0.75; // 青龍逼壓/白虎抬頭，主客失衡
        // 致命形煞全域懲罰，確保分數與大凶評級一致
        if(state.ao) m *= 0.8; // 凹風煞漏風灌穴
        if(state.tantou) m *= 0.8; // 探頭煞小人窺視
        if(state.tianzhan) m *= 0.7; // 天斬煞劈裂
        if(state.qingquan) m *= 0.8; // 擎拳煞逼壓
        if(state.qing || state.terrain === 'slope') m *= 0.7; // 明堂傾瀉或地勢傾斜，氣場無法停留
        if(state.posui) m *= 0.7; // 破碎崖，山體破敗
        if(state.wugong) m *= 0.65; // 蜈蚣脊，脈氣撕裂
        if(state.bidao) m *= 0.6; // 刀削壁煞，風刀直逼
        if(state.ms === 'sunken') m *= 0.6; // 明堂深坑，氣場下沉完全漏失
        if(state.tianjing) m *= 0.7; // 天井煞，坐井觀天，氣場窒息
        if(state.yangwa) m *= 0.7; // 仰瓦漏胎煞，胎氣漏失
        // 主客失衡 (逼壓欺主)：主山太高而明堂太小，氣場狂躁
        if((state.zhuScale || 1.0) > 1.4 && (state.mtScale || 1.0) < 0.8) m *= 0.65;

        // 【修正：砂手破碎全域懲罰】青龍白虎朱雀玄武四獸皆破則八風直灌，絕不可用。
        // 未加入此懲罰前，全破碎砂手仍可能因龍穴水向高分而獲得中平評價，與風水常理矛盾。
        const brokenSandCount = (state.ml==='po'?1:0)+(state.mr==='po'?1:0)+(state.ms==='po'?1:0)+(state.mn==='po'?1:0);
        if (brokenSandCount >= 2) m *= 0.4;
        else if (brokenSandCount === 1) m *= 0.7;
		
        // 置煞空間權重計算：距離穴心 (0, 0, 5) 越近，煞氣威力呈指數級上升
        if(AppState.obstacles.length > 0) {
            let totalObsImpact = 0;

        }

        // 零正神水法（以當前九運 2024-2043 為準）：正北坎宮 (315°~45°) 為零神催財水方位
        let zeroGodBonus = 0;

        // 【修復：精確八宮理氣度數劃分】正北坎宮同步涵蓋 315°~360° 與 0°~45°
        let isZeroGodWater = (state.w !== 'none') && (state.face === '1') && (deg < 45 || deg >= 315); // 坎宮零神催財
        let isZhaoGodWater = (state.w !== 'none') && (state.face === '1') && (deg >= 90 && deg < 135); // 震宮照神催官
        let isDirectGodWaterClash = (state.w !== 'none') && (state.face === '1') && (deg >= 180 && deg < 225); // 離宮正神下水

        const isBadWaterZero = ['fan','bazi','gejiao','ji','lintou','tfork','juanlian','pubu','liulei','jiaojian'].includes(state.w);
        if (isZeroGodWater && !isBadWaterZero) zeroGodBonus += 15; // 零神(北)得水催財大吉 (凶水除外)
        if (isZhaoGodWater && !isBadWaterZero) zeroGodBonus += 10; // 照神(東)得水催貴聚氣 (凶水除外)
        if (isDirectGodWaterClash) zeroGodBonus -= 25; // 正神(南)下水破財大凶
        if (state.face === '0' && state.d === 'pingyang' && !isBadWaterZero) zeroGodBonus += 10; // 平洋龍「坐空朝滿/倒騎龍」水繞後背不以正神下水論

        // 【修復：平洋龍坐空朝滿倒騎龍有吉水環抱，不以普通山龍坐空論折損】

        // 修正：死龍或破龍無生氣，向分數不應過高，限制上限為 40

        let xiangBonus = 0;
        const isBadWaterRuleSc = ['gejiao','fan','bazi','ji','lintou','tfork','juanlian','pubu','liulei','jiaojian'].includes(state.w);
        // 修正：迴龍顧祖必須「回頭向後(face='0')」且朝拜太祖山(zutai)。若 face='1' 則為背祖無情，大凶。
        if(state.d === 'huilong' && !isBadDragon && !isBadWaterRuleSc) {

        // 【湧現物理】導入觀測儀即時反饋 (Emergence Sensor Feedback)
        // 拔除部分硬編碼，改由實際的流體力學表現決定分數
        let densityBonus = Math.min(30, AppState.sensors.qiDensity * 600); // 氣聚為吉
        let windPenalty = Math.min(30, AppState.sensors.windSpeed * 5 + AppState.sensors.turbulence * 1.0); // 氣乘風則散，湍流權重提升以反映亂流對氣場的實質破壞
        let dragPenalty = Math.min(35, AppState.sensors.waterDrag * 4); // 割腳/直沖引發的伯努利抽吸
        // 修正：當物理觀測顯示氣場散失（scatterAcc > gatherAcc）時，即使分數高也應反映在湧現加權上，避免矛盾
        // 修正：若明堂已滿載（容量滿載），散射為溢出自然現象，不應視為風煞懲罰

        // 調整權重：提高懲罰倍率，並加入門檻判斷，確保物理異常能顯著影響分數
        if (AppState.sensors.windSpeed > 0.5 || AppState.sensors.turbulence > 2.0) {

        if (AppState.sensors.windSpeed > 1.5 || AppState.sensors.turbulence > 5.0) {

        let emergenceBonus = densityBonus - windPenalty - dragPenalty;

        // 散氣懲罰已整合至下方預熱保護分支與正常分支內，避免雙重計分。

        // 修復 2：湧現物理預熱保護機制。剛切換格局時粒子尚未聚集，qiDensity 為 0，
        // 直接套用會導致嚴重扣分。需等待實時粒子觀察累積量超過門檻再啟動物理加權。
        // 修正：若粒子總數極低（可能因物理異常導致粒子未進入感測區），則基於靜態分數與煞氣給予合理懲罰，避免矛盾評語。
        // 修正：當存在形煞但感測器為0時，強制施加懲罰，避免物理異常被忽略。
        if (AppState.gatherAcc + AppState.scatterAcc < 50) {

            if (AppState.sensors.windSpeed > 0.5 || AppState.sensors.turbulence > 2.0) {

            if (AppState.sensors.windSpeed > 1.0 || AppState.sensors.turbulence > 4.0) {

            if (AppState.scatterAcc > AppState.gatherAcc + 10) {

        } else {

            if (!isCapacityFullSc && AppState.scatterAcc > AppState.gatherAcc) {

            // 修正：當聚氣率為0且散氣率大於0時，額外施加懲罰，但僅在粒子總數足夠時生效，避免預熱誤判
            if (!isCapacityFullSc && AppState.gatherAcc === 0 && AppState.scatterAcc > 0 && AppState.gatherAcc + AppState.scatterAcc > 0) {

            // 修正：完美格局中風速與亂流度偏高時，也應給予懲罰，避免物理異常被忽略
            if (AppState.sensors.windSpeed > 0.3 || AppState.sensors.turbulence > 1.5) {

        // 若物理觀測顯示此兩種異常，即使靜態分數尚可也必須施加湧現懲罰，避免評語與數據矛盾。

        // 【修復：四獸僅 1 處破碎時按正常減分處理，達到 2 處以上八風直灌時才觸發致命形煞封頂】
        const brokenCount = (state.ml==='po'?1:0)+(state.mr==='po'?1:0)+(state.ms==='po'?1:0)+(state.mn==='po'?1:0);
        const hasFatalShaFinal = isBadWaterFinal || state.tianzhan || state.tantou || state.ao || state.qingquan || state.sherui || state.qing || state.posui || state.wugong || state.bidao || state.terrain === 'slope' || state.terrain === 'fanpo' || state.ms === 'sunken' || state.tasha || state.mr === 'kaikou' || state.yangwa || state.tianjing || (brokenCount >= 2) || ['zhichong', 'sickle', 'jiandao', 'zuocha', 'youcha', 'lanyao', 'wuwei'].includes(state.road);
        // 【修正】加入物理凝聚因子：若散氣遠大於聚氣，即使靜態巒頭完美，也應降低最終分數，避免評級與分數矛盾
        let coherenceFactor = 1.0;

        if (!hasFatalShaFinal && state.xia && state.xue !== 'none' && !isBadDragon) {

    getCapacityLimit() {
        const state = AppState.current;
        let cap = 0;
        if(state.ml==='you') cap+=20; else if(state.ml==='ya') cap-=10; else if(state.ml==='po') cap-=8;
        if(state.mr==='you') cap+=20; else if(state.mr==='tai') cap-=10; else if(state.mr==='po') cap-=8;
        if(state.ms==='you') cap+=20; else if(state.ms==='di') cap-=15; else if(state.ms==='po') cap-=12;
        if(state.mn==='you') cap+=25; else if(state.mn==='kang') cap-=15; else if(state.mn==='po') cap-=12;

        if(state.an) cap+=10; if(state.ms==='bijia') cap+=10; if(state.chao) cap+=8; if(state.xia && state.xue !== 'none') cap+=10;
        if(state.zhu) cap+=10; if(state.mn==='pingfeng') cap+=15; if(state.xu) cap+=10; if(state.mt) cap+=20;
        if(state.tianchi) cap+=15; // 天池極大擴充了山脈頂部的容氣量 
        if(state.bendi) cap+=40;   // 修復：盆地極大擴充了明堂聚氣的極限容量
        if(state.xue==='qian') cap+=15; 
        if(state.xue==='ping') cap+=12; // 坪穴堂局寬廣
        if(state.xue==='ya') cap-=10;   // 崖穴空間受限
        if(state.hulong) cap+=10; if(state.zutai) cap+=10; if(state.fengyao) cap+=10;
        if(state.luo) cap+=10; if(state.hua) cap+=10; if(state.shixiang) cap+=15; if(state.qin) cap+=5;

        if(!state.mt) cap = Math.min(cap, 25);
        // 【修正】左右砂若皆為無效（none 或 po），容量必須受限，即使迴龍顧祖有太祖山也不例外
        const hasValidLeftSand = (state.ml !== 'none' && state.ml !== 'po');
        const hasValidRightSand = (state.mr !== 'none' && state.mr !== 'po');
        if (!hasValidLeftSand && !hasValidRightSand && state.d !== 'pingyang') cap = Math.min(cap, 30);
        if(state.d === 'pingyang' && state.w === 'none') cap = Math.min(cap, 15);
        
        // 【新增：明堂實體大小直接影響容量上限】
        cap *= (state.mtScale || 1.0);
        
        // 【修正：容量上限保護】僅確保容量不為負，不再硬性封頂於100，讓大吉格局能超過100反映真實氣場容量
        cap = Math.max(0, cap);
        
        // 【新增：無明堂容量上限保護】無明堂時即使 mtScale 放大，容量也不得超過 25
        if (!state.mt) cap = Math.min(cap, 25);
        
        // 【修正：無穴星容量限制】沒有穴星則氣場無法凝聚，容量最高僅30，避免無穴格局仍顯示高容量
        if (!state.xia) cap = Math.min(cap, 30);
        
        // 【新增：高山穴容量防呆】若在高山立穴（xueHeight > 10）且缺乏案山關攔或左右護砂，容量上限大幅受限
        if ((state.xueHeight || 0) > 10 && state.d !== 'pingyang') {
            if (!state.an && (!hasValidLeftSand || !hasValidRightSand)) {
                cap *= 0.3; // 高山孤露，無左右砂手護衛，氣場無法凝結
            } else if (!state.an) {
                cap *= 0.65;
            }
        }

        // 【大一統改良】廢除凶水對「極限容量(Capacity)」的強制閹割腳本。
        // 【新增：形煞對容量的負面影響】射肋、天斬、擎拳、凹風、破碎、探頭、傾瀉等形煞均嚴重破壞氣場，容量應隨之降低
        // 【修正】凶水（割腳、反弓、八字、直沖、淋頭）破壞水聚氣格局，容量應大幅下降，避免大凶局仍顯示容量滿載
        if(['gejiao','fan','bazi','ji','lintou','tfork','juanlian','pubu','liulei','jiaojian'].includes(state.w)) cap -= 25;
        if(state.sherui) cap -= 30;
        if(state.tianzhan) cap -= 25;
        if(state.qingquan) cap -= 20;
        if(state.ao) cap -= 15;
        if(state.posui) cap -= 20;
        if(state.tantou) cap -= 15;
        if(state.qing) cap -= 15;
        if(state.fenzhi) cap -= 15;
        if(state.ml === 'ya') cap -= 15;

        if(state.wugong) cap -= 25;           // 蜈蚣脊：脈氣撕裂，氣場破碎
        if(state.bidao) cap -= 20;            // 刀削壁：風刀直劈，氣場無法停留
        if(state.ms === 'sunken') cap -= 25;  // 明堂深坑：氣場下沉漏失
        if(state.terrain === 'slope' || state.terrain === 'fanpo') cap -= 20; // 地勢前傾/反坡：氣場退散
        if(['zhichong','sickle','jiandao','zuocha','youcha','lanyao','wuwei'].includes(state.road)) cap -= 30; // 路煞直沖/側漏
        // 【修正】死龍或破龍為絕地，凝氣容量極低，反映實質上不可立穴
        if(state.d === 'si' || state.d === 'po' || state.d === 'gufeng') cap = Math.min(cap, 10);

        }
        if (rawScore.some(s => isNaN(s) || !isFinite(s))) {
            sanityWarnings.push('【數值爆破】計算分數包含 NaN 或 Infinity 異常值');
        }
        // 【新增：預設格局正向與反向斷言校驗】
        if (st.presetName === 'perfect' || st.presetName === 'diwang' || st.presetName === 'shixiang') {
            if (!verdict.rating.includes('上吉') && !verdict.rating.includes('中平')) {
                sanityWarnings.push(`【正向斷言失敗】預設 [${st.presetName}] 本應為吉局，但實際評級為 [${verdict.rating}]，請檢查物理感測器是否誤判！`);
            }
        } else if (st.presetName === 'gejiao' || st.presetName === 'dijue' || st.presetName === 'tianzhan') {
            if (!verdict.rating.includes('大凶')) {
                sanityWarnings.push(`【反向斷言失敗】預設 [${st.presetName}] 本應為大凶絕地，但實際評級為 [${verdict.rating}]，未正確認出致命形煞！`);
            }
        }

        // ==========================================
        // 【新增】：全局幾何與熱力學抽象掃描器 (Global Geometry & Thermodynamic Scanner)
        // ==========================================
        const spatialAnomalies = [];
        
        let lx = st.manualXue ? (st.xueX || 0) : 0;
        let lz = st.manualXue ? (st.xueZ || 5) : 5.0;

        // 1. 生成 11x11 降維微縮地圖 (Downsampled Topo-Matrix)
        // 讓 AI 直觀看見地形全貌 (範圍覆蓋 165x165 單位，以穴心為中心)
        const topoMatrix = [];
        const step = 15;
        for (let z = -5; z <= 5; z++) {
            let row = [];
            for (let x = -5; x <= 5; x++) {
                row.push(Math.round(Engine3D.getTerrainY(lx + x * step, lz + z * step).y));
            }
            topoMatrix.push(row);
        }

        // 2. 八方天際線雷達 (8-Directional Skyline Radar)
        // 從穴心向外發射射線，尋找周圍山峰的最高點與落差，通用判斷左右失衡或明堂受阻
        const skyline = { N:-99, NE:-99, E:-99, SE:-99, S:-99, SW:-99, W:-99, NW:-99 };
        const dirs = { N:[0,-1], NE:[0.7,-0.7], E:[1,0], SE:[0.7,0.7], S:[0,1], SW:[-0.7,0.7], W:[-1,0], NW:[-0.7,-0.7] };
        for (let d in dirs) {
            for (let dist = 10; dist <= 80; dist += 10) {
                let sy = Engine3D.getTerrainY(lx + dirs[d][0] * dist, lz + dirs[d][1] * dist).y;
                if (sy > skyline[d]) skyline[d] = Math.round(sy);
            }
        }

        // 3. 全局拓撲奇異點 (Singularity / Tearing) 掃描 與 Z-Fighting 檢測
        let maxSlope = 0, tearingCount = 0, zFightingCount = 0;
        let waterLevel = (st.d === 'pingyang') ? -3.5 : -12.0;
        // 重算河道中心線（與 buildTerrain 同步），僅對河道內部做 Z-Fighting 判定，避免將正常的岸線過渡誤判為閃爍
        let riverRefZ = 999;
        if (st.w === 'you' || st.w === 'jiuqu' || st.w === 'bazi' || st.w === 'tfork') riverRefZ = 70;
        else if (st.w === 'gejiao') riverRefZ = 30;
        else if (st.w === 'ji' || st.w === 'fan') riverRefZ = 55;
        else if (st.w === 'lintou') riverRefZ = -10;
        if (st.w !== 'none') riverRefZ += ((st.manualXue ? (st.xueZ || 0) : 5.0) - 5.0);
        for (let idx = 0; idx < Engine3D.hMap.length - (CONFIG.tSeg + 1) - 1; idx++) {
            let h = Engine3D.hMap[idx];
            let slopeX = Math.abs(h - Engine3D.hMap[idx + 1]);
            let slopeZ = Math.abs(h - Engine3D.hMap[idx + (CONFIG.tSeg + 1)]);
            let localMaxSlope = Math.max(slopeX, slopeZ);
            if (localMaxSlope > maxSlope) maxSlope = localMaxSlope;
            if (localMaxSlope > 100.0) tearingCount++; 
            // 掃描 Z-Fighting (僅在河道主流範圍內檢查，排除岸線自然過渡)
            if (st.w !== 'none') {
                let gx = idx % (CONFIG.tSeg + 1);
                let gz = Math.floor(idx / (CONFIG.tSeg + 1));
                let wx = (gx / CONFIG.tSeg) * CONFIG.tSize - CONFIG.tSize / 2;
                let wz = (gz / CONFIG.tSeg) * CONFIG.tSize - CONFIG.tSize / 2;
                let rS = riverRefZ;
                if (st.d === 'pingyang' && st.w !== 'none') rS += Math.sin(wx * 0.08) * 20.0 + Math.cos(wx * 0.18) * 8.0;
                if (st.w === 'jiuqu') { let zCurve = Math.sin(wx * 0.12); rS += Math.sign(zCurve) * Math.pow(Math.abs(zCurve), 0.5) * 14; }
                if (st.w === 'you') rS += (1.0 - Math.pow(wx / 90.0, 2)) * 28.0;
                if (st.w === 'fan') rS -= Math.cos(wx * 0.05) * 15;
                if (st.w === 'bazi') rS += Math.abs(wx) * 0.5;
                // 修正：淋頭水僅在穴後 (z<-3) 有作用，前側不應進行 Z-Fighting 掃描
                if (st.w === 'lintou' && wz > lz - 3.0) continue;
                let dR = Math.abs(wz - rS);
                if (dR < 24 && Math.abs(h - waterLevel) < 0.02) zFightingCount++;
            }
        }
        if (tearingCount > 0) {
            spatialAnomalies.push(`【拓撲奇異點】偵測到 ${tearingCount} 處地形撕裂，最大網格落差達 ${maxSlope.toFixed(1)}。`);
            sanityWarnings.push('【幾何異常】地形發生嚴重撕裂破圖');
        }
        if (zFightingCount > 30) {
            spatialAnomalies.push(`【渲染閃爍警告】發現 ${zFightingCount} 個地形頂點與水面高度重疊，將導致嚴重的 Z-Fighting 破圖！(請確保河床深於水面)`);
            sanityWarnings.push('【視覺異常】地形與水面發生深度衝突 (Z-Fighting)');
        }
        
        // 將光學異常加入 AI 警告清單
        if (opticalAnomalies.length > 0) {
            spatialAnomalies.push(...opticalAnomalies);
            sanityWarnings.push(...opticalAnomalies);
        }

        // 4. 系統動能熵值與流體散度 (CFD Divergence & Entropy)
        let clippingCount = 0, maxSpeedSq = 0, avgDeathZ = 0, deathCount = 0;
        for (let i = 0; i < Physics.pCount; i += 10) {
            let py = Physics.pPos[i*3+1];
            let pz = Physics.pPos[i*3+2];
            let groundY = Engine3D.getTerrainY(Physics.pPos[i*3], pz).y;
            if (py < groundY - 3.0) clippingCount++;
            
            let speedSq = Physics.pVel[i].lengthSq();
            if (speedSq > maxSpeedSq) maxSpeedSq = speedSq;
            
            // 統計已散氣/煞氣粒子位置 (流動拓撲掃描)；不計入正常行進中的生氣 (st=0)，避免誤判
            if (Physics.pState[i] === 3 || Physics.pState[i] === 1) {
                avgDeathZ += pz;
                deathCount++;
            }
        }
        if (clippingCount > 0) spatialAnomalies.push(`【碰撞衰減】抽樣發現 ${clippingCount} 個粒子掉入地底，地表約束失效。`);
        if (maxSpeedSq > 400.0) {
            spatialAnomalies.push(`【動能暴走】系統偵測到粒子速度異常 (SpeedSq=${maxSpeedSq.toFixed(1)})，物理引擎發散。`);
            sanityWarnings.push('【物理異常】系統動能熵值暴走');
        }
        
        // 5. 氣脈流動拓撲掃描 (Dragon Vein Continuity)
        if (deathCount > 0) avgDeathZ /= deathCount;
        let expectedLairZ = st.manualXue ? (st.xueZ||5) : 5.0;
        // 【修正】提高氣脈截斷的偵測門檻至80單位，避免迴龍顧祖等彎曲山脈造成過度敏感的假陽性警告
        if (avgDeathZ < expectedLairZ - 80.0 && st.d !== 'pingyang' && !st.manualXue && AppState.gatherAcc < 10 && (AppState.gatherAcc + AppState.scatterAcc) > 100 && st.d !== 'si' && st.d !== 'po') {
            // 大量粒子死在深山老林，根本沒有流到明堂
            spatialAnomalies.push(`【氣脈截斷】大量粒子死亡於 Z=${avgDeathZ.toFixed(1)}，距離穴心(${expectedLairZ.toFixed(1)})過遠。龍脈可能被異常地形或逆風截斷！`);
            sanityWarnings.push('【物理異常】氣脈無法抵達穴心');
        }

        // 6. 防呆狀態機悖論掃描 (State Desync)
        if (st.d === 'pingyang' && (st.xueHeight > 0 || st.tianzhan || st.posui || st.sherui)) {
            spatialAnomalies.push(`【狀態悖論】平洋龍(平原)不應存在穴高、天斬煞或破碎崖，防呆邏輯 (UI.update) 發生漏洞！`);
            sanityWarnings.push('【邏輯異常】出現不可能的風水狀態組合');
        }

        // 提取 4 個關鍵節點高程（不佔 Token 的輕量地形摘要，讓 AI 掌握高低差）
        const xueY = Engine3D.getTerrainY(st.xueX || 0, st.manualXue ? st.xueZ : 5.0).y;
		const zhuY = Engine3D.getTerrainY(0, -60).y;
		const anY = Engine3D.getTerrainY(0, 75).y;
		const riverY = Engine3D.getTerrainY(0, 30).y;

		// 1. 生成生效形煞結構化清單 (activeShaList)
        const activeShaList = [];
        if (st.ml === 'po') activeShaList.push('青龍破碎');
        if (st.mr === 'po') activeShaList.push('白虎破碎');
        if (st.ms === 'po') activeShaList.push('朱雀破碎');
        if (st.mn === 'po') activeShaList.push('玄武破碎');
        if (st.tianzhan) activeShaList.push('天斬煞');
        if (st.ao) activeShaList.push('凹風煞');
        if (st.qingquan) activeShaList.push('擎拳煞');
        if (st.tantou) activeShaList.push('探頭煞');
        if (st.sherui) activeShaList.push('射肋煞');
        if (st.posui) activeShaList.push('破碎崖');
        if (st.fenzhi) activeShaList.push('枝龍分流');
        if (st.ml === 'ya') activeShaList.push('青龍逼壓');
        if (st.mr === 'tai') activeShaList.push('白虎抬頭');
        if (st.qing) activeShaList.push('明堂傾瀉');
        if (st.terrain === 'slope') activeShaList.push('地勢前傾(退氣)');
        if (st.terrain === 'fanpo') activeShaList.push('明堂反坡(逆氣)');
        if (st.tasha) activeShaList.push('孤陽塔煞');
        if (st.yangwa) activeShaList.push('仰瓦(漏胎煞)');
        if (st.mr === 'kaikou') activeShaList.push('白虎開口煞');
        if (st.ms === 'sunken') activeShaList.push('明堂深坑');
        if (['gejiao', 'lintou', 'fan', 'bazi', 'ji', 'tfork', 'juanlian', 'pubu', 'liulei', 'jiaojian'].includes(st.w)) activeShaList.push(`凶水(${st.w})`);
        if (st.bohuan === 'no') activeShaList.push('未剝換');
        if (st.zhijiao === 'ni') activeShaList.push('橈棹逆水反');
        if (st.wugong) activeShaList.push('蜈蚣脊');
        if (st.bidao) activeShaList.push('刀削壁');
        if (['zhichong', 'sickle', 'zuocha', 'youcha', 'jiandao', 'lanyao', 'wuwei'].includes(st.road)) activeShaList.push(`路煞(${st.road})`);
        if (AppState.obstacles.length > 0) activeShaList.push(`手動置煞(${AppState.obstacles.length}處)`);

		// 2. 計算朝向與九運理氣方位名稱 (compassOrientation)
        const deg = st.degree !== undefined ? st.degree : 0;
        let facingName = "朝北 (坎宮)";
        if (deg >= 45 && deg < 90) facingName = "朝東北 (艮宮)";
        else if (deg >= 90 && deg < 135) facingName = "朝東 (震宮)";
        else if (deg >= 135 && deg < 180) facingName = "朝東南 (巽宮)";
        else if (deg >= 180 && deg < 225) facingName = "朝南 (離宮)";
        else if (deg >= 225 && deg < 270) facingName = "朝西南 (坤宮)";
        else if (deg >= 270 && deg < 315) facingName = "朝西 (兌宮)";
        else if (deg >= 315) facingName = "朝西北 (乾宮)"; // 【修復：補齊西北乾宮】

        const isBadWaterCompass = ['fan','bazi','gejiao','ji','lintou','tfork','juanlian','pubu','liulei','jiaojian'].includes(st.w);
        let zeroGodStatus = "無見水";
        if (st.w !== 'none') {
            if (st.face === '1' && (deg < 45 || deg >= 315)) zeroGodStatus = isBadWaterCompass ? "九運坎宮見水 (零神方位但為凶水, 不吉反凶)" : "九運坎宮見水 (零神催財大吉)";
            else if (st.face === '1' && (deg >= 90 && deg < 135)) zeroGodStatus = isBadWaterCompass ? "九運震宮見水 (照神方位但為凶水, 不吉反凶)" : "九運震宮見水 (照神催官吉)";
            else if (st.face === '1' && (deg >= 180 && deg < 225)) zeroGodStatus = isBadWaterCompass ? "九運離宮見水 (正神下水且為凶水, 大凶)" : "九運離宮見水 (正神下水大凶)";
            else zeroGodStatus = isBadWaterCompass ? `凶水(${st.w})` : "一般水法方位";
        }

		// 3. 計算容量利用率與物理收斂指標 (physicsStability)
        const capLimit = Rules.getCapacityLimit();
        // 【修正】使用整數化的聚散統計值，避免極小浮點殘值導致 gatherRatio 出現「幽靈 100%」的誤導數據
        const intGather = Math.round(AppState.gatherAcc);
        const intScatter = Math.round(AppState.scatterAcc);
        const totalP = intGather + intScatter;
        const physicsStability = {
            capacityLimit: Math.round(capLimit),
            // 【修正】容量利用率不會超過 100%，避免因 low-gather 保護機制（effectiveGatherCap）造成超載假象
            capacityUtilization: capLimit > 0 ? Number(Math.min(100, intGather / capLimit * 100).toFixed(1)) + "%" : "0%",
            gatherRatio: totalP > 0 ? Number((intGather / totalP * 100).toFixed(1)) + "%" : "0%",
            particleCount: Physics.pCount
        };

        let expectedRating = "動態判定";
        if (['perfect', 'diwang', 'shixiang'].includes(st.presetName)) expectedRating = "上吉/中吉";
        else if (['gejiao', 'dijue', 'tianzhan'].includes(st.presetName)) expectedRating = "大凶";

        const resultData = {
            presetName: st.presetName || 'current',
            expectedRating: expectedRating, // 👈 新增：給予 AI 評判基準
            activeShaList: [...new Set(activeShaList)].concat(st.yangwa && !activeShaList.includes('仰瓦(漏胎煞)') ? ['仰瓦(漏胎煞)'] : []), // 新增：形煞清單（已去重並補齊仰瓦）
            compassOrientation: {         // 新增：理氣方位
                degree: deg,
				facingName: facingName,
				zeroGodStatus: zeroGodStatus
			},
			config: { ...st },
			lairInfo: {
				xueHeight: st.xueHeight || 0,
				manualXue: !!st.manualXue,
				xueX: st.xueX || 0,
				xueZ: st.xueZ || 5,
				terrainSummary: {
					xueElevation: Number(xueY.toFixed(1)),
					mainMountainElevation: Number(zhuY.toFixed(1)),
					frontAnElevation: Number(anY.toFixed(1)),
					riverBedElevation: Number(riverY.toFixed(1))
				},
				spatialProfile: { 
					topoMatrix_11x11: topoMatrix,     // 全局微縮地形圖 (行:Z, 列:X)
					skylineRadar: skyline,            // 八方天際線 (E/W判斷左右, S/N判斷前後)
					geometryAnomalies: spatialAnomalies // 奇異點與熵值警告
				},
				microTopography: microTopo
			},
			emergenceMetrics: {
				gatherAcc: Math.round(AppState.gatherAcc),
				scatterAcc: Math.round(AppState.scatterAcc),
				qiDensity: Number(((AppState.sensors.qiDensity || 0) * 100).toFixed(2)) + "%",
				windSpeed: Number((AppState.sensors.windSpeed || 0).toFixed(2)),
				turbulence: Number((AppState.sensors.turbulence || 0).toFixed(2)),
				waterDrag: Number((AppState.sensors.waterDrag || 0).toFixed(2)),
				sunlight: Number(((AppState.sensors.sunlight || 1.0) * 100).toFixed(1)) + "%",
                // 【新增：將高維度非線性物理與拓撲數據推給 AI 進行深度學習分析】
                thermodynamicsAndTopology: {
                    shannonEntropy_Bits: Number((AppState.sensors.shannonEntropy || 0).toFixed(4)),
                    resonantQFactor: Number((() => {
                        const totalQiRef = AppState.gatherAcc + AppState.scatterAcc;
                        const coherenceRef = totalQiRef > 0 ? AppState.gatherAcc / totalQiRef : 0;
                        let safeEntropy = Math.max(0.08, AppState.sensors.shannonEntropy || 0); // 【修復：防除以零 NaN】
                        return Math.min(99.9, (1.0 / safeEntropy) * (AppState.sensors.qiDensity || 0) * 500 * coherenceRef * coherenceRef);
                    })().toFixed(2)),
                    fractalDimension_D: Number((2.0 + Math.min(0.99, (AppState.sensors.turbulence || 0) * 0.05 + (st.bohuan === 'no' ? 0.3 : 0.0))).toFixed(3)),
                    betti1Closure_Topological: Number(((AppState.sensors.betti1Closure || 0) * 100).toFixed(1)) + "%",
                    reynoldsNumber_CFD: Math.round((AppState.sensors.windSpeed || 0) * 1500 + (AppState.sensors.turbulence || 0) * 800),
                    froudeNumber_CFD: (st.w && st.w !== 'none') ? Number((Math.max(0, (AppState.sensors.waterDrag || 0) / 5.0 + ((st.waterVel || 1.0) - 1.0) * 0.4)).toFixed(3)) : 0
                },
				advancedPhysics: {
					phreatic: Number((AppState.sensors.phreatic || 0).toFixed(1)) + "%",
					helicity: Number((AppState.sensors.helicity || 0).toFixed(1)) + "%",
					coanda: Number((AppState.sensors.coanda || 0).toFixed(1)) + "%",
					venturi: Number((AppState.sensors.venturi || 0).toFixed(1)) + "%",
					tensorFrac: Number((AppState.sensors.tensorFrac || 0).toFixed(1)) + "%",
					thermalShear: Number((AppState.sensors.thermalShear || 0).toFixed(1)) + "%",
					downdraft: Number((AppState.sensors.downdraft || 0).toFixed(1)) + "%",
					waveletSpike: Number((AppState.sensors.waveletSpike || 0).toFixed(1)) + "%",
					coriolisCrash: Number((AppState.sensors.coriolisCrash || 0).toFixed(1)) + "%",
					darcyDrag: Number((AppState.sensors.darcyDrag || 0).toFixed(1)) + "%",
					boundarySep: Number((AppState.sensors.boundarySep || 0).toFixed(1)) + "%"
				}
			},
			physicsStability: physicsStability, // 新增：物理收斂度
			scores: {
				globalMultiplier: Number(mult.toFixed(2)),
				scoreBreakdown: {               // 新增：五訣結構化分數
					dragon: { raw: Math.round(rawScore[0]), effective: effScore[0] },
					lair:   { raw: Math.round(rawScore[1]), effective: effScore[1] },
					sand:   { raw: Math.round(rawScore[2]), effective: effScore[2] },
					water:  { raw: Math.round(rawScore[3]), effective: effScore[3] },
					facing: { raw: Math.round(rawScore[4]), effective: effScore[4] }
				}
			},
			verdict: {
				rating: verdict.rating,
				text: verdict.text
			},
			sanityWarnings: sanityWarnings
		};

        if (!silent) {
            const aiPrompt = `請幫我分析以下 3D 風水模擬器的 Dry Run 測試結果（模擬時長：${simulateSeconds}秒）。請檢查「物理觀測數據」與「最終分數」是否符合風水邏輯，並指出需要修改的程式碼段落：\n\n\`\`\`json\n${JSON.stringify(resultData, null, 2)}\n\`\`\``;
            console.clear();
            console.log(aiPrompt);
            alert(`Dry Run 完成！已進行 ${simulateSeconds} 秒加速物理演練。\n按 F12 打開 Console 即可複製完整 JSON 給 AI 分析。`);
        }

        return resultData;
    },

    // 一鍵複製 Prompt 至剪貼簿功能
    copyPrompt(simulateSeconds = 2) {
        const report = this.executeSingle(simulateSeconds, true);
        const promptText = `請幫我分析以下 3D 風水模擬器的當前格局數據與實時物理觀測結果。請檢查「湧現物理數據」與「五訣分數」是否符合風水理論，並指出當前格局的吉凶優缺點、形煞問題與趨吉避凶建議：\n\n\`\`\`json\n${JSON.stringify(report, null, 2)}\n\`\`\``;

        const btn = document.getElementById('btn-copy-prompt');
        const origText = btn ? btn.innerText : '';
        const showSuccess = () => {
            if (btn) {
                btn.innerText = "✓ 已複製 Prompt！";
                btn.style.background = "#3f6b52";
                setTimeout(() => {
                    btn.innerText = origText;
                    btn.style.background = "var(--gold)";
                }, 2000);
            }
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(promptText).then(showSuccess).catch(() => {
                this.fallbackCopy(promptText);
                showSuccess();
            });
        } else {
            this.fallbackCopy(promptText);
            showSuccess();
        }
    },

    fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
    },

    // 【新增】：全預設與多格局全套覆蓋測試 (Full Suite Dry Run)
    executeSuite(simulateSecondsPerPreset = 3) {
        console.log("[Dry Run Full Suite] 啟動全格局覆蓋率測試...");
        // ★ 保存使用者當前格局快照，測試後自動還原
        const savedState = JSON.parse(JSON.stringify(AppState.current));
        const suiteResults = [];
        const presetsToTest = ['perfect', 'gejiao', 'huilong', 'tianzhan', 'diwang', 'pingyang', 'cliff', 'dijue', 'wugongzhu', 'shixiang', 'zuozhang', 'gufeng', 'jiandao', 'bendi', 'henglong'];

        // 1. 測試所有固定預設
        presetsToTest.forEach(pName => {
            AppState.resetTo(pName);
            AppState.current.presetName = pName;
            const report = this.executeSingle(simulateSecondsPerPreset, true);
            suiteResults.push(report);
        });

        // 2. 測試 5 組隨機生成格局（擴大測試隨機邊界條件覆蓋率）
        for (let i = 1; i <= 5; i++) {
            AppState.resetTo('random');
            AppState.current.presetName = `random_${i}`;
            const report = this.executeSingle(simulateSecondsPerPreset, true);
            suiteResults.push(report);
        }

        const totalWarnings = suiteResults.reduce((acc, r) => acc + r.sanityWarnings.length, 0);
        const suitePrompt = `請幫我分析以下【全格局 Dry Run 全套覆蓋測試報告】（包含 perfect, gejiao, huilong, tianzhan 與 3 組隨機格局）。共發現 ${totalWarnings} 項警示：\n\n\`\`\`json\n${JSON.stringify(suiteResults, null, 2)}\n\`\`\``;

        console.clear();
        console.log(suitePrompt);
        
        // ★ 還原使用者測試前的原始格局
        Object.assign(AppState.current, savedState);
        UI.syncDOM();
        UI.update(true);
        
        alert(`全套 Dry Run 測試完成！共測試 ${suiteResults.length} 種不同格局組合。\n已自動還原您原本的格局。請按 F12 複製 JSON 報告！`);
        
        return suiteResults; // 👈 補上回傳值供 Python 讀取
    },

    execute(simulateSeconds = 4) {
        // 預設執行單格局測試
        return this.executeSingle(simulateSeconds, false);
    }
};

    update(forceBuild = false) {
        let autoChanged = forceBuild;
        let s = AppState.current;
        const noWater = s.w === 'none' || s.w === 'lintou';
        const noSands = (s.ml === 'none' && s.mr === 'none');
        // 修正：空間悖論！青龍逼壓(ya)與白虎抬頭(tai)是山體向內過度龐大擠壓，防風極度嚴密，絕對不可能產生「缺口漏風」的凹風煞。
        // 修正 2：缺少案山(!s.an)只是明堂開闊，並非側/後方防護破洞，不應構成導致冷風灌穴的「凹風煞」。
        // 修正 3：青龍逼壓(ya)或白虎抬頭(tai)代表該側砂體極度厚實無缺口，亦不構成凹風缺口。
        const hasGap = (s.ml==='po'||s.ml==='none'||s.mr==='po'||s.mr==='none') && s.ml !== 'ya' && s.mr !== 'tai';
        const isBadDragon = (s.d === 'si' || s.d === 'po');

        const rules = {
            luo: noWater || s.d === 'pingyang', 
            hua: noWater || s.d === 'pingyang', 
            shixiang: noWater || s.d === 'pingyang', 
            qin: noWater || s.d === 'pingyang', 
            riyue: noWater || s.d === 'pingyang', 
            san: noWater || ['fan','bazi','gejiao','ji','lintou','tfork','pubu','juanlian','hejin','jiaojian','jushui','liulei'].includes(s.w) || s.yue,
            yue: noWater || s.w === 'bazi' || s.w === 'gejiao' || s.w === 'tfork' || s.w === 'pubu' || s.w === 'juanlian' || s.w === 'hejin' || s.w === 'jiaojian' || s.w === 'jushui' || s.san, 
            tantou: !s.an || s.d === 'pingyang' || s.ms === 'di' || s.ms === 'po' || s.ms === 'sunken', 
            guan: !s.an || s.ms === 'di' || s.ms === 'po' || s.ms === 'sunken', 
            tianzhan: !s.xia || s.d === 'pingyang', qingquan: noSands || s.ml === 'po' || s.mr === 'po' || s.ml === 'none' || s.mr === 'none' || s.d === 'pingyang', ao: (!hasGap || s.d === 'pingyang' || s.ml === 'ya' || s.mr === 'tai'), qing: !s.mt || s.d === 'pingyang', 
            
            sherui: s.d === 'pingyang', 
            posui: s.d === 'pingyang' || noSands,
            wugong: s.d === 'pingyang',
            bidao: s.d === 'pingyang' || noSands,
            bendi: s.d === 'pingyang',
            // 【修復：無水、淋頭水、無主山或平洋時均不可開闢天池】
            tianchi: noWater || s.w === 'lintou' || !s.zhu || s.d === 'pingyang',
            
            // 新增物理與地質防呆邏輯
            caoshe: s.d !== 'pingyang', // 草蛇灰線專屬於平洋龍
            tianma: !s.zhu && !s.chao,  // 天馬山必須依附主山或朝山
            feie: !s.xia,               // 飛蛾砂必須有穴星才能展翅
            emei: s.d === 'pingyang',   // 蛾眉砂為微小沙丘，不適用於平洋（會被水淹沒）
            shidao: !s.an || !s.zhu || s.ml === 'none' || s.ml === 'po' || s.mr === 'none' || s.mr === 'po' || s.ms === 'none' || s.ms === 'po' || s.mn === 'none' || s.mn === 'po', // 天心十道必須四獸齊全且無破損

            shu: (isBadDragon || s.d === 'pingyang'), fenzhi: s.d === 'pingyang',
            fengyao: s.d === 'pingyang', hulong: s.d === 'pingyang', 
            // 【修復：橫龍無主山玄武時正需要鬼曜撐背，不應被禁用】
            guiyao: ((!s.zhu && !s.xu && s.d !== 'heng') || (s.d === 'pingyang')),
            zutai: s.d === 'pingyang',
            // 【修復】平洋龍為平原，無高山龍脈特徵，開帳/穿帳/跌斷/渡水必須禁用
            dazhang: s.d === 'pingyang',
            chuanzhang: s.d === 'pingyang',
            dieduan: s.d === 'pingyang',
            dushui: s.d === 'pingyang',
            // 修正：死/破龍為絕地，不得結穴星，必須禁用穴星與太極暈
            xia: isBadDragon,
            // 修正：無穴星、無穴形或死/破龍時，手動點穴無意義，必須禁用
            manualXue: !s.xia || s.xue === 'none' || isBadDragon,
            // 修正：無穴星、無穴形或死/破龍時，太極暈不可能存在，必須禁用
            taiji: !s.xia || s.xue === 'none' || isBadDragon,
            // 修正：仰瓦漏胎煞為穴場缺陷，無穴星或無穴形時不可存在，必須禁用
            yangwa: !s.xia || s.xue === 'none' || isBadDragon,
            // 修正 5：玄武即為後山之靠，若後山為「無」，則玄武必然無法成立
            xu: s.mn === 'none'
        };

        // 【最終防呆保險】強制清除與水法衝突的配合選項，防止任何 UI 路徑漏執行
        // 三叉水(san) 不可與八字水/丁字沖/瀑布/捲簾/合襟/交劍/聚水/日池共存；
        // 半月池(yue) 不可與上述水法及割腳水共存。
        const badWaterForSan = ['fan','bazi','gejiao','ji','lintou','tfork','pubu','juanlian','hejin','jiaojian','jushui','liulei'];
        const badWaterForYue = ['bazi','tfork','pubu','juanlian','hejin','jiaojian','jushui','gejiao'];
        let forcedResetChanged = false;
        if (s.san && (s.w === 'none' || s.w === 'lintou' || badWaterForSan.includes(s.w) || s.yue)) {
            s.san = false;
            forcedResetChanged = true;
        }
        if (s.yue && (s.w === 'none' || s.w === 'lintou' || badWaterForYue.includes(s.w) || s.san)) {
            s.yue = false;
            forcedResetChanged = true;
        }
        if (forcedResetChanged) {
            autoChanged = true;
            const sanBtn = document.querySelector('[data-k="san"]');
            const yueBtn = document.querySelector('[data-k="yue"]');
            if (sanBtn) sanBtn.classList.remove('on');
            if (yueBtn) yueBtn.classList.remove('on');
        }

        // 【太極暈最終同步】無穴星或無穴形時，太極暈絕不可存在，防止狀態悖論
        if (!s.xia || s.xue === 'none') {
            if (s.taiji) {
                s.taiji = false;
                autoChanged = true;
                const taijiBtn = document.querySelector('[data-k="taiji"]');
                if (taijiBtn) taijiBtn.classList.remove('on');
            }
        }

        for (let k in rules) {
            let el = document.querySelector(`[data-k="${k}"]`);
            if (el) {
                el.disabled = rules[k];
                if (rules[k] && s[k]) {
                    s[k] = false;
                    el.classList.remove('on');
                    autoChanged = true;
                }
            } else if (rules[k] && s[k]) {
                // 修正：即使沒有對應的 UI 按鈕，也強制重置狀態，防止無 UI 的防呆失效
                s[k] = false;
                autoChanged = true;
            }
        }

        // 【修復：納入死龍與破龍判斷，確保絕地時穴高滑桿文字必定歸零為平洋】
        const xuehSlider = document.getElementById('xueh-slider');
        if (xuehSlider) {
            const disableXueH = (s.d === 'pingyang' || s.d === 'si' || s.d === 'po' || !s.xia || s.xue === 'none');
            xuehSlider.disabled = disableXueH;
            if (disableXueH && s.xueHeight !== 0) {
                s.xueHeight = 0;
                autoChanged = true;
                xuehSlider.value = 0;
                const xuehVal = document.getElementById('xueh-val');
                if (xuehVal) xuehVal.innerText = "平洋";
            }
        }
        
        // 【新增：段落選項強制重置】防止不合理的字串組合躲過防呆機制
        if (s.d === 'pingyang' && s.suilong !== 'none') { s.suilong = 'none'; autoChanged = true; }
        // 【修正：無水或平洋龍不可有隨龍水】無水則無界水，平洋則無峽谷，隨龍水皆為邏輯悖論
        if ((s.w === 'none' || s.d === 'pingyang') && s.suilong !== 'none') { s.suilong = 'none'; autoChanged = true; }
        if (!s.an && s.ms === 'bijia') { s.ms = 'none'; autoChanged = true; } // 無案山則筆架三台無法成形
        // 【修正：無明堂不可能有「明堂深坑」】明堂深坑必須依賴明堂實體存在，否則即為狀態悖論，應強制清除。
        if (!s.mt && s.ms === 'sunken') { s.ms = 'none'; autoChanged = true; }
        
        // 【修正：平洋龍穴形防呆】平洋龍為平原，不可能有懸崖峭壁的崖穴，強制改為突穴或無穴
        if (s.d === 'pingyang' && s.xue === 'ya') {
            s.xue = s.xia ? 'tu' : 'none';
            autoChanged = true;
        }
        // 【修正：無穴星時強制清除穴形】無穴星不可能有實際穴形，避免狀態矛盾
        if (!s.xia && s.xue !== 'none') {
            s.xue = 'none';
            autoChanged = true;
        }
        // 同步禁用/啟用穴形按鈕（平洋龍禁崖穴；無穴星時禁所有實體穴形）
        document.querySelectorAll('.seg[data-k="xue"] button').forEach(btn => {
            const v = btn.dataset.v;
            const isDisabled = (s.d === 'pingyang' && v === 'ya') || (!s.xia && v !== 'none');
            btn.disabled = isDisabled;
            if (isDisabled) btn.classList.remove('on');
        });

        // 【修正：無水格局禁用隨龍水按鈕】
        if (s.w === 'none' || s.d === 'pingyang') {
            document.querySelectorAll('.seg[data-k="suilong"] button').forEach(btn => {
                btn.disabled = true;
                if (btn.dataset.v !== 'none') btn.classList.remove('on');
            });
        } else {
            document.querySelectorAll('.seg[data-k="suilong"] button').forEach(btn => {
                btn.disabled = false;
            });
        }

        // 【修正：平洋龍砂手狀態防呆】平洋為平原，無高山砂手，「青龍逼壓(ya)」「白虎抬頭(tai)」「砂手破碎(po)」「交牙砂(jiaoya)」皆不可能存在。
        // 玄武後靠與朱雀前案也不可有「破碎」等山體特徵（平洋以水為砂，破碎山體不合地理）
        if (s.d === 'pingyang') {
            if (s.ml === 'ya' || s.ml === 'po' || s.ml === 'jiaoya') { s.ml = 'none'; autoChanged = true; }
            if (s.mr === 'tai' || s.mr === 'po' || s.mr === 'jiaoya') { s.mr = 'none'; autoChanged = true; }

        document.querySelectorAll('.seg[data-k="ml"] button, .seg[data-k="mr"] button').forEach(btn => {

        if (s.d === 'pingyang') {

            if (s.zhijiao === 'ni') { s.zhijiao = 'none'; autoChanged = true; }
            if (s.qingquan) { s.qingquan = false; autoChanged = true; }
            if (s.tantou) { s.tantou = false; autoChanged = true; }
            if (s.zutai) { s.zutai = false; autoChanged = true; }
            if (s.qing) { s.qing = false; autoChanged = true; }
            // 【修復】平洋龍為平原，無高山龍脈特徵，強制清除開帳/穿帳/跌斷/渡水等山龍限定行度
            if (s.dazhang) { s.dazhang = false; autoChanged = true; }
            if (s.chuanzhang) { s.chuanzhang = false; autoChanged = true; }
            if (s.dieduan) { s.dieduan = false; autoChanged = true; }
            if (s.dushui) { s.dushui = false; autoChanged = true; }

        // 同步禁用平洋龍不適用的行度選項（未剝換／橈棹逆水反）
        document.querySelectorAll('.seg[data-k="bohuan"] button, .seg[data-k="zhijiao"] button').forEach(btn => {
            const v = btn.dataset.v;

            if (shouldDisable) btn.classList.remove('on');
        });
        // 【修復】同步禁用平洋龍不適用的龍脈行度按鈕（開帳/穿帳/跌斷/渡水）
        document.querySelectorAll('.tog[data-k="dazhang"], .tog[data-k="chuanzhang"], .tog[data-k="dieduan"], .tog[data-k="dushui"]').forEach(btn => {

            if (shouldDisable) btn.classList.remove('on');
        });

        // 【修正：平洋龍地形防呆】平洋龍為平原，地形必須平坦，禁止地勢前傾或後高
        if (s.d === 'pingyang') {
            if (s.terrain !== 'flat') { s.terrain = 'flat'; autoChanged = true; }
        }
        // 同步禁用平洋龍不適用的地形選項（非平坦）
        document.querySelectorAll('.seg[data-k="terrain"] button').forEach(btn => {
            const v = btn.dataset.v;
            const shouldDisable = s.d === 'pingyang' && v !== 'flat';
            btn.disabled = shouldDisable;
            if (shouldDisable) btn.classList.remove('on');
        });

        // 【終極防呆：無水則水口神獸與相關裝飾全部失效】水口神獸必須有水才存在意義，否則為邏輯悖論
        if (s.w === 'none' || s.w === 'lintou') {
            if (s.luo || s.hua || s.shixiang || s.qin || s.riyue) {
                s.luo = s.hua = s.shixiang = s.qin = s.riyue = false;
                autoChanged = true;
                // 同步清除 UI 按鈕狀態
                ['luo', 'hua', 'shixiang', 'qin', 'riyue'].forEach(k => {
                    const el = document.querySelector(`[data-k="${k}"]`);
                    if (el) el.classList.remove('on');
                });
            }
            // 三叉水與半月池亦不應存在
            if (s.san || s.yue) {
                s.san = s.yue = false;
                autoChanged = true;
            }
        }

        // 【修正：平洋龍水法防呆】平洋龍為平原，無高山崖壁，不可能有「淋頭水」「瀑布盪胸」「捲簾退財」「流淚水」等需高差之水法
        const pingyangForbiddenWater = ['lintou', 'pubu', 'juanlian', 'liulei'];
        // 【修正：平洋龍水法防呆】平洋為平原，無高山崖壁，不可有需高差/峽谷之凶水，強制轉為玉帶水
        const pingyangForbiddenWReset = ['lintou','pubu','juanlian','liulei','ji','fan','gejiao','bazi','tfork','jiaojian'];
        if (s.d === 'pingyang' && pingyangForbiddenWReset.includes(s.w)) {
            s.w = 'you';

        }
        // 同步禁用平洋龍不適用的水法選項（需高山/峽谷地形之水法皆不可選）
        const pingyangForbiddenW = pingyangForbiddenWReset;
        document.querySelectorAll('.seg[data-k="w"] button').forEach(btn => {

            if (xuehVal) {
                const labels = ["平洋", "谷底", "淺山", "半山腰", "高山懸崖"];
                xuehVal.innerText = labels[Math.floor((AppState.current.xueHeight || 0) / 5)] || `${AppState.current.xueHeight}`;

    drawRadar(dt) {
        const rCv = document.getElementById('radar');
        const rCtx = rCv.getContext('2d');
        const w = rCv.width, h = rCv.height;
        const cx = w/2, cy = h/2+5, R = 60;

        rCtx.clearRect(0,0,w,h);
        rCtx.strokeStyle = 'rgba(0,0,0,0.15)';
        rCtx.lineWidth = 1;
        const labs = ['龍','穴','砂','水','向'];

        for(let r=1; r<=5; r++){
            rCtx.beginPath();
            for(let k=0; k<=5; k++){
                const a = -Math.PI/2 + k*2*Math.PI/5;
                const x = cx + Math.cos(a)*R*r/5, y = cy + Math.sin(a)*R*r/5;
                k ? rCtx.lineTo(x,y) : rCtx.moveTo(x,y);
            }
            rCtx.stroke();
        }

        rCtx.fillStyle = '#333333';
        rCtx.font = 'bold 12px "Noto Serif TC", serif';
        rCtx.textAlign = 'center';
        rCtx.textBaseline = 'middle';
        for(let k=0; k<5; k++){
            const a = -Math.PI/2 + k*2*Math.PI/5;
            rCtx.fillText(labs[k], cx + Math.cos(a)*(R+15), cy + Math.sin(a)*(R+15));
        }

        // 修復：優先採用 AppState.smoothedScores 低通濾波分值，並 Clamp 在 0~100 區間，消除雷達圖頂點二次彈簧超調振盪
        const rawTarget = AppState.smoothedScores || Rules.computeScores();
        // 【修復：加入 isFinite 數值防護，防止 NaN 感染雷達圖陣列】
        const target = rawTarget.map(v => Number.isFinite(v) ? Math.max(0, Math.min(100, v)) : 50);
        rCtx.beginPath();

        const smoothDt = Math.min(dt, 0.1);
        let logicDt = smoothDt * 60;

        for(let k=0; k<5; k++){
            let currentDisp = Number.isFinite(this.radarDisp[k]) ? this.radarDisp[k] : 50;
            this.radarDisp[k] = currentDisp + (target[k] - currentDisp) * (1.0 - Math.pow(0.75, logicDt));

            const v = Math.min(R, Math.max(0, this.radarDisp[k]/100 * R));
            const a = -Math.PI/2 + k*2*Math.PI/5;
            const x = cx + Math.cos(a)*v, y = cy + Math.sin(a)*v;
            k ? rCtx.lineTo(x, y) : rCtx.moveTo(x, y);
        }

        rCtx.closePath();
        rCtx.fillStyle = 'rgba(185,138,46,0.4)';
        rCtx.fill();
        rCtx.strokeStyle = '#b98a2e';
        rCtx.lineWidth = 2;
        rCtx.stroke();
    }
};

/* ==========================================
   4. THREE.JS ENGINE (場景與地貌拓撲)
   ========================================== */
const Engine3D = {
    scene: null, camera: null, renderer: null, controls: null,
    terrainGeo: null, terrainMesh: null, hMap: null, waterMesh: null,
    obsGroup: null, swGroup: null, windGroup: null, windLines: [],
    heatCanvas: null, hCtx: null, heatTex: null, wTex: null,
    raycaster: new THREE.Raycaster(), mouse: new THREE.Vector2(),
    obsGeo: new THREE.ConeGeometry(2, 10, 4),
    obsMat: new THREE.MeshBasicMaterial({color:0x111111}),
    swGeo: new THREE.RingGeometry(1, 1.5, 32),

    init() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0xdfe9f5); // 淺色模式：明亮的白天天空藍
        // this.scene.fog = new THREE.FogExp2(0xdfe9f5, 0.00145); // 拿掉：遠景白晝大氣

        this.camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1500);
        // 優化攝影機初始視角，使明堂與河道居中
        this.camera.position.set(0, 150, 190);

        // ★ 開啟 preserveDrawingBuffer: true，保證 Dry Run 工具進行全像素光學診斷時不會讀到空白幀
        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", preserveDrawingBuffer: true });
        this.renderer.setPixelRatio(window.devicePixelRatio); // 取消像素比限制，讓高解析度螢幕發揮最高銳利度
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 0.65; // 調降曝光度至 0.65，壓制整體高光溢出 // 微調曝光度配合 sRGB
        this.renderer.outputEncoding = THREE.sRGBEncoding; // 加入 sRGB 色彩編碼，讓顏色更飽和真實，消除灰濛死白感
        
        // 開啟陰影渲染引擎，提升畫面層次感
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        document.body.appendChild(this.renderer.domElement);

        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.target.set(0, -5, 20);
        this.controls.maxPolarAngle = Math.PI/2 - 0.05;
        this.controls.enableKeys = false; // 禁用 OrbitControls 預設按鍵平移，避免與手動旋轉衝突
        this.controls.screenSpacePanning = false; // 改為 false：按住中鍵/右鍵平移時，保持在 XZ 地平面滑動，不會上下漂移改變視角
        this.controls.minDistance = 2;   // 限制滾輪縮放最小距離，防止穿透目標點導致視角翻轉
        this.controls.maxDistance = 500; // 限制滾輪縮放最大距離
        this.controls.zoomSpeed = 1.2;   // 優化滾輪縮放順暢度
        // 設定滑鼠按鍵：左鍵旋轉，中鍵(按住滾輪)與右鍵皆為畫面平移
        this.controls.mouseButtons = {
            LEFT: THREE.MOUSE.ROTATE,
            MIDDLE: THREE.MOUSE.PAN,
            RIGHT: THREE.MOUSE.PAN
        };

        // 【維度三：地貌渲染】實作 Unreal Bloom (輝光泛光特效)
        // 讓聚氣的「太極暈」、高光水面與凶煞紅光產生極具神聖感的光學溢出
        if (typeof THREE.EffectComposer !== 'undefined') {
            this.composer = new THREE.EffectComposer(this.renderer);
            const renderPass = new THREE.RenderPass(this.scene, this.camera);
            this.composer.addPass(renderPass);

            this.bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                0.35, // 強度 (Intensity)：調降以避免畫面過曝糊在一起
                0.65, // 半徑 (Radius)：稍微收斂光暈範圍

            );
            this.composer.addPass(this.bloomPass);

        this.terrainGeo = new THREE.PlaneGeometry(CONFIG.tSize, CONFIG.tSize, CONFIG.tSeg, CONFIG.tSeg);
        this.terrainGeo.rotateX(-Math.PI/2);
        this.hMap = new Float32Array((CONFIG.tSeg+1)*(CONFIG.tSeg+1));

        this.heatCanvas = document.createElement('canvas');
        this.heatCanvas.width = 256; this.heatCanvas.height = 256;
        this.hCtx = this.heatCanvas.getContext('2d');
        this.hCtx.fillStyle = 'black'; this.hCtx.fillRect(0,0,256,256);
        this.heatTex = new THREE.CanvasTexture(this.heatCanvas);
        this.heatTex.wrapS = this.heatTex.wrapT = THREE.ClampToEdgeWrapping;
        this.heatTex.anisotropy = this.renderer.capabilities.getMaxAnisotropy(); // 開啟各向異性過濾，讓傾斜視角與遠處的熱力圖保持銳利不模糊

        const terrainMat = new THREE.MeshStandardMaterial({
            vertexColors: true, 
            roughness: 0.96, // 吸收 Qwen版：提高粗糙度，消除塑膠反光感，更貼近真實土壤與岩石
            metalness: 0.03, // 吸收 Qwen版：降低金屬度，呈現自然漫反射
            flatShading: false
        });

        // 確保編譯器自動注入 vUv 到 Shader 內，避免 TypeError 崩潰
        terrainMat.defines = { USE_UV: '' };

        terrainMat.onBeforeCompile = (shader) => {
            shader.uniforms.heatmap = { value: this.heatTex };
            // 抓取世界座標傳遞給像素著色器 (Fragment Shader)
            shader.vertexShader = `
                varying vec3 vWorldPosMist;
                ${shader.vertexShader}
            `.replace(
                `#include <worldpos_vertex>`,
                `
                #include <worldpos_vertex>
                vWorldPosMist = (modelMatrix * vec4(transformed, 1.0)).xyz;
                `
            );
            shader.fragmentShader = `
                uniform sampler2D heatmap;
                varying vec3 vWorldPosMist;
                ${shader.fragmentShader}
            `.replace(
                `#include <emissivemap_fragment>`,
                `
                #include <emissivemap_fragment>
                #ifdef USE_UV
                    vec4 heatColor = texture2D(heatmap, vUv);
                    // 修正：進一步調降熱力圖的發光強度至 0.4，防止地形高光區泛紅過曝
                    totalEmissiveRadiance += heatColor.rgb * 0.4; 
                #endif
                `
            ).replace(
                `#include <fog_fragment>`,
                `
                #include <fog_fragment>
                // 山谷地氣霧功能已拿掉，保持地貌最原始清晰的色彩
                `
            );
        };

        this.terrainMesh = new THREE.Mesh(this.terrainGeo, terrainMat);
        this.terrainMesh.castShadow = true;     // 讓山峰能互相遮擋投射陰影
        this.terrainMesh.receiveShadow = true;  // 讓地面能接收陰影
        this.scene.add(this.terrainMesh);

        const wTexCv = document.createElement('canvas'); wTexCv.width = 256; wTexCv.height = 256;
        const wTCtx = wTexCv.getContext('2d');
        // 修正：改用細微流線噪點取代巨大圓形斑點，徹底消除水面上的圓圈圖案
        wTCtx.fillStyle = 'rgba(255,255,255,0.06)';
        for(let i=0;i<500;i++) {
            wTCtx.fillRect(Math.random()*256, Math.random()*256, Math.random()*4+1, Math.random()*1.5+0.5);
        }
        this.wTex = new THREE.CanvasTexture(wTexCv);
        this.wTex.wrapS = this.wTex.wrapT = THREE.RepeatWrapping;
        // 增加各向異性過濾，消除遠處河道貼圖的模糊感
        this.wTex.anisotropy = this.renderer.capabilities.getMaxAnisotropy(); 
        const waterGeo = new THREE.PlaneGeometry(CONFIG.tSize, CONFIG.tSize, 100, 100); waterGeo.rotateX(-Math.PI/2); // 提高網格精度以顯示細膩波浪
        // 增加 metalness 與降低 roughness 讓水面具備更真實的鏡面反光特性
        // 修正：調高粗糙度 (roughness: 0.45)、降低金屬度 (metalness: 0.1)，防止太陽高光反射過度爆白
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x1d758f, map: this.wTex, transparent: true, opacity: 0.85, roughness: 0.35, metalness: 0.2 });
        waterMat.onBeforeCompile = (shader) => {
            shader.uniforms.time = { value: 0 };
            shader.uniforms.riverType = { value: 0 };
            shader.vertexShader = `
                varying vec2 vWorldXZ;
                varying vec3 vWorldPosGeo;
                uniform float time;
                ${shader.vertexShader}
            `.replace(
                `#include <begin_vertex>`,
                `
                #include <begin_vertex>
                vWorldXZ = position.xz; // 抓取世界 XZ 座標
                vWorldPosGeo = (modelMatrix * vec4(position, 1.0)).xyz; // 抓取全域坐標供光學計算
                // ★ 限制微波振幅在 0.3 以內，防止平洋淺水區波谷穿透河床造成黑面穿模 (Z-Fighting)
                float wave1 = sin(position.x * 0.05 + time * 1.2) * 0.20 * cos(position.z * 0.06 + time * 0.8);
                float wave2 = sin(position.x * 0.15 - time) * 0.10;
                transformed.y += wave1 + wave2;
                `
            );
            shader.fragmentShader = `
                uniform float time;
                uniform int riverType;
                varying vec2 vWorldXZ;
                varying vec3 vWorldPosGeo;
                ${shader.fragmentShader}
            `.replace(
                `#include <map_fragment>`,
                `
                vec2 flowUV = vUv;
                float rx = vWorldXZ.x;
                float shift = 0.0;

                if (riverType == 1) shift = sin(rx * 0.15) * 8.0; 
                else if (riverType == 0) shift = cos(rx * 0.05) * 15.0; 
                else if (riverType == 2) shift = -cos(rx * 0.05) * 15.0; 
                else if (riverType == 3) shift = abs(rx) * 0.5; 

                vec2 flowUV1 = flowUV;
                vec2 flowUV2 = flowUV * 1.5; 
                
                // 【修復：靜水湖泊流速設為極微弱微波，河流維持正常前進流速】
                float flowSpeedX = (riverType == 5) ? (time * 0.005) : (time * 0.04);
                float flowSpeedY = (riverType == 5) ? (time * 0.005) : (shift / 350.0);
                
                flowUV1.x -= flowSpeedX;
                flowUV1.y -= flowSpeedY;
                
                flowUV2.x -= flowSpeedX * 0.5;
                flowUV2.y -= flowSpeedY + (time * 0.01);

                float rz = vWorldXZ.y;
                float riverRefZ = (riverType == 0 || riverType == 1 || riverType == 3 || riverType == 6) ? 70.0 : ((riverType == 2) ? 55.0 : ((riverType == 5) ? -10.0 : ((riverType == 7) ? 35.0 : 30.0)));
                float rS = riverRefZ + shift;
                float distToShore = abs(rz - rS);
                if (riverType == 5 && rz > -3.0) distToShore = 999.0; // 僅淋頭水做穴後限制
                if (riverType == 7) distToShore = length(vec2(vWorldXZ.x, rz - 35.0)) - 10.0; // 天心湖圓形水體
                    if (riverType == 6) { // 丁字沖水 (T-Fork)：加入垂直衝射支流距離

                    }
                float depthFactor = clamp(1.0 - (distToShore / 25.0), 0.0, 1.0); // 0=河岸外透明, 1=河心深潭
                
                // Fresnel 視角反射效應 (讓遠處的水面更像鏡子)
                vec3 viewDir = normalize(cameraPosition - vWorldPosGeo);
                float fresnel = pow(1.0 - max(dot(viewDir, vec3(0.0, 1.0, 0.0)), 0.0), 3.0);

                    diffuseColor.a *= mix(0.0, 1.0, smoothstep(0.0, 0.2, depthFactor));
                #endif
                `
            );
            waterMat.userData.shader = shader;
