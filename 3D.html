                } else if (state.road === 'sickle') {
                    // 【生態移植：鐮刀煞 (Sickle Road)】比反弓更銳利的近距離切腰彎道
                    let sickleCurve = 30 - Math.pow(dxLair / 40, 2) * 20; 
                    let distToSickle = Math.abs(dzLair - sickleCurve);
                    if (distToSickle < 3.5) {
                        let roadY = y + 0.15; // ★ 貼地：消除鐮刀路懸空
                        let blend = Math.pow(1.0 - distToSickle / 3.5, 1.2);
                        y = y * (1 - blend * 0.3) + roadY * (blend * 0.3);
                    }
                } else if (state.road === 'zuocha' || state.road === 'youcha') {
                    // 左/右脅路 (斜擦邊而過)
                    let sign = state.road === 'zuocha' ? -1 : 1;
                    let expectedX = sign * (dzLair * 0.4 + 14); // 斜率
                    let distToRoad = Math.abs(dxLair - expectedX) * 0.8; 
                    if (distToRoad < 3.0 && dzLair > -15 && dzLair < 115) {
                        let roadY = y + 0.15; // ★ 貼地：消除斜路切山懸空
                        let blend = Math.pow(1.0 - distToRoad / 3.0, 1.5);
                        y = y * (1 - blend * 0.3) + roadY * (blend * 0.3);
                    }
                } else if (state.road === 'jiandao') {
                    // 剪刀煞 (Y字型交叉路)
                    let leftDist = Math.abs(dxLair + (dzLair-10)*0.6) * 0.8;
                    let rightDist = Math.abs(dxLair - (dzLair-10)*0.6) * 0.8;
                    let distToRoad = Math.min(leftDist, rightDist);
                    if (distToRoad < 3.0 && dzLair > 0 && dzLair < 145) {
                        let roadY = y + 0.15; // ★ 貼地：消除剪刀叉路懸空
                        let blend = Math.pow(1.0 - distToRoad / 3.0, 1.5);
                        y = y * (1 - blend * 0.3) + roadY * (blend * 0.3);
                    }
                } else if (state.road === 'lanyao') {
                    // 【高架攔腰煞】：明堂正前方橫跨一座高聳的陸橋/土堤
                    if (Math.abs(dzLair - 20) < 3.5 && Math.abs(dxLair) < 80) {
                        y = Math.max(y, 18.0); // 霸道橫切的高架
                    }
                } else if (state.road === 'wuwei') {
                    // 【無尾巷 (Dead-End)】：道路直沖後被絕壁堵死，死氣鬱結
                    if (Math.abs(dxLair) < 3.5 && dzLair > 20 && dzLair < 145) {
                        let roadY = y + 0.15; // ★ 貼地巷道
                        let blend = Math.pow(1.0 - Math.abs(dxLair) / 3.5, 1.5);
                        y = y * (1 - blend * 0.3) + roadY * (blend * 0.3);
                    }
                    if (Math.abs(dxLair) < 8 && Math.abs(dzLair - 20) < 2) {
                        y = Math.max(y, 25.0); // 巷尾高牆橫截堵死
                    }
                }
            }
            
            // 【孤陽塔煞 (Tower Sha)】：前方突兀立起的現代尖塔或電塔
            if (state.tasha && Math.sqrt(Math.pow(dxLair-20, 2) + Math.pow(dzLair-20, 2)) < 3.5) {
                y = Math.max(y, 65.0); 
            }
            
            // 【生態移植：大環境地勢傾斜 (Global Terrain Slope)】
            if (state.terrain === 'slope') {
                y -= Math.max(0, dzLair * 0.15); // 前方急遽傾斜，退氣不聚
            } else if (state.terrain === 'backhigh') {
                y += Math.max(0, -dzLair * 0.15); // 後方高仰，如靠山
            } else if (state.terrain === 'fanpo') {
                y += Math.max(0, dzLair * 0.18); // 【明堂反坡】：前方高聳如壁，水氣逆流倒灌，明堂逼壓
            }
            
            let gX = Math.round((x+tSize/2)/(tSize/tSeg)), gZ = Math.round((z+tSize/2)/(tSize/tSeg));
            this.hMap[gZ*(tSeg+1) + gX] = y;
        } // 結束階段一：基礎風水地形生成

        // 階段二：執行水力侵蝕與風化平滑 (吸收 Qwen 版優點，讓山脈雕刻出溝壑與自然坡面)
        this.erodeTerrain(2);

        // 【修復：輕量河道防穿模與平滑】保留微地形細節，消除多餘平滑迴圈
        if (state.w !== 'none') {
            let waterLevel = (state.d === 'pingyang') ? -3.5 : -12.0;
            let minRiverDepth = waterLevel - 0.8;
            let lxWaterGuard = state.manualXue ? (state.xueX || 0) : 0;
            
            for (let gz = 0; gz <= tSeg; gz++) {
                for (let gx = 0; gx <= tSeg; gx++) {
                    let x = (gx / tSeg) * tSize - tSize / 2;
                    let z = (gz / tSeg) * tSize - tSize / 2;
                    let idx = gz * (tSeg + 1) + gx;
                    
                    // 限制全域極端高度
                    this.hMap[idx] = Math.max(-45, Math.min(130, this.hMap[idx]));
                }
            }
        }

        // 階段三：套用侵蝕後的高度，更新網格頂點與計算地貌顏色
        for (let i = 0; i < pos.length; i += 3) {
            let x = pos[i], z = pos[i+2];
            let lxColor = state.manualXue ? (state.xueX || 0) : 0;
            let lzColor = state.manualXue ? (state.xueZ || 5.0) : 5.0;
            let dxLair = x - lxColor, dzLair = z - lzColor;
            let gX = Math.round((x+tSize/2)/(tSize/tSeg)), gZ = Math.round((z+tSize/2)/(tSize/tSeg));
            let y = this.hMap[gZ*(tSeg+1) + gX]; // 讀取侵蝕過後的新高度
            
            // 【新增：高山天池平靜水面拉平與著色標記】
            let distToPeak = Math.sqrt(x*x + Math.pow(z+60, 2));
            let tianchiWaterLevel = 33 * (state.zhuScale || 1.0); 
            let isLakeSurface = (state.tianchi && state.zhu && distToPeak < 15 && y < tianchiWaterLevel);
            
            // 【修復：同步更新物理碰撞網格 hMap，確保粒子能在天池水面平穩滑行不沉底】
            if (isLakeSurface) {
                y = tianchiWaterLevel;
                this.hMap[gZ*(tSeg+1) + gX] = tianchiWaterLevel;
            }
            pos[i+1] = y;

            // 加入地表噪聲擾動，打破死板的水平顏色分層，產生真實的斑駁植被與鋸齒狀林線
            let colorNoise = this.pNoise(x * 1.5, z * 1.5, 2) * 0.12; 
            // 修正：歸一化海拔高度，適應前傾斜坡，防止低海拔山丘被誤算為極低值
            let nH = Math.max(0, Math.min(1.0, ((y + 35.0) / 95.0) + colorNoise));

            // 【優化：基於坡度的動態材質混合 (Slope-based Texturing)】
            // 讀取周圍高度計算真實坡度，陡坡自動裸露岩石，平緩處才生長植被
            let gX_slope = Math.max(0, Math.min(CONFIG.tSeg, gX));
            let gZ_slope = Math.max(0, Math.min(CONFIG.tSeg, gZ));
            let hL = this.hMap[gZ_slope * (tSeg + 1) + Math.max(0, gX_slope - 1)] || y;
            let hR = this.hMap[gZ_slope * (tSeg + 1) + Math.min(tSeg, gX_slope + 1)] || y;
            let hU = this.hMap[Math.max(0, gZ_slope - 1) * (tSeg + 1) + gX_slope] || y;
            let hD = this.hMap[Math.min(tSeg, gZ_slope + 1) * (tSeg + 1) + gX_slope] || y;
            let slope = Math.max(Math.abs(hL - hR), Math.abs(hU - hD)); // 計算最大高差代表坡度

            // 修正：精準判定是否位於「實際河道 channel 內部」，避免前傾山坡與低地被誤塗成深海藍色
                let isActualRiverChannel = false;
                if (state.w !== 'none') {
                    let lairZRefColor = (state.manualXue ? (state.xueZ || 0) : 5.0);
                    let wZColor = 30;
                    if (['you','jiuqu','bazi','tfork','juanlian','pubu','liulei'].includes(state.w)) wZColor = 70;
                    else if (state.w==='ji'||state.w==='fan') wZColor = 55;
                    else if (state.w==='lintou') wZColor = -10;
                    wZColor += (lairZRefColor - 5.0);

                    let rSColor = wZColor;
                    if (state.d === 'pingyang') rSColor += Math.sin(dxLair * 0.08) * 20.0 + Math.cos(dxLair * 0.18) * 8.0;
                    if (state.w === 'jiuqu') { let zCurveC = Math.sin(dxLair * 0.12); rSColor += Math.sign(zCurveC) * Math.pow(Math.abs(zCurveC), 0.5) * 14; }
                    if (state.w === 'you') rSColor += (1.0 - Math.pow(dxLair / 90.0, 2)) * 28.0;
                    if (state.w === 'fan') rSColor -= Math.cos(dxLair*0.05)*15;
                    if (state.w === 'bazi') rSColor += Math.abs(dxLair)*0.5;

                    let dRColor = Math.abs(z - rSColor);
                if (state.w === 'tfork' && Math.abs(x) < 12 && z > 20 && z < 75) dRColor = 0; // 丁字沖垂直支流
                // 修正：淋頭水僅影響穴後 (z<-3)，穴前不得被誤判為河道水域
                if (state.w === 'lintou' && z > lairZRefColor - 3.0) dRColor = 999;
                if (dRColor < 22.0) isActualRiverChannel = true;
            }

                if (isActualRiverChannel && y < -10.0) {
                    // 真正的河床過渡：僅在河道溝槽內部著色深沉青墨色
                    let depth = Math.max(0, Math.min(1.0, (-10.0 - y) / 15.0));
                    c.setRGB(0.05 + depth * 0.05, 0.20 - depth * 0.1, 0.25 - depth * 0.1);
                } else {
                // 陸地山坡與谷底：依海拔與坡度渲染自然植被（綠色/褐色/岩石），徹底解決海洋視覺 BUG
                if (nH < 0.28) {
                    let t = nH / 0.28;
                    c.setHSL(0.33 - t * 0.06, 0.45 - t * 0.15, 0.18 + t * 0.10);
                } else if (nH < 0.65) {
                    let t = (nH - 0.28) / 0.37;
                    c.setHSL(0.27 - t * 0.15, 0.30 - t * 0.20, 0.28 + t * 0.12);
                } else if (nH < 0.88) {
                    let t = (nH - 0.65) / 0.23;
                    c.setHSL(0.10, 0.15 - t * 0.10, 0.40 + t * 0.10);
                } else {
                    let t = (nH - 0.88) / 0.12;
                    c.setHSL(0.6, 0.05, 0.50 + t * 0.45);
                }

                // 若坡度過陡 (大於 2.5)，植被無法附著，強制渲染為裸露風化岩石 (廉貞煞氣特徵)
                if (slope > 2.5) {
                    let rockFactor = Math.min(1.0, (slope - 2.5) / 3.0);
                    tempRockColor.setHSL(0.08, 0.15, 0.35 + colorNoise); // 灰褐色岩盤
                    c.lerp(tempRockColor, rockFactor);
                }

                // 【新增：高山天池湛藍湖水顏色】
                if (isLakeSurface) {
                    c.setRGB(0.08, 0.45, 0.55); // 深邃的翡翠湖水藍
                }

                // 【新增：道路鋪面顏色 (灰土/柏油色)】
                let isRoadSurface = false;
                if (state.road === 'huanbao') {
                    let roadCurve = 10 - Math.pow(dxLair / 35, 2) * 12; 
                    if (Math.abs(dzLair - roadCurve) < 3.0) isRoadSurface = true;
                } else if (state.road === 'zhichong') {
                    if (Math.abs(dxLair) < 2.5 && dzLair > 5 && dzLair < 145) isRoadSurface = true;
                } else if (state.road === 'sickle') {
                    // 【生態移植】鐮刀煞道路著色
                    let sickleCurve = 30 - Math.pow(dxLair / 40, 2) * 20; 
                    if (Math.abs(dzLair - sickleCurve) < 3.0) isRoadSurface = true;
                } else if (state.road === 'zuocha' || state.road === 'youcha') {
                    let sign = state.road === 'zuocha' ? -1 : 1;
                    let expectedX = sign * (dzLair * 0.4 + 14);
                    if (Math.abs(dxLair - expectedX) * 0.8 < 2.5 && dzLair > -15 && dzLair < 115) isRoadSurface = true;
                } else if (state.road === 'jiandao') {
                    let leftDist = Math.abs(dxLair + (dzLair-10)*0.6) * 0.8;
                    let rightDist = Math.abs(dxLair - (dzLair-10)*0.6) * 0.8;
                    if (Math.min(leftDist, rightDist) < 2.5 && dzLair > 0 && dzLair < 145) isRoadSurface = true;
                }
                
                if (isRoadSurface && !isLakeSurface) {
                    c.setRGB(0.35, 0.35, 0.35); // 灰黑色路面
                }

                // 【新增：穴土五色材質渲染】動態跟隨不同穴形的 Z 軸中心著色（相對座標修正）
                let dynTaijiOffset = (state.xue === 'wo') ? -10.0 : (state.xue === 'ru' ? 7.0 : (state.xue === 'qian' ? -5.0 : 0.0));
                let dynTaijiZ_visual = lzColor + dynTaijiOffset;
                let inTaijiVisual = (state.xia && Math.abs(x - lxColor) < 20 && z > (dynTaijiZ_visual - 10) && z < (dynTaijiZ_visual + 13));
                
                if (inTaijiVisual && slope < 1.0 && y > -2) {
                    let soilCenterFactor = Math.exp(-(Math.pow(x - lxColor, 2) + Math.pow(z - dynTaijiZ_visual, 2))/100);
                    if (state.soil === 'wuse') {
                        // 五色土：呈現紫紅、暖黃交織的祥瑞生機
                        tempSoilColor.setHSL(0.08 + colorNoise * 0.4, 0.65, 0.45); 
                        c.lerp(tempSoilColor, soilCenterFactor * 0.85);
                    } else if (state.soil === 'yuni') {
                        // 淤泥：呈現死氣沉沉、潮濕腐敗的黑灰色
                        tempSoilColor.setHSL(0.0, 0.0, 0.15);
                        c.lerp(tempSoilColor, soilCenterFactor * 0.95);
                    } else if (state.soil === 'wanshi') {
                        // 頑石：呈現蒼白反光、毫無生氣的死硬岩盤
                        tempSoilColor.setHSL(0.1, 0.05, 0.65);
                        c.lerp(tempSoilColor, soilCenterFactor * 0.95);
                    }
                }
            }
            cols.push(c.r, c.g, c.b);
        }
        // 根據水法吉凶動態調整水體視覺材質（吉水清澈呈翡翠碧波，凶水渾濁呈泥黃血煞）
        if (this.waterMesh) {
            let isBadWater = ['gejiao', 'lintou', 'fan', 'bazi', 'ji', 'tfork', 'juanlian', 'pubu', 'liulei', 'jiaojian'].includes(state.w);
            if (isBadWater) {
                this.waterMesh.material.color.setHex(0x6b4a31); // 更具土石流質感的泥黃煞水
                this.waterMesh.material.opacity = 0.98;
                this.waterMesh.material.roughness = 0.9; // 完全粗糙，無光澤
                this.waterMesh.material.metalness = 0.0;
            } else {
                this.waterMesh.material.color.setHex(0x0a91a1); // 提亮為明亮清透的翡翠琉璃藍
                this.waterMesh.material.opacity = 0.75; // 提高透明度，透出下方加深顏色的河床
                this.waterMesh.material.roughness = 0.02; // 極致光滑，形成強烈的高光反射
                this.waterMesh.material.metalness = 0.65; // 高金屬度讓水面波光粼粼
            }
        }

        this.terrainGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(cols), 3));
        this.terrainGeo.attributes.color.needsUpdate = true;
        this.terrainGeo.computeVertexNormals(); this.terrainGeo.attributes.position.needsUpdate = true;
        
        // 【優化：動態生成植被 (Dynamic Vegetation)】
        // 根據地形坡度與高度，自動在平緩的陽坡或明堂周圍生長防風林
        if (this.treeMesh) {
            let treeCount = 0;
            const dummy = new THREE.Object3D();
            let lx_tree = AppState.current.xueX || 0;
            let lz_tree = AppState.current.manualXue ? AppState.current.xueZ : 5.0;

            for (let i = 0; i < pos.length; i += 3) {
                let x = pos[i], y = pos[i+1], z = pos[i+2];
                
                // 只在特定高度 (平原到淺山腰，不生長於深水或太高的寒冷山頂)
                if (y > -1 && y < 32) {
                    let ny = this.terrainGeo.attributes.normal.array[i+1];
                    
                    let dxLairTree = x - lx_tree;
                    let dzLairTree = z - lz_tree;
                    let distToLairTree = Math.sqrt(dxLairTree * dxLairTree + dzLairTree * dzLairTree);

                    // 【修復：排除道路路面與水域河道，避免樹木穿模長在馬路與河中】
                    let isOnRoad = false;
                    if (state.road === 'zhichong' && Math.abs(dxLairTree) < 4.0 && dzLairTree > 0) isOnRoad = true;
                    if (state.road === 'huanbao' && Math.abs(dzLairTree - (10 - Math.pow(dxLairTree / 35, 2) * 12)) < 4.5) isOnRoad = true;
                    if (state.w !== 'none' && y <= ((state.d === 'pingyang') ? -2.5 : -10.0)) isOnRoad = true;
                    if (isOnRoad) continue;

                    let treeProb = 0.06;
                    let isBehindOrSide = (dzLairTree < 5 || Math.abs(dxLairTree) > 12);
                    
                    if (distToLairTree > 12 && distToLairTree < 45 && isBehindOrSide && AppState.current.xia) {
                        treeProb = 0.25;
                    } else if (distToLairTree <= 10 && AppState.current.xia) {
                        treeProb = 0.0;
                    }

                    if (ny > 0.82 && Math.random() < treeProb && treeCount < 3000) {
                        dummy.position.set(x, y, z);
                        
                        // 穴後大樹更高聳 (古木參天感)，其餘為一般植被
                        let isAncientTree = (distToLairTree > 12 && distToLairTree < 35 && dzLairTree < 0);
                        let baseScale = isAncientTree ? (1.0 + Math.random() * 0.9) : (0.4 + Math.random() * 0.7);
                        
                        dummy.scale.set(baseScale, baseScale * (isAncientTree ? 1.4 : 1.1), baseScale);
                        dummy.rotation.y = Math.random() * Math.PI;
                        dummy.updateMatrix();
                        this.treeMesh.setMatrixAt(treeCount, dummy.matrix);
                        treeCount++;
                    }
                }
            }
            this.treeMesh.count = treeCount; // 只渲染實際生成的數量
            this.treeMesh.instanceMatrix.needsUpdate = true;
        }
    },

    getTerrainY(x, z) {
        let gX = (x+CONFIG.tSize/2)/(CONFIG.tSize/CONFIG.tSeg), gZ = (z+CONFIG.tSize/2)/(CONFIG.tSize/CONFIG.tSeg);
        // 修復：Clamp 邊界邊緣索引，防止頂格點擊或粒子到達地圖邊緣時誤判定出界
        if(gX < 0 || gX > CONFIG.tSeg || gZ < 0 || gZ > CONFIG.tSeg) return {y:-100, nx:0, nz:0};
        let x0 = Math.min(CONFIG.tSeg - 1, Math.max(0, Math.floor(gX))), x1 = Math.min(CONFIG.tSeg, x0 + 1);
        let z0 = Math.min(CONFIG.tSeg - 1, Math.max(0, Math.floor(gZ))), z1 = Math.min(CONFIG.tSeg, z0 + 1);
        let h00 = this.hMap[z0*(CONFIG.tSeg+1)+x0]||0, h10 = this.hMap[z0*(CONFIG.tSeg+1)+x1]||0, h01 = this.hMap[z1*(CONFIG.tSeg+1)+x0]||0, h11 = this.hMap[z1*(CONFIG.tSeg+1)+x1]||0;
        let tx = gX-x0, tz = gZ-z0;
        let nx = (h00*(1-tz) + h01*tz) - (h10*(1-tz) + h11*tz);
        let nz = (h00*(1-tx) + h10*tx) - (h01*(1-tx) + h11*tx);
        return { 
            y: (h00*(1-tx)+h10*tx)*(1-tz) + (h01*(1-tx)+h11*tx)*tz, 
            nx: nx, 
            nz: nz 
        };
    },

    shockwavesThisFrame: 0, // 新增：單幀震波計數器
    createShockwave(x, y, z, color) {
        if (this.shockwavesThisFrame > 2) return; // 新增：每幀最多只允許產生 3 個震波，保護效能
        this.shockwavesThisFrame++;

        const mat = new THREE.MeshBasicMaterial({color: color, transparent: true, opacity: 1, side: THREE.DoubleSide});
        const mesh = new THREE.Mesh(this.swGeo, mat); mesh.position.set(x, y+1, z);
        this.swGroup.add(mesh);
        AppState.shockwaves.push({mesh: mesh, life: 1.0});

        if (AppState.shockwaves.length > CONFIG.maxShockwaves) {
            let sw = AppState.shockwaves.shift();
            this.swGroup.remove(sw.mesh);
            sw.mesh.material.dispose();
        }
    }
};

/* ==========================================
   5. PHYSICS & PARTICLES
   ========================================== */
const Physics = {
    pCount: CONFIG.pCount,
    pPos: new Float32Array(CONFIG.pCount * 3),
    pCol: new Float32Array(CONFIG.pCount * 3),
    pVel: [],
    pState: new Uint8Array(CONFIG.pCount),
    pLife: new Float32Array(CONFIG.pCount),
    pGeom: new THREE.BufferGeometry(),
    pSys: null,
    
    // 【優化：新增全域氣場熱力網格與最佳穴眼座標】
    qiGrid: new Float32Array(64 * 64),
    windGridX: new Float32Array(64 * 64),      // 新增：CFD 橫向風場網格
    windGridZ: new Float32Array(64 * 64),      // 新增：CFD 縱向風場網格
    windGridX_next: new Float32Array(64 * 64), // 新增：CFD 雙緩衝區 (Double Buffering)
    windGridZ_next: new Float32Array(64 * 64), // 新增：CFD 雙緩衝區 (Double Buffering)
    maxQi: 0,                                  // 新增：上一幀累積最大氣場快取
    bestLairPos: new THREE.Vector3(0, 0, 0),

    init() {
        for(let i=0; i<this.pCount; i++) this.pVel.push(new THREE.Vector3(0,0,0));
        this.pGeom.setAttribute('position', new THREE.BufferAttribute(this.pPos, 3));
        this.pGeom.setAttribute('color', new THREE.BufferAttribute(this.pCol, 3));

        // 優化粒子：加強中心發光，邊緣更通透柔和，縮小總體尺寸避免拉近破圖
        const c1 = document.createElement('canvas'); c1.width = 64; c1.height = 64;
        const ctx1 = c1.getContext('2d');
        const g1 = ctx1.createRadialGradient(32,32,0,32,32,32);
        g1.addColorStop(0, 'rgba(255,255,255,1.0)');
        g1.addColorStop(0.2, 'rgba(255,255,255,0.8)');
        g1.addColorStop(0.6, 'rgba(255,255,255,0.1)');
        g1.addColorStop(1, 'rgba(255,255,255,0)');
        ctx1.fillStyle = g1; ctx1.fillRect(0,0,64,64);
        const pTex = new THREE.CanvasTexture(c1);

        // 新增：將粒子的速度傳入 GPU，用於動態拉絲計算
        this.pGeom.setAttribute('velocity', new THREE.BufferAttribute(new Float32Array(CONFIG.pCount * 3), 3));

        // 【維度一：流體物理】將單調的點狀粒子升級為「絲絹流體 (Velocity-Aligned Streaks)」 Shader
        const pMat = new THREE.ShaderMaterial({
            uniforms: {
                pointTexture: { value: pTex }
            },
            vertexShader: `
                attribute vec3 color;
                attribute vec3 velocity;
                varying vec3 vColor;
                varying vec2 vVel;
                varying float vSpeed;
                void main() {
                    vColor = color;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    
                    // 將 3D 速度投影到 2D 螢幕空間
                    vec4 targetPos = modelViewMatrix * vec4(position + velocity * 0.15, 1.0);
                    vVel = (projectionMatrix * targetPos).xy / (projectionMatrix * targetPos).w - gl_Position.xy / gl_Position.w;
                    vSpeed = length(velocity);
                    
                    // 【修復：加入安全鉗制，防止相機後方粒子產生負數點尺寸造成 WebGL 破圖】
                    float safeDist = max(0.5, -mvPosition.z);
                    gl_PointSize = clamp((60.0 / safeDist) * (1.0 + vSpeed * 0.25), 0.0, 80.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D pointTexture;
                varying vec3 vColor;
                varying vec2 vVel;
                varying float vSpeed;
                void main() {
                    vec2 uv = gl_PointCoord - 0.5;
                    
                    // 計算螢幕空間的流體旋轉角度
                    float angle = atan(vVel.y, vVel.x);
                    float s = sin(-angle);
                    float c = cos(-angle);
                    mat2 rot = mat2(c, -s, s, c);
                    
                    vec2 rotatedUV = rot * uv;
                    
                    // 根據流速進行 X 軸 (前進方向) 的拉絲形變 (Motion Blur 視覺化)
                    float stretch = max(1.0, vSpeed * 1.5);
                    rotatedUV.x /= stretch; 
                    rotatedUV += 0.5;
                    
                    // 剔除變形出界的像素
                    if (rotatedUV.x < 0.0 || rotatedUV.x > 1.0 || rotatedUV.y < 0.0 || rotatedUV.y > 1.0) discard;
                    
                    vec4 texColor = texture2D(pointTexture, rotatedUV);
                    // 根據速度降低透明度，速度越快越透，形成煙霧感
                    gl_FragColor = vec4(vColor, texColor.a * clamp(1.2 - vSpeed*0.1, 0.2, 0.9));
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending, // 改回 Additive 讓重疊的真氣產生極亮太極暈
            depthWrite: false, depthTest: true
        });
        this.pSys = new THREE.Points(this.pGeom, pMat);
        Engine3D.scene.add(this.pSys);

        this.resetParticles();
    },

    resetParticles() {
        const state = AppState.current;
        const xueXOffset = state.manualXue ? (state.xueX || 0) : 0;
        const xueZOffset = (state.manualXue ? state.xueZ : 5.0) - 5.0;
        for(let i=0; i<this.pCount; i++) {
            this.pPos[i*3] = (Math.random()-0.5)*60;

            // 尋龍點穴：發脈沿著地表/骨脈內部湧出，而非從天而降
            if(state.d === 'pingyang') {
                // 【修復】：改為動態讀取平洋地形高度，防止粒子在切換時從地底瞬間彈出
                // 【第六輪優化】平洋龍粒子初始位置調整至感測區外（-35~-45），避免出生即在感測區內造成 qiDensity 虛高。
                // 同時搭配較高初速，確保粒子在 4 秒 Dry Run 模擬內抵達穴場感測區，平衡感測真實性與聚氣統計。
                let tz, tx, ty;
                let attempts = 0;
                do {
                    tz = -35 - Math.random()*10 + xueZOffset;
                    tx = (Math.random()-0.5)*20 + xueXOffset;
                    ty = Engine3D.getTerrainY(tx, tz).y;
                    attempts++;
                } while(ty < -2.0 && attempts < 30);
                this.pPos[i*3] = tx;
                this.pPos[i*3+1] = ty - 1 + Math.random()*3; 
                this.pPos[i*3+2] = tz;
            } else {
                let tzStart = state.zutai ? -80 : -60; 
                let tz = tzStart + Math.random()*20 + xueZOffset;
                let normT = Math.max(0, Math.min(1.0, (tz + 160) / 120.0));
                let dragonCurveX = 0;
                if(state.d === 'sheng') dragonCurveX = Math.sin(normT * Math.PI * 2.2) * 25.0;
                else if(state.d === 'ji') dragonCurveX = Math.sin(normT * Math.PI * 4.0) * 8.0;
                else if(state.d === 'huan') dragonCurveX = Math.sin(normT * Math.PI * 1.8) * 40.0;
                else if(state.d === 'huilong') dragonCurveX = Math.sin(Math.max(0,-tz)*0.02)*50.0;

                let tx = dragonCurveX + (Math.random()-0.5)*10 + xueXOffset;
                
                if (state.d === 'heng') {
                    tz = -70 + (Math.random()-0.5)*15 + xueZOffset;
                    tx = (Math.random() > 0.5 ? 1 : -1) * (60 + Math.random()*40) + xueXOffset;
                }
                
                let ty = Engine3D.getTerrainY(tx, tz).y;
                this.pPos[i*3] = tx;
                this.pPos[i*3+1] = ty - 2 + Math.random()*4; // 氣從山脊內部與表面滲透湧出
                this.pPos[i*3+2] = tz;
            }

            // 客觀穩態初速（在全局物理限速 4.5 範圍內，消除第一幀超速衝擊）
            this.pVel[i].set((Math.random()-0.5)*0.5, 0.2, 3.5);
            if(state.d === 'si') {
                this.pState[i] = 0;
                this.pCol[i*3]=0.45; this.pCol[i*3+1]=0.45; this.pCol[i*3+2]=0.40; // 死龍氣盡枯槁灰暗色
            } else if(state.d === 'po' && Math.random() < 0.35) {
                this.pState[i] = 3; // 僅破龍山體崩塌 35% 出生即為洩氣（移除緩龍 huan）
                this.pCol[i*3]=0.2; this.pCol[i*3+1]=0.4; this.pCol[i*3+2]=0.7; // 淺色模式：加深散氣的藍色
                this.pVel[i].set((Math.random()-0.5)*3.0, 0, 1.0);
            } else {
                this.pState[i] = 0;
                // 修正：調整生氣的預設顏色，從偏紅的琥珀金改為偏向青金/翠綠的生氣，徹底解決整個畫面紅通通的問題
                this.pCol[i*3]=0.4; this.pCol[i*3+1]=0.8; this.pCol[i*3+2]=0.6; 
            }
            this.pLife[i] = 100 + Math.random() * 500;
        }
        this.pGeom.attributes.position.needsUpdate = true;
        this.pGeom.attributes.color.needsUpdate = true;
    },
	update(dt) {
        Engine3D.shockwavesThisFrame = 0;
        if(dt === 0) return;
        AppState.frames++;
        let state = AppState.current;

        // 【修正】山體點穴/手動點穴時，河道/半月池/水口神獸等相對座標必須跟隨動態穴心 Z 座標
        const lairZRef = state.manualXue ? (state.xueZ || 0) : 5.0;

        // 【修復】河道中心線 Z 座標（與地形生成同步），供水流幾何與伯努利抽吸計算使用
        let wZ = 30;
        if(['you','jiuqu','bazi','tfork','juanlian','pubu','liulei'].includes(state.w)) wZ = 70;
        else if(state.w==='ji'||state.w==='fan') wZ = 55;
        else if(state.w==='lintou') wZ = -10;
        if (state.w !== 'none') wZ += (lairZRef - 5.0);

        let rType = 4;
        if(state.w === 'you') rType = 0;
        else if(state.w === 'jiuqu' || state.w === 'juanlian' || state.w === 'pubu' || state.w === 'liulei' || state.w === 'hulu') rType = 1; // 葫蘆水對齊前方大水體 (Z=70)
        else if(state.w === 'fan' || state.w === 'ji') rType = 2; // 直沖水與反弓水精準對齊河道 (Z=55)
        else if(state.w === 'bazi' || state.w === 'jiaojian') rType = 3;
        else if(state.w === 'lintou' || state.w === 'jushui' || state.w === 'sishui' || state.w === 'hejin') rType = 5; // 合襟與四水歸堂歸入靜水天心湖
        else if(state.w === 'tfork') rType = 6;
        else if(state.w === 'jushui' || state.w === 'sishui' || state.w === 'hejin') rType = 7; // 【修復：天心大湖專屬型別 (位於穴前明堂)】

        if (Engine3D.waterMesh.material.userData.shader) {
            // 【修復】：讓水面著色器的波浪流動速度，完美與物理 UI 滑桿連動！
            let visualWVel = state.waterVel || 1.0;
            Engine3D.waterMesh.material.userData.shader.uniforms.time.value = AppState.frames * 0.05 * visualWVel;
            Engine3D.waterMesh.material.userData.shader.uniforms.riverType.value = rType;
        }
        if (Engine3D.treeMesh && Engine3D.treeMesh.material.userData.shader) {
            Engine3D.treeMesh.material.userData.shader.uniforms.time.value = AppState.frames * 0.05;
        }

        let baseWind = state.wind * 0.015;
        // 【修正】無風設定時強制清零 CFD 網格，防止殘留風場造成穴心風速虛高
        if (Math.abs(baseWind) <= 0.001) {
            this.windGridX.fill(0);
            this.windGridZ.fill(0);
            this.windGridX_next.fill(0);
            this.windGridZ_next.fill(0);
        }
        let capLimit = Rules.getCapacityLimit();
        let frameGather = 0, frameScatter = 0;
        let maxQi = this.maxQi || 0; // 提前宣告，提供粒子趨化性 (Chemotaxis) 安全讀取上一幀數值
        
        // 【新增：進階流體觀測儀表計數器】
        let frameCoanda = 0, frameDowndraft = 0, frameVenturi = 0, frameBounce = 0;
        let framePhreatic = 0, frameTensorFracture = 0, frameHelicity = 0, frameThermalShear = 0, frameWaveletSpike = 0;
        let frameCoriolisCrash = 0, frameDarcyDrag = 0, frameBoundarySep = 0; // 【終極探針】

        // 【新增：Grid-based CFD 網格流體求解器 (Navier-Stokes 近似)】
        // 修正：空間尺度與 CONFIG.tSize (350, -175~+175) 完美對齊，消除空間錯位 Bug
        if (Math.abs(baseWind) > 0.001) {
            for (let gz = 1; gz < 63; gz++) {
                for (let gx = 1; gx < 63; gx++) {
                    let idx = gz * 64 + gx;
                    let worldX = (gx / 64) * CONFIG.tSize - CONFIG.tSize / 2;
                    let worldZ = (gz / 64) * CONFIG.tSize - CONFIG.tSize / 2;
                    let t = Engine3D.getTerrainY(worldX, worldZ);
                    
                    // 1. 地形邊界阻擋 (No-slip boundary 近似) 與風源注入
                    // 修正：平洋地面高度約 -2~0，若以 -2 為界會誤判為高山阻擋風。改為僅顯著高地 (>5，平洋 >0.5) 才阻擋。
                    let blockingThreshold = (state.d === 'pingyang') ? 0.5 : 5.0;
                    if (t.y > blockingThreshold) { 
                        this.windGridX[idx] *= 0.5; // 高山阻擋風流
                        this.windGridZ[idx] *= 0.5;
                    } else { 
                        this.windGridX[idx] += (baseWind - this.windGridX[idx]) * 0.08 * dt;
                        this.windGridZ[idx] += (Math.sin(worldX * 0.05 + AppState.frames * 0.02) * Math.abs(baseWind) * 0.5 - this.windGridZ[idx]) * 0.08 * dt;
                    }
                    
                    // 2. 擴散與壓力鬆弛 (Jacobi Iteration)
                    let avgX = (this.windGridX[idx-1] + this.windGridX[idx+1] + this.windGridX[idx-64] + this.windGridX[idx+64]) * 0.25;
                    let avgZ = (this.windGridZ[idx-1] + this.windGridZ[idx+1] + this.windGridZ[idx-64] + this.windGridZ[idx+64]) * 0.25;
                    
                    // 【修復：加入自然黏滯衰減阻尼 0.92，防止旋度能量自我激發失控】
                    let curl = (this.windGridZ[idx+1] - this.windGridZ[idx-1]) - (this.windGridX[idx+64] - this.windGridX[idx-64]);
                    
                    this.windGridX_next[idx] = (avgX + curl * 0.05 * dt) * 0.92;
                    this.windGridZ_next[idx] = (avgZ - curl * 0.05 * dt) * 0.92;
                    // 自然收斂在合理的微風範圍 (-2.5 ~ 2.5)
                    this.windGridX_next[idx] = Math.max(-2.5, Math.min(2.5, this.windGridX_next[idx]));
                    this.windGridZ_next[idx] = Math.max(-2.5, Math.min(2.5, this.windGridZ_next[idx]));
                }
            }
            // Swap Buffers
            let tmpX = this.windGridX; this.windGridX = this.windGridX_next; this.windGridX_next = tmpX;
            let tmpZ = this.windGridZ; this.windGridZ = this.windGridZ_next; this.windGridZ_next = tmpZ;
        }

        // 【湧現物理】觀測儀歸零
        let sensorCount = 0;
        let qiSensorCount = 0; // 僅計數吉氣粒子，用於準確反映聚氣密度
        let envParticleCount = 0; // 新增：游離環境粒子計數
        let sumVelX = 0, sumVelY = 0, sumVelZ = 0; // 新增 Y 軸平均
        let sumSpeedSq = 0;
        let waterDragCount = 0;
        let sumWaterDrag = 0;

        const hasDynamicFatalSha = state.tianzhan || state.sherui || state.tantou || state.qingquan || state.ao || 
            state.posui || state.bidao || state.wugong || state.terrain === 'slope' || state.terrain === 'fanpo' || state.ms === 'sunken' || state.tasha ||
            state.qing || state.fenzhi || state.ml === 'ya' || state.mr === 'tai' || state.mr === 'kaikou' ||
            state.yangwa || state.tianjing ||
            state.ml === 'po' || state.mr === 'po' || state.ms === 'po' || state.mn === 'po' ||
            ['fan','bazi','gejiao','ji','lintou','tfork','juanlian','pubu','liulei','jiaojian'].includes(state.w) ||
            ['zhichong','sickle','jiandao','zuocha','youcha','lanyao','wuwei'].includes(state.road);

        const isBadWaterSensor = ['gejiao', 'lintou', 'fan', 'bazi', 'ji', 'tfork', 'juanlian', 'pubu', 'liulei', 'jiaojian'].includes(state.w) || ((state.waterVel || 1.0) > 1.8);

        for(let i=AppState.shockwaves.length-1; i>=0; i--) {
            let sw = AppState.shockwaves[i];
            sw.life -= 0.02 * dt;
            sw.mesh.scale.set(1 + (1-sw.life)*10, 1 + (1-sw.life)*10, 1);
            sw.mesh.material.opacity = sw.life;
            if(sw.life <= 0) {
                Engine3D.swGroup.remove(sw.mesh);
                sw.mesh.material.dispose();
                AppState.shockwaves.splice(i, 1);
            }
        }

        if(state.vHeat && AppState.frames % 4 === 0) {
            // 修正：提高熱力圖的自然衰減率 (0.05 -> 0.10)，防止長時間運行後殘影過度累積覆蓋地形
            Engine3D.hCtx.fillStyle = 'rgba(0,0,0,0.10)';
            Engine3D.hCtx.fillRect(0, 0, 256, 256);
        }

        const sunVec = new THREE.Vector3(70, 140, 60).normalize();
        const tempNormal = new THREE.Vector3();

        for(let i=0; i<this.pCount; i++) {
            let x = this.pPos[i*3], y = this.pPos[i*3+1], z = this.pPos[i*3+2];
            let vel = this.pVel[i]; let st = this.pState[i];

            // 【湧現物理】感測器空間採樣（結合山體動態穴位與手動點穴）
            let xueH = state.xueHeight || 0;
            let lx = state.xueX || 0;
            // 【修正】穴位水平固定 Z=5
            let lz = state.manualXue ? state.xueZ : 5.0;
            let dynamicTaijiZ = lz;
            let dxTaiji = x - lx;
            let dzTaiji = z - dynamicTaijiZ;
            let inTaijiShield = (dxTaiji*dxTaiji + dzTaiji*dzTaiji < (state.d === 'pingyang' ? 1000 : 320));
            let dxSensor = dxTaiji;
            let dzSensor = dzTaiji;
            let distToSensorSq = dxSensor*dxSensor + dzSensor*dzSensor;
            // 【第七輪優化】感測半徑擴大至 60 單位，讓明堂周邊流動的粒子也能被完整採樣，避免 gatherAcc 恆為 0 的物理感測失效
            let sensorRadiusSq = 3600;
            let sensorGroundY = Engine3D.getTerrainY(x, z).y;
            if (distToSensorSq < sensorRadiusSq && y > sensorGroundY - 5 && y < sensorGroundY + 15) {
                sensorCount++;
                if (st === 2) {
                    // 【客觀物理採樣】：真實統計感測區內的吉氣粒子，不再受 UI 布林值人為過濾
                    qiSensorCount++;
                }
                if (st !== 2) { // 排除已穩定結穴的粒子，客觀計算環境流動速度與亂流
                    envParticleCount++;
                    sumVelX += vel.x; sumVelY += vel.y; sumVelZ += vel.z;
                    sumSpeedSq += vel.lengthSq();
                }
                // 【客觀聚散計數】：純依據空間位置與粒子狀態統計
                if (!state.taiji || (dxTaiji*dxTaiji + dzTaiji*dzTaiji >= (state.d === 'pingyang' ? 1000 : 320))) {
                    if (st === 2 || st === 0) frameGather++;
                    else if (st === 1 || st === 3) frameScatter++;
                }
            }
            let waterSensorLevel = (state.d === 'pingyang') ? -3.5 : -12.0;
            let isNearWater = (state.w !== 'none' || state.yue);
            let riverRefZ = 30;
            if(['you','jiuqu','bazi','tfork','juanlian','pubu','liulei'].includes(state.w)) riverRefZ = 70;
            else if(state.w==='ji'||state.w==='fan') riverRefZ = 55;
            else if(state.w==='lintou') riverRefZ = -10;
            if (isNearWater) riverRefZ += (lz - 5.0);
            let waterSenseZStart = Math.min(lz - 5, riverRefZ - 20);
            let waterSenseZEnd = Math.max(lz + 40, riverRefZ + 20);
            // 【客觀水力物理採樣】：真實測量水域流體對粒子的動態剪切與垂直拖拽（完全移除字串黑名單）
            if (isNearWater && z > waterSenseZStart && z < waterSenseZEnd && Math.abs(dxTaiji) < 50 && Engine3D.getTerrainY(x, z).y <= waterSensorLevel + 0.5 && y <= waterSensorLevel + 5.0) {
                let physicalDrag = Math.sqrt(vel.x * vel.x + vel.z * vel.z) * 0.35 + Math.max(0, -vel.y) * 0.65;
                if (physicalDrag > 0.3) {
                    waterDragCount++;
                    sumWaterDrag += physicalDrag;
                }
            }

            vel.y -= 0.025 * dt;
            vel.x += (Math.random()-0.5)*0.1*dt; vel.z += (Math.random()-0.5)*0.1*dt;

            if(AppState.obstacles.length > 0) {
                if (st === 0 || st === 2) {
                    for(let obs of AppState.obstacles) {
                        let dxObs = x - obs.mesh.position.x;
                        let dzObs = z - obs.mesh.position.z;
                        let distObsSq = dxObs*dxObs + dzObs*dzObs;
                        if(distObsSq < 36.0 && y < obs.mesh.position.y + 5.0) {
                            let dObs = Math.max(0.1, Math.sqrt(distObsSq));
                            this.pState[i] = 1; 
                            vel.x = (dxObs / dObs) * 4.5;
                            vel.z = (dzObs / dObs) * 4.5;
                            vel.y += 2.0;
                            this.pCol[i*3]=1.0; this.pCol[i*3+1]=0.2; this.pCol[i*3+2]=0.1;
                            if (st === 2) Engine3D.createShockwave(x, y, z, 0xff0000);
                            break;
                        }
                    }
                }
            }

            let t = Engine3D.getTerrainY(x, z);
            let waterLevel = (state.d === 'pingyang') ? -3.5 : -12.0;
            // ★ 加入天池水域判定：主山頂峰火山口湖 (y 接近天池水面) 同樣享有水文流體物理
            let isTianchiLake = (state.tianchi && state.zhu && Math.sqrt(x*x + Math.pow(z+60, 2)) < 16 && Math.abs(t.y - 33 * (state.zhuScale || 1.0)) < 2.0);
            let isWater = (((state.w !== 'none' || state.yue) && t.y <= waterLevel + 0.5) || isTianchiLake);
            let isWaterZone = (((state.w !== 'none' || state.yue) && t.y <= waterLevel + 1.5 && y <= waterLevel + 5.0) || isTianchiLake);

            // 【湧現物理】2. 網格地形向量流體場 
            // ★ 校準尺度：CONFIG.tSize 為 350 (座標範圍 -175 ~ +175)
            let sampleX = Math.max(0, Math.min(63, Math.floor((x + 175) / 350 * 64)));
            let sampleZ = Math.max(0, Math.min(63, Math.floor((z + 175) / 350 * 64)));
            let gridIdx = sampleZ * 64 + sampleX;
            
            // 【修正】直接讀取 CFD 網格值，避免 `|| baseWind` 將 0 風速（合法狀態）誤替換為全域風，導致山體阻擋失效
            let globalWindX = this.windGridX[gridIdx];
            let globalWindZ = this.windGridZ[gridIdx];

            let localWindX = globalWindX;
            let localWindZ = globalWindZ;
            let localTurbulence = 0;

            // 修正 4：大一統物理系統無風漏洞。形煞地貌(如天斬、凹風)必伴隨自然熱力學山谷風。
            // 必須給予基礎氣流(0.03)，否則當系統設定無風(baseWind=0)時，所有形煞會完全失效失去懲罰力。
            let thermalDraft = Math.max(0.03, Math.abs(baseWind)); 

            // 實體湧現：探頭煞 (Tantou) 造成的越過案山的下洗氣流 (Downdraft) 與暗流
            if (state.tantou && state.an && dzTaiji > 10 && dzTaiji < 70 && Math.abs(dxTaiji) < 30) {
                localWindZ -= thermalDraft * 3.5; 
                localTurbulence += thermalDraft * 1.5;
            }
            
            
            // 【天心十道幾何效應】：由四山地形阻擋風場，此處僅保留微觀能量聚焦阻尼
            if (state.shidao && Math.abs(dxTaiji) < 18 && Math.abs(dzTaiji) < 18) {
                vel.multiplyScalar(Math.pow(0.88, dt)); // 腔體內的動能平穩衰減
            }

            // 【物理湧現補全】天斬煞與凹風煞的真實流體力學：狹管切風與冷風灌穴
            if (state.tianzhan && Math.abs(dxTaiji) < 15 && dzTaiji > -50 && dzTaiji < 0) {
                localWindZ += thermalDraft * 6.5; // 冷風乘勢直灌
                localTurbulence += thermalDraft * 2.5;
            }
            if (state.ao && Math.abs(dxTaiji) < 25 && dzTaiji > -15 && dzTaiji < 25) {
                localWindX += Math.sign(dxTaiji) * -thermalDraft * 3.0; // 缺口寒風倒灌
                localTurbulence += thermalDraft * 2.0;
            }
            // 【新增：路沖煞 (槍煞) 風洞效應】筆直的道路成為風的加速通道，煞氣直沖明堂
            if (state.road === 'zhichong' && Math.abs(dxTaiji) < 5 && dzTaiji > 5 && dzTaiji < 115) {
                localWindZ -= thermalDraft * 8.0; // 強烈逆風直刺穴位
                localTurbulence += thermalDraft * 4.0;
            }
            
            // 【生態移植：鐮刀煞物理湧現】極近距離的彎道產生強烈向心切割風
            if (state.road === 'sickle') {
                let sickleCurve = 30 - Math.pow(dxTaiji / 40, 2) * 20;
                if (Math.abs(dzTaiji - sickleCurve) < 6.0 && dzTaiji > 0 && dzTaiji < 95) {
                    localWindZ -= thermalDraft * 9.5; // 鐮刀橫切，強烈下洗直劈穴星
                    localTurbulence += thermalDraft * 6.0;
                }
            }
            
            // 【生態移植：丁字沖物理湧現】垂直水氣直撞太極
            if (state.w === 'tfork' && Math.abs(dxTaiji) < 12 && dzTaiji > 15 && dzTaiji < 70) {
                localWindZ -= thermalDraft * 8.5; // 水氣伴隨冷風倒灌
                localTurbulence += thermalDraft * 5.0;
            }

            // 【新增：左/右脅擦邊路物理湧現】側邊車流產生橫向負壓，無情抽走明堂真氣
            if ((state.road === 'zuocha' && dxTaiji < 0) || (state.road === 'youcha' && dxTaiji > 0)) {
                let sign = state.road === 'zuocha' ? -1 : 1;
                let expectedX = sign * (dzTaiji * 0.4 + 14);
                if (Math.abs(dxTaiji - expectedX) * 0.8 < 5.0 && dzTaiji > -15 && dzTaiji < 95) {
                    localWindX += sign * thermalDraft * 5.0; // 強大側向吸力將氣場扯出
                    localWindZ -= thermalDraft * 2.5;
                    localTurbulence += thermalDraft * 3.0;
                }
            }
            
            // 【新增：剪刀煞物理湧現】交叉口形成喇叭狀風洞，兩股煞氣匯聚直劈太極
            if (state.road === 'jiandao') {
                let leftDist = Math.abs(dxTaiji + (dzTaiji-10)*0.6) * 0.8;
                let rightDist = Math.abs(dxTaiji - (dzTaiji-10)*0.6) * 0.8;
                if (Math.min(leftDist, rightDist) < 6.0 && dzTaiji > 0 && dzTaiji < 95) {
                    localWindX += Math.sign(dxTaiji) * -thermalDraft * 6.0; // 向交叉點擠壓的側切風
                    localWindZ -= thermalDraft * 7.5; // 雙倍風洞效應直吹穴場
                    localTurbulence += thermalDraft * 5.0;
                }
            }

            // 【客觀逼壓氣旋】：山體逼近引發的側向流體擠壓與熱力風壓聯動（無風則無側壓）
            if (state.ml === 'ya' && dxTaiji < -5 && dxTaiji > -25 && dzTaiji > -10 && dzTaiji < 40) {
                localWindX += thermalDraft * 3.5; 
                localTurbulence += thermalDraft * 1.5;
            }
            if (state.mr === 'tai' && dxTaiji > 5 && dxTaiji < 25 && dzTaiji > -10 && dzTaiji < 40) {
                localWindX -= thermalDraft * 3.5; 
                localTurbulence += thermalDraft * 1.5;
            }
            
            // 【白虎開口 (White Tiger Mouth)】巨大的坑洞產生可怕的物理負壓抽吸，吸走右側生氣
            if (state.mr === 'kaikou' && dxTaiji > 15 && dxTaiji < 40 && dzTaiji > 5 && dzTaiji < 25) {
                localWindX += thermalDraft * 8.5; // 氣流被狂吸入洞內
                localTurbulence += thermalDraft * 6.0;
            }

            // 【明堂反坡 (Reverse Slope)】前方高聳如牆，使風場無法排出，形成逆流倒灌
            if (state.terrain === 'fanpo' && Math.abs(dxTaiji) < 40 && dzTaiji > 15 && dzTaiji < 45) {
                localWindZ -= thermalDraft * 5.0; // 回頂逆風撞擊太極暈
                localTurbulence += thermalDraft * 4.0;
            }
            

            // 【修復：無全域風時，熱力學高低壓仍會推動橋下橫切風煞】
            if (state.road === 'lanyao' && Math.abs(dzTaiji - 20) < 8 && Math.abs(dxTaiji) < 40) {
                let windDir = Math.sign(globalWindX) || 1.0;
                localWindX += windDir * thermalDraft * 12.0; // 橋下強烈橫切風
                localTurbulence += thermalDraft * 6.0;
            }

            // 【孤陽塔煞 (Kármán Vortex Street)】尖塔後方產生強烈卡門渦街亂流
            if (state.tasha && dxTaiji > 15 && dxTaiji < 25 && dzTaiji > 20 && dzTaiji < 40) {
                localWindZ += thermalDraft * 4.0;
                localTurbulence += thermalDraft * 12.0; // 塔後強烈震盪
            }

            // 【天井煞煙囪效應】：深井絕壁引發垂直熱浮力抽吸與劇烈亂流（移除人工正弦波震盪）
            if (state.tianjing && Math.abs(dxTaiji) < 15 && dzTaiji > -5 && dzTaiji < 25) {
                vel.y += 3.5 * dt; // 穩態垂直煙囪抽吸
                localWindZ -= thermalDraft * 4.0;
                localTurbulence += 8.5;
            }

            // 【無尾巷 (Stagnant Dead-End)】：盲端地形引發氣流抽吸與高壓渦旋亂流（碰撞由地貌法線自然反彈）
            if (state.road === 'wuwei' && Math.abs(dxTaiji) < 5 && dzTaiji > 15 && dzTaiji < 45) {
                if (dzTaiji < 23) {
                    localWindZ += thermalDraft * 8.0; // 盲端反壓
                    localTurbulence += 12.0; // 死氣鬱結亂流
                } else {
                    localWindZ -= thermalDraft * 8.0; // 強力吸入死巷深處
                }
            }

            // 【瀑布盪胸/聲煞 (Waterfall Downdraft)】深谷極速下切，拖拽上方氣流形成劇烈下沉亂流
            if (state.w === 'pubu' && Math.abs(dxTaiji) < 30 && dzTaiji > 20 && dzTaiji < 50) {
                localWindZ += thermalDraft * 4.0; // 氣流被瀑布重力加速扯走
                vel.y -= 3.5 * dt; // 粒子遭到瀑布強大下洗墜落
                localTurbulence += thermalDraft * 8.0; // 聲煞造成的空氣震動亂流
            }
            
            // 【客觀高空風切變 (Atmospheric Wind Shear)】：高海拔暴露區域 (y > 25) 自然承受大氣切變風
            if (y > 25.0 && y > t.y + 1.0) {
                let shearFactor = Math.min(2.0, (y - 25.0) / 25.0);
                localWindX += (Math.random() - 0.5) * thermalDraft * 6.0 * shearFactor; 
                localTurbulence += thermalDraft * 3.0 * shearFactor; 
            }
            
            // 【新增：射肋煞 (Arrow Sha)】尖銳山脊引發的噴射氣流 (Jet Stream) 切割太極
            if (state.sherui && Math.abs(dxTaiji) < 30 && dzTaiji > -15 && dzTaiji < 25) {
                localWindX += Math.sign(dxTaiji) * -thermalDraft * 15.0; // 極速橫向切風
                localTurbulence += thermalDraft * 5.0;
            }
            
            // 【破碎崖微觀擾動】：由地貌岩石鋸齒引發之流體亂流（與環境風壓動態聯動）
            if (state.posui && Math.abs(dxTaiji) > 15 && dzTaiji > -20 && dzTaiji < 40) {
                localTurbulence += thermalDraft * 3.5; 
            }

            // 修復 3：效能優化，僅在真正有風時才執行昂貴的上下游地形高度探測，省下每幀數萬次無效計算
            if (Math.abs(baseWind) > 0.01) {
                let scanD = 15;
                let hLeft = Engine3D.getTerrainY(x - scanD, z).y;
                let hRight = Engine3D.getTerrainY(x + scanD, z).y;
                let windUpstreamH = (globalWindX > 0) ? hLeft : hRight;

                // 修復：必須有風才會引發亂流，且加入嚴格的寬度限制，保護明堂盆地
                let isCanyon = (Math.abs(x) < 15 && hLeft > t.y + 12 && hRight > t.y + 12);
                if (isCanyon) {
                    let compression = ((hLeft - t.y) + (hRight - t.y)) * 0.02;
                    let pinchForce = Math.abs(globalWindX) * compression * 1.2; 
                    localWindX *= 0.2; 
                    localWindZ += pinchForce * Math.sign(z - 5); 
                    localTurbulence += pinchForce * 0.3;
                } 
                
                if (windUpstreamH < t.y - 3 && t.y > -5) {
                    let funnelSpeed = Math.abs(globalWindX) * 1.5;
                    localWindX += Math.sign(globalWindX) * funnelSpeed; 
                    localTurbulence += 0.5 * Math.abs(globalWindX);
                }

                if (windUpstreamH > y + 8) {
                    let drop = windUpstreamH - Math.max(t.y, y);
                    localWindX *= -0.1; 
                    localWindZ += (Math.random() - 0.5) * drop * 0.2 * Math.abs(globalWindX);
                    localTurbulence += drop * 0.1 * Math.abs(globalWindX);
                }
            }

            vel.x += localWindX * dt;
            vel.z += localWindZ * dt;
            vel.y += (localTurbulence * (Math.random() - 0.5)) * dt; 

            // 修復：物理數學悖論！UI 風速全滿時，baseWind 平方僅約 0.028，
            // 永遠達不到 0.25 的門檻，導致一般強風形同虛設，完全無法吹散粒子。
            // 必須將門檻下修至 0.02，讓無地形保護的強風能正確發揮物理吹散作用。
            let speedSq = localWindX*localWindX + localWindZ*localWindZ;
            // 【客觀風場物理散氣】：純依據局部風速大小判定，移除布林無敵護盾
            // （藏風聚氣格局之防風能力，已由周圍山體在 CFD 網格中自然衰減風速）
            if (speedSq > 0.35 && (st === 0 || st === 2) && Math.random() < (speedSq - 0.2) * 1.2 * dt) {
                this.pState[i] = 3; 
                this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
            }

            // 客觀亂流物理撕裂判定
            if (localTurbulence > 2.0 && st !== 1 && st !== 3) {
                if (localTurbulence > 5.5 && Math.random() < localTurbulence * 0.1 * dt) {
                    this.pState[i] = 1; // 極端亂流撕裂成紅煞
                    this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.15; this.pCol[i*3+2] = 0.1;
                    if (Math.random() < 0.02) Engine3D.createShockwave(x, y, z, 0xff3333);
                } else if (Math.random() < localTurbulence * 0.15 * dt) {
                    this.pState[i] = 3; // 一般亂流吹散
                    this.pCol[i*3] = 0.4; this.pCol[i*3+1] = 0.8; this.pCol[i*3+2] = 0.9;
                }
            }

            // 【枝龍分流幾何導流】：氣脈順著雙側分岔山脊法線向兩翼滑動（狀態由主物理機制判定）
            if(state.fenzhi && dzTaiji < -15) {
                let leftBranchH = Engine3D.getTerrainY(x - 8, z + 5).y;
                let rightBranchH = Engine3D.getTerrainY(x + 8, z + 5).y;
                let centerH = t.y;

                if (Math.abs(x) <= 10) {
                    let side = (Math.random() < 0.5) ? -1 : 1;
                    vel.x += side * 3.5 * dt; // 沿分流山脊兩側滑落
                } else if (Math.abs(x) > 10 && (leftBranchH > centerH || rightBranchH > centerH)) {
                    vel.x += Math.sign(x) * 6.5 * dt; // 順著分流溝槽加速甩出
                }
            }

            // 【鬼山支撐效應】：山脊幾何已雕刻於地貌，粒子依據後山坡度自然獲取向心穩定性
            if (state.guiyao && dzTaiji > -60 && dzTaiji < 20) {
                vel.x += (lx - x) * 0.08 * dt; // 輕微向山脊中軸收斂
                vel.multiplyScalar(Math.pow(0.95, dt));
            }

            let isInCaveZone = (dzTaiji > -30 && dzTaiji < 25 && Math.abs(dxTaiji) < 35); 
            // 【純客觀地形引導】：移除五行星體字串比對與人為噴射力，完全回歸 3D 地貌法線與坡度引導
            if (state.xia && state.d !== 'si' && state.d !== 'po' && isInCaveZone && y < t.y + 25) {
                // 依據地形法線進行自然的重力沉降與導流（凹地自然聚氣、凸坡自然滑開）
                vel.x += t.nx * 1.5 * dt;
                vel.z += t.nz * 1.5 * dt;

                // 若地形呈現碗狀聚氣凹陷（法線指向穴心），粒子自然減速沉降
                let normalTowardsCenter = (dxTaiji * t.nx + dzTaiji * t.nz);
                if (normalTowardsCenter < -0.2) {
                    vel.multiplyScalar(Math.pow(0.85, dt));
                    vel.y -= 0.2 * dt;
                } else if (normalTowardsCenter > 0.5) {
                    // 孤峰凸頂，粒子自然順坡散開
                    vel.multiplyScalar(Math.pow(0.98, dt));
                }

                if(state.xue === 'wo' || state.xue === 'qian') {
                        let woSync = (state.xing === 'jin' || state.xing === 'shui') ? 1.8 : 1.0;
                        vel.x += t.nx * 1.2 * woSync * dt;
                        vel.z += t.nz * 1.2 * woSync * dt;
                        vel.x += (-dxTaiji) * 0.08 * (woSync - 1.0) * dt;
                        vel.z += (-dzTaiji) * 0.08 * (woSync - 1.0) * dt;
                        vel.multiplyScalar(Math.pow(0.85, dt)); 
                        if (woSync > 1.0 && st === 0 && Math.random() < 0.15 * dt) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.95; this.pCol[i*3+2] = 0.6;
                        }
                    } else if ((state.xue === 'tu' || state.xue === 'ru') && state.d === 'pingyang') {
                        if (dzTaiji > -20 && dzTaiji < 20 && Math.abs(dxTaiji) < 25) {
                            vel.multiplyScalar(Math.pow(0.15, dt)); 
                            vel.y -= 0.3 * dt; 
                            if (st === 0 || st === 3) {
                                this.pState[i] = 2; 
                                this.pCol[i*3] = 0.85; this.pCol[i*3+1] = 1.0; this.pCol[i*3+2] = 0.65;
                                Engine3D.createShockwave(x, y, z, 0x229944); 
                            }
                        }
                    } else if (state.xue === 'ru') {
                        let ruSync = (state.xing === 'mu' || state.xing === 'tu') ? 1.5 : 1.0;
                        vel.x += (-dxTaiji) * 0.02 * ruSync * dt; 
                        vel.z += (0 - dzTaiji) * 0.02 * ruSync * dt;
                        vel.multiplyScalar(Math.pow(0.95 - (ruSync - 1.0) * 0.05, dt)); 
                        
                        if (ruSync > 1.0 && st === 0 && Math.random() < 0.12 * dt) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.95; this.pCol[i*3+2] = 0.6;
                        }
                    } else if (state.xue === 'ping') {
                        // 坪穴：氣場舒緩，粒子平鋪慢流，在平坦棋盤上沉降
                        vel.multiplyScalar(Math.pow(0.85, dt));
                        vel.y -= 0.1 * dt;
                        vel.x += (Math.random() - 0.5) * 0.5 * dt;
                        vel.z += (Math.random() - 0.5) * 0.5 * dt;
                        if (st === 0 && Math.random() < 0.15 * dt) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.95; this.pCol[i*3+2] = 0.6;
                        }
                    } else if (state.xue === 'ya') {
                        // 崖穴：氣流急促，撞擊背後峭壁後形成強烈逆流旋渦駐留
                        vel.x += (-dxTaiji) * 0.05 * dt;
                        vel.z -= 5.0 * dt; // 貼壁逆流
                        vel.multiplyScalar(Math.pow(0.75, dt));
                        if (st === 0 && Math.random() < 0.2 * dt) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.95; this.pCol[i*3+2] = 0.6;
                        }
                    }

                    // 【仰瓦漏胎幾何導流】：氣脈順著凹槽法線自然下沉滑移（狀態交由主物理機制判定）
                    if (state.yangwa && dzTaiji > -18 && dzTaiji < 2 && Math.abs(dxTaiji) < 15) {
                        vel.y -= 2.5 * dt; // 氣脈下沉
                        vel.z -= 1.5 * dt; // 向後倒流
                    }

                    // 【客觀穴場減速引導】：穴場幾何提供平穩阻尼，狀態轉化 100% 移交主太極暈 isCalmFlow 機制統一判定
                    if (state.xia && state.xue !== 'none' && dzTaiji >= -8 && dzTaiji <= 12 && Math.abs(dxTaiji) <= 12) {
                        vel.multiplyScalar(Math.pow(0.70, dt)); 
                        vel.y -= 0.2 * dt; 
                    }

                    if (state.xing === 'shui') {
                        vel.x += Math.sin(z * 0.1 + AppState.frames * 0.08) * 1.2 * dt;
                        vel.multiplyScalar(Math.pow(0.82, dt));
                    } else if (state.xing === 'jin') {
                        vel.x += (-dxTaiji) * 0.08 * dt;
                        vel.multiplyScalar(Math.pow(0.78, dt));
                        vel.y -= 0.15 * dt;
                    } else if (state.xing === 'tu') {
                        vel.multiplyScalar(Math.pow(0.65, dt));
                        vel.y -= 0.4 * dt;
                    } else if (['jin', 'shui', 'tu'].includes(state.xing)) {
                        vel.multiplyScalar(Math.pow(0.75, dt));
                        vel.y -= 0.2 * dt;
                    }
                }

            if (t.y > -100 && y <= t.y + 15.0) { // 貼地邊界層感應區（允許粒子在三維空間自由升降）
                
                // 【進化：地下水頭壓強 (Hydraulic Head & Phreatic Surface)】
                // 地下水位線動態分佈：高山水位深，平洋水位淺。
                let waterTable = (state.d === 'pingyang') ? -2.5 : Math.max(-10.0, -z * 0.08 - 4.0);
                let phreaticDepth = waterTable - t.y; // 地下水層與地表的距離
                
                // 當龍脈下行，地表接近地下水位時，水頭壓強將地氣「逼出地表」 (界水則止)
                if (phreaticDepth > -5.0 && phreaticDepth < 2.0) {
                    vel.y += (2.0 - phreaticDepth) * 1.5 * dt; // 潛水層上浮力 (Buoyancy)
                    if (st === 0 && Math.random() < 0.05 * dt) framePhreatic++; // 【探針：水壓結穴懸浮】
                } else if (phreaticDepth >= 2.0) {
                    vel.y -= phreaticDepth * 2.0 * dt; // 水壓過大，沖心洗穴 (凶)
                    if (st === 2) this.pState[i] = 3; 
                }

                // 【進化：高斯曲率與主應力張量斷裂 (Tensor Fracture)】
                // 客觀計算鄰近地形的法線變化率 (近似曲率)，完全移除布林護盾判定
                let tLeft = Engine3D.getTerrainY(x - 2, z).nx;
                let tRight = Engine3D.getTerrainY(x + 2, z).nx;
                let gaussianCurvature = Math.abs(tLeft - tRight);
                
                if (gaussianCurvature > 1.8 && z < 0) { // 局部地形曲率嚴重斷裂
                    frameTensorFracture++; // 【探針：客觀記錄張力斷裂】
                    vel.x += Math.sign(t.nx) * gaussianCurvature * 3.5 * dt; // 沿斷崖法線自然側滑
                    vel.y -= 1.0 * dt;
                }

                // 【客觀單向地面支撐約束】：僅在粒子沉入地下時托起，釋放真實 3D 垂直流體升力
                y = Math.max(y, t.y + 0.8);
                
                // 【微地形自然阻尼】：由地表田壟與蛾眉沙丘幾何自然產生法線阻擋，移除人工加減速注入
                if (state.caoshe && state.d === 'pingyang' && y < t.y + 2.0) {
                    vel.multiplyScalar(Math.pow(0.92, dt)); // 貼地微孔隙阻尼
                }
                
                if (state.emei && dzTaiji > 20 && dzTaiji < 40 && Math.abs(dxTaiji) < 25 && y < t.y + 3.0) {
                    vel.multiplyScalar(Math.pow(0.90, dt)); // 沙丘自然滯留阻尼
                }

                // 【客觀地表剛體反彈】：岩石彈跳純粹體現於垂直與水平動能散射（狀態交由通用亂流機制處理）
                if (state.bohuan === 'no' && z < -10) {
                    if (vel.y < 0) {
                        frameBounce++; // 【探針：客觀記錄剛體反彈】
                        vel.y = Math.abs(vel.y) * 0.75; // 岩石硬表面彈性反彈
                        vel.x += (Math.random() - 0.5) * 4.0; // 表面粗糙導致散射
                    }
                } else {
                    if (vel.y < 0) vel.y *= 0.5; // 泥土軟表面吸收垂直動能，維持貼地層流
                }
                
                // 【客觀龍脈連續引導場】：統一基礎引導推力，速度差異完全由 3D 地貌重力坡度法線自然湧現
                if (z < 60) {
                    let pulse = 2.5; 
                    // 距離衰減：離穴位越遠引導越強，靠近時平穩減速
                    let pullDist = Math.max(0, (lz - z));
                    let pullFactor = Math.min(1.0, pullDist / 100.0);
                    pulse *= (0.3 + pullFactor * 0.7);
                    // 接近太極暈時平滑過渡至微觀向心力
                    let taijiDistSqPulse = dxTaiji*dxTaiji + dzTaiji*dzTaiji;
                    if (taijiDistSqPulse < 625) {
                        let taijiDistPulse = Math.sqrt(taijiDistSqPulse);
                        pulse *= Math.max(0.05, (taijiDistPulse - 3) / 22);
                    }
                    
                // 【客觀橫龍動量流動】：粒子沿橫向大山與結穴短脈山坡法線自然翻越滑動，移除人工磁吸力
                if (state.d === 'heng' && z < -40) {
                    vel.z += pulse * 0.8 * dt; // 保持基礎前進動能
                } else {
                        // 【橈棹枝腳導流】：分岔導流完全由實體 3D 山脊斜向法線自然推動，移除字串人工增減速與隨機散氣
                        vel.z += pulse * dt;
                    }
                    if (state.d === 'huilong') {
                        // 【客觀 C 型山脊流體偏轉】：氣流由彎曲山脈表面法線自然折射導向，移除人工黑洞吸力
                        let rx = x - (state.manualXue ? state.xueX : 0);
                        let rz = z - (state.manualXue ? state.xueZ : 5.0);
                        let rSq = rx*rx + rz*rz;
                        if (rSq < 10000.0) {
                            frameHelicity++; // 探針：客觀記錄迴旋區粒子
                            vel.x += -rz * 0.02 * dt; // 僅保留山體弧度帶來的自然微弱角動量偏轉
                            vel.z += rx * 0.02 * dt;
                        }
                    }
                }
                
                // 【湧現物理】3. 水文流體力學與伯努利抽吸效應
                // 修正 3：物理引擎盲區！即使沒有天然河流(w='none')，只要有人造半月池(yue)，
                // 池中就必須具備水的流體力學。否則半月池會變成沒有浮力的乾涸旱坑。
                if (isWaterZone) {
                    // 【大一統湧現】完全信任 Engine3D.buildTerrain 中設定的 flowTilt (河床重力梯度)
                    
                    // 【新增：水流速物理 (Water Velocity multiplier)】
                    let wVel = state.waterVel || 1.0;
                    let waterFlowX = t.nx * 25.0 * wVel;
                    let waterFlowZ = t.nz * 25.0 * wVel; 
                    
                    // 【合襟水】：雙側水流夾護，前方匯聚成低速駐點（純流體物理）
                    if (state.w === 'hejin' && dzTaiji > 10 && dzTaiji < 30 && Math.abs(dxTaiji) < 20) {
                        waterFlowX *= 0.1; waterFlowZ *= 0.1; // 水流平緩駐留
                        vel.y -= 0.8 * dt; // 貼地沉降
                    }
                    
                    // 【流淚水】：高頻溝壑引發微觀水流摩擦阻尼
                    if (state.w === 'liulei') {
                        localTurbulence += 3.5;
                        vel.y -= 1.5 * dt;
                        vel.multiplyScalar(Math.pow(0.85, dt)); // 摩擦阻力消耗流速
                    }
                    
                    // 【四水歸堂】：四方水體向心引導（純速度向量導流，移除狀態強改）
                    if (state.w === 'sishui' && Math.abs(dxTaiji) < 35 && dzTaiji > 10 && dzTaiji < 70) {
                        let sishuiDist = Math.sqrt(dxTaiji*dxTaiji + dzTaiji*dzTaiji);
                        if (sishuiDist > 0.1) {
                            let sishuiSpeed = Math.min(4.5, sishuiDist * 0.12);
                            waterFlowX = (-dxTaiji / sishuiDist) * sishuiSpeed; 
                            waterFlowZ = (-dzTaiji / sishuiDist) * sishuiSpeed;
                        } else {
                            waterFlowX = 0; waterFlowZ = 0;
                        }
                        vel.y -= 1.5 * dt; // 沉降入明堂
                    }
                    
                    // 【聚水天心】：湖泊大水體阻尼（流速天然衰減至平靜）
                    if (state.w === 'jushui') {
                        let lakeDist = Math.sqrt(dxTaiji*dxTaiji + Math.pow(dzTaiji-30, 2));
                        if (lakeDist < 26) {
                            waterFlowX *= 0.05; waterFlowZ *= 0.05; // 湖面平靜
                            vel.y -= 0.6 * dt;
                            vel.multiplyScalar(Math.pow(0.80, dt)); // 動能自然沉降
                        }
                    }
                    
                    // 【交劍水】：水躍與深溝剪切引發流體拖拽
                    if (state.w === 'jiaojian') {
                        let swordLeft = Math.abs(dxTaiji - (dzTaiji-10)*1.2);
                        let swordRight = Math.abs(dxTaiji + (dzTaiji-10)*1.2);
                        if ((swordLeft < 5 || swordRight < 5) && dzTaiji > 10 && dzTaiji < 65) {
                            vel.y -= 4.5 * dt; // 捲入深溝
                            vel.z += 6.0 * dt; // 向前下方抽離
                            localTurbulence += 12.0; // 形成高速剪切亂流（自然依據亂流機制撕裂粒子）
                        }
                    }
                    
                    // 【葫蘆水】：水槽寬窄變化引發文丘里流速縮放
                    if (state.w === 'hulu') {
                        let venturi = 1.0 - Math.sin(dxTaiji * 0.15) * 0.6;
                        waterFlowX *= venturi; waterFlowZ *= venturi;
                    }
                    
                    // 【伏流/湧泉】：地下泉水垂直浮力噴發
                    if (state.w === 'fuliu' && Math.abs(dxTaiji) < 12 && dzTaiji > 15 && dzTaiji < 35) {
                        vel.y += 8.0 * dt; // 垂直水力托舉
                        localTurbulence += 2.0;
                    }

                    // BUG 修正：waterFlowX 是未歸一化的速度向量(極端時極大)，直接乘 1.5 採樣會飛越山脈，必須歸一化為單位方向向量後再乘上固定探測步長 
                    
                    waterFlowX += Math.sign(x) * 0.5 * wVel; // 水體微流動性
                    waterFlowZ += 0.8 * wVel;

                    let waterSpeed = Math.sqrt(waterFlowX*waterFlowX + waterFlowZ*waterFlowZ);

                    // BUG 修正：waterFlowX 是未歸一化的速度向量(極端時極大)，直接乘 1.5 採樣會飛越山脈，必須歸一化為單位方向向量後再乘上固定探測步長
                    let dirX = (waterSpeed > 0) ? (waterFlowX / waterSpeed) : 0;
                    let dirZ = (waterSpeed > 0) ? (waterFlowZ / waterSpeed) : 0;
                    let downstreamH = Engine3D.getTerrainY(x + dirX * 5.0, z + dirZ * 5.0).y;
                    if (downstreamH > t.y + 3.0) {
                        waterFlowX *= -0.3; 
                        waterFlowZ *= -0.3;
                        waterSpeed *= 0.3; 
                        
                        if (z > 10 && z < 50 && st === 0 && Math.random() < 0.08 * dt) {
                            this.pState[i] = 2; 
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.9; this.pCol[i*3+2] = 0.7;
                        }
                    }

                    // 【進化：彎道二次流與邊界層剝離 (Helicoidal Secondary Flow)】
                    // 純依據局部水流速度與地形下切深度計算流體剪切拖拽（完全移除字串判斷與狀態強改）
                    if (Math.abs(dxTaiji) < 30 && y <= waterLevel + 2.0) {
                        let helicoidalShear = waterSpeed * 0.35;
                        vel.z += Math.sign(riverRefZ - z) * helicoidalShear * dt; // 沿水流梯度拖拽
                        vel.y -= Math.abs(t.nz) * helicoidalShear * 0.5 * dt; // 沿河床坡度下切
                        if (helicoidalShear > 2.0) frameBoundarySep++; // 【探針：客觀記錄二次流剝離】
                    }

                    // 【客觀高速水流沖刷】：任何水體超速時均自然產生強大動能下拽（移除字串綁定與狀態強改）
                    if (waterSpeed > 5.0) {
                        vel.y -= waterSpeed * 0.25 * dt; // 高速水力拖拽
                        vel.z += waterSpeed * 0.20 * dt;
                    }

                    if (waterSpeed < 4.5) {
                        vel.multiplyScalar(Math.pow(0.1, dt)); 

                        // 【客觀深水流體力學】：粒子在深水潭中沿水底坡度自然滑移，禁止在水底生成穴場吉氣
                        let deepWaterThreshold = (state.d === 'pingyang') ? -3.4 : -15.0;
                        if (t.y < deepWaterThreshold) {
                            vel.x += t.nx * 2.5 * dt; 
                            vel.z += t.nz * 2.5 * dt;
                            vel.y -= 0.6 * dt; 
                        }
                    }

                    vel.x += waterFlowX * dt;
                    vel.z += waterFlowZ * dt;
                    
                } else { 
                    vel.x += t.nx * 0.5 * dt; 
                    vel.z += t.nz * 0.5 * dt; 

                    // 【客觀斷崖伯努利抽吸力場】：前方地形急遽下切時，產生流體邊界層剝離負壓加速度（狀態由物理主循環自然判定）
                    if (t.y > -12 && t.y < 8 && dzTaiji > 10 && dzTaiji < 55 && Math.abs(x) < 40) {
                        let cliffCheck = Engine3D.getTerrainY(x, z + 8); 
                        let dropThreshold = (state.d === 'pingyang') ? 2.0 : 8.0; 
                        if (t.y - cliffCheck.y > dropThreshold) { 
                            let suctionForce = (t.y - cliffCheck.y) * 0.15 * (state.waterVel || 1.0); 
                            vel.z += suctionForce * dt; // 負壓向前加速扯出
                            vel.y -= suctionForce * 0.8 * dt; // 負壓向下吸入低谷
                        }
                    }

                    // 【進化：熱力學斜坡風 (Diurnal Thermal Slope-Wind)】
                    // 利用太陽向量與地形法線的內積計算熱輻射吸收 (Solar Flux)
                    // 修正：使用迴圈外的暫存向量，避免每粒子每幀創建新物件
                    tempNormal.set(-t.nx, 1.0, -t.nz).normalize();
                    let solarFlux = tempNormal.dot(sunVec);
                    
                    if (Math.abs(x) < 40 && z > -20 && z < 40) {
                        // 陽坡受熱上升 (Updraft)，陰坡冷卻下沉 (Downdraft)
                        let thermalDeltaP = (solarFlux - 0.5) * 3.5; 
                        vel.y += thermalDeltaP * dt;
                        
                        // 若兩側護砂不對稱 (如逼壓 vs 無)，會引發單向橫切風，撕裂氣場腔室
                        let leftH = Engine3D.getTerrainY(x - 20, z).y;
                        let rightH = Engine3D.getTerrainY(x + 20, z).y;
                        // 修正：大幅放寬橫切風門檻 (10.0 -> 25.0)，避免正常山脊的高低差被誤判為斷層煞氣
                        if (Math.abs(leftH - rightH) > 25.0) {
                            frameThermalShear++; // 【探針：熱力學橫切風撕裂】
                            vel.x += Math.sign(rightH - leftH) * Math.abs(thermalDeltaP) * 1.5 * dt;
                            // 修正：將吉氣降級為散氣 (st=3)，而非直接轉為惡性紅煞
                            if (st === 2 && Math.random() < 0.05 * dt) {
                                this.pState[i] = 3;
                                this.pCol[i*3] = 0.4; this.pCol[i*3+1] = 0.8; this.pCol[i*3+2] = 0.9;
                            }
                        }
                    }

                    // 【進化：傅立葉/小波變換的能譜衰減 (Wavelet Energy Cascade)】
                    let ruggedness = Math.sqrt(t.nx*t.nx + t.nz*t.nz);
                    
                    // 檢查穴星附近的高頻噪聲頻譜是否呈現指數級衰減 (Exponential Decay)
                    if (dzTaiji > -15 && dzTaiji < 15 && Math.abs(x) < 25) {
                        let expectedDecay = Math.exp(-Math.pow(dzTaiji + 15, 2) / 50.0); // 理論應衰減至此
                        // 修正：放寬容差門檻 (+1.0 -> +4.0)，容許自然的地表小幅起伏，避免誤判
                        if (ruggedness > expectedDecay + 4.0) {
                            // 殘留高頻分量：煞氣未化，引發微觀量子態亂流 (Micro-turbulence)
                            frameWaveletSpike++; // 【探針：高頻煞氣未化】
                            vel.x += (Math.random() - 0.5) * ruggedness * 2.0 * dt;
                            vel.z += (Math.random() - 0.5) * ruggedness * 2.0 * dt;
                            if (st === 2 && Math.random() < ruggedness * 0.05 * dt) {
                                this.pState[i] = 3; // 降為散氣
                                this.pCol[i*3] = 0.4; this.pCol[i*3+1] = 0.8; this.pCol[i*3+2] = 0.9;
                            }
                        }
                    }

                    // 【客觀康達效應 (Coandă Effect)】：純依據地表幾何平滑度與貼地高度觸發邊界層吸附（完全解耦星體字串）
                    let isPhysicallySmooth = (ruggedness < 1.5 && y < t.y + 5.0 && z > -50 && z < 10);
                    
                    if (isPhysicallySmooth) {
                        frameCoanda++; // 【探針：客觀記錄康達附著】
                        vel.y -= 0.8 * dt; // 負壓貼地滑行
                        vel.x += (t.nx * 0.3 - vel.x) * 0.5 * dt; // 沿平滑曲面法線自然導流
                    }

                    // 【客觀地表法線梯度撕裂】：純依據微觀法線梯度大小判定（梯度 > 12.0 判定為尖銳碎岩，8.0~12.0 判定為陡坡滑移）
                    if (ruggedness > 8.0 && st !== 1 && st !== 3 && Math.random() < ruggedness * 0.01 * dt) {
                        if (ruggedness > 12.0) {
                            this.pState[i] = 1; // 極端尖銳岩角撕裂成紅煞
                            this.pCol[i*3] = 1.0; this.pCol[i*3+1] = 0.15; this.pCol[i*3+2] = 0.05;
                            if (Math.random() < 0.02) Engine3D.createShockwave(x, y, z, 0xff3333);
                        } else {
                            this.pState[i] = 3; // 陡坡自然滑移吹散
                            this.pCol[i*3] = 0.4; this.pCol[i*3+1] = 0.8; this.pCol[i*3+2] = 0.9;
                        }
                        vel.x += (Math.random() - 0.5) * ruggedness * 1.0;
                        vel.y += ruggedness * 0.3;
                        vel.z += (Math.random() - 0.5) * ruggedness * 1.0;
                    }

                    // 【湧現物理】4. 陸地地形屏障與微氣候 
                    let leftSand = Engine3D.getTerrainY(x - 25, z).y;
                    let rightSand = Engine3D.getTerrainY(x + 25, z).y;
                    let isLeftExposed = (leftSand < t.y + 3);
                    let isRightExposed = (rightSand < t.y + 3);

                    if (dzTaiji > -20 && dzTaiji < 45 && Math.abs(dxTaiji) < 40) {
                        if (isLeftExposed && globalWindX > 0) vel.x += globalWindX * 1.5 * dt;
                        if (isRightExposed && globalWindX < 0) vel.x += globalWindX * 1.5 * dt;

                        if ((isLeftExposed || isRightExposed) && Math.abs(globalWindX) > 0.1 && st === 2) {
                            if (Math.random() < Math.abs(globalWindX) * 0.15 * dt) {
                                this.pState[i] = 3; 
                                this.pCol[i*3] = 0.5; this.pCol[i*3+1] = 0.7; this.pCol[i*3+2] = 0.9;
                            }
                        }

                        if (!isLeftExposed && !isRightExposed) {
                            vel.x += (lx - x) * 0.05 * dt; 
                            vel.multiplyScalar(Math.pow(0.92, dt)); 
                        }

                        // 修復：將坡度亂流門檻調高至 6.0，避免正常坡道觸發斷崖逼壓炸成紅煞
                        if (Math.abs(t.nx) > 9.0) { 
                            // 【純客觀地形碰撞反彈】：移除瞬間傳送作弊，依據表面法線進行流體折射與減速
                            vel.x -= Math.sign(t.nx) * 2.5 * dt; 
                            vel.y += 1.0 * dt; 
                            vel.multiplyScalar(Math.pow(0.75, dt)); // 碰撞剛體消耗動能
                            if (st !== 1 && Math.random() < Math.abs(t.nx) * 0.005 * dt) {
                                this.pState[i] = 1; 
                                this.pCol[i*3] = 0.9; this.pCol[i*3+1] = 0.2; this.pCol[i*3+2] = 0.2;
                                if (Math.random() < 0.02) Engine3D.createShockwave(x, y, z, 0xff2222);
                            }
                        }
                    }

                    let rearH = Engine3D.getTerrainY(x, z - 25).y;
                    let frontH = Engine3D.getTerrainY(x, z + 45).y; // 延伸探測距離，避免過早判定為空虛

                    // 【進化：起伏屈曲的動能阻尼 (Kinematic Damping)】
                    // 當粒子撞擊陡峭的側向山壁 (之玄屈曲轉彎處)，或正在上坡時，大幅消耗動能 (煞車抵銷煞氣)
                    if (z < -10) {
                        let isUphill = (vel.z > 0 && t.nz > 0.5); // 正在往上爬坡
                        let isHittingWall = (Math.abs(t.nx) > 1.5 && Math.sign(vel.x) === Math.sign(t.nx)); // 撞擊側壁
                        if (isUphill || isHittingWall) {
                            vel.multiplyScalar(Math.pow(0.5, dt)); // 動能急遽衰減
                        }
                    }

                    // 【渡水過峽 (Hydraulic Jump)】：氣脈潛入水底後重新拔起，引發激烈水花氣泡
                    if (state.dushui && z > -45 && z < -15 && y < -10) {
                        vel.y += 2.5 * dt; // 浮力上湧
                        localTurbulence += 2.0;
                    }

                    // 【龍吐珠 (Coandă Bifurcation)】：圓潤金星將直衝的煞氣一分為二

                    // 【修復物理 BUG】：將下洗氣流與拒屍煞的作用域改為相對於動態穴星的區間 (dzTaiji)，確保明堂永遠能正確受測
                    if (dzTaiji > -15 && dzTaiji < 35) {

               let distToTaiji = Math.sqrt(dxTaiji*dxTaiji + dzTaiji*dzTaiji);

               if ((st === 1 || st === 3) && isEscaping) {
