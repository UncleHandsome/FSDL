<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 龍・山・水 終極全息模擬器 (大一統進化版)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --paper: #f6f1e7;
    --ink: #22201c;
    --seal: #a63a2b;
    --gold: #b98a2e;
    --jade: #3f6b52;
    --bg-dark: #14120e;
    --bg-panel: rgba(23, 26, 30, 0.85);
    --text: #cfc6b4;
}
body { margin: 0; overflow: hidden; background: var(--bg-dark); color: var(--text); font-family: 'Noto Sans TC', sans-serif; user-select: none; }

/* 左側控制面板 */
#panel-left {
    position: absolute; top: 10px; left: 10px; width: 380px; height: calc(100vh - 20px);
    display: flex; flex-direction: column; background: var(--bg-panel);
    border: 1px solid rgba(246,241,231,0.15); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(8px);
}
.header { text-align: center; padding: 12px 10px; border-bottom: 2px solid var(--gold); background: #171512; border-top-left-radius: 12px; border-top-right-radius: 12px; }
.header h1 { margin: 0; font-size: 16px; font-family: 'Noto Serif TC', serif; color: var(--paper); letter-spacing: 2px; }
.scroll-area { flex: 1; overflow-y: auto; padding: 12px; scrollbar-width: thin; scrollbar-color: var(--jade) #0e1114; }
.scroll-area::-webkit-scrollbar { width: 5px; }
.scroll-area::-webkit-scrollbar-track { background: #0e1114; border-radius: 3px; }
.scroll-area::-webkit-scrollbar-thumb { background: var(--jade); border-radius: 3px; }

.ctrl-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.ctrl-label { color: #a89e88; font-family: 'Noto Serif TC', serif; min-width: 45px; font-size: 13px; flex-shrink: 0; }
.seg { display: flex; gap: 3px; flex-wrap: wrap; flex: 1; }
.seg button {
    flex: 1; min-width: 42px; background: transparent;
    border: 1px solid rgba(246,241,231,0.2); color: var(--text);
    font-family: 'Noto Serif TC', serif; border-radius: 4px; padding: 4px 2px;
    cursor: pointer; font-size: 12px; transition: 0.2s; white-space: nowrap;
}
.seg button.on { background: var(--gold); border-color: var(--gold); color: #171512; font-weight: bold; }
.seg button.danger.on { background: var(--seal); border-color: var(--seal); color: #fff; }
.seg button:hover { background: rgba(246,241,231,0.08); border-color: rgba(246,241,231,0.5); }
.seg button.on:hover { background: #cda240; border-color: #cda240; }
.seg button.danger.on:hover { background: #c04a3a; border-color: #c04a3a; }
.seg button:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

.preset-btn { border-color: #7fb08f !important; color: #7fb08f !important; font-weight: bold; }
.preset-btn:hover { background: #7fb08f !important; color: #14120e !important; }

input[type=range] { width: 100%; margin: 0; accent-color: var(--gold); background: transparent; cursor: pointer; }

/* 右側分析面板 */
#panel-right { position: absolute; top: 10px; right: 10px; width: 300px; display: flex; flex-direction: column; gap: 10px; }
.box {
    background: var(--bg-panel); border: 1px solid rgba(246,241,231,0.15);
    border-radius: 12px; padding: 15px; backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
.radar-container { text-align: center; }
#radar { width: 100%; height: 160px; }

.meter-group { margin-bottom: 8px; }
.meter-title { font-size: 12px; display: flex; justify-content: space-between; margin-bottom: 2px; color: #a89e88; }
.meter-title b { color: var(--paper); }
.meter { height: 6px; background: rgba(246,241,231,0.1); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0%; transition: width 0.3s; }
.m-gather i { background: linear-gradient(90deg, #8a6a20, var(--gold)); }
.m-scatter i { background: linear-gradient(90deg, #7a2a20, var(--seal)); }
.m-cap i { background: linear-gradient(90deg, #3f6b52, #7fb08f); }

#verdict-box { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; border-left: 4px solid var(--gold); margin-top: 5px; }
#v-rating { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: bold; color: var(--gold); display: block; margin-bottom: 5px; }
#v-text { font-family: 'Noto Serif TC', serif; font-size: 13px; line-height: 1.5; color: #d8cfba; white-space: pre-line; }

/* 行動端 / 小螢幕自適應 RWD */
@media (max-width: 768px) {
    #panel-left { width: calc(100vw - 20px); height: 50vh; top: 10px; left: 10px; }
    #panel-right { width: calc(100vw - 20px); top: calc(50vh + 20px); right: 10px; left: 10px; }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="panel-left">
    <div class="header"><h1>3D 龍山水・大一統進化版</h1></div>
    <div class="scroll-area">
        <div class="ctrl-row"><span class="ctrl-label">龍勢</span><div class="seg" data-k="d"><button data-v="sheng">躍龍</button><button data-v="pingyang">平洋</button><button data-v="huilong">迴龍</button><button data-v="ji">急龍</button><button data-v="huan">緩龍</button><button data-v="si">死病</button><button data-v="po" class="danger">破</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">後山</span><div class="seg" data-k="mn"><button data-v="you">垂頭</button><button data-v="kang" class="danger">拒屍</button><button data-v="po" class="danger">破碎</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">左砂</span><div class="seg" data-k="ml"><button data-v="you">青龍有情</button><button data-v="ya" class="danger">逼壓</button><button data-v="po" class="danger">破碎</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">右砂</span><div class="seg" data-k="mr"><button data-v="you">白虎有情</button><button data-v="tai" class="danger">抬頭煞</button><button data-v="po" class="danger">破碎</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">前案</span><div class="seg" data-k="ms"><button data-v="you">朱雀翔舞</button><button data-v="di">低陷</button><button data-v="po" class="danger">破碎</button><button data-v="none">無</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">水勢</span><div class="seg" data-k="w"><button data-v="you">玉帶</button><button data-v="jiuqu">九曲</button><button data-v="gejiao" class="danger">割腳</button><button data-v="lintou" class="danger">淋頭</button><button data-v="ji" class="danger">直沖</button><button data-v="fan" class="danger">反弓</button><button data-v="bazi" class="danger">八字</button><button data-v="none">無水</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">星體</span><div class="seg" data-k="xing"><button data-v="jin">金</button><button data-v="mu">木</button><button data-v="shui">水</button><button data-v="huo" class="danger">火</button><button data-v="tu">土</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">穴形</span><div class="seg" data-k="xue"><button data-v="none">無</button><button data-v="wo">窩</button><button data-v="qian">鉗</button><button data-v="ru">乳</button><button data-v="tu">突</button></div></div>

        <div class="ctrl-row" style="margin-top:10px;"><span class="ctrl-label">護從</span><div class="seg"><button class="tog" data-k="shu">束氣</button><button class="tog danger" data-k="fenzhi">分流</button><button class="tog" data-k="guiyao">鬼曜</button><button class="tog" data-k="hulong">護龍</button><button class="tog" data-k="fengyao">蜂腰</button><button class="tog" data-k="zutai">祖脈</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">穴場</span><div class="seg"><button class="tog" data-k="xia">穴星</button><button class="tog" data-k="an">案山</button><button class="tog" data-k="chao">朝山</button><button class="tog" data-k="zhu">主山</button><button class="tog" data-k="xu">玄武</button><button class="tog" data-k="mt">明堂</button><button class="tog" data-k="taiji">太極</button><button class="tog" data-k="guan">官星</button><button class="tog danger" data-k="qing">傾瀉</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">水法</span><div class="seg"><button class="tog" data-k="san">三叉水</button><button class="tog" data-k="yue">半月池</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">水口</span><div class="seg"><button class="tog" data-k="luo">羅星</button><button class="tog" data-k="hua">華表</button><button class="tog" data-k="shixiang">獅象</button><button class="tog" data-k="qin">禽星</button></div></div>

        <div class="ctrl-row"><span class="ctrl-label">形煞</span><div class="seg"><button class="tog danger" data-k="tianzhan">天斬</button><button class="tog danger" data-k="qingquan">擎拳</button><button class="tog danger" data-k="ao">凹風</button><button class="tog danger" data-k="tantou">探頭</button><button class="tog danger" data-k="shaMode" id="btn-shaMode">手動置煞</button></div></div>

        <div class="ctrl-row"><span class="ctrl-label">風場</span><div class="seg" style="align-items:center;"><input type="range" id="wind-slider" min="-10" max="10" value="5" title="八風交吹強度 (左右側風)"><span id="wind-val" style="min-width:25px; text-align:right; font-size:12px; color:var(--gold);">+5</span></div></div>

        <div class="ctrl-row"><span class="ctrl-label">理氣</span><div class="seg" data-k="face"><button data-v="1">向水</button><button data-v="0">背水(坐空)</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">視效</span><div class="seg"><button class="tog" data-k="vHeat">3D熱力圖</button><button class="tog" data-k="vWind">風場矩陣</button><button id="btn-cam-cave">堪輿視角(C)</button><button id="btn-cam-reset">預設視角</button></div></div>
        <div class="ctrl-row"><span class="ctrl-label">時間</span><div class="seg" data-k="time"><button data-v="0">暫停</button><button data-v="1">1x</button><button data-v="2">2x</button></div></div>

        <div class="ctrl-row" style="margin-top:10px;"><span class="ctrl-label">預設</span>
            <div class="seg">
                <button class="preset-btn" data-p="perfect">完美巒頭</button>
                <button class="preset-btn" data-p="gejiao">割腳退財</button>
                <button class="preset-btn" data-p="huilong">迴龍顧祖</button>
                <button class="preset-btn" data-p="tianzhan">天斬傾瀉</button>
                <button class="preset-btn" data-p="random">隨機生成</button>
            </div>
        </div>
    </div>
</div>
<div id="panel-right">
    <div class="box radar-container">
        <h3 style="margin:0 0 5px 0;font-size:14px;color:var(--gold);font-family:'Noto Serif TC',serif;">五訣理氣理論分析</h3>
        <canvas id="radar" width="260" height="160"></canvas>
    </div>
    <div class="box">
        <div class="meter-group m-gather"><div class="meter-title"><span>湧現聚氣量 (Gather)</span><b id="g-num">0</b></div><div class="meter"><i id="g-fill"></i></div></div>
        <div class="meter-group m-scatter"><div class="meter-title"><span>湧現散煞氣 (Scatter)</span><b id="s-num">0</b></div><div class="meter"><i id="s-fill"></i></div></div>
        <div class="meter-group m-cap"><div class="meter-title"><span>明堂極限容量 (Capacity)</span><b id="cap-num">0</b></div><div class="meter"><i id="cap-fill"></i></div></div>
        <div id="verdict-box">
            <span id="v-rating">觀測中</span>
            <div id="v-text">載入中...</div>
        </div>
    </div>
</div>

<script>
/* ==========================================
   1. CONFIGURATION & CORE STATE
   ========================================== */
const CONFIG = {
    tSize: 350,
    tSeg: 150,
    pCount: 15000, // 優化效能與視覺平衡
    maxObstacles: 5,
    maxShockwaves: 50,
    baseState: {
        // 修改：將預設 degree 改為 0 (朝北)，以符合九運「零神見水」催財大吉，避免完美巒頭遭正神下水誤扣分
        d:'sheng', mn:'you', ml:'you', mr:'you', ms:'you', w:'jiuqu', xing:'jin', xue:'wo', face:'1', degree: 0, time:'1', 
        shu:true, fenzhi:false, guiyao:false, hulong:false, fengyao:true, zutai:false,
        xia:true, an:true, chao:true, zhu:true, xu:true, mt:true, taiji:true, guan:false, qing:false,
        san:false, yue:false, luo:false, hua:false, shixiang:false, qin:false,
        tianzhan:false, qingquan:false, ao:false, tantou:false,
        vHeat:true, vWind:true, shaMode:false, wind: 5
    },
    presets: {
        // 補齊：加入 guiyao:true，還原強龍生曜武將帶刀的真格屬性
        perfect: {d:'sheng',ml:'you',mr:'you',ms:'you',mn:'you',w:'jiuqu',xing:'jin',xue:'wo',face:'1', mt:true,xia:true,an:true,chao:true,zhu:true,xu:true,taiji:true,san:true,yue:true,luo:true,hua:true,shixiang:true,qin:true,shu:true,fengyao:true,hulong:true,zutai:true,guan:true, guiyao:true, wind:2},
        gejiao: {d:'sheng',ml:'you',mr:'tai',ms:'you',mn:'you',w:'gejiao',xing:'jin',xue:'none',face:'1', mt:true,xia:false,an:false,chao:true,zhu:true,xu:true,taiji:false,san:false,yue:false,luo:false,hua:false,shixiang:false,qin:false,shu:true,fengyao:true,hulong:false,zutai:false,guan:false, wind:8},
        huilong: {d:'huilong',ml:'you',mr:'you',ms:'you',mn:'you',w:'you',xing:'jin',xue:'ru',face:'1', mt:true,xia:true,an:true,chao:true,zhu:true,xu:true,taiji:true,san:false,yue:false,luo:false,hua:false,shixiang:true,qin:false,hulong:true,fengyao:true,zutai:false,guan:false, wind:2},
        tianzhan: {d:'sheng',ml:'you',mr:'you',ms:'you',mn:'you',w:'you',xing:'jin',xue:'none',face:'1', mt:true,xia:true,an:true,chao:true,zhu:true,xu:true,taiji:false,san:false,yue:false,luo:false,hua:false,shixiang:false,qin:false,tianzhan:true,qing:true, wind:8}
    }
};

const AppState = {
    current: { ...CONFIG.baseState },
    obstacles: [],
    shockwaves: [],
    gatherAcc: 0,
    scatterAcc: 0,
    smoothedScores: null, // 儲存一階低通濾波後的平滑分數 [龍, 穴, 砂, 水, 向]
    frames: 0,

    resetTo(presetName) {
        let p = presetName === 'random' ? Rules.generateRandomPreset() : CONFIG.presets[presetName];
        Object.assign(this.current, CONFIG.baseState);
        Object.keys(p).forEach(k => this.current[k] = p[k]);

        while(Engine3D.obsGroup.children.length > 0) {
            let child = Engine3D.obsGroup.children[0];
            Engine3D.obsGroup.remove(child);
        }
        this.obstacles.length = 0;

        // 修復：清空舊震波 Mesh 避免 WebGL 記憶體洩漏
        while(Engine3D.swGroup.children.length > 0) {
            let child = Engine3D.swGroup.children[0];
            Engine3D.swGroup.remove(child);
            if(child.material) child.material.dispose();
        }
        this.shockwaves.length = 0;

        // 修復：重置實時粒子統計與分數濾波緩存，避免跨格局狀態污染
        this.gatherAcc = 0;
        this.scatterAcc = 0;
        this.smoothedScores = null;

        UI.syncDOM();
        // 修復：移除獨立的 Engine3D.buildTerrain()，改用 UI.update(true) 統一校驗與單次建構
        // 防止無效狀態引發防呆機制，導致同一幀重複渲染兩次地形
        UI.update(true);
        Physics.resetParticles();
        Engine3D.clearHeatmap();
    }
};

/* ==========================================
   2. RULES ENGINE (理論評分系統)
   ========================================== */
const Rules = {
    getGlobalMultiplier() {
        const state = AppState.current;
        let m = 1.0;
        if(!state.xia) m *= 0.4;
        if(!state.mt) m *= 0.6;

        if(state.d === 'po') m *= 0.25;
        if(state.d === 'si') m *= 0.35;
        // 緩來急受：緩龍若結「乳/突」急穴，化弱為強，不予扣分；否則扣分
        if(state.d === 'huan' && state.xue !== 'ru' && state.xue !== 'tu') m *= 0.65;
        // 急來緩受：急龍若結「窩/鉗」緩穴，煞氣得化；否則若無案無堂則重扣
        if(state.d === 'ji' && state.xue !== 'qian' && state.xue !== 'wo' && !state.an && !state.mt && !state.guan) m *= 0.7;

        if(state.ml === 'ya') m *= 0.85;
        if(state.mr === 'tai') m *= 0.65;
        if(state.ml === 'ya' && state.mr === 'tai') m *= 0.75;
        if(state.ml === 'po') m *= 0.75;
        if(state.mr === 'po') m *= 0.75;
        if(state.ml === 'po' && state.mr === 'po') m *= 0.65;
        if(state.ms === 'po') m *= 0.80;
        if(state.mn === 'po') m *= 0.80;
        if(state.mn === 'kang') m *= 0.55;
        if(state.ms === 'di') m *= 0.75;
        if(state.ms === 'none') m *= 0.85;
        if(state.mn === 'none') m *= 0.7;

        if(state.d !== 'pingyang'){
            if(state.ml === 'none' && state.mr === 'none') m *= 0.5;
            else if(state.ml === 'none' || state.mr === 'none') m *= 0.8;
        }

        if(state.ao) m *= (state.shu ? 0.25 : 0.4);
        if(state.tantou) m *= 0.55;
        // 修正 5：天斬罡風若剛好劈中脆弱的「束氣過峽」，即為「風吹脈斷」大凶絕地，扣分暴增
        if(state.tianzhan) m *= (state.shu ? 0.15 : 0.45); 
        if(state.qingquan) m *= 0.65;
        if(state.fenzhi) m *= 0.7;

        // 風速 Slider 連動評分：風速過大且無左右護砂，藏風聚氣加權下降
        const windAbs = Math.abs(state.wind);
        if(windAbs > 3) {
            if (state.d === 'pingyang') {
                // 平洋以水為龍，不怕八風交吹，風力對其影響微乎其微
                m *= Math.max(0.85, 1.0 - (windAbs - 3) * 0.01);
            } else {
                const hasProtection = (state.ml === 'you' && state.mr === 'you');
                const windImpact = hasProtection ? (windAbs - 3) * 0.02 : (windAbs - 3) * 0.05;
                m *= Math.max(0.3, 1.0 - windImpact);
            }
        }

        if(state.xing === 'huo'){
            // 修正 1：水火既濟必須水在「前方(face='1')」。若為背水，水在後方非但不能濟火，反成「水火相背」
            const hasGoodWaterControl = (state.yue || state.san || state.w === 'you' || state.w === 'jiuqu') && state.face === '1';
            m *= hasGoodWaterControl ? 0.80 : 0.25; 
        }
        if(state.xia){
            // 修正風水堪輿法則：金星/水星結乳/突/鉗/窩皆可為正格（如覆釜垂乳、金鵝抱蛋）；僅火星直結穴、木星結深窩、或山龍火星結硬突犯星穴相剋
            if(state.xue === 'wo' && (state.xing === 'mu' || state.xing === 'huo')) m *= 0.35;
            else if((state.xue === 'tu' || state.xue === 'ru') && state.xing === 'huo' && state.d !== 'pingyang') m *= 0.35;
            else if(state.xue === 'qian' && state.xing === 'huo') m *= 0.35;
        }

        if(state.d === 'pingyang' && state.w === 'none') m *= 0.25;
        if(state.d === 'ji' && (state.w === 'ji' || state.w === 'bazi')) m *= 0.30; // 急龍逢直沖/八字水分飛，無法聚氣
        
        // 置煞空間權重計算：距離穴心 (0, 0, 5) 越近，煞氣威力呈指數級上升
        if(AppState.obstacles.length > 0) {
            let totalObsImpact = 0;
            AppState.obstacles.forEach(obs => {
                let dx = obs.mesh.position.x - 0;
                let dz = obs.mesh.position.z - 5;
                let dist = Math.sqrt(dx*dx + dz*dz);
                // 高斯衰減：15單位內極凶，60單位外影響微弱
                let impact = Math.exp(-dist / 25.0);
                totalObsImpact += impact;
            });
            m *= Math.max(0.15, 1.0 - totalObsImpact * 0.45);
        }

        let validGuards = (state.ml !== 'none' || state.mr !== 'none' || state.d === 'pingyang');
        const isBadWater = ['gejiao','fan','bazi','ji','lintou'].includes(state.w);
        let waterGuards = (validGuards && !isBadWater) ? ((state.luo ? 1 : 0) + (state.hua ? 1 : 0) + (state.shixiang ? 2 : 0) + (state.qin ? 1 : 0)) : 0;
        let anshanShield = state.an ? 0.35 : 0;

        if(['gejiao','ji','fan','bazi','lintou'].includes(state.w)) {
            let base = (state.w === 'bazi' || state.w === 'gejiao' || state.w === 'fan' || state.w === 'lintou') ? 0.25 : 0.45;
            let waterCap = (state.w === 'bazi' || state.w === 'gejiao' || state.w === 'fan' || state.w === 'lintou') ? 0.75 : 0.9;
            let effectiveAnShield = (state.w === 'bazi' || state.w === 'lintou') ? anshanShield * 0.15 : ((state.w === 'gejiao' || state.w === 'fan') ? anshanShield * 0.35 : anshanShield);
            // 風水學理：八字、割腳、淋頭皆為「貼身極凶煞」，遠處水口神獸關攔無法挽救近身破壞，水關攔完全無效
            let effectiveWaterGuards = (state.w === 'bazi' || state.w === 'gejiao' || state.w === 'lintou') ? 0 : waterGuards;
            m *= Math.min(waterCap, base + effectiveWaterGuards * 0.12 + effectiveAnShield);
        }

        if(state.qing) m *= Math.min(0.9, 0.55 + waterGuards * 0.12 + anshanShield);
        if(state.face === '0' && state.d !== 'pingyang' && state.w !== 'none') m *= 0.5;

        if(state.d === 'pingyang' && state.w !== 'none') {
            const hasFrontGoodWater = (state.w === 'jiuqu' || state.w === 'you' || state.yue || state.san);
            const hasCompleteSands = (state.ml === 'you' && state.mr === 'you' && state.an);
            if(state.face === '0') {
                if(!hasFrontGoodWater || !hasCompleteSands) m *= 0.5;
            } else if(state.w !== 'jiuqu' && state.w !== 'you') m *= 0.75;
        }

        if(state.xia && state.xing === 'mu' && state.xue === 'none') m *= 0.5;
        // 修正五行生剋：金生水、水生木、水體自旺皆吉。土剋水反耗財氣(山水相戰)，不應列入大吉加權。
        if(state.d !== 'si' && state.d !== 'po' && state.xia && (state.xing === 'jin' || state.xing === 'mu' || state.xing === 'shui') && state.ml === 'you' && state.mr === 'you' && (state.w === 'you' || state.w === 'jiuqu') && state.an) m *= 1.15;
        if(state.d === 'huilong' && state.d !== 'si' && state.d !== 'po' && !isBadWater && state.zutai && state.face === '0') m *= 1.2;
        if(state.fengyao && state.hulong && state.zutai && state.d !== 'si' && state.d !== 'po') m *= 1.1;

        return m;
    },

    computeScores() {
        const state = AppState.current;
        let isBadDragon = (state.d === 'si' || state.d === 'po');
        let D_raw = {sheng:90, si:35, po:20, pingyang:70, huilong:95, ji:55, huan:45}[state.d];
        let isPingyang = (state.d === 'pingyang');
        if(state.shu && !isBadDragon && !isPingyang) D_raw += 10;
        else if(state.shu && isBadDragon) D_raw -= 15;
        if(state.fenzhi) D_raw -= 30; 
        if(state.zutai) D_raw += 15; 
        if(state.fengyao && !isPingyang) D_raw += 12; 
        if(state.hulong && !isPingyang) D_raw += 12;
        if(state.d === 'pingyang' && state.w === 'none') D_raw -= 45;
        let D = Math.max(0, Math.min(100, D_raw));

        let mlScore = {you:35, ya:-18, po:-8, none:0}[state.ml]; // 青龍逼壓為形煞，修正為負分 -18
        let mrScore = {you:35, tai:-25, po:-8, none:0}[state.mr]; // 白虎抬頭為重煞，修正大幅扣分 -25
        let msScore = {you:35, di:-10, po:-12, none:-15}[state.ms]; // 修正：朱雀完全缺失(none)比低陷(di)更空虛漏氣，給予 -15 分
        let mnScore = {you:40, kang:-15, po:-12, none:0}[state.mn];

        let baseS = (state.d === 'pingyang' && state.ml === 'none' && state.mr === 'none') ? 55 : (mlScore + mrScore + msScore + mnScore);
        
        // 修正 1：案山(前擋)必須搭配明堂(空間)。若無明堂而有案山，為「案山逼壓/欺主煞」，非但不吉，反而大凶。
        let anBonus = 0;
        if (state.an) {
            if (!state.mt) anBonus = -25; // 案山逼壓欺主，前途斷絕
            else if (state.ms !== 'di' && state.ms !== 'po') anBonus = 12;
            else anBonus = 2; // 朱雀低陷則護持力極弱
        }
        let chaoBonus = (state.chao && state.ms !== 'di' && state.ms !== 'po') ? 10 : (state.chao ? 3 : 0);
        
        baseS += anBonus + chaoBonus + (state.zhu ? 10 : 0) + (state.xu ? 10 : 0);
        if(state.ao) baseS -= 40; if(state.tantou) baseS -= 30; if(state.qingquan) baseS -= 30;
        if(state.ml === 'ya' && state.mr === 'tai') baseS -= 40;
        if(state.mn === 'kang') baseS -= 35;
        if(state.hulong) baseS += 15;
        if(state.guiyao) {
            if(['po','si','huan'].includes(state.d)) {
                baseS -= 25;
            } else if (state.d === 'ji') {
                // 修正 2：急龍(動能暴走)若再生「鬼曜」推波助瀾，形同失速列車，名為「催煞」，大凶
                baseS -= 30; 
            } else {
                if(state.xing === 'shui') baseS += 5; else if(state.xing === 'huo') baseS += 18; else baseS += 12;
            }
        }
        let S = Math.max(0, Math.min(100, baseS));

        let validGuards = (state.ml !== 'none' || state.mr !== 'none' || state.d === 'pingyang');
        const isBadWater2 = ['gejiao','fan','bazi','ji'].includes(state.w);
        let waterExitScore = 0;
        // 風水學理：直沖水為來水直射穴心（槍煞），水口神獸（去水關攔）無法為直沖煞加分
        if(state.w !== 'none' && state.w !== 'lintou' && state.w !== 'ji' && validGuards) {
            waterExitScore = (state.luo ? 15 : 0) + (state.hua ? 15 : 0) + (state.shixiang ? 25 : 0) + (state.qin ? 10 : 0);
            if(isBadWater2) waterExitScore *= 0.60;
        }

        let baseWa = {you:65, jiuqu:95, gejiao:8, lintou:0, none:35, ji:12, fan:8, bazi:5}[state.w];
        
        if (state.san) {
            if (!isBadWater2 && (state.d !== 'pingyang' || state.luo || state.hua || state.shixiang)) {
                baseWa += 12; // 吉水交會，水聚天心
            } else if (isBadWater2) {
                // 修正 3：凶水(割腳/反弓/直沖)若遇「三叉水」交會，名為「激水絞肉煞」，兩股凶水相撞，破壞力翻倍。
                baseWa -= 35; 
            }
        }
        
        if(state.yue && !isBadWater2) baseWa += 8;
        let Wa = Math.max(0, Math.min(100, baseWa + waterExitScore));

        let xueScore = 0;
        if(state.xia) {
            if(state.xue === 'wo') {
                xueScore = (state.d === 'ji' || state.d === 'sheng') ? 18 : 5;
                if(state.xing === 'jin' || state.xing === 'shui') xueScore += 18;
                if(state.xing === 'mu') xueScore -= 18; if(state.xing === 'huo') xueScore -= 25;
            } else if(state.xue === 'ru') {
                xueScore = (state.d === 'pingyang' || state.d === 'huan') ? 22 : 12;
                if(state.xing === 'mu' || state.xing === 'tu' || state.xing === 'jin' || state.xing === 'shui') xueScore += 18; // 金水垂乳乃正格吉穴（如覆釜垂乳）
                if(state.xing === 'huo') xueScore -= 50;
            } else if(state.xue === 'qian') {
                xueScore = (state.an && state.mt) ? 15 : -10;
                if(state.xing === 'jin' || state.xing === 'shui') xueScore += 12;
                if(state.xing === 'mu') xueScore += 15; // 木星開雙釵/合襟鉗穴乃木星正格，修正加分 +15
                if(state.xing === 'huo') xueScore -= 30; if(state.xing === 'tu') xueScore += 8;
            } else if(state.xue === 'tu') {
                if (state.d === 'pingyang') {
                    xueScore = 25; // 平洋一突勝千峰，極品大吉
                } else {
                    // 山龍結突穴極忌八風交吹，若無青龍白虎雙重包裹，則為「高山孤突煞」，必主敗絕
                    if (state.ml === 'none' || state.mr === 'none') {
                        xueScore = -25;
                    } else {
                        xueScore = 12; // 左右護砂藏風，方可結突穴
                    }
                }
                if(state.xing === 'jin' || state.xing === 'tu') xueScore += 15; // 金泡/土突為吉
                if(state.xing === 'shui') xueScore -= 15;
                if(state.xing === 'mu') xueScore += 10; if(state.xing === 'huo') xueScore -= 40;
            }
            let xingScore = {jin:12, mu:12, shui:8, tu:12}[state.xing] || 0;
            if(state.xing === 'huo') xingScore = (state.yue || state.san || state.w === 'you' || state.w === 'jiuqu') ? -35 : -55;
            xueScore += xingScore;
        }

        // 割腳水逼穴沖刷，明堂必遭掏空，無法獲得明堂加分，且須額外重扣
        let mtScore = (state.w === 'gejiao') ? 0 : (state.mt ? 22 : 0);
        
        // 修正 3：死/破龍氣竭，強行立穴非但不加分，反成藏凶「煞穴」
        let finalXueScore = (state.xia ? xueScore : 0);
        if (state.xia && isBadDragon) finalXueScore = -40;

        // 修正 2：明堂傾瀉如同溜滑梯，真氣無法停留，絕對不可能結成「太極暈」
        let taijiScore = (state.taiji && !state.qing) ? 28 : 0;
        let X_raw = taijiScore + (state.xia ? 28 : 0) + mtScore + finalXueScore;
        
        // 修正 4：無太極暈者非真穴，徒具其形為「虛花假穴」，穴場分數直接崩潰
        if (state.xia && !state.taiji) X_raw *= 0.35; 

        if(state.w === 'gejiao') X_raw -= 25; 
        if(state.xue === 'qian' && !isBadDragon) X_raw += 15; // 破龍結鉗穴不予加分
        if(state.tianzhan) X_raw -= 35; if(state.qing) X_raw -= 30;

        let X_base = !state.xia ? Math.min(25, Math.max(0, X_raw)) : X_raw;
        let X = Math.max(-50, Math.min(100, X_base));

        let hasFrontGoodWaterSc = (state.w === 'jiuqu' || state.w === 'you' || state.yue || state.san);
        let Xg_base = state.face === '1' ? 65 : (state.d === 'pingyang' && state.w !== 'none' ? (hasFrontGoodWaterSc ? 25 : 90) : 20);
        let waterBonus = (state.w === 'you' || state.w === 'jiuqu') ? 25 : 0;
        let anshanBonus = state.an ? 12 : 0;
        let guanBonus = state.guan ? 15 : 0;
        if(state.guan) {
            if(state.xing === 'mu') guanBonus -= 8; else if(state.xing === 'jin') guanBonus += 8; else if(state.xing === 'shui') guanBonus -= 5; else if(state.xing === 'huo') guanBonus += 10;
        }

        // 零正神水法（以當前九運 2024-2043 為準）：預設以坎宮朝北 (0°) 為零神催財水方位，避免無羅盤控制時誤判
        let zeroGodBonus = 0;
        let deg = (state.degree !== undefined) ? state.degree : 0;
        // 九運：向首朝北（坎宮 315°~45°）見水為零神催財水；朝東（震宮 75°~105°）為照神催官水；朝南（離宮 135°~225°）則犯正神下水煞
        let isZeroGodWater = (state.w !== 'none') && (state.face === '1') && (deg <= 45 || deg >= 315);
        let isZhaoGodWater = (state.w !== 'none') && (state.face === '1') && (deg >= 75 && deg <= 105);
        let isDirectGodWaterClash = (state.w !== 'none') && (state.face === '1') && (deg >= 135 && deg <= 225); // 南方正神見水犯下水煞

        if (isZeroGodWater) zeroGodBonus += 15; // 零神(北)得水催財大吉
        if (isZhaoGodWater) zeroGodBonus += 10; // 照神(東)得水催貴聚氣
        if (isDirectGodWaterClash) zeroGodBonus -= 25; // 正神(南)下水破財大凶
        if (state.face === '0' && state.d === 'pingyang') zeroGodBonus += 10; // 平洋龍「坐空朝滿/倒騎龍」水繞後背不以正神下水論

        let Xg = state.face === '1'
            ? Math.min(100, Xg_base + waterBonus + anshanBonus + guanBonus + zeroGodBonus)
            : Math.min(100, Xg_base + (state.d === 'pingyang' && state.w !== 'none' ? waterBonus : 0) + (state.an ? 8 : 0) + zeroGodBonus);
        if(!state.xia) Xg *= 0.35;

        let vetoPenalty = 0;
        if(state.w === 'lintou') vetoPenalty = state.d === 'pingyang' ? 28 : 55;
        if(state.w === 'fan') vetoPenalty += 35;
        if(state.w === 'ji') vetoPenalty += 35; // 修正：直沖水（槍煞/沖心煞）增加 vetoPenalty 一票否決扣分
        if(state.d === 'po' && state.w === 'gejiao') vetoPenalty += 35;
        if(state.ml === 'po' && state.mr === 'po' && state.ao) vetoPenalty += 30;
        if(state.d === 'ji' && (state.w === 'ji' || state.w === 'bazi')) vetoPenalty += 40; // 龍急水直（牽牛水），氣隨水散，人丁滅絕
        
        // 修正 4：玄武拒屍(後山推斥) + 背水坐空(後方水拉扯) = 「山水皆棄」，真氣腹背受敵，徹底絕滅
        if(state.mn === 'kang' && state.face === '0') vetoPenalty += 50;

        let xiangBonus = 0;
        const isBadWaterRuleSc = ['gejiao','fan','bazi','ji','lintou'].includes(state.w);
        // 修正：迴龍顧祖必須「回頭向後(face='0')」且朝拜太祖山(zutai)。若 face='1' 則為背祖無情，大凶。
        if(state.d === 'huilong' && !isBadDragon && !isBadWaterRuleSc) {
            if(state.face === '0' && state.zutai) xiangBonus += 25; // 顧祖有情，太祖山作朝案，大吉
            else if (state.face === '1') xiangBonus -= 25; // 反骨背主，氣脈不交，大凶
        }
        if(!isBadDragon && state.xia && ['jin','tu','shui'].includes(state.xing) && state.ml === 'you' && state.mr === 'you' && ['you','jiuqu'].includes(state.w) && state.an) X += 10;

        // 導入實時粒子動態物理反饋 (Dynamic Particle Feedback)
        let totalP = AppState.gatherAcc + AppState.scatterAcc;
        let dynRatio = totalP > 0 ? (AppState.gatherAcc / totalP) : 0.5;
        let dynScoreBonus = (dynRatio - 0.5) * 20; // 隨動態氣場聚散上下浮動 -10~+10 分

        return [
            Math.max(0, Math.min(100, D - vetoPenalty + dynScoreBonus * 0.5)),
            Math.max(-50, Math.min(100, X + xiangBonus - vetoPenalty * 0.5 + dynScoreBonus)),
            Math.max(0, Math.min(100, S - vetoPenalty * 0.3 + dynScoreBonus * 0.5)),
            Math.max(0, Math.min(100, Wa - vetoPenalty * 0.5 + dynScoreBonus * 0.5)),
            Math.max(0, Math.min(100, Xg + xiangBonus - vetoPenalty * 0.3 + dynScoreBonus * 0.8))
        ];
    },

    getVerdictText(customScores) {

        const dynMult = Math.min(1.4, Math.max(0.2, dynRatio * 1.5)); // 動態加權倍數

        let rating, color, tail;

        else if(state.w === 'lintou'){ rating='大凶・淋頭煞頂'; color='#a63a2b'; tail='穴後水體灌頂傾瀉，犯風水極凶之「淋頭煞」，主人丁滅絕、破家絕嗣，絕不可立穴。'; }
        else if(state.xia && !isXueMatch){ rating='大凶・星穴相剋'; color='#a63a2b'; tail='星體與穴形犯嚴重形煞相剋（如火星直結四穴、木星結深窩），穴場化為凶煞，無法聚氣。'; }
        else if(effectiveAvg >= 70 && state.xia && state.mt && hasSideSands && dynRatio > 0.6){ rating='上吉・龍真穴的'; color='#b98a2e'; tail='巒頭完美且實時粒子物理流動藏風聚氣，上上之局。'; }
        else if(effectiveAvg >= 35){
            if(!state.xia){rating='中平・有龍無穴';color='#3f6b52';tail='龍脈護從雖美，惟穴星未結，難以乘氣。';}
            else if(!state.mt){rating='中平・明堂未成';color='#3f6b52';tail='穴星已成但明堂不足，生氣易散。';}
            else if(!hasSideSands){rating='中平・缺砂受風';color='#3f6b52';tail='山龍左右無護砂關攔，兩邊受風，生氣難聚。';}
            else if(dynRatio < 0.4){rating='中平・氣場散失';color='#3f6b52';tail='靜態巒頭尚可，但實時風場或形煞導致粒子聚氣率低下。';}
            else{rating='中平・有瑕';color='#3f6b52';tail='格局有瑕，聚散互見。';}
        }
        else {

            else if(dynRatio < 0.2){rating='大凶・極度吹散';color='#a63a2b';tail='實時動態物理顯示強烈風場/煞氣已完全摧毀穴場氣脈。';}
            else{rating='大凶・不聚';color='#a63a2b';tail='煞氣肆橫，生氣耗散。';}
        }

        let shaNotes = [];
        if(AppState.obstacles.length > 0) shaNotes.push(`手動煞氣(${AppState.obstacles.length}處)`);
        if(state.qing) shaNotes.push('明堂傾瀉'); if(state.tianzhan) shaNotes.push('天斬煞');
        if(state.ao) shaNotes.push('凹風煞'); if(state.fenzhi) shaNotes.push('枝龍分流');
        if(state.ml === 'ya') shaNotes.push('青龍逼壓'); if(state.mr === 'tai') shaNotes.push('白虎抬頭');

        if(state.w === 'fan') shaNotes.push('反弓水'); if(state.w === 'bazi') shaNotes.push('八字水');
        if(state.qingquan) shaNotes.push('擎拳煞'); if(state.tantou) shaNotes.push('探頭煞');
        let shaStr = shaNotes.length > 0 ? `【犯煞：${shaNotes.join('、')}】\n` : '';
        let multStr = mult < 1 ? `【總加權 ×${mult.toFixed(2)}】\n` : '';

        // 新增：趨吉避凶 / 化煞建議分析引擎
        let advice = [];
        if(!state.xia) advice.push('宜尋找龍脈止落處建立穴星');
        if(!state.mt) advice.push('宜開闢內外明堂以聚生氣');
        if(state.ml === 'none' || state.mr === 'none') advice.push('兩邊缺砂，宜築造護龍或植林以禦風吹');
        if(state.w === 'gejiao' || state.w === 'fan') advice.push('宜改建半月池或三叉水以改道避煞');
        if(state.ao) advice.push('宜增加「束氣」或補齊側砂以擋凹風');
        if(state.xing === 'huo' && !state.yue && !state.san) advice.push('火星結穴極燥，亟需半月池或三叉水鎮壓水火既濟');
        if(Math.abs(state.wind) > 6) advice.push('八風交吹過劇，宜調降風速或加強案山關攔');
        
        let adviceStr = advice.length > 0 ? `\n\n💡【趨吉避凶建議】：\n• ${advice.slice(0, 2).join('\n• ')}` : '';

        return { rating, color, text: `${shaStr}${multStr}${tail}${adviceStr}` };
    },

    getCapacityLimit() {
        const state = AppState.current;
        let cap = 0;
        if(state.ml==='you') cap+=20; else if(state.ml==='ya') cap-=10; else if(state.ml==='po') cap-=8;
        if(state.mr==='you') cap+=20; else if(state.mr==='tai') cap-=10; else if(state.mr==='po') cap-=8;
        if(state.ms==='you') cap+=20; else if(state.ms==='di') cap-=15; else if(state.ms==='po') cap-=12;
        if(state.mn==='you') cap+=25; else if(state.mn==='kang') cap-=15; else if(state.mn==='po') cap-=12;

        if(state.an) cap+=10; if(state.chao) cap+=8; if(state.xia) cap+=10;
        if(state.zhu) cap+=10; if(state.xu) cap+=10; if(state.mt) cap+=20;
        if(state.xue==='qian') cap+=15; if(state.hulong) cap+=10; if(state.zutai) cap+=10; if(state.fengyao) cap+=10;
        if(state.luo) cap+=10; if(state.hua) cap+=10; if(state.shixiang) cap+=15; if(state.qin) cap+=5;

        if(!state.mt) cap = Math.min(cap, 25);
        if(state.ml==='none' && state.mr==='none' && state.d !== 'pingyang') cap = Math.min(cap, 30);
        if(state.d === 'pingyang' && state.w === 'none') cap = Math.min(cap, 15);
        if(state.w === 'gejiao' || state.w === 'lintou') cap = Math.min(cap, 20);
        if(state.w === 'lintou') cap = Math.min(cap, 5);
        if(['gejiao', 'lintou', 'fan', 'bazi', 'ji'].includes(state.w)) cap = Math.min(cap, 20);
        if(state.qing) cap = Math.min(cap, 30);
        return Math.max(0, Math.min(100, cap));
    },

    generateRandomPreset() {
        const p = {
            // 進一步優化權重：提高「躍龍」「有情」「吉水」等觀賞性較佳的基本盤，降低極端無水或全無砂的機率
            d: ['sheng','sheng','sheng','pingyang','pingyang','huilong','huilong','ji','huan','si','po'][Math.floor(Math.random()*11)],
            mn: ['you','you','you','kang','po','none'][Math.floor(Math.random()*6)],
            ml: ['you','you','you','ya','po','none'][Math.floor(Math.random()*6)],
            mr: ['you','you','you','tai','po','none'][Math.floor(Math.random()*6)],
            ms: ['you','you','you','di','po','none'][Math.floor(Math.random()*6)],
            w: ['you','you','jiuqu','jiuqu','gejiao','lintou','ji','fan','bazi','none'][Math.floor(Math.random()*10)],
            xing: ['jin','jin','mu','shui','huo','tu','tu'][Math.floor(Math.random()*7)],
            xue: ['none','wo','wo','qian','ru','tu'][Math.floor(Math.random()*6)],
            degree: Math.floor(Math.random() * 360), // 隨機生成坐向角度以連動零神/正神水法
            face: Math.random() < 0.7 ? '1' : '0',
            mt: Math.random() < 0.8, xia: Math.random() < 0.85, an: Math.random() < 0.75,
            chao: Math.random() < 0.6, zhu: Math.random() < 0.8, xu: Math.random() < 0.8, taiji: Math.random() < 0.7,
            wind: Math.floor(Math.random()*17) - 8, // 稍微收斂風速，避免隨機生成動不動就滿級狂風
            fenzhi: Math.random() < 0.2, tantou: Math.random() < 0.2, guiyao: Math.random() < 0.3, ao: Math.random() < 0.25, shu: Math.random() < 0.6,
            san: Math.random() < 0.3, yue: Math.random() < 0.3, luo: Math.random() < 0.25, hua: Math.random() < 0.25, hulong: Math.random() < 0.35,
            fengyao: Math.random() < 0.4, zutai: Math.random() < 0.3, guan: Math.random() < 0.3, qin: Math.random() < 0.25, qing: Math.random() < 0.2,
            shixiang: Math.random() < 0.25, tianzhan: Math.random() < 0.15, qingquan: Math.random() < 0.2
        };

        // 強化隨機邏輯防呆，確保隨機生成的參數組合在風水物理上是合理的
        if (!p.xia) { p.xue = 'none'; p.taiji = false; p.tianzhan = false; }
        if (p.xue === 'none') { p.taiji = false; }
        if (!p.an) { p.tantou = false; p.guan = false; }
        if (!p.mt) { p.qing = false; }
        if (p.w === 'bazi') p.san = false; // 八字水分飛與三叉水匯聚不可共存
        if (p.w === 'lintou') p.yue = false; // 淋頭水不可結半月池
        
        // 砂手缺失防呆：無左右護砂則難以形成擎拳煞
        if (p.ml === 'none' && p.mr === 'none') p.qingquan = false;
        
        // 迴龍顧祖防呆：強制搭配太祖山並向後看，展現顧祖之象
        if (p.d === 'huilong') {
            p.zutai = true;
            p.face = '0';
        }

        if (p.w === 'none' || p.w === 'lintou') { p.luo = false; p.hua = false; p.qin = false; p.shixiang = false; }
        if (p.d === 'si' || p.d === 'po') p.shu = false;
        
        if (p.d === 'pingyang') {
            // 平洋為平原，無高山與峽谷特徵
            p.fenzhi = false; p.shu = false; p.fengyao = false; p.hulong = false; 
            p.guiyao = false; p.tianzhan = false; p.ao = false;
            p.luo = false; p.hua = false; p.qin = false; p.shixiang = false;
            // 平洋無水則完全空亡，提高平洋局出現水法的機率
            if (p.w === 'none' || p.w === 'lintou') p.w = ['you', 'jiuqu', 'bazi', 'gejiao'][Math.floor(Math.random()*4)];
        }
        
        return p;
    }
};

const UI = {
    radarDisp: [0,0,0,0,0],
    radarVel: [0,0,0,0,0],

    init() {
        document.querySelectorAll('.seg button:not(.tog):not(.preset-btn)').forEach(b => {
            b.addEventListener('click', e => {
                const seg = e.target.closest('.seg');
                seg.querySelectorAll('button').forEach(x => x.classList.remove('on'));
                b.classList.add('on');
                const oldD = AppState.current.d;
                AppState.current[seg.dataset.k] = b.dataset.v;

                if(seg.dataset.k === 'd' && oldD !== AppState.current.d) {
                    Physics.resetParticles();
                    Engine3D.clearHeatmap();
                }
                // 修復：交由 this.update() 統一執行規則校驗與單次建構地形，消除重複地貌重繪
                this.update(true);
            });
        });

        document.querySelectorAll('.tog').forEach(b => {
            b.addEventListener('click', e => {
                if(b.disabled) return;
                AppState.current[b.dataset.k] = !AppState.current[b.dataset.k];
                b.classList.toggle('on', AppState.current[b.dataset.k]);

                if(b.dataset.k === 'vHeat' && !AppState.current.vHeat) Engine3D.clearHeatmap();
                if(b.dataset.k === 'shaMode') document.body.style.cursor = AppState.current.shaMode ? 'crosshair' : 'default';

                this.update(true); // 修復：如同上方 .seg 邏輯，統一帶入 true 交由 update 集中處裡，避免一幀內產生兩次地形重繪
            });
        });

        document.getElementById('wind-slider').addEventListener('input', e => {
            const val = parseInt(e.target.value);
            AppState.current.wind = val;
            const valEl = document.getElementById('wind-val');
            if (valEl) valEl.innerText = val > 0 ? `+${val}` : `${val}`;
            // 修復：拖曳滑桿時即時觸發 UI 評分與極限容量更新
            this.update();
        });

        document.getElementById('btn-cam-cave')?.addEventListener('click', () => {
            let dynamicTaijiZ = (AppState.current.xue === 'wo') ? -5.0 : (AppState.current.xue === 'ru' ? 12.0 : 5.0);
            let caveY = Engine3D.getTerrainY(0, dynamicTaijiZ).y + 3.0;
            Engine3D.targetCamPos = new THREE.Vector3(0, caveY, dynamicTaijiZ);
            Engine3D.targetLookAt = new THREE.Vector3(0, caveY + 2.0, 80.0);
            Engine3D.isTransitioning = true;
        });

        document.getElementById('btn-cam-reset')?.addEventListener('click', () => {
            Engine3D.targetCamPos = new THREE.Vector3(0, 150, 190);
            Engine3D.targetLookAt = new THREE.Vector3(0, -5, 20);
            Engine3D.isTransitioning = true;
        });

        document.querySelectorAll('.preset-btn').forEach(b => {
            b.addEventListener('click', () => {
                AppState.resetTo(b.dataset.p);
            });
        });

        this.syncDOM();
        this.update();
    },

    update(forceBuild = false) {
        let autoChanged = forceBuild;
        let s = AppState.current;
        const noWater = s.w === 'none' || s.w === 'lintou';
        const noSands = (s.ml === 'none' && s.mr === 'none');
        const hasGap = (s.ml==='po'||s.ml==='none'||s.mr==='po'||s.mr==='none'||s.ml==='ya'||s.mr==='tai'||!s.an);
        const isBadDragon = (s.d === 'si' || s.d === 'po');

        const rules = {
            // 修正 1：平洋為平原，絕不可能憑空長出高山峽谷專屬的巨石神獸關攔
            luo: noWater || s.d === 'pingyang', 
            hua: noWater || s.d === 'pingyang', 
            shixiang: noWater || s.d === 'pingyang', 
            qin: noWater || s.d === 'pingyang', 
            // 修正 4：物理悖論！「八字水分飛」是向外分裂，「三叉水」是向內聚攏。兩者流向完全相反，絕不能並存。
            san: noWater || s.w === 'bazi',
            yue: s.w === 'lintou', tantou: !s.an, 
            // 修正 2：朱雀低陷或破碎，氣機全漏，絕不可能生出餘氣「官星」
            guan: !s.an || s.ms === 'di' || s.ms === 'po', 
            // 修正 3：平洋為平原，無高山峽谷，自然不可能產生漏斗狀的「凹風煞」
            tianzhan: !s.xia, qingquan: noSands, ao: !hasGap || s.d === 'pingyang', qing: !s.mt, 
            shu: (isBadDragon || s.d === 'pingyang'), fenzhi: s.d === 'pingyang',
            fengyao: s.d === 'pingyang', hulong: s.d === 'pingyang', 
            guiyao: (!s.zhu && !s.xu) || (s.d === 'pingyang')
        };

        for (let k in rules) {
            let el = document.querySelector(`[data-k="${k}"]`);
            if (el) {
                el.disabled = rules[k];
                if (rules[k] && s[k]) {
                    s[k] = false;
                    el.classList.remove('on');
                    autoChanged = true;
                }
            }
        }

        let shaBtn = document.getElementById('btn-shaMode');
        if (shaBtn) {
            shaBtn.disabled = noWater;
            if (noWater && s.shaMode) {
                s.shaMode = false;
                shaBtn.classList.remove('on');
                document.body.style.cursor = 'default';
            }
        }

        if (autoChanged) {
            Engine3D.buildTerrain();
        }

        const cap = Rules.getCapacityLimit();
        const mult = Rules.getGlobalMultiplier();
        document.getElementById('cap-num').innerText = `${cap} (×${mult.toFixed(2)})`;
    },

    syncDOM() {
        document.querySelectorAll('.seg').forEach(seg => {
            if(seg.dataset.k) {
                seg.querySelectorAll('button').forEach(x => x.classList.remove('on'));
                let cur = seg.querySelector(`[data-v="${AppState.current[seg.dataset.k]}"]`);
                if(cur) cur.classList.add('on');
            }
        });
        document.querySelectorAll('.tog').forEach(b => {
            b.classList.toggle('on', AppState.current[b.dataset.k]);
        });
        const windSlider = document.getElementById('wind-slider');
        if (windSlider) {
            windSlider.value = AppState.current.wind;
            const valEl = document.getElementById('wind-val');
            if (valEl) valEl.innerText = AppState.current.wind > 0 ? `+${AppState.current.wind}` : `${AppState.current.wind}`;
        }
        document.body.style.cursor = AppState.current.shaMode ? 'crosshair' : 'default';
    },

    drawRadar(dt) {
        const rCv = document.getElementById('radar');
        const rCtx = rCv.getContext('2d');
        const w = rCv.width, h = rCv.height;
        const cx = w/2, cy = h/2+5, R = 60;

        rCtx.clearRect(0,0,w,h);
        rCtx.strokeStyle = 'rgba(255,255,255,0.1)';
        rCtx.lineWidth = 1;
        const labs = ['龍','穴','砂','水','向'];

        for(let r=1; r<=5; r++){
            rCtx.beginPath();
            for(let k=0; k<=5; k++){
                const a = -Math.PI/2 + k*2*Math.PI/5;
                const x = cx + Math.cos(a)*R*r/5, y = cy + Math.sin(a)*R*r/5;
                k ? rCtx.lineTo(x,y) : rCtx.moveTo(x,y);
            }
            rCtx.stroke();
        }

        rCtx.fillStyle = '#cfc6b4';
        rCtx.font = '12px "Noto Serif TC", serif';
        rCtx.textAlign = 'center';
        rCtx.textBaseline = 'middle';
        for(let k=0; k<5; k++){
            const a = -Math.PI/2 + k*2*Math.PI/5;
            rCtx.fillText(labs[k], cx + Math.cos(a)*(R+15), cy + Math.sin(a)*(R+15));
        }

        // 修復：優先採用 AppState.smoothedScores 低通濾波分值，並 Clamp 在 0~100 區間，消除雷達圖頂點二次彈簧超調振盪
        const rawTarget = AppState.smoothedScores || Rules.computeScores();
        const target = rawTarget.map(v => Math.max(0, Math.min(100, v)));
        rCtx.beginPath();

        const smoothDt = Math.min(dt, 0.1);
        let logicDt = smoothDt * 60;

        for(let k=0; k<5; k++){
            this.radarVel[k] += (target[k] - this.radarDisp[k]) * 0.3 * logicDt;
            this.radarVel[k] *= Math.pow(0.65, logicDt);
            this.radarDisp[k] += this.radarVel[k] * logicDt;

            const v = Math.min(R, Math.max(0, this.radarDisp[k]/100 * R));
            const a = -Math.PI/2 + k*2*Math.PI/5;
            const x = cx + Math.cos(a)*v, y = cy + Math.sin(a)*v;
            k ? rCtx.lineTo(x, y) : rCtx.moveTo(x, y);
        }

        rCtx.closePath();
        rCtx.fillStyle = 'rgba(185,138,46,0.4)';
        rCtx.fill();
        rCtx.strokeStyle = '#b98a2e';
        rCtx.lineWidth = 2;
        rCtx.stroke();
    }
};

/* ==========================================
   4. THREE.JS ENGINE (場景與地貌拓撲)
   ========================================== */
const Engine3D = {
    scene: null, camera: null, renderer: null, controls: null,
    terrainGeo: null, terrainMesh: null, hMap: null, waterMesh: null,
    obsGroup: null, swGroup: null, windGroup: null, windLines: [],
    heatCanvas: null, hCtx: null, heatTex: null, wTex: null,
    raycaster: new THREE.Raycaster(), mouse: new THREE.Vector2(),
    obsGeo: new THREE.ConeGeometry(2, 10, 4),
    obsMat: new THREE.MeshBasicMaterial({color:0x111111}),
    swGeo: new THREE.RingGeometry(1, 1.5, 32),

    init() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x07101c); // 吸收 Qwen版：深邃的夜空藍背景
        this.scene.fog = new THREE.FogExp2(0x07101c, 0.00145); // 吸收 Qwen版：讓遠景隱沒得更自然大氣

        this.camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1500);
        // 優化攝影機初始視角，使明堂與河道居中
        this.camera.position.set(0, 150, 190);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        this.renderer.setPixelRatio(window.devicePixelRatio); // 取消像素比限制，讓高解析度螢幕發揮最高銳利度
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 0.65; // 調降曝光度至 0.65，壓制整體高光溢出 // 微調曝光度配合 sRGB
        this.renderer.outputEncoding = THREE.sRGBEncoding; // 加入 sRGB 色彩編碼，讓顏色更飽和真實，消除灰濛死白感
        
        // 開啟陰影渲染引擎，提升畫面層次感
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        document.body.appendChild(this.renderer.domElement);

        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.target.set(0, -5, 20);
        this.controls.maxPolarAngle = Math.PI/2 - 0.05;

        this.terrainGeo = new THREE.PlaneGeometry(CONFIG.tSize, CONFIG.tSize, CONFIG.tSeg, CONFIG.tSeg);
        this.terrainGeo.rotateX(-Math.PI/2);
        this.hMap = new Float32Array((CONFIG.tSeg+1)*(CONFIG.tSeg+1));

        this.heatCanvas = document.createElement('canvas');
        this.heatCanvas.width = 256; this.heatCanvas.height = 256;
        this.hCtx = this.heatCanvas.getContext('2d');
        this.hCtx.fillStyle = 'black'; this.hCtx.fillRect(0,0,256,256);
        this.heatTex = new THREE.CanvasTexture(this.heatCanvas);
        this.heatTex.wrapS = this.heatTex.wrapT = THREE.ClampToEdgeWrapping;
        this.heatTex.anisotropy = this.renderer.capabilities.getMaxAnisotropy(); // 開啟各向異性過濾，讓傾斜視角與遠處的熱力圖保持銳利不模糊

        const terrainMat = new THREE.MeshStandardMaterial({
            vertexColors: true, 
            roughness: 0.96, // 吸收 Qwen版：提高粗糙度，消除塑膠反光感，更貼近真實土壤與岩石
            metalness: 0.03, // 吸收 Qwen版：降低金屬度，呈現自然漫反射
            flatShading: false
        });

        // 確保編譯器自動注入 vUv 到 Shader 內，避免 TypeError 崩潰
        terrainMat.defines = { USE_UV: '' };

        terrainMat.onBeforeCompile = (shader) => {
            shader.uniforms.heatmap = { value: this.heatTex };
            shader.fragmentShader = `
                uniform sampler2D heatmap;
                ${shader.fragmentShader}
            `.replace(
                `#include <emissivemap_fragment>`,
                `
                #include <emissivemap_fragment>
                #ifdef USE_UV
                    vec4 heatColor = texture2D(heatmap, vUv);
                    totalEmissiveRadiance += heatColor.rgb * 0.8; // 調降至 0.8，避免熱力圖發光導致地形高光區過曝
                #endif
                `
            );
        };

        this.terrainMesh = new THREE.Mesh(this.terrainGeo, terrainMat);
        this.terrainMesh.castShadow = true;     // 讓山峰能互相遮擋投射陰影
        this.terrainMesh.receiveShadow = true;  // 讓地面能接收陰影
        this.scene.add(this.terrainMesh);

        const wTexCv = document.createElement('canvas'); wTexCv.width = 256; wTexCv.height = 256;
        const wTCtx = wTexCv.getContext('2d');
        // 修正：改用細微流線噪點取代巨大圓形斑點，徹底消除水面上的圓圈圖案
        wTCtx.fillStyle = 'rgba(255,255,255,0.06)';
        for(let i=0;i<500;i++) {
            wTCtx.fillRect(Math.random()*256, Math.random()*256, Math.random()*4+1, Math.random()*1.5+0.5);
        }
        this.wTex = new THREE.CanvasTexture(wTexCv);
        this.wTex.wrapS = this.wTex.wrapT = THREE.RepeatWrapping;
        // 增加各向異性過濾，消除遠處河道貼圖的模糊感
        this.wTex.anisotropy = this.renderer.capabilities.getMaxAnisotropy(); 
        const waterGeo = new THREE.PlaneGeometry(CONFIG.tSize, CONFIG.tSize, 100, 100); waterGeo.rotateX(-Math.PI/2); // 提高網格精度以顯示細膩波浪
        // 增加 metalness 與降低 roughness 讓水面具備更真實的鏡面反光特性
        // 修正：調高粗糙度 (roughness: 0.45)、降低金屬度 (metalness: 0.1)，防止太陽高光反射過度爆白
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x1d758f, map: this.wTex, transparent: true, opacity: 0.85, roughness: 0.45, metalness: 0.1 });
        waterMat.onBeforeCompile = (shader) => {
            shader.uniforms.time = { value: 0 };
            shader.uniforms.riverType = { value: 0 };
            shader.vertexShader = `
                varying vec2 vWorldXZ;
                uniform float time;
                ${shader.vertexShader}
            `.replace(
                `#include <begin_vertex>`,
                `
                #include <begin_vertex>
                vWorldXZ = position.xz; // 抓取世界 XZ 座標
                // 複合波浪模擬：主波浪 + 次級擾動波浪，產生更自然的立體流體起伏
                float wave1 = sin(position.x * 0.05 + time * 1.2) * 0.6 * cos(position.z * 0.06 + time * 0.8);
                float wave2 = sin(position.x * 0.15 - time) * 0.25;
                transformed.y += wave1 + wave2;
                `
            );
            shader.fragmentShader = `
                uniform float time;
                uniform int riverType;
                varying vec2 vWorldXZ;
                ${shader.fragmentShader}
            `.replace(
                `#include <map_fragment>`,
                `
                vec2 flowUV = vUv;
                float rx = vWorldXZ.x;
                float shift = 0.0;

                // 使水紋貼圖根據河道真實形狀蜿蜒流動，解決直直平移的問題
                if (riverType == 1) shift = sin(rx * 0.15) * 8.0; // 九曲水

        this.waterMesh = new THREE.Mesh(waterGeo, waterMat); this.waterMesh.position.y = -10;

        this.scene.add(this.waterMesh);

    clearHeatmap() {

    // 吸收 Qwen 版優點 1：引入 Domain Warping (空間扭曲) 與 FBM 碎形雜訊，使山脈更具自然崎嶇感
    hashNoise(x, z) {
        return (Math.sin(x * 0.31 + z * 0.17) * Math.cos(z * 0.29 - x * 0.13) + Math.sin(x * 0.73 + z * 0.51)) * 0.5;
    },
    pNoise(x, z, octaves = 3) {
        let sum = 0, amp = 1, freq = 1, norm = 0;
        for (let i = 0; i < octaves; i++) {
            // 加入輕量 Domain Warping 讓地貌發生自然扭曲
            let wx = x * freq + this.hashNoise(z * freq, x * freq) * 2.0;
            let wz = z * freq + this.hashNoise(x * freq, z * freq) * 2.0;
            sum += this.hashNoise(wx, wz) * amp;
            norm += amp;
            amp *= 0.5; freq *= 2.0;
        }
        return sum / norm;
    },
    ridgeNoise(x, z) {
        let n = this.pNoise(x * 0.5, z * 0.5, 2);
        return 1.0 - Math.abs(n);
    },

    // 吸收 Qwen 版優點 2：加入水力侵蝕與熱力風化 (Hydraulic Erosion & Thermal Weathering)
    erodeTerrain(passes = 2) {
        const tSeg = CONFIG.tSeg;
        const size = (tSeg + 1) * (tSeg + 1);
        const flow = new Float32Array(size);
        const order = new Array(size);
        for(let i=0; i<size; i++) order[i] = i;
        // 依高度由上而下排序，模擬水流由高處往低處沖刷
        order.sort((a, b) => this.hMap[b] - this.hMap[a]);

        const neigh = [-1, 1, -(tSeg+1), (tSeg+1)]; // 左右上下

        for(let pass = 0; pass < passes; pass++) {
            flow.fill(1.0);
            for(let oi = 0; oi < size; oi++) {
                const i = order[oi];
                const ix = i % (tSeg+1), iz = Math.floor(i / (tSeg+1));
                if(ix === 0 || ix === tSeg || iz === 0 || iz === tSeg) continue;

                let lowest = -1, lh = this.hMap[i];
                for(let k = 0; k < 4; k++) {
                    const j = i + neigh[k];
                    if(this.hMap[j] < lh) { lh = this.hMap[j]; lowest = j; }
                }
                if(lowest < 0) continue; // 已經是坑底

                const slope = this.hMap[i] - lh;
                const carry = flow[i];
                flow[lowest] += carry * 0.94; // 水流匯聚

                // 侵蝕量與坡度和水流量成正比 (保護水下河床與深潭不被過度侵蝕)
                let eros = slope * 0.025 * carry;
                if (this.hMap[i] < -5) eros *= 0.1; 
                const maxErode = slope * 0.45;
                if(eros > maxErode) eros = maxErode;

                if(eros > 0.001) {
                    this.hMap[i] -= eros;
                    this.hMap[lowest] += eros * 0.40; // 泥沙沉積
                }
            }
            // 輕量熱力風化 (崩塌平滑化)，消除過度鋸齒，讓陡峭山脈產生滑坡坡度
            for(let iz = 1; iz < tSeg; iz++) {
                for(let ix = 1; ix < tSeg; ix++) {
                    const i = iz * (tSeg+1) + ix;
                    const h = this.hMap[i];
                    for(let k = 0; k < 4; k++) {
                        const j = i + neigh[k];
                        const diff = h - this.hMap[j];
                        if(diff > 3.0) { // 坡度過陡發生崩塌
                            const move = (diff - 3.0) * 0.15;
                            this.hMap[i] -= move;
                            this.hMap[j] += move * 0.85;
                        }
                    }
                }
            }
        }
    },

    buildTerrain() {
        const state = AppState.current;
        const tSeg = CONFIG.tSeg, tSize = CONFIG.tSize;
        this.waterMesh.visible = (state.w !== 'none' || state.yue || state.w === 'lintou');
        const pos = this.terrainGeo.attributes.position.array;
        const cols = [];
        let wZ = 999; if(['you','jiuqu','bazi'].includes(state.w)) wZ = 70; if(state.w==='gejiao') wZ = 30; if(state.w==='ji'||state.w==='fan') wZ = 55;

        let defaultY = (state.w === 'none') ? -8 : -18;
        let c = new THREE.Color(); // 修復：將 Color 實例化移出 22800 次的迴圈外，消除切換格局時的 GC 記憶體暴增卡頓
        for (let i = 0; i < pos.length; i += 3) {
            let x = pos[i], z = pos[i+2], y = defaultY;
            if (state.d === 'pingyang') {
                // 平洋微地形：高一寸為山，低一寸為水；水纏砂微沙洲與田壟隆起
                let microTopo = this.pNoise(x*0.8, z*0.8) * 1.5 + this.ridgeNoise(x*2, z*2) * 0.8;

                // 【平洋水纏砂 / 平洋一突】：穴場周圍隆起平洋微丘，若選突穴/乳穴則大幅墊高顯現「平洋一突勝千峰」
                if (Math.abs(x) < 25 && z > -15 && z < 25) {
                    let knollBoost = (state.xue === 'tu' || state.xue === 'ru') ? 12.0 : 3.5;
                    microTopo += knollBoost * Math.exp(-(x*x + z*z)/250); // 平洋一突實體沙洲
                }

                y = (state.w === 'none') ? 2.0 + microTopo : -2.0 + microTopo;
            } else {
                // 迴龍顧祖：建立真實 C 型半圓弧山脊拓撲（將龍脈尾端大幅彎回朝向太祖山 -Z）
                let dX = x;
                let dZ = z;
                if(state.d==='huilong') {
                    let curveAngle = Math.max(0, Math.min(Math.PI, (z + 100) / 110 * Math.PI));
                    let curveCenterX = Math.sin(curveAngle) * 65.0; // 山脊向右前方弧形彎曲
                    dX = x - curveCenterX;
                }
                let zRatio = Math.min(2.2, Math.max(0, -z/40));
                let ridge = this.ridgeNoise(dX, dZ) * 15;
                let sBase = 25 * Math.exp(-(dX*dX)/(300 + ridge*10)) * zRatio + ridge * zRatio * 0.5;
                if(['sheng','ji','huan'].includes(state.d)) sBase += (Math.sin(z*(state.d==='ji'?0.15:0.08)) + this.pNoise(x*0.5, z*0.5)*0.5)*(state.d==='ji'?15:8)*Math.min(2.0, Math.max(0,-z/50));
                if(state.d==='si') sBase *= 0.3; if(state.d==='po') sBase += this.pNoise(x,z)*15;

                // 【龍脈剝換脫煞】：太祖山 (z < -90) 為粗老峭拔石山，過峽剝換後至近穴山脈 (z > -60) 轉為秀嫩圓潤土山
                if (z < -40) {
                    let roughFactor = Math.min(1.0, Math.max(0, (-z - 40) / 60)); // 越往遠處越粗老
                    let rockyNoise = this.pNoise(x * 1.5, z * 1.5) * 12.0 * roughFactor; // 高頻粗糙鋸齒（石山煞氣）
                    sBase += rockyNoise;
                }
                if(z > -40 && z < -15) {
                    if(state.shu) sBase *= (1 - Math.exp(-Math.pow(z+25,2)/50)*0.6);
                    if(state.fengyao || state.shu) {
                        // 蜂腰鶴膝：山脊在 z: -32 處急遽收窄（蜂腰），並在 z: -25 處隆起圓頭（鶴膝）
                        let pinch = Math.exp(-Math.pow(z + 32, 2) / 25); // 蜂腰收縮節點
                        let knee = Math.exp(-Math.pow(z + 24, 2) / 15) * 8.0; // 鶴膝跌斷隆起
                        sBase = sBase * (1.0 - pinch * 0.75) + knee;
                        
                        // 迎送砂與扛劫砂：過峽兩側兩對雙峰山腳護衛（前迎砂、後送砂、夾角扛砂）
                        if (Math.abs(z + 32) < 12) {
                            let leftGuard = 14.0 * Math.exp(-(Math.pow(x + 14, 2) + Math.pow(z + 34, 2)) / 35); // 左迎砂
                            let rightGuard = 14.0 * Math.exp(-(Math.pow(x - 14, 2) + Math.pow(z + 30, 2)) / 35); // 右送砂
                            sBase = Math.max(sBase, Math.max(leftGuard, rightGuard));
                        }
                    }
                }
                if(state.fenzhi && z < -20) sBase = Math.max(sBase, 15*Math.exp(-Math.pow(Math.abs(x)-Math.abs(z+20),2)/100));
                if(state.guiyao && z < -10) {
                    // 鬼山撐背：穴星正後方 (z: -55 ~ -35, |x| < 10) 延伸出一座堅實的支撐山脊
                    if (z > -60 && z < -35 && Math.abs(x) < 12) {
                        let spurH = 22.0 * Math.exp(-(x * x) / 45.0) * Math.sin((z + 60) / 25.0 * Math.PI);
                        sBase = Math.max(sBase, spurH);
                    } else if (Math.abs(x) < 40 && Math.sin(x * 0.5) * Math.cos(z * 0.5) > 0.8) {
                        sBase += 12; // 周圍散落曜星
                    }
                }
                y = Math.max(y, sBase);

                if (z < -10 && (state.xia || state.mn !== 'none' || state.zhu || state.xu)) {
                    let mD = Math.sqrt(x*x + Math.pow(z+45,2)), h = 0;
                    if(state.xia) {
                        if(state.xing==='jin') {
                            // 金星覆鐘：頂部極度圓潤（覆鐘/覆釜圓頂）
                            h = 45 * Math.cos(Math.min(Math.PI/2, mD/25)) * Math.exp(-(mD*mD)/1200);
                        } else if(state.xing==='mu') {
                            // 木星高柱：陡峭高聳柱狀，兩側快速直落
                            h = 60 / (1.0 + Math.pow(mD/12, 3.5));
                        } else if(state.xing==='shui') {
                            // 水星蛇浪：波浪連綿丘陵（多重水浪峰）
                            h = 35 * Math.exp(-Math.pow(z+45,2)/800) * (0.8 + 0.35 * Math.sin(x * 0.2) + 0.25 * Math.cos((z+45) * 0.2));
                        } else if(state.xing==='tu') {
                            // 土星棋盤：頂部方正平坦，四角邊緣陡峭切落
                            let squareD = Math.max(Math.abs(x), Math.abs(z+45));
                            h = 38 * Math.exp(-Math.pow(squareD/22, 6)); // 平頂方丘
                        } else if(state.xing==='huo') {
                            // 火星尖焰：頂部陡峭刺天且帶 jagged 尖牙
                            h = 50 * Math.exp(-mD/12) + this.pNoise(x*0.8, z*0.8) * 14;
                        }

                        // 【堪輿微觀：蟬翼砂與蟹眼分水】
                        if (z > -30 && z < -10 && Math.abs(x) < 20) {
                            // 蟬翼砂：穴星兩側薄如蟬翼的微型隱砂護衛穴心
                            let wing = Math.exp(-Math.pow(Math.abs(x) - 10, 2) / 12) * Math.exp(-Math.pow(z + 20, 2) / 40) * 4.0;
                            // 蟹眼分水溝：穴星頂部兩側微深之導水溝，將山頂雨水向兩側引開
                            let crabEyeDrain = Math.exp(-Math.pow(Math.abs(x) - 5, 2) / 6) * Math.exp(-Math.pow(z + 25, 2) / 20) * 3.5;
                            h = h + wing - crabEyeDrain;
                        }
                    }
                    if(state.mn==='you') {
                        // 玄武垂頭：主山在接近穴星處 (z: -45 ~ -25) 微微低頭下伏，順暢貫注龍氣入穴
                        if (z > -50 && z < -25) {
                            let nodDip = Math.sin((z + 50) / 25 * Math.PI) * 6.0; // 垂頭伏入低凹弧度
                            h -= nodDip;
                        }
                    } else if(state.mn==='kang') h += (z < -45 ? 20 : -10); else if(state.mn==='po') h += this.pNoise(x,z)*15;
                    if(state.zhu && z < -40 && z > -80) h += 18*Math.exp(-(x*x + Math.pow(z+60,2))/800);
                    if(state.xu && z < -70 && z > -120) h += 25*Math.exp(-(x*x + Math.pow(z+95,2))/1200);
                    y = Math.max(y, h);
                }
                if(state.zutai && z < -90) y = Math.max(y, 80*Math.exp(-(x*x + Math.pow(z+120,2))/1000));

                if(state.ml!=='none' && x<0 && z>-30 && z<110) {
                    let r = state.ml==='ya'?15:35;
                    let curve = Math.max(0, (z - 20) * 0.45); // 加強環抱
                    // 內明堂下關：青龍砂在 z: 20~35 處微向右跨過中線，形成「龍過虎包」內水關攔
                    if (z > 20 && z < 35 && state.mr !== 'none') curve += Math.sin((z - 20) / 15 * Math.PI) * 18;
                    // 犬牙交鎖：左砂青龍在 z: 55~85 橫向延伸過中線，形成第一重關攔
                    if (z > 55 && z < 85) curve += Math.sin((z - 55) / 30 * Math.PI) * 45;
                    let centerX = -Math.max(-10, r - curve); // 允許青龍下關砂深插關攔
                    let sH = 35*Math.exp(-Math.pow(x-centerX,2)/200)*Math.max(0,1-(z+20)/130);
                    if(z > 70 && state.an) sH += 15 * Math.exp(-(Math.pow(x+10,2)+Math.pow(z-85,2))/100); // 砂案深度交鎖
                    if(state.ml==='po') sH *= (1+this.pNoise(x,z)*0.5); if(state.ao && z>0 && z<30) sH *= 0.1;
                    if(state.qingquan && Math.abs(z-20)<10 && Math.abs(x)>10) sH += 20*Math.exp(-Math.pow(x+20,2)/50);
                    y = Math.max(y, sH);
                }
                if(state.mr!=='none' && x>0 && z>-30 && z<110) {
                    let r = state.mr==='tai'?15:35;
                    let curve = Math.max(0, (z - 20) * 0.45);
                    // 犬牙交鎖：右砂白虎在 z: 75~105 錯開延伸過中線，形成第二重逆水交鎖
                    if (z > 75 && z < 105) curve += Math.sin((z - 75) / 30 * Math.PI) * 45;
                    let centerX = Math.min(10, r - curve); // 允許白虎下關砂反向向左深插
                    let sH = (state.mr==='tai'?45:35)*Math.exp(-Math.pow(x-centerX,2)/200)*Math.max(0,1-(z+20)/130);
                    if(z > 70 && state.an) sH += 15 * Math.exp(-(Math.pow(x-10,2)+Math.pow(z-85,2))/100); // 砂案深度交鎖
                    if(state.mr==='po') sH *= (1+this.pNoise(x,z)*0.5); if(state.ao && z>0 && z<30) sH *= 0.1;
                    if(state.qingquan && Math.abs(z-20)<10 && Math.abs(x)>10) sH += 20*Math.exp(-Math.pow(x-20,2)/50);
                    y = Math.max(y, sH);
                }
                if(state.hulong && Math.abs(z)<50) y = Math.max(y, 25*Math.exp(-Math.pow(Math.abs(x)-70,2)/200));
            }

            if(state.an && z>55 && z<100) {
                // 若朱雀低陷 (ms === 'di')，降低前案高度為 5 展現空虛低陷，否則保持標準案山高度 18
                let targetH = (state.ms === 'di') ? 5 : 18;
                let flatTableAn = targetH * Math.exp(-(Math.pow(x/1.8, 4) + Math.pow(z-75, 2)) / 350);
                y = Math.max(y, flatTableAn + (state.guan?5*Math.exp(-(x*x)/100):0));
            }
            if(state.ms==='po' && z>55 && z<100) y = Math.max(y, 18*Math.exp(-(x*x+Math.pow(z-75,2))/400)*(1+this.pNoise(x,z)*0.5));
            if(state.tantou && z>80 && z<120) y = Math.max(y, 25*Math.exp(-(x*x+Math.pow(z-100,2))/100));
            if(state.chao && z>110) {
                // 三台疊浪朝山：遠處朝山分成三重波浪狀山脈（第一台 z:125、第二台 z:145、第三台 z:165），層層朝拜
                let t1 = 35 * Math.exp(-(x*x + Math.pow(z-125, 2))/1200);
                let t2 = 50 * Math.exp(-(x*x + Math.pow(z-145, 2))/1800);
                let t3 = 70 * Math.exp(-(x*x + Math.pow(z-165, 2))/2500);
                y = Math.max(y, Math.max(t1, Math.max(t2, t3)));
            }

            let mtD = Math.sqrt(x*x + z*z);
            if(state.mt && mtD < 65) {
                let tY = -3;
                // 實體雕塑：穴星與明堂的開口方向由「坐向 (face)」決定，形成真實的 U 型擋牆
                let angle = Math.atan2(x, z);
                let targetAngle = state.face === '1' ? 0 : Math.PI; // 0=向水開口, PI=向山開口(背水)
                let angleDiff = Math.abs(Math.atan2(Math.sin(angle - targetAngle), Math.cos(angle - targetAngle)));
                let wall = (angleDiff / Math.PI) * 12 * (Math.min(30, mtD)/30); // 背側自動築起實體氣場擋牆

                if(state.xue==='wo') tY = -8 * Math.cos(mtD*Math.PI/60) + wall;
                else if(state.xue==='tu') tY = 8 * Math.cos(mtD*Math.PI/60) - wall*0.5;
                else if(state.xue==='ru' && z<10) tY = 12 * Math.exp(-(x*x + Math.pow(z+10,2))/50) + wall;
                else if(state.xue==='qian') tY = (Math.abs(x)>8 && z<15) ? 10*Math.exp(-(Math.pow(Math.abs(x)-15,2) + z*z)/100) : -5 + wall;

                // 【真龍結穴特徵：穴下氈唇 (Zhan-Chun Shelf)】：穴星正下方伸出平坦小台地界氣
                if (state.xia && z >= -8 && z <= 12 && Math.abs(x) <= 12) {
                    let zhanFactor = Math.exp(-(x*x + Math.pow(z-2, 2))/60);
                    tY = tY * (1 - zhanFactor) + (2.5) * zhanFactor; // 墊高成平坦緩衝台地
                }

                // 【穴前合襟水交會點 (He-Jin Point)】：兩側蟹眼水在氈唇前方交會，形成微淺合襟坑界氣
                if (state.xia && z >= 12 && z <= 20 && Math.abs(x) <= 8) {
                    let hejinPit = Math.exp(-(x*x + Math.pow(z-16, 2))/20) * 3.0;
                    tY -= hejinPit; // 兩水合襟，界氣止龍
                }

                // 【堪輿經典「三明堂」真格】：內明堂容鵲（小圓盤）、中明堂容龜（龍虎交鎖處）、外明堂容舟（大水會聚處）
                if (z >= -5 && z < 15) {
                    // 1. 內明堂（容鵲）：貼穴極小平坦圓盤，藏風聚氣
                    let innerHall = Math.exp(-(x*x + Math.pow(z-5, 2))/120) * 1.8;
                    tY = tY * (1 - Math.min(1, innerHall)) + (1.2) * Math.min(1, innerHall);
                } else if (z >= 15 && z < 42) {
                    // 2. 中明堂（容龜）：龍虎交鎖環抱處，階梯式微平平伏
                    let midHallDrop = 3.5 + Math.sin((z - 15) / 27 * Math.PI) * 1.5;
                    tY -= midHallDrop;
                } else if (z >= 42 && z < 65) {
                    // 3. 外明堂（容舟）：案山朝山前廣闊低窪匯水盆地
                    let outerHallDrop = 7.0 + Math.exp(-Math.pow(x/25, 2)) * 3.0;
                    tY -= outerHallDrop;
                }

                let blendDist = Math.min(1.0, mtD / 55.0);
                y = y * blendDist + tY * (1 - blendDist);
            }
            if(state.taiji && mtD < 18) y = Math.max(y, -2.5);
            if(state.qing && z>15 && mtD<40) y -= (z-15)*0.3;
            // 三叉水交會處：雕塑「水聚天心」深潭（天心水暈）
            if(state.san && Math.abs(x) < 25 && z > 45 && z < 75) {
                let junctionDist = Math.sqrt(x*x + Math.pow(z - 60, 2));
                if (junctionDist < 20) {
                    y = Math.min(y, -22 + junctionDist * 0.35); // 沖刷出水下深潭
                }
            }

            // 修復：限制天斬煞的 -Z 軸深度 (z > -45)，避免其向後無限延伸切穿遠處太祖山脈，破壞遠景
            if(state.tianzhan && Math.abs(x)<8 && z > -45 && z < 0) y = Math.min(y, -12);
            let targetYueZ = (state.face === '1') ? 30 : -35;
            let yueZMin = targetYueZ - 10, yueZMax = targetYueZ + 10;
            if(state.yue && Math.abs(x)<22 && z > yueZMin && z < yueZMax) {
                // 半月池：根據坐向 (face) 動態於前方 (z~30) 或後方 (z~-35) 雕塑池底與金城池堤
                let poolRadius = Math.sqrt(x*x + Math.pow(z-targetYueZ, 2));
                if (poolRadius < 14) {
                    y = -16.0 + (poolRadius/14) * 4.0; // 凹陷池底
                } else if (poolRadius >= 14 && poolRadius <= 18 && (state.face === '1' ? z > targetYueZ + 2 : z < targetYueZ - 2)) {
                    y = Math.max(y, -2.0); // 池前/池後拱起半月金城池堤
                }
            }
            if(state.w !== 'none') {
                // 將 z 限定在 > -5，保留後方主山的完整性，讓水流自然從山坡上傾瀉而下
                if(state.w==='lintou' && Math.abs(x)<12 && z > -5 && z < 20) y = Math.min(y, -12);

                let rS = wZ;
                if (state.d === 'pingyang' && state.w !== 'none') {
                    // 平洋鴨頸水：形成細長曲折如鴨頸的環抱灣流
                    rS += Math.sin(x * 0.08) * 20.0 + Math.cos(x * 0.18) * 8.0;
                }
                if(state.w==='jiuqu') {
                    // 之字/玄字形蛇行屈曲：利用方波化三角函數產生急折角度的九曲水道
                    let zCurve = Math.sin(x * 0.12);
                    rS += Math.sign(zCurve) * Math.pow(Math.abs(zCurve), 0.5) * 14;
                }
                if(state.w==='you') {
                    // 玉帶環腰：形成深 C 型半圓弧，將明堂與案山緊緊包抱在弧內
                    rS += (1.0 - Math.pow(x / 90.0, 2)) * 28.0;
                }
                if(state.w==='fan') rS -= Math.cos(x*0.05)*15;
                if(state.w==='bazi') rS += Math.abs(x)*0.5;

                // 【水文水力學雕塑】：彎道凸岸（環抱側）堆積沙洲金城吐唇，凹岸（反弓側）深切成割腳崖深潭
                if((state.w === 'jiuqu' || state.w === 'you' || state.w === 'fan') && Math.abs(z - rS) < 25) {
                    // 計算河道曲率方向（正值為向北彎，負值為向南彎）
                    let curveCoeff = (state.w === 'jiuqu') ? Math.sin(x * 0.12) : ((state.w === 'you') ? 1.0 : -1.0);
                    let bankDist = (z - rS) * curveCoeff;

                    if (bankDist > 1.5 && bankDist < 18.0) {
                        // 凸岸（水包邊）：泥沙堆積凸起成金城水灣包抱沙洲（吐唇）
                        let spitH = Math.exp(-Math.pow(bankDist - 8.0, 2) / 20) * 4.5;
                        y += spitH;
                    } else if (bankDist < -1.5 && bankDist > -18.0) {
                        // 凹岸（水沖射）：流體水力下切淘空，形成陡峭懸崖與河底深潭
                        let gougeDepth = Math.exp(-Math.pow(bankDist + 8.0, 2) / 16) * 6.0;
                        y -= gougeDepth;
                    }
                }

                // 【風水地理修復】：水口神獸關攔（獅象/華表/羅星）實體窄化河道，形成 S 型交鎖峽谷
                let hasGuardsGorge = state.shixiang || state.hua || state.luo;
                if(hasGuardsGorge && Math.abs(x) > 50 && z > 40) {
                    let sideSign = Math.sign(x);
                    // 擠壓河道道中心線，形成犬牙交鎖（S 彎）
                    rS += Math.sin(x * 0.2) * 12;
                    // 左右山腳強行向河心延伸，將河道收窄為狹谷
                    let gorgeChoke = Math.exp(-Math.pow(Math.abs(x) - 65, 2) / 150) * 18;
                    if (z > rS - 15 && z < rS + 15) {
                        y = Math.max(y, -5 + gorgeChoke); // 強行抬高峽谷兩側地基
                    }
                }

                let dR = Math.abs(z - rS);

                if(dR < 25) {
                    let t = Math.max(0, dR / 25);
                    let smoothT = t * t * (3 - 2 * t);
                    let riverBottom = (state.w === 'gejiao') ? -18 : -15;

                    // 真實流體力學：加入河道物理高低差 (梯度)，讓重力自然引導水流，取代魔法向量
                    let flowTilt = 0;
                    if (state.w === 'bazi') flowTilt = -Math.abs(x) * 0.08; // 八字水分流向兩側低垂
                    else if (state.w === 'lintou') flowTilt = (z < 20) ? (z - 20) * 0.5 : -Math.abs(x) * 0.05; // 淋頭水從後方高處直沖向下
                    else flowTilt = -x * 0.03; // 一般水流向右側流出

                    // 修復：移除 dR < 15 的硬限制，讓貝茲曲線平滑過渡 (smoothT) 完整涵蓋 25 單位的河岸，消除 3D 地形撕裂斷崖
                    y = y * smoothT + (riverBottom + flowTilt) * (1 - smoothT);
                    
                    if (state.w === 'gejiao' && dR >= 15) {
                        // 保留割腳水特有的峭壁切削效果
                        y -= Math.pow(25 - dR, 1.2) * 0.5;
                    }
                }

                if(state.luo && Math.abs(x) < 12 && z > 65 && z < 85) {
                    // 羅星塞水口：河道正中央聳立獨立石墩山包（羅星），高出水面逼水分流
                    let luoH = 8.0 * Math.exp(-(x*x + Math.pow(z-75, 2))/35);
                    y = Math.max(y, -15 + luoH); // 從河床抬升為水中央山洲
                }
                // 【華表捍門與獅象把水口】：左右兩岸對峙聳立陡峭雙峰峽谷門（捍門雙峰）
                if((state.shixiang || state.hua) && z > 65 && z < 85) {
                    let bankDist = Math.abs(Math.abs(x) - 52); // 河道兩岸52距離處聳立雙峰
                    if (bankDist < 16) {
                        let gateH = (state.shixiang ? 28.0 : 22.0) * Math.exp(-bankDist*bankDist / 80) * Math.exp(-Math.pow(z-75, 2)/100);
                        y = Math.max(y, gateH);
                    }
                }
                if(state.qin && z > 48 && z < 68) {
                    // 水尾禽星：溪流出口兩側橫臥龜蛇形巨石洲（禽星砥柱）
                    let qinRock = 6.0 * Math.exp(-(Math.pow(Math.abs(x) - 15, 2) + Math.pow(z - 58, 2)) / 25);
                    y = Math.max(y, -12 + qinRock); // 凸起出水面的龜蛇奇石
                }
            }

            if (state.d !== 'huilong' && state.d !== 'pingyang') y -= (z + 170) * 0.015;

            let gX = Math.round((x+tSize/2)/(tSize/tSeg)), gZ = Math.round((z+tSize/2)/(tSize/tSeg));
            this.hMap[gZ*(tSeg+1) + gX] = y;
        } // 結束階段一：基礎風水地形生成

        // 階段二：執行水力侵蝕與風化平滑 (吸收 Qwen 版優點，讓山脈雕刻出溝壑與自然坡面)
        this.erodeTerrain(2);

        // 階段三：套用侵蝕後的高度，更新網格頂點與計算地貌顏色
        for (let i = 0; i < pos.length; i += 3) {
            let x = pos[i], z = pos[i+2];
            let gX = Math.round((x+tSize/2)/(tSize/tSeg)), gZ = Math.round((z+tSize/2)/(tSize/tSeg));
            let y = this.hMap[gZ*(tSeg+1) + gX]; // 讀取侵蝕過後的新高度
            pos[i+1] = y;

            // 加入地表噪聲擾動，打破死板的水平顏色分層，產生真實的斑駁植被與鋸齒狀林線
            let colorNoise = this.pNoise(x * 1.5, z * 1.5, 2) * 0.12; 
            let nH = Math.max(0, Math.min(1.0, ((y + 15) / 75) + colorNoise));

            if (y < -9) {
                // 河床過渡：越深的水底顏色越呈現深沉的青墨色
                let depth = Math.max(0, Math.min(1.0, (-9 - y) / 15));
                c.setRGB(0.05 + depth * 0.05, 0.20 - depth * 0.1, 0.25 - depth * 0.1); // 加深河床色彩對比
            } else {
                // 植被與地質生態層次分明：平原 ➔ 森林 ➔ 高山岩石 ➔ 山頂雪線 (色彩飽和度與明度微調，更具史詩感)
                if (nH < 0.28) {
                    // 1. 平原至淺丘 (翠綠過渡到深草綠)
                    let t = nH / 0.28;
                    c.setHSL(0.33 - t * 0.06, 0.45 - t * 0.15, 0.18 + t * 0.10);
                } else if (nH < 0.65) {
                    // 2. 山腰森林至岩盤 (深草綠過渡到墨綠/黃褐岩石)
                    let t = (nH - 0.28) / 0.37;
                    c.setHSL(0.27 - t * 0.15, 0.30 - t * 0.20, 0.28 + t * 0.12);
                } else if (nH < 0.88) {
                    // 3. 高山岩石 (黃褐岩石過渡到深灰褐色)
                    let t = (nH - 0.65) / 0.23;
                    c.setHSL(0.10, 0.15 - t * 0.10, 0.40 + t * 0.10);
                } else {
                    // 4. 極高山峰雪線 (灰褐過渡到雪白高光)
                    let t = (nH - 0.88) / 0.12;
                    c.setHSL(0.6, 0.05, 0.50 + t * 0.45);
                }
            }
            cols.push(c.r, c.g, c.b);
        }
        // 根據水法吉凶動態調整水體視覺材質（吉水清澈呈翡翠碧波，凶水渾濁呈泥黃血煞）
        if (this.waterMesh) {
            let isBadWater = ['gejiao', 'lintou', 'fan', 'bazi', 'ji'].includes(state.w);
            if (isBadWater) {
                this.waterMesh.material.color.setHex(0x6b4a31); // 更具土石流質感的泥黃煞水
                this.waterMesh.material.opacity = 0.98;
                this.waterMesh.material.roughness = 0.9; // 完全粗糙，無光澤
                this.waterMesh.material.metalness = 0.0;
            } else {
                this.waterMesh.material.color.setHex(0x0a91a1); // 提亮為明亮清透的翡翠琉璃藍
                this.waterMesh.material.opacity = 0.75; // 提高透明度，透出下方加深顏色的河床
                this.waterMesh.material.roughness = 0.02; // 極致光滑，形成強烈的高光反射
                this.waterMesh.material.metalness = 0.65; // 高金屬度讓水面波光粼粼
            }
        }

        this.terrainGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(cols), 3));
        this.terrainGeo.computeVertexNormals(); this.terrainGeo.attributes.position.needsUpdate = true;
    },

    getTerrainY(x, z) {
        let gX = (x+CONFIG.tSize/2)/(CONFIG.tSize/CONFIG.tSeg), gZ = (z+CONFIG.tSize/2)/(CONFIG.tSize/CONFIG.tSeg);
        // 修復：Clamp 邊界邊緣索引，防止頂格點擊或粒子到達地圖邊緣時誤判定出界
        if(gX < 0 || gX > CONFIG.tSeg || gZ < 0 || gZ > CONFIG.tSeg) return {y:-100, nx:0, nz:0};
        let x0 = Math.min(CONFIG.tSeg - 1, Math.max(0, Math.floor(gX))), x1 = Math.min(CONFIG.tSeg, x0 + 1);
        let z0 = Math.min(CONFIG.tSeg - 1, Math.max(0, Math.floor(gZ))), z1 = Math.min(CONFIG.tSeg, z0 + 1);
        let h00 = this.hMap[z0*(CONFIG.tSeg+1)+x0]||0, h10 = this.hMap[z0*(CONFIG.tSeg+1)+x1]||0, h01 = this.hMap[z1*(CONFIG.tSeg+1)+x0]||0, h11 = this.hMap[z1*(CONFIG.tSeg+1)+x1]||0;
        let tx = gX-x0, tz = gZ-z0;
        let nx = (h00*(1-tz) + h01*tz) - (h10*(1-tz) + h11*tz);
        let nz = (h00*(1-tx) + h10*tx) - (h01*(1-tx) + h11*tx);
        return { 
            y: (h00*(1-tx)+h10*tx)*(1-tz) + (h01*(1-tx)+h11*tx)*tz, 
            nx: nx, 
            nz: nz 
        };
    },

    shockwavesThisFrame: 0, // 新增：單幀震波計數器
    createShockwave(x, y, z, color) {
        if (this.shockwavesThisFrame > 2) return; // 新增：每幀最多只允許產生 3 個震波，保護效能
        this.shockwavesThisFrame++;

        const mat = new THREE.MeshBasicMaterial({color: color, transparent: true, opacity: 1, side: THREE.DoubleSide});
        const mesh = new THREE.Mesh(this.swGeo, mat); mesh.position.set(x, y+1, z);
        this.swGroup.add(mesh);
        AppState.shockwaves.push({mesh: mesh, life: 1.0});

        if (AppState.shockwaves.length > CONFIG.maxShockwaves) {
            let sw = AppState.shockwaves.shift();
            this.swGroup.remove(sw.mesh);
            sw.mesh.material.dispose();
        }
