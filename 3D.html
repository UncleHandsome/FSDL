    // 吸收 Qwen 版優點 1：引入 Domain Warping (空間扭曲) 與 FBM 碎形雜訊，使山脈更具自然崎嶇感
    hashNoise(x, z) {
        return (Math.sin(x * 0.31 + z * 0.17) * Math.cos(z * 0.29 - x * 0.13) + Math.sin(x * 0.73 + z * 0.51)) * 0.5;
    },
    pNoise(x, z, octaves = 3) {
        let sum = 0, amp = 1, freq = 1, norm = 0;
        for (let i = 0; i < octaves; i++) {
            // 加入輕量 Domain Warping 讓地貌發生自然扭曲
            let wx = x * freq + this.hashNoise(z * freq, x * freq) * 2.0;
            let wz = z * freq + this.hashNoise(x * freq, z * freq) * 2.0;
            sum += this.hashNoise(wx, wz) * amp;
            norm += amp;
            amp *= 0.5; freq *= 2.0;
        }
        return sum / norm;
    },
    ridgeNoise(x, z) {
        let n = this.pNoise(x * 0.5, z * 0.5, 2);
        return 1.0 - Math.abs(n);
    },

    // 吸收 Qwen 版優點 2：加入水力侵蝕與熱力風化 (Hydraulic Erosion & Thermal Weathering)
    erodeTerrain(passes = 2) {
        const tSeg = CONFIG.tSeg;
        const size = (tSeg + 1) * (tSeg + 1);
        const flow = new Float32Array(size);
        const order = new Array(size);
        for(let i=0; i<size; i++) order[i] = i;
        // 依高度由上而下排序，模擬水流由高處往低處沖刷
        order.sort((a, b) => this.hMap[b] - this.hMap[a]);

        const neigh = [-1, 1, -(tSeg+1), (tSeg+1)]; // 左右上下

        for(let pass = 0; pass < passes; pass++) {
            flow.fill(1.0);
            for(let oi = 0; oi < size; oi++) {
                const i = order[oi];
                const ix = i % (tSeg+1), iz = Math.floor(i / (tSeg+1));
                if(ix === 0 || ix === tSeg || iz === 0 || iz === tSeg) continue;

                let lowest = -1, lh = this.hMap[i];
                for(let k = 0; k < 4; k++) {
                    const j = i + neigh[k];
                    if(this.hMap[j] < lh) { lh = this.hMap[j]; lowest = j; }
                }
                if(lowest < 0) continue; // 已經是坑底

                const slope = this.hMap[i] - lh;
                const carry = flow[i];
                flow[lowest] += carry * 0.94; // 水流匯聚

                // 侵蝕量與坡度和水流量成正比 (保護水下河床與深潭不被過度侵蝕)
                let eros = slope * 0.025 * carry;
                if (this.hMap[i] < -5) eros *= 0.1; 
                const maxErode = slope * 0.45;
                if(eros > maxErode) eros = maxErode;

                if(eros > 0.001) {
                    this.hMap[i] -= eros;
                    this.hMap[lowest] += eros * 0.40; // 泥沙沉積
                }
            }
            // 輕量熱力風化 (崩塌平滑化)，消除過度鋸齒，讓陡峭山脈產生滑坡坡度
            // 【崩塌疊代收斂】以 80 單位作為最大鄰域落差上界，多重疊代將極端懸崖緩衝成連續坡面，杜絕 3D 地形撕裂
            for(let iter = 0; iter < 4; iter++) {
                let maxMoveThisIteration = 0;
                for(let iz = 1; iz < tSeg; iz++) {
                    for(let ix = 1; ix < tSeg; ix++) {
                        const i = iz * (tSeg+1) + ix;
                        const h = this.hMap[i];
                        for(let k = 0; k < 4; k++) {
                            const j = i + neigh[k];
                            const diff = h - this.hMap[j];
                            if(diff > 80.0) {
                                const move = (diff - 80.0) * 0.5;
                                this.hMap[i] -= move;
                                this.hMap[j] += move * 0.8;
                                if (move > maxMoveThisIteration) maxMoveThisIteration = move;
                            } else if(diff < -80.0) {
                                const move = (-diff - 80.0) * 0.5;
                                this.hMap[i] += move;
                                this.hMap[j] -= move * 0.8;
                                if (move > maxMoveThisIteration) maxMoveThisIteration = move;
                            }
                        }
                    }
                }
                if (maxMoveThisIteration < 0.01) break;
            }
        }
    },

    buildTerrain() {
        const state = AppState.current;
        const tSeg = CONFIG.tSeg, tSize = CONFIG.tSize;

        const pos = this.terrainGeo.attributes.position.array;

                let wZ = 999; if(['you','jiuqu','bazi','tfork'].includes(state.w)) wZ = 70; if(state.w==='gejiao') wZ = 30; if(state.w==='ji'||state.w==='fan') wZ = 55; if(state.w==='lintou') wZ = -10;
                // 【修正】高山點穴/手動點穴導致穴位水平位移 (lz 偏移) 時，河道位置必須連動，

        for (let i = 0; i < pos.length; i += 3) {

                // 【平洋水纏砂 / 平洋一突】：穴場周圍隆起平洋微丘，若選突穴/乳穴則大幅墊高顯現「平洋一突勝千峰」
                // 【修復幾何 BUG】：動態追蹤真實的物理太極中心 (lx, lz)，確保手動點穴或物理漩渦不會與實體土丘發生空間脫節
                let lx_ping = state.manualXue ? (state.xueX || 0) : 0;
                let lz_ping = state.manualXue ? (state.xueZ || 5.0) : 5.0; // 平洋 xueHeight 恆為 0
                if (Math.abs(x - lx_ping) < 25 && Math.abs(z - lz_ping) < 25) {
                    // 修正：平洋龍穴形微地形應符合風水形狀——「突穴/乳穴」為平洋一突勝千峰（隆起），
                    // 但高度應適中（約 5 單位），避免過度突出導致地形與「平洋」語義矛盾。
                    let knollBoost = (state.xue === 'tu' || state.xue === 'ru') ? 5.0 : (state.xue === 'wo' || state.xue === 'qian' ? -0.8 : 1.0);

            } else {

                let dX = x;

                if(state.d==='huilong') {

                if(['sheng','ji','huan'].includes(state.d)) sBase += (Math.sin(z*(state.d==='ji'?0.15:0.08)) + this.pNoise(x*0.5, z*0.5)*0.5)*(state.d==='ji'?15:8)*Math.min(2.0, Math.max(0,-z/50));
                if(state.d==='si') sBase *= 0.3; if(state.d==='po') sBase += this.pNoise(x,z)*15;

                // 【進化：能量層級與真龍骨脈 (Mountain Spine & Hierarchy)】
                // 讓龍脈的骨幹隨機隆起，展現「過峽跌斷、起伏頓跌」的真實山脊起伏，而不只是平滑的圓管
                let hierarchyBoost = 0;
                let spinePulse = Math.sin(z * 0.15) * 8.0 + Math.cos(z * 0.07) * 12.0; // 骨脈的頓跌與波浪起伏
                
                if (z < -120) hierarchyBoost = 45 + spinePulse * 1.5; // 太祖山勢能最高，山脊極端起伏
                else if (z < -80) hierarchyBoost = 22 + spinePulse;   // 少祖山降壓，保留強烈骨感
                else if (z < -40) hierarchyBoost = 8 + spinePulse * 0.5; // 父母山平緩，逐漸柔和
                
                // 將骨脈起伏與左右寬度結合 (越高的山體，基底延伸越寬厚)

                // 【龍脈剝換脫煞 (Metamorphosis)】：未剝換則全線佈滿尖銳岩石

                if (state.xing === 'huo' && state.bohuan === 'no') rockyNoise += Math.abs(Math.sin(x * 0.8) * Math.cos(z * 0.8)) * 15.0;
                sBase += rockyNoise;
                
                // 【橈棹枝腳 (Fractal Branches)】：龍脈兩側的天然導流防波堤

                    if (state.tianchi && state.zhu && z > -80 && z < -40 && Math.abs(x) < 25) {
                        let distToPeak = Math.sqrt(x*x + Math.pow(z+60, 2));
                        if (distToPeak < 18) {
                            let lakeDepth = 15 * Math.exp(-Math.pow(distToPeak/10, 2));
                            h -= lakeDepth;
                        }
                        // 火山口邊緣微凸
                        if (distToPeak >= 14 && distToPeak < 22) {
                            h += 4 * Math.sin((distToPeak - 14)/8 * Math.PI);
                        }
                    }
                    
                    // 【主客比例 (Mountain Scale)】：應用 UI 滑桿的主山縮放
                    h *= state.zhuScale; 

                    if(state.zhu && z < -40 && z > -80) {
                        // 主山：增加山峰的側翼支脈，打破單調圓錐，呈現山腳的延伸感
                        let zhuCore = 18 * Math.exp(-(x*x + Math.pow(z+60,2))/800);
                        let zhuRidges = Math.max(0, Math.cos(x * 0.08) * Math.sin(z * 0.1)) * 6.0 * Math.exp(-(x*x)/1500);
                        h += (zhuCore + zhuRidges) * state.zhuScale;
                    }
                    
                    // 【生態移植：蜈蚣脊 (Centipede Ridge) / 枯骨煞】
                    if (state.wugong && z < -10) {
                        let distFromSpine = Math.abs(x);
                        // 只在主脊兩側生長出高頻的肋骨支脈，避開中心線
                        if (distFromSpine > 5 && distFromSpine < 40) {
                            let ribFrequency = 1.2;
                            let ribPattern = Math.abs(Math.cos(z * ribFrequency));
                            let ribHeight = 16.0 * ribPattern * Math.exp(-(Math.pow(distFromSpine - 15, 2))/100);
                            let spike = (ribPattern > 0.9) ? 6.0 : 0; // 尖銳的毒刺
                            h = Math.max(h, h * 0.5 + ribHeight + spike);
                        }
                    }
                    if(state.xu && z < -70 && z > -120) {
                        // 玄武山 (後靠)：重巒疊嶂，橫向展開如屏障護衛
                        let xuCore = 25 * Math.exp(-(x*x*0.6 + Math.pow(z+95,2))/1200); // 橢圓形主核心
                        let xuScreen = 15 * Math.exp(-(Math.pow(z+100,2))/400) * Math.cos(x * 0.05); // 橫向屏風山脈
                        h += Math.max(xuCore, xuScreen * (Math.abs(x) < 80 ? 1 : 0)) * state.zhuScale;
                    }
                    y = Math.max(y, h);
                }
                
                // 【進化：太祖山與遠方群山大背景 (Majestic Ancestral Mountain Range)】
                if(state.zutai && z < -90) {
                    // 太祖山不再是單一圓丘，而是插天巨峰群 (中心主峰 + 左右輔弼護衛)
                    let zuMain = 85 * Math.exp(-(x*x*0.8 + Math.pow(z+135,2))/900); // 挺拔高聳主峰
                    let zuSide1 = 55 * Math.exp(-(Math.pow(x-45, 2) + Math.pow(z+125,2))/1000); // 左輔峰
                    let zuSide2 = 60 * Math.exp(-(Math.pow(x+50, 2) + Math.pow(z+130,2))/1200); // 右弼峰
                    
                    // 背景連綿萬山朝拜 (利用 FBM 噪聲生成廣袤山脈基底與雲海感)
                    let bgMountains = (this.pNoise(x * 0.35, z * 0.35, 3) * 35.0 + 15.0) * Math.exp(-Math.pow(z+90, 2)/15000);
                    
                    // 龍脈發源的深切溝壑與岩骨紋理 (模擬高山冰川切削)
                    let glacialCrevasses = -Math.abs(this.pNoise(x * 1.2, z * 1.2)) * 10.0; 
                    
                    let zuTotal = Math.max(zuMain, Math.max(zuSide1, zuSide2)) + Math.max(0, bgMountains) + glacialCrevasses;
                    y = Math.max(y, zuTotal * state.zhuScale);
                } else if (state.d !== 'pingyang' && z < -110) {
                    // 即使未點選太祖山，山龍遠處也不該是平地，補上連綿的背景遠山 (Background Ranges)
                    let distantRanges = (this.ridgeNoise(x * 0.4, z * 0.4) * 30.0 + this.pNoise(x * 0.2, z * 0.2, 2) * 20.0) * Math.min(1.0, (-z - 110) / 40.0);
                    y = Math.max(y, distantRanges * state.zhuScale);
                }

                let brokenNoise = state.posui ? (this.pNoise(x*2.0, z*2.0) * 20.0 - 5.0) : 0; // 破碎崖崩塌地貌

                if(state.ml!=='none' && x<0 && z>-30 && z<110) {
                    let sH = 0;
                    if (state.ml === 'jiaoya') {
                        // 交牙砂：產生波浪狀向中心延伸的山脊，與右砂咬合
                        let tooth = Math.sin((z - 20) * 0.15) * 15; // 週期性向內伸出
                        let centerX = -35 + Math.max(0, tooth);
                        sH = 38 * Math.exp(-Math.pow(x-centerX,2)/120) * Math.max(0,1-(z+20)/130);
                    } else {
                        let r = state.ml==='ya'?15:35;
                        let curve = Math.max(0, (z - 20) * 0.45); 
                        if (z > 20 && z < 35 && state.mr !== 'none') curve += Math.sin((z - 20) / 15 * Math.PI) * 18;
                        if (z > 55 && z < 85) curve += Math.sin((z - 55) / 30 * Math.PI) * 45;
                        let centerX = -Math.max(-10, r - curve); 
                        sH = 35*Math.exp(-Math.pow(x-centerX,2)/200)*Math.max(0,1-(z+20)/130);
                        if(state.ml==='po') sH *= (1+this.pNoise(x,z)*0.5); 
                        if(state.ao && z>0 && z<30) sH *= 0.1;
                    }
                    if(z > 70 && state.an) sH += 15 * Math.exp(-(Math.pow(x+10,2)+Math.pow(z-85,2))/100); 
                    if(state.qingquan && Math.abs(z-20)<10 && Math.abs(x)>10) sH += 20*Math.exp(-Math.pow(x+20,2)/50);
                    if(state.posui && sH > 5) sH += brokenNoise;
                    
                    if (state.bidao && z > 10 && z < 70) {
                        let edgeDist = x - 15; // 右砂邊緣
                        if (edgeDist > 0 && edgeDist < 8.0) {
                            if (edgeDist < 2.0) sH = Math.max(sH, 45);
                            else sH = Math.max(sH, 45 - (edgeDist - 2.0) * 2.5);
                        }
                    }
                    y = Math.max(y, sH);
                }

                if(state.mr!=='none' && x>0 && z>-30 && z<110) {
                    let sH = 0;
                    if (state.mr === 'jiaoya') {
                        // 交牙砂：相位錯開，與左砂形成犬牙交錯的峽谷
                        let tooth = Math.cos((z - 20) * 0.15) * 15; 
                        let centerX = 35 - Math.max(0, tooth);
                        sH = 38 * Math.exp(-Math.pow(x-centerX,2)/120) * Math.max(0,1-(z+20)/130);
                    } else {
                        let r = state.mr==='tai'?15:35;
                        let curve = Math.max(0, (z - 20) * 0.45);
                        if (z > 75 && z < 105) curve += Math.sin((z - 75) / 30 * Math.PI) * 45;
                        let centerX = Math.max(-10, r - curve); 
                        sH = (state.mr==='tai'?45:35)*Math.exp(-Math.pow(x-centerX,2)/200)*Math.max(0,1-(z+20)/130);
                        if(state.mr==='po') sH *= (1+this.pNoise(x,z)*0.5); 
                        if(state.ao && z>0 && z<30) sH *= 0.1;
                    }
                    if(z > 70 && state.an) sH += 15 * Math.exp(-(Math.pow(x-10,2)+Math.pow(z-85,2))/100); 
                    if(state.qingquan && Math.abs(z-20)<10 && Math.abs(x)>10) sH += 20*Math.exp(-Math.pow(x-20,2)/50);
                    if(state.posui && sH > 5) sH += brokenNoise;
                    
                    if (state.bidao && z > 10 && z < 70) {
                        let edgeDist = x - 15; // 右砂邊緣
                        if (edgeDist > 0 && edgeDist < 8.0) {
                            if (edgeDist < 2.0) sH = Math.max(sH, 45);
                            else sH = Math.max(sH, 45 - (edgeDist - 2.0) * 2.5);
                        }
                    }
                    y = Math.max(y, sH);
                }
                if(state.hulong && Math.abs(z)<50) y = Math.max(y, 25*Math.exp(-Math.pow(Math.abs(x)-70,2)/200));

                // 【射肋煞 (Arrow Sha)】：尖銳的無情山脊如刀劍直插穴星兩側
                if (state.sherui && z > -15 && z < 25) {
                    let arrowH = 25.0 * Math.exp(-(Math.pow(Math.abs(x) - 25, 2))/20) * Math.exp(-(Math.pow(z - 5, 2))/40);
                    y = Math.max(y, arrowH);
                }
            }

            // 【修正：平洋龍物理空間悖論】平洋為平坦微地形，前方案山與朝山必須等比例縮小為沙洲微丘，不能長出摩天大山
            let pScale = (state.d === 'pingyang') ? 0.15 : 1.0;

            if(state.an && z>55 && z<100) {
                // 若朱雀低陷 (ms === 'di')，降低前案高度為 5 展現空虛低陷，否則保持標準案山高度 18
                let targetH = (state.ms === 'di') ? 5 : 18;
                let flatTableAn = targetH * Math.exp(-(Math.pow(x/1.8, 4) + Math.pow(z-75, 2)) / 350);
                
                // 【新增：筆架三台 (Brush Rest Anshan)】
                if (state.ms === 'bijia') {
                    // 三座尖峰並列，中央略高，兩側略低，形如筆架
                    let pCenter = 28 * Math.exp(-(x*x + Math.pow(z-75, 2))/80);
                    let pLeft   = 22 * Math.exp(-(Math.pow(x+25, 2) + Math.pow(z-75, 2))/80);
                    let pRight  = 22 * Math.exp(-(Math.pow(x-25, 2) + Math.pow(z-75, 2))/80);
                    flatTableAn = Math.max(flatTableAn, (pCenter + pLeft + pRight));
                }
                
                // 修正 2：官星 (Guan) 缺少 Z 軸收斂...
                let guanStar = state.guan ? 5 * Math.exp(-(x*x + Math.pow(z-85, 2))/100) : 0;
                y = Math.max(y, (flatTableAn + guanStar) * pScale);
            }
            if(state.ms==='po' && z>55 && z<100) y = Math.max(y, 18 * pScale * Math.exp(-(x*x+Math.pow(z-75,2))/400)*(1+this.pNoise(x,z)*0.5));
            // 修正：風水幾何防呆。探頭煞必須躲在「案山」背後。若無案山 (state.an 為 false)，則不應生成孤立的探頭山。
            if(state.an && state.tantou && z>80 && z<120) y = Math.max(y, 25 * pScale * Math.exp(-(x*x+Math.pow(z-100,2))/100));
            if(state.chao && z>110) {
                // 三台疊浪朝山：遠處朝山分成三重波浪狀山脈（第一台 z:125、第二台 z:145、第三台 z:165），層層朝拜
                let t1 = 35 * Math.exp(-(x*x + Math.pow(z-125, 2))/1200);
                let t2 = 50 * Math.exp(-(x*x + Math.pow(z-145, 2))/1800);
                let t3 = 70 * Math.exp(-(x*x + Math.pow(z-165, 2))/2500);
                y = Math.max(y, Math.max(t1, Math.max(t2, t3)) * pScale);
            }

                        // 【效能優化】：將穴位座標與平台高度預先計算
            let xueH = state.xueHeight || 0;
            let lx = state.manualXue ? (state.xueX || 0) : 0; // 手動切換防呆
            // 【修正】穴位水平固定於前方 Z=5，xueHeight 改為直接提升穴位山體海拔，避免高山點穴位移造成穴位落入深谷
            let lz = state.manualXue ? state.xueZ : 5.0;
            let terraceY = (state.d === 'pingyang') ? -1.0 + xueH * 0.5 : -3.0 + xueH * 1.2; // 海拔加成

            // 【主客比例 (Ming Tang Scale)】：將 UI 滑桿應用於明堂半徑
            let scaledMtRadius = 65 * state.mtScale;
            let dxLair = x - lx, dzLair = z - lz;
            let mtD = Math.sqrt(dxLair*dxLair + dzLair*dzLair);

            if(state.mt && mtD < scaledMtRadius) {
                // 將所有 mtD 相關的衰減也按比例放大
                let normMtD = mtD / state.mtScale;
                
                // 【修正】穴基海拔加成：xueHeight 越高，穴位與明堂整體抬高，模擬高山結穴
                let tY = (state.d === 'pingyang') ? -1.0 + xueH * 0.5 : -3.0 + xueH * 1.2;
                let angle = Math.atan2(dxLair, dzLair);
                let targetAngle = state.face === '1' ? 0 : Math.PI; 
                let angleDiff = Math.abs(Math.atan2(Math.sin(angle - targetAngle), Math.cos(angle - targetAngle)));
                let wall = (angleDiff / Math.PI) * 12 * pScale * (Math.min(30, normMtD)/30); 

                // 【修正：保留 xueHeight 抬升基準】各穴形雕刻必須疊加在基準海拔之上，否則高山點穴會失效
                const xueBaseY = tY;

                if(state.xue==='wo') tY = xueBaseY + (-8 * pScale * Math.cos(normMtD*Math.PI/60) + wall);
                else if(state.xue==='tu') tY = xueBaseY + (8 * pScale * Math.cos(normMtD*Math.PI/60) - wall*0.5);
                else if(state.xue==='ru' && dzLair<5) tY = xueBaseY + (12 * pScale * Math.exp(-(dxLair*dxLair + Math.pow(dzLair+5,2))/50) + wall);
                else if(state.xue==='qian') {
                    let qianArm = 12 * Math.exp(-(Math.pow(Math.abs(dxLair)-15, 2) + Math.pow(Math.max(0, dzLair), 2))/80);
                    tY = xueBaseY + (-5 * pScale) + wall + (qianArm * pScale);
                }
                else if(state.xue==='ping') {
                    tY = xueBaseY + (0 + wall * 0.3); // 坪穴極其平緩，微弱邊緣
                }
                else if(state.xue==='ya') {
                    // 崖穴：後方突起陡峭，前方深淵斷崖
                    if (dzLair < 0) tY = xueBaseY + (18 * pScale * Math.exp(-(dxLair*dxLair + Math.pow(dzLair+10,2))/80) + wall);
                    else tY = xueBaseY + (-15 * pScale * Math.exp(-(dxLair*dxLair + Math.pow(dzLair-10,2))/80) + wall);
                }

                // 【進化：自然生態穴場與超真實微地形雕塑】
                if (state.xia) {
                    // 加入自然風化與土壤起伏雜訊 (Organic Micro-Noise)，讓穴場地表不再僵硬平滑
                    let organicMicroNoise = this.pNoise(x * 0.4, z * 0.4, 2) * 1.4 * pScale;
                    
                    // 1. 球檐 / 頂枕 (圓潤包覆的後靠化胎山丘)
                    if (dzLair < 0 && dzLair > -18 && Math.abs(dxLair) < 15) {
                        tY += (8.0 + organicMicroNoise * 0.5) * pScale * Math.exp(-(dxLair*dxLair + Math.pow(dzLair + 7, 2))/45);
                    }
                    // 2. 氈唇 / 吐唇 (帶有扇形沖積坡度的自然餘氣平台)
                    if (dzLair >= 0 && dzLair < 24 && Math.abs(dxLair) < 22) {
                        let fanDist = Math.sqrt(dxLair * dxLair + Math.pow(dzLair - 6, 2));
                        let lipFactor = Math.exp(-Math.pow(fanDist / 12.0, 2));
                        tY = tY * (1.0 - lipFactor * 0.75) + (1.8 * pScale + organicMicroNoise * 0.3) * lipFactor;
                    }
                    // 3. 蟬翼砂 (兩側環抱微弧形護穴砂丘)
                    if (Math.abs(dzLair) < 22) {
                        let wingCurve = Math.sin((dzLair + 20) * 0.08) * 3.0; // 呈現微向內彎的自然弧線
                        let wingLeft = Math.exp(-(Math.pow(x - (lx - 12 - wingCurve), 2) + dzLair*dzLair)/38) * 4.5 * pScale;
                        let wingRight = Math.exp(-(Math.pow(x - (lx + 12 + wingCurve), 2) + dzLair*dzLair)/38) * 4.5 * pScale;
                        tY += (wingLeft + wingRight);
                    }
                    // 4. 蟹眼水 (自然雨水侵蝕形成的雙側分水小深溝)
                    if (dzLair < 2 && dzLair > -12) {
                        let drainLeft = Math.exp(-(Math.pow(x - (lx - 6), 2) + Math.pow(dzLair + 5, 2))/10) * 2.8 * pScale;
                        let drainRight = Math.exp(-(Math.pow(x - (lx + 6), 2) + Math.pow(dzLair + 5, 2))/10) * 2.8 * pScale;
                        tY -= (drainLeft + drainRight);
                    }
                    
                    // 5. 太極暈 (自然同心圓地脈波紋與微坡度)
                    if (mtD < 10) {
                        let halo = Math.cos(mtD * 1.3) * Math.exp(-(mtD*mtD)/18) * 1.5 * pScale;
                        tY += halo + organicMicroNoise * 0.2;
                    }

                    // 6. 蝦鬚水 (八字分流界水線，增加兩側排水層次感)
                    if (dzLair > -5 && dzLair < 14) {
                        let whiskerCurve = 3.8 + dzLair * 0.55; // 八字向外開展
                        let whiskerDist = Math.abs(Math.abs(dxLair) - whiskerCurve);
                        if (whiskerDist < 2.8) {
                            let whiskerDepth = Math.exp(-(whiskerDist*whiskerDist)/2.2) * Math.exp(-(dzLair*dzLair)/55) * 1.8 * pScale;
                            tY -= whiskerDepth;
                        }
                    }

                    // 7. 四大穴形 (窩、鉗、乳、突) 專屬微地貌強化
                    if (state.xue === 'wo') {
                        // 窩穴：強化「弦稜」 (窩緣的圓潤包覆) 與前方的開口平滑
                        if (mtD > 6 && mtD < 16) {
                            let rim = Math.sin((mtD - 6) / 10 * Math.PI) * 4.0 * pScale;
                            tY += rim * Math.max(0, (12 - dzLair) / 15); // 前方開口放低，背側隆起
                        }
                    } else if (state.xue === 'qian') {
                        // 鉗穴：牛角砂 (雙臂微向內彎曲延伸，抱緊穴心)
                        if (dzLair > -2 && dzLair < 22) {
                            let armCurve = 11 + Math.sin(dzLair * 0.15) * 4; 
                            let armDist = Math.abs(Math.abs(dxLair) - armCurve);
                            if (armDist < 5) {
                                let horn = 5.5 * Math.exp(-(armDist*armDist)/8) * Math.exp(-(dzLair - 10)*(dzLair - 10)/150) * pScale;
                                tY += horn;
                            }
                        }
                    } else if (state.xue === 'ru') {
                        // 乳穴：強化「垂珠」的飽滿度與尖端突起，讓乳穴更圓潤立體
                        if (mtD < 11 && dzLair < 6) {
                            let drop = 4.5 * Math.exp(-(dxLair*dxLair + Math.pow(dzLair + 2, 2))/20) * pScale;
                            tY += drop;
                        }
                    } else if (state.xue === 'tu') {
                        // 突穴：突起四周挖出隱約的「微型界水」 (護城溝)，凸顯平中生突的孤高感
                        if (mtD > 4.5 && mtD < 10) {
                            let moat = 1.8 * Math.exp(-(Math.pow(mtD - 7.5, 2))/4) * pScale;
                            tY -= moat;
                        }
                    } else if (state.xue === 'ping') {
                        // 坪穴：中心點猶如棋盤般平坦開闊，四周略微隆起一圈微不可察的「土唇」
                        if (mtD < 12) {
                            let flatBoard = Math.exp(-(mtD*mtD)/144) * 0.5 * pScale;
                            tY = tY * 0.5 + flatBoard; // 強制壓平
                        }
                    } else if (state.xue === 'ya') {
                        // 崖穴(壁穴)：穴後背靠如刀削般垂直，前方呈現懸崖斷層
                        if (dzLair < -2 && dzLair > -10 && Math.abs(dxLair) < 8) {
                            let cliffBack = 8.0 * pScale * Math.exp(-(dxLair*dxLair)/20);
                            tY += cliffBack;
                        } else if (dzLair > 2 && dzLair < 12 && Math.abs(dxLair) < 10) {
                            let cliffDrop = 12.0 * pScale * Math.exp(-(dxLair*dxLair)/30);
                            tY -= cliffDrop;
                        }
                    }
                }

                // 【修復】移除寫死的重複氈唇(已由上方的 lipFactor 動態取代)
                // 並將合襟水(穴前匯水微坑)改為相對坐標 (dzLair 與 dxLair)，完美跟隨穴場移動
                if (state.xia && dzLair >= 7 && dzLair <= 15 && Math.abs(dxLair) <= 8) {
                    let hejinPit = Math.exp(-(dxLair*dxLair + Math.pow(dzLair-11, 2))/20) * 3.0 * pScale;
                    tY -= hejinPit; 
                }

                // 【修復】明堂的階梯式下切全面使用 dxLair 與 dzLair，
                // 讓「手動點穴」在 X 軸偏移時，明堂凹陷也能完美跟隨穴星！
                // 修正：加入邊界過渡帶，消除階梯間的不連續，防止地形撕裂
                if (dzLair >= -10 && dzLair < 10) {
                    let innerHall = Math.exp(-(dxLair*dxLair + Math.pow(dzLair, 2))/120) * 1.8 * pScale;
                    // 【修正】內堂平坦化必須尊重 xueHeight 的抬升基準，否則高山點穴會被強制壓回低海拔
                    let innerBaseY = Math.max(1.2 * pScale, xueBaseY);
                    tY = tY * (1 - Math.min(1, innerHall)) + innerBaseY * Math.min(1, innerHall);
                } else if (dzLair >= 10 && dzLair < 37 * state.mtScale) {
                    let smoothStart = Math.min(1, Math.max(0, (dzLair - 10) / 8.0));
                    smoothStart = smoothStart * smoothStart * (3 - 2 * smoothStart);
                    let midHallDrop = (3.5 + Math.sin((dzLair - 10) / (27 * state.mtScale) * Math.PI) * 1.5) * pScale * smoothStart;
                    tY -= midHallDrop;
                    
                    // 【生態移植：明堂低陷深坑 (Sunken Mingtang)】
                    if (state.ms === 'sunken') {

                        tY -= sinkDepth;
                    }
                } else if (dzLair >= 37 * state.mtScale && dzLair < scaledMtRadius) {
                    let smoothStart = Math.min(1, Math.max(0, (dzLair - 37 * state.mtScale) / 8.0));
                    smoothStart = smoothStart * smoothStart * (3 - 2 * smoothStart);
                    let progress = Math.min(1, Math.max(0, (dzLair - 37 * state.mtScale) / Math.max(1, scaledMtRadius - 37 * state.mtScale)));
                    let outerHallDrop = (3.5 + (7.0 - 3.5 + Math.exp(-Math.pow(dxLair/25, 2)) * 3.0) * progress) * pScale * smoothStart;
                    tY -= outerHallDrop;
                }

                let blendDist = Math.min(1.0, mtD / (55.0 * state.mtScale));
                y = y * blendDist + tY * (1 - blendDist);
            }
            // 【修正】高海拔穴位同步抬高太極暈底緣，避免低窪平台
            if(state.taiji && mtD < 18) y = Math.max(y, -2.5 + (state.d === 'pingyang' ? 0 : xueH * 0.8));
            
            // 【新增：無明堂的高山穴位抬升】修復 xueHeight 在 mt=false 時被完全忽略的邏輯 bug
            // 在沒有明堂的格局中，穴位海拔也應隨 xueHeight 提升，否則高山點穴無效。
            if (!state.mt && mtD < 22) {
                let noMtRise = (state.d === 'pingyang') ? -1.0 + xueH * 0.5 : -3.0 + xueH * 1.2;
                if (noMtRise > y) {

                    y = y + (noMtRise - y) * noMtFactor;
                }
            }
            
            // 【修復】明堂傾瀉(qing)必須使用相對座標 (dzLair)！
            // 否則點高山穴時，傾瀉會發生在幾十單位外的遠方平地，導致凶煞失效。
            if (state.mt && state.qing && mtD < 40) {
                if (state.face === '1' && dzLair > 10) y -= (dzLair - 10) * 0.35; // 向前傾瀉
                else if (state.face === '0' && dzLair < -20) y -= (-20 - dzLair) * 0.35; // 向後傾瀉
            }
            
            // 三叉水交會處：雕塑「水聚天心」深潭（天心水暈）
            // 【修正】三叉水的位置也應隨穴位水平位移 (lairZRef) 連動，否則高山點穴後水聚天心與明堂錯位
            if(state.san && Math.abs(x) < 25 && z > 45 + (state.w !== 'none' ? (lairZRef - 5.0) : 0) && z < 75 + (state.w !== 'none' ? (lairZRef - 5.0) : 0)) {
                let junctionDist = Math.sqrt(x*x + Math.pow(z - (60 + (state.w !== 'none' ? (lairZRef - 5.0) : 0)), 2));
                if (junctionDist < 20) {
                    // 修正：幾何深度悖論！平洋龍河床極淺(僅-4.5)，若強行挖出 -22 的深潭會產生荒謬的直井黑洞。
                    let sanDepth = (state.d === 'pingyang') ? -6.5 : -22;
                    // 修正：使用平滑的 s-curve 過渡代替 Math.min 硬切，消除地形撕裂
                    let smoothBlend = Math.pow(1.0 - Math.min(1.0, junctionDist / 20.0), 1.5);
                    let pitBottom = sanDepth + junctionDist * 0.35;
                    y = y * (1.0 - smoothBlend) + pitBottom * smoothBlend;
                }
            }

            // 修正 5：天斬煞直接用 Math.min 削平會導致網格法線破裂。
            // 必須改用平滑的高斯乘數，刻出極度陡峭但網格依然連續的深V型峽谷。
            if(state.tianzhan && Math.abs(x)<15 && z > -45 && z < 5) {
                let tCut = 18.0 * Math.exp(-(x*x)/25) * Math.sin(Math.min(1.0, (z+45)/45) * Math.PI);
                y -= Math.max(0, tCut - 4.0);
            }
            // 修正：地理拓撲悖論！當立向為背水(face=0)時，若將半月池建在 z: -35 處，
            // 會直接挖穿背後高聳的主山峰，造成嚴重的 3D 地形撕裂與邏輯悖論。
            // 半月池實體必須建於前方的平坦明堂(z: 30)，與人面朝向無關。
            // 【修正】半月池也應隨穴位水平位移 (lairZRef) 連動，確保池體位於明堂前方
            let targetYueZ = lairZRef + 25;
            // 修正 2：半月池的總半徑為 18，邊界裁切範圍必須大於 18 (放寬至 20)，否則池堤前後端會被像切蛋糕一樣削平
            let yueZMin = targetYueZ - 20, yueZMax = targetYueZ + 20;
            if(state.yue && Math.abs(x)<22 && z > yueZMin && z < yueZMax) {
                // 半月池：根據坐向 (face) 動態於前方 (z~30) 或後方 (z~-35) 雕塑池底與金城池堤
                let poolRadius = Math.sqrt(x*x + Math.pow(z-targetYueZ, 2));
                if (poolRadius < 14) {

                    let poolBottom = (state.d === 'pingyang') ? -5.0 : -16.0;
                    let poolSlope = (state.d === 'pingyang') ? 1.5 : 4.0;
                    y = poolBottom + (poolRadius/14) * poolSlope; 
                } else if (poolRadius >= 14 && poolRadius <= 18 && z > targetYueZ + 2) {
                    // 修正 2：半月池固定於前方，池堤(Bank)必須永遠位於池的外側 (z > targetYueZ + 2)。
                    // 移除 state.face 的判斷，防止背水時池堤長在內側導致形狀錯亂。
                    let bankH = (state.d === 'pingyang') ? 1.5 : -2.0;
                    y = Math.max(y, bankH); // 池前/池後拱起半月金城池堤
                }
            }
            if(state.w !== 'none') {
                // 修正：淋頭水應位於穴後 (z<5)，避免河道覆蓋穴場並造成深坑
                if(state.w==='lintou' && Math.abs(x)<12 && z > -30 && z < -3) y = Math.min(y, -12);

                let rS = wZ;
                // 修正：淋頭水僅允許存在於穴後，穴前區域不得被河道混合挖深
                if(state.w === 'lintou' && z > -3.0) rS = 999;
                if (state.d === 'pingyang' && state.w !== 'none') {
                    // 平洋鴨頸水：形成細長曲折如鴨頸的環抱灣流
                    rS += Math.sin(x * 0.08) * 20.0 + Math.cos(x * 0.18) * 8.0;
                }
                if(state.w==='jiuqu') {
                    // 之字/玄字形蛇行屈曲：利用方波化三角函數產生急折角度的九曲水道
                    let zCurve = Math.sin(x * 0.12);
                    rS += Math.sign(zCurve) * Math.pow(Math.abs(zCurve), 0.5) * 14;
                }
                if(state.w==='you') {
                    // 玉帶環腰：形成深 C 型半圓弧，將明堂與案山緊緊包抱在弧內
                    rS += (1.0 - Math.pow(x / 90.0, 2)) * 28.0;
                }
                if(state.w==='fan') rS -= Math.cos(x*0.05)*15;
                if(state.w==='bazi') rS += Math.abs(x)*0.5;

                // 【水文水力學雕塑】：彎道凸岸（環抱側）堆積沙洲金城吐唇，凹岸（反弓側）深切成割腳崖深潭
                let dR = Math.abs(z - rS);
                
                // 【生態移植：丁字沖水 (T-Fork River)】
                if (state.w === 'tfork') {
                    // 主河道在前方橫流 (rS = 70)，並有一支流從 70 垂直射向明堂 (z: 20~70)

                        // 修正：平洋龍為平原微地形，支流深度必須與平洋河床一致，避免產生深溝破圖
                        const tforkBranchDepth = (state.d === 'pingyang') ? 
                            (-4.5) :

                        y = Math.min(y, tforkBranchDepth);

                    }
                }
                if((state.w === 'jiuqu' || state.w === 'you' || state.w === 'fan') && Math.abs(z - rS) < 25) {
                    // 計算河道曲率方向（正值為向北彎，負值為向南彎）
                    let curveCoeff = (state.w === 'jiuqu') ? Math.sin(x * 0.12) : ((state.w === 'you') ? 1.0 : -1.0);
                    let bankDist = (z - rS) * curveCoeff;

                    if (bankDist > 1.5 && bankDist < 18.0) {
                        // 凸岸（水包邊）：泥沙堆積凸起成金城水灣包抱沙洲（吐唇）
                        let spitH = Math.exp(-Math.pow(bankDist - 8.0, 2) / 20) * 4.5;
                        y += spitH;
                    } else if (bankDist < -1.5 && bankDist > -18.0) {

                        let gougeDepth = Math.exp(-Math.pow(bankDist + 8.0, 2) / 16) * 6.0;
                        y -= gougeDepth;
                    }
                }

                // 【風水地理修復】：水口神獸關攔（獅象/華表/羅星）實體窄化河道，形成 S 型交鎖峽谷
                let hasGuardsGorge = state.shixiang || state.hua || state.luo;
                if(hasGuardsGorge && Math.abs(x) > 50 && z > 40) {

                    // 左右山腳強行向河心延伸，將河道收窄為狹谷
                    let gorgeChoke = Math.exp(-Math.pow(Math.abs(x) - 65, 2) / 150) * 18;

                    }
                }

                dR = Math.abs(z - rS);

				if(dR < 25) {
					// 【新增：關鍵巒頭保護】案山與朝山為風水上的重要屏障，不得被河道侵蝕挖除。
					// 若當前點位於案山(55-100)或朝山(z>110)範圍，則跳過河道混合，保留山體。
					let isKeyMountain = (state.an && z > 55 && z < 100 && Math.abs(x) < 40) || (state.chao && z > 110 && Math.abs(x) < 80);
					if (!isKeyMountain) {
						let t = Math.max(0, dR / 25);
						let smoothT = t * t * (3 - 2 * t);
						// 修正：平洋為平原微地形，水體不應刻出極深峽谷，將河床深度大幅調淺至 -4.5
						let riverBottom = (state.d === 'pingyang') ? -4.5 : ((state.w === 'gejiao') ? -18 : -15);

						// 真實流體力學：加入河道物理高低差 (梯度)，讓重力自然引導水流，取代魔法向量
						let flowTilt = 0;
						if (state.w === 'bazi') flowTilt = -Math.abs(x) * 0.08; 
						else if (state.w === 'lintou') flowTilt = (z < 20) ? (z - 20) * 0.5 : -Math.abs(x) * 0.05; 
						else flowTilt = -x * 0.03; 

						let targetRiverY = riverBottom + flowTilt;
						
						// 【幾何安全鎖】確保河床絕對不會高於兩側陸地，且【必須】低於水面
                        let waterLevel = (state.d === 'pingyang') ? -3.5 : -12.0;
                        targetRiverY = Math.min(targetRiverY, Math.min(y - 1.5, waterLevel - 0.8));

						y = y * smoothT + targetRiverY * (1 - smoothT);
						if (state.w === 'gejiao' && dR >= 15) {

							// 讓割腳水產生連續且深 V 型的沖刷絕壁，徹底消除網格撕裂與尖刺
							let gejiaoCut = Math.pow(Math.max(0, 25 - dR), 1.2) * 0.5;
							y -= gejiaoCut;
						}
					}
				}

                if(state.luo && Math.abs(x) < 12 && z > 65 + (state.w !== 'none' ? (lairZRef - 5.0) : 0) && z < 85 + (state.w !== 'none' ? (lairZRef - 5.0) : 0)) {
                    // 羅星塞水口：河道正中央聳立獨立石墩山包（羅星），高出水面逼水分流
                    let luoH = 8.0 * Math.exp(-(x*x + Math.pow(z-(75 + (state.w !== 'none' ? (lairZRef - 5.0) : 0)), 2))/35);
                    y = Math.max(y, -15 + luoH); // 從河床抬升為水中央山洲
                }
                // 【華表捍門與獅象把水口】：左右兩岸對峙聳立陡峭雙峰峽谷門（捍門雙峰）
                if((state.shixiang || state.hua) && z > 65 + (state.w !== 'none' ? (lairZRef - 5.0) : 0) && z < 85 + (state.w !== 'none' ? (lairZRef - 5.0) : 0)) {
                    let bankDist = Math.abs(Math.abs(x) - 52); // 河道兩岸52距離處聳立雙峰
                    if (bankDist < 16) {
                        let gateH = (state.shixiang ? 28.0 : 22.0) * Math.exp(-bankDist*bankDist / 80) * Math.exp(-Math.pow(z-(75 + (state.w !== 'none' ? (lairZRef - 5.0) : 0)), 2)/100);
                        y = Math.max(y, gateH);
                    }
                }
                if(state.qin && z > 48 + (state.w !== 'none' ? (lairZRef - 5.0) : 0) && z < 68 + (state.w !== 'none' ? (lairZRef - 5.0) : 0)) {
                    // 水尾禽星：溪流出口兩側橫臥龜蛇形巨石洲（禽星砥柱）
                    let qinRock = 6.0 * Math.exp(-(Math.pow(Math.abs(x) - 15, 2) + Math.pow(z - (58 + (state.w !== 'none' ? (lairZRef - 5.0) : 0)), 2)) / 25);
                    y = Math.max(y, -12 + qinRock); // 凸起出水面的龜蛇奇石

            }

            if (state.d !== 'huilong' && state.d !== 'pingyang') y -= (z + 170) * 0.015;

            // 【新增：盆地宏觀地形 (Basin Topology)】 (完美模擬埔里盆地四周高山環抱)
            if (state.bendi && state.d !== 'pingyang') {
                // 修正：移除 Math.max 導致的 U 型拓撲破圖，讓距離計算真正成為 360 度 O 型盆地
                let basinRadius = Math.sqrt(x*x + Math.pow(z-20, 2));
                if (basinRadius > 60) {

                    // 加上雜訊讓盆地邊緣山脈看起來自然起伏
                    basinWall += this.pNoise(x*0.5, z*0.5) * 15.0;

                }
            }
            // 【新增 1：單/雙側界水/隨龍水 (Side Streams)】
            if (state.suilong !== 'none' && state.d !== 'pingyang') {
                if (state.suilong === 'shuang' || state.suilong === 'zuo') {
                    let leftTrench = Math.abs(x + 22) - Math.max(0, (z + 10) * 0.15); 
                    if (leftTrench < 8 && z > -80 && z < 35) {

                        y -= depth;
                    }
                }

                    if (rightTrench < 8 && z > -80 && z < 35) {

                        y -= depth;
                    }
                }
            }

            // 【新增 2：山區道路 (Virtual Water / Roads)】
            if (state.road !== 'none') {
                if (state.road === 'huanbao') {
                    let roadCurve = 15 - Math.pow(x / 35, 2) * 12; 
                    let distToRoad = Math.abs(z - roadCurve);
                    if (distToRoad < 3.5) {
                        let roadY = (state.d === 'pingyang') ? 1.5 : -1.5;

                    }
                } else if (state.road === 'zhichong') {
                    let distToRoad = Math.abs(x);
                    if (distToRoad < 3.0 && z > 10 && z < 150) {
                        let roadY = (state.d === 'pingyang') ? 1.5 : -2.0 + (z - 10) * 0.08; 
                        let blend = Math.pow(1.0 - distToRoad / 3.0, 1.5);
                        y = y * (1 - blend) + roadY * blend;
                    }
                } else if (state.road === 'sickle') {
                    // 【生態移植：鐮刀煞 (Sickle Road)】比反弓更銳利的近距離切腰彎道
                    let sickleCurve = 35 - Math.pow(x / 40, 2) * 20; 
                    let distToSickle = Math.abs(z - sickleCurve);
                    if (distToSickle < 3.5) {

                        y = y * (1 - blend) + roadY * blend;
                    }
                } else if (state.road === 'zuocha' || state.road === 'youcha') {
                    // 左/右脅路 (斜擦邊而過)

                    let expectedX = sign * (z * 0.4 + 12); // 斜率
                    let distToRoad = Math.abs(x - expectedX) * 0.8; 
                    if (distToRoad < 3.0 && z > -10 && z < 120) {

                } else if (state.road === 'jiandao') {

                    let rightDist = Math.abs(x - (z-15)*0.6) * 0.8;
                    let distToRoad = Math.min(leftDist, rightDist);
                    if (distToRoad < 3.0 && z > 5 && z < 150) {

                        let blend = Math.pow(1.0 - distToRoad / 3.0, 1.5);
                        y = y * (1 - blend) + roadY * blend;
                    }
                }
            }
            
            // 【生態移植：大環境地勢傾斜 (Global Terrain Slope)】
            if (state.terrain === 'slope') {
                y -= Math.max(0, (z - 5) * 0.15); // 前方急遽傾斜，退氣不聚
            } else if (state.terrain === 'backhigh') {
                y += Math.max(0, (-z - 10) * 0.15); // 後方高仰，如靠山
            }
            
            let gX = Math.round((x+tSize/2)/(tSize/tSeg)), gZ = Math.round((z+tSize/2)/(tSize/tSeg));
            this.hMap[gZ*(tSeg+1) + gX] = y;
        } // 結束階段一：基礎風水地形生成

        // 階段二：執行水力侵蝕與風化平滑 (吸收 Qwen 版優點，讓山脈雕刻出溝壑與自然坡面)
        this.erodeTerrain(2);

        // 【修復】河道深度保護：確保河床低於水面至少 0.8 單位，防止侵蝕沉積將河床抬升到水面高度，徹底消除 Z-Fighting
        if (state.w !== 'none') {
            let waterLevel = (state.d === 'pingyang') ? -3.5 : -12.0;
            let minRiverDepth = waterLevel - 0.8;
            let guardOffset = lairZRef - 5.0;
            for (let gz = 0; gz <= tSeg; gz++) {
                for (let gx = 0; gx <= tSeg; gx++) {
                    let x = (gx / tSeg) * tSize - tSize / 2;
                    let z = (gz / tSeg) * tSize - tSize / 2;
                    let rS = wZ;
                    if (state.d === 'pingyang' && state.w !== 'none') rS += Math.sin(x * 0.08) * 20.0 + Math.cos(x * 0.18) * 8.0;
                    if (state.w === 'jiuqu') { let zCurve = Math.sin(x * 0.12); rS += Math.sign(zCurve) * Math.pow(Math.abs(zCurve), 0.5) * 14; }
                    if (state.w === 'you') rS += (1.0 - Math.pow(x / 90.0, 2)) * 28.0;
                    if (state.w === 'fan') rS -= Math.cos(x * 0.05) * 15;
                    if (state.w === 'bazi') rS += Math.abs(x) * 0.5;
                    // 修正：淋頭水僅允許存在於穴後 (z<-3)，不得影響穴場前方的明堂與氈唇
                    if (state.w === 'lintou' && z > -3.0) continue;
                    let dR = Math.abs(z - rS);
                    if (dR < 25) {
                        // 保護關鍵巒頭：案山、朝山、水口神獸等水上構造不得被河道深度保護削平
                        let isProtectedLandmark = false;
                        if (state.an && z > 55 && z < 100 && Math.abs(x) < 40) isProtectedLandmark = true;
                        if (state.chao && z > 110 && Math.abs(x) < 80) isProtectedLandmark = true;
                        if (!isProtectedLandmark) {
                            if (state.luo && z > 65 + guardOffset && z < 85 + guardOffset && Math.abs(x) < 12) isProtectedLandmark = true;
                            if (state.qin && z > 48 + guardOffset && z < 68 + guardOffset && Math.abs(Math.abs(x) - 15) < 10) isProtectedLandmark = true;
                            if ((state.hua || state.shixiang) && z > 65 + guardOffset && z < 85 + guardOffset && Math.abs(Math.abs(x) - 52) < 16) isProtectedLandmark = true;
                        }
                    if (isProtectedLandmark) continue;
                    let idx = gz * (tSeg + 1) + gx;
                    let maxRiverbedY = minRiverDepth + (dR / 25) * 0.6;
                    if (this.hMap[idx] > maxRiverbedY) this.hMap[idx] = maxRiverbedY;
                }
            }
        }
        }

        // 【極端高度箝制】防止地形撕裂 (Z-Fighting)：先限制全域高度在 -45 ~ 130 之間，避免極端斷崖
        const TERRAIN_MIN_H = -45;
        const TERRAIN_MAX_H = 130;
        for (let clampIdx = 0; clampIdx < this.hMap.length; clampIdx++) {
            if (this.hMap[clampIdx] > TERRAIN_MAX_H) this.hMap[clampIdx] = TERRAIN_MAX_H;
            else if (this.hMap[clampIdx] < TERRAIN_MIN_H) this.hMap[clampIdx] = TERRAIN_MIN_H;
        }

        // 【後處理崩塌平滑】削平一切過度陡峭的懸崖落差，杜絕地形撕裂 (Z-Fighting)
        // 進一步強化：降低門檻至 30、增加迭代至 30，確保極端火山斷層地貌也能收斂成連續坡面
        const nbSlope = [-1, 1, -(tSeg+1), (tSeg+1)];
        for (let iter = 0; iter < 30; iter++) {
            let changed = false;
            for (let gz = 1; gz < tSeg; gz++) {
                for (let gx = 1; gx < tSeg; gx++) {
                    const idx = gz * (tSeg+1) + gx;
                    const h = this.hMap[idx];
                    for (let k = 0; k < 4; k++) {
                        const nIdx = idx + nbSlope[k];
                        const diff = h - this.hMap[nIdx];
                        if (diff > 30.0) {
                            const move = (diff - 30.0) * 0.5;
                            this.hMap[idx] -= move;
                            this.hMap[nIdx] += move * 0.8;
                            changed = true;
                        } else if (diff < -30.0) {
                            const move = (-diff - 30.0) * 0.5;
                            this.hMap[idx] += move;
                            this.hMap[nIdx] -= move * 0.8;
                            changed = true;
                        }
                    }
                }
            }
            if (!changed) break;
        }

        // 階段三：套用侵蝕後的高度，更新網格頂點與計算地貌顏色
        for (let i = 0; i < pos.length; i += 3) {
            let x = pos[i], z = pos[i+2];
            let gX = Math.round((x+tSize/2)/(tSize/tSeg)), gZ = Math.round((z+tSize/2)/(tSize/tSeg));
            let y = this.hMap[gZ*(tSeg+1) + gX]; // 讀取侵蝕過後的新高度
            
            // 【新增：高山天池平靜水面拉平與著色標記】
            let distToPeak = Math.sqrt(x*x + Math.pow(z+60, 2));
            let tianchiWaterLevel = 33 * (state.zhuScale || 1.0); 
            let isLakeSurface = (state.tianchi && state.zhu && distToPeak < 15 && y < tianchiWaterLevel);
            
            // 如果在天池範圍內，將起伏不平的坑洞強制拉平成如鏡面的水面
            if (isLakeSurface) y = tianchiWaterLevel;
            pos[i+1] = y;

            // 加入地表噪聲擾動，打破死板的水平顏色分層，產生真實的斑駁植被與鋸齒狀林線
            let colorNoise = this.pNoise(x * 1.5, z * 1.5, 2) * 0.12; 
            // 修正：歸一化海拔高度，適應前傾斜坡，防止低海拔山丘被誤算為極低值
            let nH = Math.max(0, Math.min(1.0, ((y + 35.0) / 95.0) + colorNoise));

            // 【優化：基於坡度的動態材質混合 (Slope-based Texturing)】
            // 讀取周圍高度計算真實坡度，陡坡自動裸露岩石，平緩處才生長植被
            let gX_slope = Math.max(0, Math.min(CONFIG.tSeg, gX));
            let gZ_slope = Math.max(0, Math.min(CONFIG.tSeg, gZ));
            let hL = this.hMap[gZ_slope * (tSeg + 1) + Math.max(0, gX_slope - 1)] || y;
            let hR = this.hMap[gZ_slope * (tSeg + 1) + Math.min(tSeg, gX_slope + 1)] || y;
            let hU = this.hMap[Math.max(0, gZ_slope - 1) * (tSeg + 1) + gX_slope] || y;
            let hD = this.hMap[Math.min(tSeg, gZ_slope + 1) * (tSeg + 1) + gX_slope] || y;
            let slope = Math.max(Math.abs(hL - hR), Math.abs(hU - hD)); // 計算最大高差代表坡度

            // 修正：精準判定是否位於「實際河道 channel 內部」，避免前傾山坡與低地被誤塗成深海藍色
            let isActualRiverChannel = false;
            if (state.w !== 'none') {
                let lairZRefColor = (state.manualXue ? (state.xueZ || 0) : 5.0);
                let wZColor = 30;
                if (['you','jiuqu','bazi','tfork'].includes(state.w)) wZColor = 70;
                else if (state.w==='ji'||state.w==='fan') wZColor = 55;
                else if (state.w==='lintou') wZColor = -10;
                wZColor += (lairZRefColor - 5.0);

                let rSColor = wZColor;
                if (state.d === 'pingyang') rSColor += Math.sin(x * 0.08) * 20.0 + Math.cos(x * 0.18) * 8.0;
                if (state.w === 'jiuqu') { let zCurveC = Math.sin(x * 0.12); rSColor += Math.sign(zCurveC) * Math.pow(Math.abs(zCurveC), 0.5) * 14; }
                if (state.w === 'you') rSColor += (1.0 - Math.pow(x / 90.0, 2)) * 28.0;
                if (state.w === 'fan') rSColor -= Math.cos(x*0.05)*15;
                if (state.w === 'bazi') rSColor += Math.abs(x)*0.5;

                let dRColor = Math.abs(z - rSColor);
                if (state.w === 'tfork' && Math.abs(x) < 12 && z > 20 && z < 75) dRColor = 0; // 丁字沖垂直支流
                // 修正：淋頭水僅影響穴後 (z<-3)，穴前不得被誤判為河道水域
                if (state.w === 'lintou' && z > -3.0) dRColor = 999;
                if (dRColor < 22.0) isActualRiverChannel = true;
            }

                if (isActualRiverChannel && y < -10.0) {
                    // 真正的河床過渡：僅在河道溝槽內部著色深沉青墨色
                    let depth = Math.max(0, Math.min(1.0, (-10.0 - y) / 15.0));
                    c.setRGB(0.05 + depth * 0.05, 0.20 - depth * 0.1, 0.25 - depth * 0.1);
                } else {
                // 陸地山坡與谷底：依海拔與坡度渲染自然植被（綠色/褐色/岩石），徹底解決海洋視覺 BUG
                if (nH < 0.28) {
                    let t = nH / 0.28;
                    c.setHSL(0.33 - t * 0.06, 0.45 - t * 0.15, 0.18 + t * 0.10);
                } else if (nH < 0.65) {
                    let t = (nH - 0.28) / 0.37;
                    c.setHSL(0.27 - t * 0.15, 0.30 - t * 0.20, 0.28 + t * 0.12);
                } else if (nH < 0.88) {
                    let t = (nH - 0.65) / 0.23;
                    c.setHSL(0.10, 0.15 - t * 0.10, 0.40 + t * 0.10);
                } else {
                    let t = (nH - 0.88) / 0.12;
                    c.setHSL(0.6, 0.05, 0.50 + t * 0.45);
                }

                // 若坡度過陡 (大於 2.5)，植被無法附著，強制渲染為裸露風化岩石 (廉貞煞氣特徵)
                if (slope > 2.5) {
                    let rockFactor = Math.min(1.0, (slope - 2.5) / 3.0);
                    let rockColor = new THREE.Color();
                    rockColor.setHSL(0.08, 0.15, 0.35 + colorNoise); // 灰褐色岩盤
                    c.lerp(rockColor, rockFactor);
                }

                // 【新增：高山天池湛藍湖水顏色】
                if (isLakeSurface) {
                    c.setRGB(0.08, 0.45, 0.55); // 深邃的翡翠湖水藍
                }

                // 【新增：道路鋪面顏色 (灰土/柏油色)】
                let isRoadSurface = false;
                if (state.road === 'huanbao') {
                    let roadCurve = 15 - Math.pow(x / 35, 2) * 12; 
                    if (Math.abs(z - roadCurve) < 3.0) isRoadSurface = true;
                } else if (state.road === 'zhichong') {
                    if (Math.abs(x) < 2.5 && z > 10 && z < 150) isRoadSurface = true;
                } else if (state.road === 'sickle') {
                    // 【生態移植】鐮刀煞道路著色
                    let sickleCurve = 35 - Math.pow(x / 40, 2) * 20; 
                    if (Math.abs(z - sickleCurve) < 3.0) isRoadSurface = true;
                } else if (state.road === 'zuocha' || state.road === 'youcha') {
                    let sign = state.road === 'zuocha' ? -1 : 1;
                    let expectedX = sign * (z * 0.4 + 12);
                    if (Math.abs(x - expectedX) * 0.8 < 2.5 && z > -10 && z < 120) isRoadSurface = true;
                } else if (state.road === 'jiandao') {
                    let leftDist = Math.abs(x + (z-15)*0.6) * 0.8;
                    let rightDist = Math.abs(x - (z-15)*0.6) * 0.8;
                    if (Math.min(leftDist, rightDist) < 2.5 && z > 5 && z < 150) isRoadSurface = true;
                }
                
                if (isRoadSurface && !isLakeSurface) {
                    c.setRGB(0.35, 0.35, 0.35); // 灰黑色路面
                }

                // 【新增：穴土五色材質渲染】動態跟隨不同穴形的 Z 軸中心著色
                let dynTaijiZ_visual = (state.xue === 'wo') ? -5.0 : (state.xue === 'ru' ? 12.0 : (state.xue === 'qian' ? 0.0 : 5.0));
                let inTaijiVisual = (state.xia && Math.abs(x) < 20 && z > (dynTaijiZ_visual - 10) && z < (dynTaijiZ_visual + 13));
                
                if (inTaijiVisual && slope < 1.0 && y > -2) {
                    let soilCenterFactor = Math.exp(-(x*x + Math.pow(z - dynTaijiZ_visual, 2))/100);
                    if (state.soil === 'wuse') {
                        // 五色土：呈現紫紅、暖黃交織的祥瑞生機
                        let wuseColor = new THREE.Color();
                        wuseColor.setHSL(0.08 + colorNoise * 0.4, 0.65, 0.45); 
                        c.lerp(wuseColor, soilCenterFactor * 0.85);
                    } else if (state.soil === 'yuni') {
                        // 淤泥：呈現死氣沉沉、潮濕腐敗的黑灰色
                        let yuniColor = new THREE.Color();
                        yuniColor.setHSL(0.0, 0.0, 0.15);
                        c.lerp(yuniColor, soilCenterFactor * 0.95);
                    } else if (state.soil === 'wanshi') {
                        // 頑石：呈現蒼白反光、毫無生氣的死硬岩盤
                        let wanshiColor = new THREE.Color();
                        wanshiColor.setHSL(0.1, 0.05, 0.65);
                        c.lerp(wanshiColor, soilCenterFactor * 0.95);
                    }
                }
            }
            cols.push(c.r, c.g, c.b);
        }
        // 根據水法吉凶動態調整水體視覺材質（吉水清澈呈翡翠碧波，凶水渾濁呈泥黃血煞）
        if (this.waterMesh) {
            let isBadWater = ['gejiao', 'lintou', 'fan', 'bazi', 'ji', 'tfork'].includes(state.w);
            if (isBadWater) {
                this.waterMesh.material.color.setHex(0x6b4a31); // 更具土石流質感的泥黃煞水
                this.waterMesh.material.opacity = 0.98;
                this.waterMesh.material.roughness = 0.9; // 完全粗糙，無光澤
                this.waterMesh.material.metalness = 0.0;
            } else {
                this.waterMesh.material.color.setHex(0x0a91a1); // 提亮為明亮清透的翡翠琉璃藍
                this.waterMesh.material.opacity = 0.75; // 提高透明度，透出下方加深顏色的河床
                this.waterMesh.material.roughness = 0.02; // 極致光滑，形成強烈的高光反射
                this.waterMesh.material.metalness = 0.65; // 高金屬度讓水面波光粼粼
            }
        }

        // 【最終防撕裂收斂】強制將頂點高度限制在安全範圍（-45~130），並將相鄰落差超過 5 的位置平滑，杜絕任何 Z-Fighting
        const posArrSafety = this.terrainGeo.attributes.position.array;
        const tSegSafety = CONFIG.tSeg;
        const hMapSafety = this.hMap;
        // 先將 hMap 高度鉗制到全域安全範圍，避免極端斷崖
        for (let clampIdx = 0; clampIdx < hMapSafety.length; clampIdx++) {
            if (hMapSafety[clampIdx] > 130) hMapSafety[clampIdx] = 130;
            else if (hMapSafety[clampIdx] < -45) hMapSafety[clampIdx] = -45;
        }
        const nbSafety = [-1, 1, -(tSegSafety+1), (tSegSafety+1)];
        // 以極低的落差門檻（5.0）進行多輪鬆弛，確保所有內點鄰域高低差被撫平
        for (let iterSafety = 0; iterSafety < 60; iterSafety++) {
            let changedSafety = false;
            for (let gzSafety = 1; gzSafety < tSegSafety; gzSafety++) {
                for (let gxSafety = 1; gxSafety < tSegSafety; gxSafety++) {
                    const idxSafety = gzSafety * (tSegSafety + 1) + gxSafety;
                    const hSafety = hMapSafety[idxSafety];
                    for (let kSafety = 0; kSafety < 4; kSafety++) {
                        const nIdxSafety = idxSafety + nbSafety[kSafety];
                        const diffSafety = hSafety - hMapSafety[nIdxSafety];
                        if (diffSafety > 5.0) {
                            const moveSafety = (diffSafety - 5.0) * 0.5;
                            hMapSafety[idxSafety] -= moveSafety;
                            hMapSafety[nIdxSafety] += moveSafety * 0.8;
                            changedSafety = true;
                        } else if (diffSafety < -5.0) {
                            const moveSafety = (-diffSafety - 5.0) * 0.5;
                            hMapSafety[idxSafety] += moveSafety;
                            hMapSafety[nIdxSafety] -= moveSafety * 0.8;
                            changedSafety = true;
                        }
                    }
                }
            }
            if (!changedSafety) break;
        }
        // 同步回寫頂點高度，並再次鉗制防止越界
        for (let zSafety = 0; zSafety <= tSegSafety; zSafety++) {
            for (let xSafety = 0; xSafety <= tSegSafety; xSafety++) {
                const idxSafety = zSafety * (tSegSafety + 1) + xSafety;
                let hVal = hMapSafety[idxSafety];
                if (hVal > 130) hVal = 130;
                else if (hVal < -45) hVal = -45;
                posArrSafety[idxSafety * 3 + 1] = hVal;
            }
        }
        this.terrainGeo.attributes.position.needsUpdate = true;
        this.terrainGeo.computeVertexNormals();

        this.terrainGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(cols), 3));
        this.terrainGeo.computeVertexNormals(); this.terrainGeo.attributes.position.needsUpdate = true;
        
        // 【優化：動態生成植被 (Dynamic Vegetation)】
        // 根據地形坡度與高度，自動在平緩的陽坡或明堂周圍生長防風林
        if (this.treeMesh) {
            let treeCount = 0;
            const dummy = new THREE.Object3D();
            let lx_tree = AppState.current.xueX || 0;
            let lz_tree = AppState.current.manualXue ? AppState.current.xueZ : 5.0;

            for (let i = 0; i < pos.length; i += 3) {
                let x = pos[i], y = pos[i+1], z = pos[i+2];
                
                // 只在特定高度 (平原到淺山腰，不生長於深水或太高的寒冷山頂)
                if (y > -1 && y < 32) {
                    let ny = this.terrainGeo.attributes.normal.array[i+1];
                    
                    // 計算此點相對於穴心的距離與方位
                    let dxLairTree = x - lx_tree;
                    let dzLairTree = z - lz_tree;
                    let distToLairTree = Math.sqrt(dxLairTree * dxLairTree + dzLairTree * dzLairTree);

                    // 穴場自然植被分佈演算法：
                    // 1. 穴心前方 (氈唇/太極暈) 保持開闊無大樹遮擋
                    // 2. 穴場後方與兩側 (玄武後靠、青龍、白虎) 生成較密的「護穴風水林」
                    let treeProb = 0.06; // 預設植被密度
                    let isBehindOrSide = (dzLairTree < 5 || Math.abs(dxLairTree) > 12);
                    
                    if (distToLairTree > 12 && distToLairTree < 45 && isBehindOrSide && AppState.current.xia) {
                        treeProb = 0.25; // 穴場周圍防風林提高密度至 25%
                    } else if (distToLairTree <= 10 && AppState.current.xia) {
                        treeProb = 0.0; // 穴心保持乾淨開闊
                    }

                    if (ny > 0.82 && Math.random() < treeProb && treeCount < 3000) {
                        dummy.position.set(x, y, z);
                        
                        // 穴後大樹更高聳 (古木參天感)，其餘為一般植被
                        let isAncientTree = (distToLairTree > 12 && distToLairTree < 35 && dzLairTree < 0);
                        let baseScale = isAncientTree ? (1.0 + Math.random() * 0.9) : (0.4 + Math.random() * 0.7);
                        
                        dummy.scale.set(baseScale, baseScale * (isAncientTree ? 1.4 : 1.1), baseScale);
                        dummy.rotation.y = Math.random() * Math.PI;
                        dummy.updateMatrix();
                        this.treeMesh.setMatrixAt(treeCount, dummy.matrix);
                        treeCount++;
                    }
                }
            }
            this.treeMesh.count = treeCount; // 只渲染實際生成的數量
            this.treeMesh.instanceMatrix.needsUpdate = true;
        }
    },

    getTerrainY(x, z) {
        let gX = (x+CONFIG.tSize/2)/(CONFIG.tSize/CONFIG.tSeg), gZ = (z+CONFIG.tSize/2)/(CONFIG.tSize/CONFIG.tSeg);
        // 修復：Clamp 邊界邊緣索引，防止頂格點擊或粒子到達地圖邊緣時誤判定出界
        if(gX < 0 || gX > CONFIG.tSeg || gZ < 0 || gZ > CONFIG.tSeg) return {y:-100, nx:0, nz:0};
        let x0 = Math.min(CONFIG.tSeg - 1, Math.max(0, Math.floor(gX))), x1 = Math.min(CONFIG.tSeg, x0 + 1);
        let z0 = Math.min(CONFIG.tSeg - 1, Math.max(0, Math.floor(gZ))), z1 = Math.min(CONFIG.tSeg, z0 + 1);
        let h00 = this.hMap[z0*(CONFIG.tSeg+1)+x0]||0, h10 = this.hMap[z0*(CONFIG.tSeg+1)+x1]||0, h01 = this.hMap[z1*(CONFIG.tSeg+1)+x0]||0, h11 = this.hMap[z1*(CONFIG.tSeg+1)+x1]||0;
        let tx = gX-x0, tz = gZ-z0;
        let nx = (h00*(1-tz) + h01*tz) - (h10*(1-tz) + h11*tz);
        let nz = (h00*(1-tx) + h10*tx) - (h01*(1-tx) + h11*tx);
        return { 
            y: (h00*(1-tx)+h10*tx)*(1-tz) + (h01*(1-tx)+h11*tx)*tz, 
            nx: nx, 
            nz: nz 
        };
    },

    shockwavesThisFrame: 0, // 新增：單幀震波計數器
    createShockwave(x, y, z, color) {
        if (this.shockwavesThisFrame > 2) return; // 新增：每幀最多只允許產生 3 個震波，保護效能
        this.shockwavesThisFrame++;

        const mat = new THREE.MeshBasicMaterial({color: color, transparent: true, opacity: 1, side: THREE.DoubleSide});
        const mesh = new THREE.Mesh(this.swGeo, mat); mesh.position.set(x, y+1, z);
        this.swGroup.add(mesh);
        AppState.shockwaves.push({mesh: mesh, life: 1.0});

        if (AppState.shockwaves.length > CONFIG.maxShockwaves) {
            let sw = AppState.shockwaves.shift();
            this.swGroup.remove(sw.mesh);
            sw.mesh.material.dispose();
        }
    }
};

/* ==========================================
   5. PHYSICS & PARTICLES
   ========================================== */
const Physics = {
    pCount: CONFIG.pCount,
    pPos: new Float32Array(CONFIG.pCount * 3),
    pCol: new Float32Array(CONFIG.pCount * 3),
    pVel: [],
    pState: new Uint8Array(CONFIG.pCount),
    pLife: new Float32Array(CONFIG.pCount),
    pGeom: new THREE.BufferGeometry(),
    pSys: null,
    
    // 【優化：新增全域氣場熱力網格與最佳穴眼座標】
    qiGrid: new Float32Array(64 * 64),
    windGridX: new Float32Array(64 * 64),      // 新增：CFD 橫向風場網格
    windGridZ: new Float32Array(64 * 64),      // 新增：CFD 縱向風場網格
    windGridX_next: new Float32Array(64 * 64), // 新增：CFD 雙緩衝區 (Double Buffering)
    windGridZ_next: new Float32Array(64 * 64), // 新增：CFD 雙緩衝區 (Double Buffering)
    bestLairPos: new THREE.Vector3(0, 0, 0),

    init() {
        for(let i=0; i<this.pCount; i++) this.pVel.push(new THREE.Vector3(0,0,0));
        this.pGeom.setAttribute('position', new THREE.BufferAttribute(this.pPos, 3));
        this.pGeom.setAttribute('color', new THREE.BufferAttribute(this.pCol, 3));

        // 優化粒子：加強中心發光，邊緣更通透柔和，縮小總體尺寸避免拉近破圖
        const c1 = document.createElement('canvas'); c1.width = 64; c1.height = 64;
        const ctx1 = c1.getContext('2d');
        const g1 = ctx1.createRadialGradient(32,32,0,32,32,32);
        g1.addColorStop(0, 'rgba(255,255,255,1.0)');
        g1.addColorStop(0.2, 'rgba(255,255,255,0.8)');
        g1.addColorStop(0.6, 'rgba(255,255,255,0.1)');
        g1.addColorStop(1, 'rgba(255,255,255,0)');
        ctx1.fillStyle = g1; ctx1.fillRect(0,0,64,64);
        const pTex = new THREE.CanvasTexture(c1);

        // 新增：將粒子的速度傳入 GPU，用於動態拉絲計算
        this.pGeom.setAttribute('velocity', new THREE.BufferAttribute(new Float32Array(CONFIG.pCount * 3), 3));

        // 【維度一：流體物理】將單調的點狀粒子升級為「絲絹流體 (Velocity-Aligned Streaks)」 Shader
        const pMat = new THREE.ShaderMaterial({
            uniforms: {
                pointTexture: { value: pTex }
            },
            vertexShader: `
                attribute vec3 color;
                attribute vec3 velocity;
                varying vec3 vColor;
                varying vec2 vVel;
                varying float vSpeed;
                void main() {
                    vColor = color;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    
                    // 將 3D 速度投影到 2D 螢幕空間
                    vec4 targetPos = modelViewMatrix * vec4(position + velocity * 0.15, 1.0);
                    vVel = (projectionMatrix * targetPos).xy / (projectionMatrix * targetPos).w - gl_Position.xy / gl_Position.w;
                    vSpeed = length(velocity);
                    
                    // 根據速度動態放大粒子，為拉長變形預留像素空間
                    gl_PointSize = (60.0 / -mvPosition.z) * (1.0 + vSpeed * 0.25);
                }
            `,
            fragmentShader: `
                uniform sampler2D pointTexture;
                varying vec3 vColor;
                varying vec2 vVel;
                varying float vSpeed;
                void main() {
                    vec2 uv = gl_PointCoord - 0.5;
                    
                    // 計算螢幕空間的流體旋轉角度
                    float angle = atan(vVel.y, vVel.x);
                    float s = sin(-angle);
                    float c = cos(-angle);
                    mat2 rot = mat2(c, -s, s, c);
                    
                    vec2 rotatedUV = rot * uv;
                    
                    // 根據流速進行 X 軸 (前進方向) 的拉絲形變 (Motion Blur 視覺化)
                    float stretch = max(1.0, vSpeed * 1.5);
                    rotatedUV.x /= stretch; 
                    rotatedUV += 0.5;
                    
                    // 剔除變形出界的像素
                    if (rotatedUV.x < 0.0 || rotatedUV.x > 1.0 || rotatedUV.y < 0.0 || rotatedUV.y > 1.0) discard;
                    
                    vec4 texColor = texture2D(pointTexture, rotatedUV);
                    // 根據速度降低透明度，速度越快越透，形成煙霧感
                    gl_FragColor = vec4(vColor, texColor.a * clamp(1.2 - vSpeed*0.1, 0.2, 0.9));
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending, // 改回 Additive 讓重疊的真氣產生極亮太極暈
            depthWrite: false, depthTest: true
        });
        this.pSys = new THREE.Points(this.pGeom, pMat);
        Engine3D.scene.add(this.pSys);

        this.resetParticles();
    },

    resetParticles() {
        const state = AppState.current;
        for(let i=0; i<this.pCount; i++) {
            this.pPos[i*3] = (Math.random()-0.5)*60;

            // 尋龍點穴：發脈沿著地表/骨脈內部湧出，而非從天而降
            if(state.d === 'pingyang') {
                // 【修復】：改為動態讀取平洋地形高度，防止粒子在切換時從地底瞬間彈出
                // 【第四輪優化】平洋龍粒子初始位置縮短至 -15~-35，並透過檢查地形高度避免在河道中出生，
                // 確保粒子在模擬時長內能順利抵達穴場感測區，解決 GatherAcc 恆為 0 的湧現物理失效問題。
                let tz, tx, ty;
                let attempts = 0;
                do {
                    tz = -15 - Math.random()*20;
                    tx = (Math.random()-0.5)*20;
                    ty = Engine3D.getTerrainY(tx, tz).y;
                    attempts++;
                } while(ty < -2.0 && attempts < 30);
                this.pPos[i*3] = tx;
                this.pPos[i*3+1] = ty - 1 + Math.random()*3; 
                this.pPos[i*3+2] = tz;
            } else {
                // 【進化：太祖山勢能起點】若有太祖山，發脈起點推至極遠高空 (z: -160 ~ -120)
                let tzStart = state.zutai ? -160 : -120; 
                let tz = tzStart + Math.random()*40;
                let tx = (Math.random()-0.5)*20;
                if(state.d === 'huilong') tx += Math.sin(Math.max(0,-tz)*0.02)*50;
                let ty = Engine3D.getTerrainY(tx, tz).y;
                this.pPos[i*3] = tx;
                this.pPos[i*3+1] = ty - 2 + Math.random()*4; // 氣從山脊內部與表面滲透湧出
                this.pPos[i*3+2] = tz;
            }

            // 增加初始推進力，讓粒子能順利從發脈點沿龍脈流向穴位（避免因地形摩擦而卡死在後方）
            this.pVel[i].set((Math.random()-0.5)*0.5, 0.4, state.d === 'pingyang' ? 3.0 : 4.0);
            if(state.d === 'si') {
                this.pState[i] = 0;
                this.pCol[i*3]=0.45; this.pCol[i*3+1]=0.45; this.pCol[i*3+2]=0.40; // 死龍氣盡枯槁灰暗色
            } else if((state.d === 'po' || state.d === 'huan') && Math.random() < 0.35) {
                this.pState[i] = 3; // 破龍/緩龍 35% 出生即為洩氣
                this.pCol[i*3]=0.2; this.pCol[i*3+1]=0.4; this.pCol[i*3+2]=0.7; // 淺色模式：加深散氣的藍色
                this.pVel[i].set((Math.random()-0.5)*3.0, 0, 1.0);
            } else {
                this.pState[i] = 0;
                this.pCol[i*3]=0.8; this.pCol[i*3+1]=0.55; this.pCol[i*3+2]=0.1; // 淺色模式：加深生氣的琥珀金
            }
            this.pLife[i] = 100 + Math.random() * 500;
        }
        this.pGeom.attributes.position.needsUpdate = true;
        this.pGeom.attributes.color.needsUpdate = true;
    },
	update(dt) {
        if(dt === 0) return;
        AppState.frames++;
        let state = AppState.current;

        let rType = 4;
        if(state.w === 'you') rType = 0;
        else if(state.w === 'jiuqu') rType = 1;
        else if(state.w === 'fan') rType = 2;
        else if(state.w === 'bazi') rType = 3;
        else if(state.w === 'tfork') rType = 6;
        else if(state.w === 'lintou') rType = 5; // 修復：補上淋頭水對應的著色器編號 5，啟動瀑布傾瀉特效

        if (Engine3D.waterMesh.material.userData.shader) {
            // 【修復】：讓水面著色器的波浪流動速度，完美與物理 UI 滑桿連動！
            let visualWVel = state.waterVel || 1.0;
            Engine3D.waterMesh.material.userData.shader.uniforms.time.value = AppState.frames * 0.05 * visualWVel;
            Engine3D.waterMesh.material.userData.shader.uniforms.riverType.value = rType;
        }
        if (Engine3D.treeMesh && Engine3D.treeMesh.material.userData.shader) {
            Engine3D.treeMesh.material.userData.shader.uniforms.time.value = AppState.frames * 0.05;
        }

        let baseWind = state.wind * 0.015;
        let capLimit = Rules.getCapacityLimit();
        let frameGather = 0, frameScatter = 0;
        
        // 【新增：進階流體觀測儀表計數器】
        let frameCoanda = 0, frameDowndraft = 0, frameVenturi = 0, frameBounce = 0;
        let framePhreatic = 0, frameTensorFracture = 0, frameHelicity = 0, frameThermalShear = 0, frameWaveletSpike = 0;
        let frameCoriolisCrash = 0, frameDarcyDrag = 0, frameBoundarySep = 0; // 【終極探針】

        // 【新增：Grid-based CFD 網格流體求解器 (Navier-Stokes 近似)】
        if (Math.abs(baseWind) > 0.001) {
            for (let gz = 1; gz < 63; gz++) {
                for (let gx = 1; gx < 63; gx++) {
                    let idx = gz * 64 + gx;
                    let worldX = (gx / 64) * 200 - 100;
                    let worldZ = (gz / 64) * 200 - 100;
                    let t = Engine3D.getTerrainY(worldX, worldZ);
                    
                    // 1. 地形邊界阻擋 (No-slip boundary 近似) 與風源注入
                    // 修正：平洋地面高度約 -2~0，若以 -2 為界會誤判為高山阻擋風。改為僅顯著高地 (>5，平洋 >0.5) 才阻擋。
                    let blockingThreshold = (state.d === 'pingyang') ? 0.5 : 5.0;
                    if (t.y > blockingThreshold) { 
                        this.windGridX[idx] *= 0.5; // 高山阻擋風流
                        this.windGridZ[idx] *= 0.5;
                    } else { 
                        this.windGridX[idx] += (baseWind - this.windGridX[idx]) * 0.08 * dt;
                        this.windGridZ[idx] += (Math.sin(worldX * 0.05 + AppState.frames * 0.02) * Math.abs(baseWind) * 0.5 - this.windGridZ[idx]) * 0.08 * dt;
                    }
                    
                    // 2. 擴散與壓力鬆弛 (Jacobi Iteration)
                    let avgX = (this.windGridX[idx-1] + this.windGridX[idx+1] + this.windGridX[idx-64] + this.windGridX[idx+64]) * 0.25;
                    let avgZ = (this.windGridZ[idx-1] + this.windGridZ[idx+1] + this.windGridZ[idx-64] + this.windGridZ[idx+64]) * 0.25;
                    
                    // 3. 旋度計算 (Vorticity Curl) -> 產生背風面卡門渦街氣旋
                    let curl = (this.windGridZ[idx+1] - this.windGridZ[idx-1]) - (this.windGridX[idx+64] - this.windGridX[idx-64]);
                    
                    this.windGridX_next[idx] = avgX + curl * 0.25 * dt * Math.sign(avgZ);
                    this.windGridZ_next[idx] = avgZ - curl * 0.25 * dt * Math.sign(avgX);
                    // 新增：CFD 數值穩定鎖，防止風場無限增長導致湍流爆炸
                    this.windGridX_next[idx] = Math.max(-5.0, Math.min(5.0, this.windGridX_next[idx]));
                    this.windGridZ_next[idx] = Math.max(-5.0, Math.min(5.0, this.windGridZ_next[idx]));
                }
            }
            // Swap Buffers
            let tmpX = this.windGridX; this.windGridX = this.windGridX_next; this.windGridX_next = tmpX;
            let tmpZ = this.windGridZ; this.windGridZ = this.windGridZ_next; this.windGridZ_next = tmpZ;
        }

        // 【湧現物理】觀測儀歸零
        let sensorCount = 0;
        let qiSensorCount = 0; // 僅計數吉氣粒子，用於準確反映聚氣密度
        let envParticleCount = 0; // 新增：游離環境粒子計數
        let sumVelX = 0, sumVelY = 0, sumVelZ = 0; // 新增 Y 軸平均
        let sumSpeedSq = 0;
        let waterDragCount = 0;
        let sumWaterDrag = 0;

        let speedMod = 1.0;
        if(state.d === 'si') speedMod = 0.5;
        if(state.d === 'ji') speedMod = 1.5;

        // 【修正：致命形煞存在時，太極暈防護罩不再屏蔽風煞，讓路沖/鐮刀/天斬等實體破壞力可以穿透穴場】
        // 進一步包含所有會破壞氣場穩定的形煞，避免太極暈保護使明堂傾瀉、青龍逼壓等物理失效
        const hasDynamicFatalSha = state.tianzhan || state.sherui || state.tantou || state.qingquan || state.ao || 
            state.posui || state.bidao || state.wugong || state.terrain === 'slope' || state.ms === 'sunken' || 
            state.qing || state.fenzhi || state.ml === 'ya' || state.mr === 'tai' ||
            ['fan','bazi','gejiao','ji','lintou','tfork'].includes(state.w) ||
            ['zhichong','sickle','jiandao','zuocha','youcha'].includes(state.road);

        for(let i=AppState.shockwaves.length-1; i>=0; i--) {
            let sw = AppState.shockwaves[i];
            sw.life -= 0.02 * dt;
            sw.mesh.scale.set(1 + (1-sw.life)*10, 1 + (1-sw.life)*10, 1);
            sw.mesh.material.opacity = sw.life;
            if(sw.life <= 0) {
                Engine3D.swGroup.remove(sw.mesh);
                sw.mesh.material.dispose();
                AppState.shockwaves.splice(i, 1);
            }
        }

        if(state.vHeat && AppState.frames % 4 === 0) {
            Engine3D.hCtx.fillStyle = 'rgba(0,0,0,0.05)';
            Engine3D.hCtx.fillRect(0, 0, 256, 256);
        }

        // 清理無效的探頭煞斜率計算(Dead Code)，節省每幀兩次的地形高度探測效能
        let globalMultCache = Rules.getGlobalMultiplier(); 

        for(let i=0; i<this.pCount; i++) {
            let x = this.pPos[i*3], y = this.pPos[i*3+1], z = this.pPos[i*3+2];
            let vel = this.pVel[i]; let st = this.pState[i];

            // 【湧現物理】感測器空間採樣（結合山體動態穴位與手動點穴）
            let xueH = state.xueHeight || 0;
            let lx = state.xueX || 0;
            // 【修正】穴位水平固定 Z=5
            let lz = state.manualXue ? state.xueZ : 5.0;
            let dynamicTaijiZ = lz;
            let dxTaiji = x - lx;
            let dzTaiji = z - dynamicTaijiZ;
            let dxSensor = dxTaiji;
            let dzSensor = dzTaiji;
            let distToSensorSq = dxSensor*dxSensor + dzSensor*dzSensor;
            // 平洋龍地勢平坦，氣場範圍較廣，感測半徑從 20 擴大至 30，讓粒子更容易被捕獲
            let sensorRadiusSq = (state.d === 'pingyang') ? 900 : 400;
            let sensorGroundY = Engine3D.getTerrainY(x, z).y;
            if (distToSensorSq < sensorRadiusSq && y > sensorGroundY - 5 && y < sensorGroundY + 15) {
                sensorCount++;
                if (st === 2) {
                    // 修正：氣密度應只統計已凝聚成太極暈的吉氣，避免煞氣粒子造成虛假聚氣加分
                    qiSensorCount++;
                }
                if (st !== 2) { // 修復 1：排除已完美結成太極暈的吉氣 (st===2)，只計算環境游離風煞，避免太極旋渦被誤判為亂流
                    envParticleCount++;
                    sumVelX += vel.x; sumVelY += vel.y; sumVelZ += vel.z; // 納入 Y 軸
                    sumSpeedSq += vel.lengthSq();
                }
                // 【修正：聚氣計數不應被太極暈開關鎖死】只要吉氣粒子位於穴場感測範圍，即應計為聚氣，
                // 否則當 taiji=false 時，qiDensity 極高但 gatherAcc 永遠為 0，造成感測器與評分系統矛盾。
                // 同時避免與太極暈區塊重複計數：僅在 taiji=false 時由感測器計數，taiji=true 時由太極暈邏輯計數。
                if (!state.taiji) {
                    if (st === 2) frameGather++;
                    else if (st === 1 || st === 3) frameScatter++;
                }
            }
            // 修正 4：水力感測器應依據格局地形給予動態深水閥值。
            // 平洋龍陸地為 -2.0，水面為 -3.0，必須將感測線下放至 -2.5 才能排除陸地上的誤判。
            // 修正：迴龍顧祖格局的割腳水位於 z=30 附近，但感測器範圍僅 z>15 && z<60，且需 y<waterSensorLevel，
            // 但粒子可能因地形或風場未進入該區域，導致 waterDrag 為 0。放寬感測範圍並加入地形判斷。
            // 【修正】水感測器對凶水的偵測靈敏度，使伯努利抽吸效應能如實反映在湧現物理加權上。
            // 原條件需粒子完全沈入深水且垂直速度極大 (vel.y < -0.3)，導致割腳/反弓等凶水幾乎永遠無法觸發 waterDrag。
            // 現放寬至接近水面即可，且僅對凶水（含傾瀉與水流過急）啟用，避免誤傷吉水玉帶/九曲。
            let waterSensorLevel = (state.d === 'pingyang') ? -2.0 : -3.5;
            let isNearWater = (state.w !== 'none' || state.yue);
            let riverRefZ = 30;
            if(['you','jiuqu','bazi','tfork'].includes(state.w)) riverRefZ = 70;
            else if(state.w==='ji'||state.w==='fan') riverRefZ = 55;
            else if(state.w==='lintou') riverRefZ = -10;
            if (isNearWater) riverRefZ += (lz - 5.0);
            let waterSenseZStart = Math.min(lz - 5, riverRefZ - 20);
            let waterSenseZEnd = Math.max(lz + 40, riverRefZ + 20);
            const isBadWaterSensor = ['gejiao','fan','bazi','ji','lintou','tfork'].includes(state.w) || state.qing || (state.waterVel || 1.0) > 1.8;
            // 修正：水感測器不應依賴垂直速度，只要粒子位於凶水河道且深度足夠即觸發，確保凶水的伯努利抽吸能被穩定偵測
            // 【修復空間 BUG】：補上對粒子本身高度 (y) 的空間攔截，避免飛越高空的氣場被錯誤判定為落水
            // 【新增：淋頭水區域限制】淋頭水僅在穴後 (z<-3) 有作用，穴前不得觸發水力抽吸
            const isLintouFront = (state.w === 'lintou' && z > -3.0);
            if (!isLintouFront && isNearWater && isBadWaterSensor && z > waterSenseZStart && z < waterSenseZEnd && Math.abs(x) < 50 && Engine3D.getTerrainY(x, z).y <= waterSensorLevel + 0.5 && y <= waterSensorLevel + 5.0) {
                waterDragCount++;
                sumWaterDrag += Math.max(0.2, Math.abs(vel.y) * 0.5 + 0.3);
            }

            vel.y -= 0.025 * dt;
            vel.x += (Math.random()-0.5)*0.1*dt; vel.z += (Math.random()-0.5)*0.1*dt;

            if(AppState.obstacles.length > 0) {
                if (st === 0 || st === 2) {
                    for(let obs of AppState.obstacles) {
                        let dxObs = x - obs.mesh.position.x;
                        let dzObs = z - obs.mesh.position.z;
                        let distObsSq = dxObs*dxObs + dzObs*dzObs;
                        if(distObsSq < 36.0 && y < obs.mesh.position.y + 5.0) {
                            let dObs = Math.max(0.1, Math.sqrt(distObsSq));
                            this.pState[i] = 1; 
                            vel.x = (dxObs / dObs) * 4.5;
                            vel.z = (dzObs / dObs) * 4.5;
                            vel.y += 2.0;
                            this.pCol[i*3]=1.0; this.pCol[i*3+1]=0.2; this.pCol[i*3+2]=0.1;
                            if (st === 2) Engine3D.createShockwave(x, y, z, 0xff0000);
                            break;
                        }
                    }
                }
            }

            // 【修復】將煞氣連環感染邏輯移出，讓地形湧現的風煞與探頭暗箭皆能摧毀吉氣
            if (st === 1) {
                if (Math.random() < 0.25 * dt) {
                    let sampleIdx = Math.floor(i + 7) % this.pCount;
                    if (this.pState[sampleIdx] === 2) {
                        let rx = x - this.pPos[sampleIdx*3];
                        let rz = z - this.pPos[sampleIdx*3+2];
                        if (rx*rx + rz*rz < 144.0) { 
                            this.pState[sampleIdx] = 1; 
                            this.pCol[sampleIdx*3] = 1.0; this.pCol[sampleIdx*3+1] = 0.15; this.pCol[sampleIdx*3+2] = 0.1;
                            this.pVel[sampleIdx].x += (Math.random()-0.5) * 4.0;
                            this.pVel[sampleIdx].z += (Math.random()-0.5) * 4.0;
                            Engine3D.createShockwave(this.pPos[sampleIdx*3], this.pPos[sampleIdx*3+1], this.pPos[sampleIdx*3+2], 0xff2222);
                        }
                    }
                }
            }

            let t = Engine3D.getTerrainY(x, z);
            let waterLevel = (state.d === 'pingyang') ? -3.5 : -12.0;
            let isWater = ((state.w !== 'none' || state.yue) && t.y <= waterLevel + 0.5);

            // 【湧現物理】2. 網格地形向量流體場 
            // 升級：從 CFD 網格中採樣真實流體風速 (包含卡門渦街與背風面氣旋)
            let sampleX = Math.max(0, Math.min(63, Math.floor((x + 100) / 200 * 64)));
            let sampleZ = Math.max(0, Math.min(63, Math.floor((z + 100) / 200 * 64)));
            let gridIdx = sampleZ * 64 + sampleX;
            
            let globalWindX = this.windGridX[gridIdx] || baseWind;
            let globalWindZ = this.windGridZ[gridIdx] || 0;

            let localWindX = globalWindX;
            let localWindZ = globalWindZ;
            let localTurbulence = 0;

            // 修正 4：大一統物理系統無風漏洞。形煞地貌(如天斬、凹風)必伴隨自然熱力學山谷風。
            // 必須給予基礎氣流(0.03)，否則當系統設定無風(baseWind=0)時，所有形煞會完全失效失去懲罰力。
            let thermalDraft = Math.max(0.03, Math.abs(baseWind)); 

            // 實體湧現：探頭煞 (Tantou) 造成的越過案山的下洗氣流 (Downdraft) 與暗流
            if (state.tantou && state.an && z > 10 && z < 70 && Math.abs(x) < 30) {
                localWindZ -= thermalDraft * 3.5; 
                localTurbulence += thermalDraft * 1.5;
            }

            // 【物理湧現補全】天斬煞與凹風煞的真實流體力學：狹管切風與冷風灌穴
            if (state.tianzhan && Math.abs(x) < 15 && z > -35 && z < 15) {
                localWindZ += thermalDraft * 6.5; // 冷風乘勢直灌
                localTurbulence += thermalDraft * 2.5;
            }
            if (state.ao && Math.abs(x) < 25 && z > -15 && z < 25) {
                localWindX += Math.sign(x) * -thermalDraft * 3.0; // 缺口寒風倒灌
                localTurbulence += thermalDraft * 2.0;
            }
            // 【新增：路沖煞 (槍煞) 風洞效應】筆直的道路成為風的加速通道，煞氣直沖明堂
            if (state.road === 'zhichong' && Math.abs(x) < 5 && z > 5 && z < 120) {
                localWindZ -= thermalDraft * 8.0; // 強烈逆風直刺穴位
                localTurbulence += thermalDraft * 4.0;
            }
            
            // 【生態移植：鐮刀煞物理湧現】極近距離的彎道產生強烈向心切割風
            if (state.road === 'sickle') {
                let sickleCurve = 35 - Math.pow(x / 40, 2) * 20;
                if (Math.abs(z - sickleCurve) < 6.0 && z > 0 && z < 100) {
                    localWindZ -= thermalDraft * 9.5; // 鐮刀橫切，強烈下洗直劈穴星
                    localTurbulence += thermalDraft * 6.0;
                }
            }
            
            // 【生態移植：丁字沖物理湧現】垂直水氣直撞太極
            if (state.w === 'tfork' && Math.abs(x) < 12 && z > 20 && z < 75) {
                localWindZ -= thermalDraft * 8.5; // 水氣伴隨冷風倒灌
                localTurbulence += thermalDraft * 5.0;
            }

            // 【新增：左/右脅擦邊路物理湧現】側邊車流產生橫向負壓，無情抽走明堂真氣
            if ((state.road === 'zuocha' && x < 0) || (state.road === 'youcha' && x > 0)) {
                let sign = state.road === 'zuocha' ? -1 : 1;
                let expectedX = sign * (z * 0.4 + 12);
                if (Math.abs(x - expectedX) * 0.8 < 5.0 && z > -10 && z < 100) {
                    localWindX += sign * thermalDraft * 5.0; // 強大側向吸力將氣場扯出
